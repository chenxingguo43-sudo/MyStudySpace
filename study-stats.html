<head>

        }

        .unav-links{display:flex;align-items:center;gap:2px;flex:1}

        .unav-link:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.08)}
        .unav-link.active{color:#a5b4fc;background:rgba(99,102,241,.2);border-color:rgba(99,102,241,.3)}
        .unav-right{display:flex;align-items:center;gap:8px;margin-left:auto}
        .unav-dark-btn{background:none;border:none;cursor:pointer;font-size:1em;padding:4px 8px;border-radius:12px;color:rgba(255,255,255,.5);transition:all .2s}
        .unav-dark-btn:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9)}
        /* 导航栏占位 — 让body内容不被遮挡 */
        body{padding-top:44px!important}
        /* iframe 内嵌模式：隐藏导航栏、移除顶部间距 */
        body.in-iframe{padding-top:0!important}

        body.in-iframe .unified-nav{display:none!important}

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #020617;
            min-height: 100vh;
            padding: 20px;
            color: rgba(255, 255, 255, 0.85);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* 顶部标题栏 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px 24px;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        .header h1 {
            font-size: 1.5em;
            color: rgba(255, 255, 255, 0.9);

        }

        .close-btn {
            width: 36px;
            height: 36px;

            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);

            cursor: pointer;

            align-items: center;

        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        /* 统计卡片通用样式 */
        .stats-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .stats-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-icon {
            font-size: 1.8em;
        }

        .card-title {
            font-size: 1.3em;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
        }

        /* 番茄钟统计卡片 - 靛蓝渐变 */
        .pomodoro-card {
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.08) 0%, rgba(129, 140, 248, 0.08) 100%);
            border: 1px solid rgba(79, 70, 229, 0.2);
        }

        /* 俄语学习卡片 - 蓝紫渐变（保持不变） */
        .russian-card {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.08) 0%, rgba(118, 75, 162, 0.08) 100%);
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        /* 统计项布局 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 16px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.2s;

        }

        .stat-item:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.02);
        }

        .stat-value {
            font-size: 2.2em;
            font-weight: 800;
            margin: 8px 0;
            background: linear-gradient(135deg, #4F46E5 0%, #818CF8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .pomodoro-card .stat-value {
            background: linear-gradient(135deg, #4F46E5 0%, #818CF8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

            font-size: 0.85em;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 500;
        }

        /* 总览统计 */

            justify-content: center;
            flex-wrap: wrap;
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: rgba(255, 255, 255, 0.85);
        }

        .chart-container {
            max-width: 300px;
            margin: 30px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* 章节明细表格 */
        .chapter-details {
            margin-top: 20px;
            overflow-x: auto;
        }

        .chapter-details table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
        }

            padding: 12px 16px;
            text-align: left;
            font-weight: 600;

            font-size: 0.9em;

        .export-btn:hover {

        }

        .import-btn {
            background: linear-gradient(135deg, #26a69a, #00796b);
        }

        .import-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(38, 166, 154, 0.4);
        }

        .clear-btn {
            background: linear-gradient(135deg, #ef5350, #c62828);
        }

            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(239, 83, 80, 0.4);

        .file-input {
            display: none;

        /* 空状态 */

            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.4);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .stats-grid {

            }

                align-items: stretch;
            }

            .data-management {
                flex-direction: column;
            }

            .data-btn {
                width: 100%;
                justify-content: center;
            }
        }

        /* Toast 提示 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(30, 30, 50, 0.9);
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.9em;
            z-index: 9999;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            opacity: 0;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

    <script>
        // ==========================================
        // 全局变量
        // ==========================================
        let ratingChart = null;

        // ==========================================
        // 初始化
        // ==========================================
        document.addEventListener('DOMContentLoaded', function() {
            refreshAllStats();
            
            // 监听跨页面 storage 事件
            window.addEventListener('storage', function(e) {
                var relevantKeys = [
                    'pomodoro-today-count', 'pomodoro-today-minutes',
                    'pomodoro-total-count', 'pomodoro-total-minutes', 'pomodoro-streak',
                    'oral-read-records', 'oral-speak-records', 'oral-memo-records',
                    'oral-speak-daily'
                ];
                if (relevantKeys.indexOf(e.key) !== -1) {
                    refreshAllStats();
                }
            });
        });

        // ==========================================
        // 刷新所有统计
        // ==========================================
        function refreshAllStats() {
            refreshPomodoroStats();
            refreshRussianStats();
        }

        // ==========================================
        // 番茄钟统计
        // ==========================================
        function refreshPomodoroStats() {
            var todayCount = parseInt(localStorage.getItem('pomodoro-today-count') || '0');
            var todayMinutes = parseInt(localStorage.getItem('pomodoro-today-minutes') || '0');
            var totalCount = parseInt(localStorage.getItem('pomodoro-total-count') || '0');
            var totalMinutes = parseInt(localStorage.getItem('pomodoro-total-minutes') || '0');
            var streak = parseInt(localStorage.getItem('pomodoro-streak') || '0');

            document.getElementById('today-count').textContent = todayCount;
            document.getElementById('today-minutes').textContent = todayMinutes;
            document.getElementById('total-count').textContent = totalCount;
            document.getElementById('total-hours').textContent = (totalMinutes / 60).toFixed(1);
            document.getElementById('streak-days').textContent = streak;
        }

        // ==========================================
        // 俄语学习统计
        // ==========================================
        function refreshRussianStats() {
            var readRecords = JSON.parse(localStorage.getItem('oral-read-records') || '{}');
            var speakRecords = JSON.parse(localStorage.getItem('oral-speak-records') || '{}');
            var memoRecords = JSON.parse(localStorage.getItem('oral-memo-records') || '{}');
            var speakDaily = JSON.parse(localStorage.getItem('oral-speak-daily') || '{}');

            var today = new Date().toISOString().slice(0, 10);

            // 计算总数
            var totalRead = 0, totalSpeak = 0, totalMemo = 0;
            var todayRead = 0, todaySpeak = 0, todayMemo = 0;

            for (var k in readRecords) {
                var cnt = readRecords[k].count || 1;
                totalRead += cnt;
                if (readRecords[k].dates && readRecords[k].dates.indexOf(today) !== -1) {
                    todayRead += 1;
                }
            }

            for (var k in speakRecords) {
                var cnt = speakRecords[k].count || 1;
                totalSpeak += cnt;
                if (speakRecords[k].dates && speakRecords[k].dates.indexOf(today) !== -1) {
                    todaySpeak += 1;
                }
            }

            for (var k in memoRecords) {
                var cnt = memoRecords[k].count || 1;
                totalMemo += cnt;
                if (memoRecords[k].dates && memoRecords[k].dates.indexOf(today) !== -1) {
                    todayMemo += 1;
                }
            }

            document.getElementById('total-read').textContent = totalRead;
            document.getElementById('total-speak').textContent = totalSpeak;
            document.getElementById('total-memo').textContent = totalMemo;
            document.getElementById('today-read').textContent = todayRead;
            document.getElementById('today-speak').textContent = todaySpeak;
            document.getElementById('today-memo').textContent = todayMemo;

            // 更新口语评分分布图表
            updateRatingChart(speakDaily);
            
            // 更新章节明细（这里需要章节信息，暂时省略）
            updateChapterDetails(readRecords, speakRecords, memoRecords);
        }

        // ==========================================
        // 更新口语评分分布图表
        // ==========================================
        function updateRatingChart(speakDaily) {
            var ratingCounts = [0, 0, 0, 0, 0]; // 😰 😐 🙂 😊 🌟

            // 从 speakDaily 中统计评分分布
            for (var date in speakDaily) {
                var records = speakDaily[date];
                if (Array.isArray(records)) {
                    records.forEach(function(r) {
                        if (r.rating && r.rating >= 1 && r.rating <= 5) {
                            ratingCounts[r.rating - 1]++;
                        }
                    });
                }
            }

            var ctx = document.getElementById('rating-chart').getContext('2d');

            if (ratingChart) {
                ratingChart.data.datasets[0].data = ratingCounts;

        // ==========================================
        // 数据导出
        // ==========================================
        function exportAllData() {
            var data = {};
            var keys = [
                'oral-read-records', 'oral-speak-records', 'oral-memo-records',
                'oral-chapter-masks', 'oral-speak-daily', 'oral-daily-position',
                'pomodoro-sessions', 'pomodoro-today-count', 'pomodoro-today-minutes',
                'pomodoro-week-count', 'pomodoro-month-count', 'pomodoro-total-count',
                'pomodoro-total-minutes', 'pomodoro-streak', 'pomodoro-current-task'
            ];

            keys.forEach(function(key) {
                var val = localStorage.getItem(key);
                if (val !== null) {
                    try {
                        data[key] = JSON.parse(val);
                    } catch(e) {
                        data[key] = val;
                    }
                }
            });

            var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'mystudyspace-backup-' + new Date().toISOString().slice(0, 10) + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast('✅ 数据已导出');
        }

        // ==========================================
        // 数据导入
        // ==========================================
        function importData(event) {
            var file = event.target.files[0];
            if (!file) return;

            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = JSON.parse(e.target.result);
                    
                    for (var key in data) {
                        localStorage.setItem(key, JSON.stringify(data[key]));
                    }

                    refreshAllStats();
                    showToast('✅ 数据已导入');
                } catch(err) {
                    showToast('❌ 导入失败：文件格式错误');
                }
            };
            reader.readAsText(file);
            
            // 清空 input，允许重复选择同一文件
            event.target.value = '';
        }

        // ==========================================
        // 清空所有数据
        // ==========================================
        function clearAllData() {
            if (confirm('确定要清空所有学习数据吗？此操作不可恢复！')) {
                var keys = [
                    'oral-read-records', 'oral-speak-records', 'oral-memo-records',
                    'oral-chapter-masks', 'oral-speak-daily', 'oral-daily-position',
                    'pomodoro-sessions', 'pomodoro-today-count', 'pomodoro-today-minutes',
                    'pomodoro-week-count', 'pomodoro-month-count', 'pomodoro-total-count',
                    'pomodoro-total-minutes', 'pomodoro-streak', 'pomodoro-current-task'
                ];

                keys.forEach(function(key) {
                    localStorage.removeItem(key);
                });

                refreshAllStats();
                showToast('🗑️ 所有数据已清空');
            }
        }

        // ==========================================
        // Toast 提示
        // ==========================================
        function showToast(msg) {
            var toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            
            setTimeout(function() {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
