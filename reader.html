<style>
/* ─── 主题变量 ─── */
:root {
  --bg: #020617; --surface: rgba(15,23,42,0.6); --surface-solid: #0f172a;
  --glass: rgba(255,255,255,0.06); --glass-border: rgba(255,255,255,0.10);
  --glass-hover: rgba(255,255,255,0.10);
  --text: rgba(255,255,255,0.90); --text-secondary: rgba(255,255,255,0.55);
  --text-dim: rgba(255,255,255,0.38);
  --accent: #818cf8; --accent-dim: rgba(129,140,248,0.20); --accent-border: rgba(129,140,248,0.30);
  --success: #34d399; --warning: #fbbf24;
  --ru-text: rgba(255,255,255,0.88); --cn-text: rgba(255,255,255,0.52);
  --border: rgba(255,255,255,0.08); --para-hover: rgba(255,255,255,0.04);
  --para-expanded-border: rgba(129,140,248,0.4);
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --highlight-word: rgba(251,191,36,0.25); --highlight-search: rgba(56,189,248,0.30);
}
body.theme-sepia {
  --bg: #1a1410; --surface: rgba(30,24,18,0.6); --surface-solid: #1e1812;
  --glass: rgba(180,150,100,0.08); --glass-border: rgba(180,150,100,0.15);
  --glass-hover: rgba(180,150,100,0.12);
  --text: rgba(230,210,170,0.92); --text-secondary: rgba(200,170,120,0.58);
  --text-dim: rgba(180,150,100,0.42);
  --accent: #d4a574; --accent-dim: rgba(212,165,116,0.20); --accent-border: rgba(212,165,116,0.30);
  --ru-text: rgba(230,210,170,0.90); --cn-text: rgba(200,170,120,0.52);
  --border: rgba(180,150,100,0.12); --para-hover: rgba(180,150,100,0.05);
  --para-expanded-border: rgba(212,165,116,0.4);
  --highlight-word: rgba(212,165,116,0.25); --highlight-search: rgba(100,180,220,0.25);
  --success: #34d399;
}
body.theme-warm {
  --bg: #ECE1C7; --surface: rgba(236,225,199,0.85); --surface-solid: #E6DABB;
  --glass: rgba(0,0,0,0.03); --glass-border: rgba(0,0,0,0.08);
  --glass-hover: rgba(0,0,0,0.06);
  --text: rgba(40,35,25,0.92); --text-secondary: rgba(80,65,40,0.68);
  --text-dim: rgba(80,65,40,0.50);
  --accent: #8c5a1e; --accent-dim: rgba(140,90,30,0.15); --accent-border: rgba(140,90,30,0.30);
  --ru-text: rgba(40,35,25,0.92); --cn-text: rgba(80,65,40,0.60);
  --border: rgba(0,0,0,0.08); --para-hover: rgba(0,0,0,0.03);
  --para-expanded-border: rgba(140,90,30,0.3);
  --shadow: 0 4px 16px rgba(0,0,0,0.06);
  --highlight-word: rgba(200,160,60,0.25); --highlight-search: rgba(60,140,200,0.20);
  --success: #0d6b4c;
}
body.theme-paper {
  --bg: #f5f0e8; --surface: rgba(245,240,232,0.8); --surface-solid: #efe8dc;
  --glass: rgba(0,0,0,0.03); --glass-border: rgba(0,0,0,0.08);
  --glass-hover: rgba(0,0,0,0.06);
  --text: rgba(30,25,18,0.90); --text-secondary: rgba(80,60,40,0.55);
  --text-dim: rgba(80,60,40,0.35);
  --accent: #7c5e3c; --accent-dim: rgba(124,94,60,0.12); --accent-border: rgba(124,94,60,0.25);
  --ru-text: rgba(30,25,18,0.90); --cn-text: rgba(80,60,40,0.55);
  --border: rgba(0,0,0,0.06); --para-hover: rgba(0,0,0,0.03);
  --para-expanded-border: rgba(124,94,60,0.3);
  --shadow: 0 4px 16px rgba(0,0,0,0.08);
  --highlight-word: rgba(200,160,60,0.20); --highlight-search: rgba(60,140,200,0.20);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Noto Sans SC', sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.8; min-height: 100vh;
  overflow-x: hidden; -webkit-font-smoothing: antialiased; transition: background 0.3s, color 0.3s;
  text-rendering: optimizeLegibility;
}
/* 全局俄语文字使用衬线字体，覆盖所有编辑器生成的动态内容 */
.expr-ru, .ru-expression-tag .ru-word, .ru-word, .ws-replica, .dp-coll-ru, .dp-ex-ru,
.ru-expression-tag, .expression-zh ~ .expr-ru {
  font-family: 'Noto Serif', 'PT Serif', Georgia, 'Segoe UI', serif;
  font-variant-ligatures: common-ligatures;
  font-variant-position: normal;
}
/* ─── 自定义滚动条 ─── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--text-dim); border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
.bg-orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(80px); opacity: 0.12; }
.bg-orb-1 { width: 400px; height: 400px; background: #4F46E5; top: -100px; left: -100px; }
.bg-orb-2 { width: 300px; height: 300px; background: #7C3AED; bottom: -80px; right: -80px; }

/* ─── 顶部进度条 ─── */
.progress-top { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 200; transition: width 0.15s; width: 0; border-radius: 0 2px 2px 0; }

/* ─── 工具栏 ─── */
.toolbar {
  position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between;
  background: rgba(10,10,20,0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border); padding: 0 12px; min-height: 48px;
}
.toolbar-left, .toolbar-right { display: flex; gap: 4px; align-items: center; }
.toolbar-center { display: flex; align-items: center; gap: 8px; }
.toolbar-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.toolbar-timer { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; margin-right: 4px; }
.tb-btn {
  background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-secondary);
  font-size: 16px; padding: 6px 10px; cursor: pointer; border-radius: 8px;
  min-width: 36px; min-height: 36px; transition: all 0.15s; display: flex; align-items: center; justify-content: center;
}
.tb-btn:hover { background: var(--glass-hover); color: var(--text); }
.tb-btn:active { transform: scale(0.95); }
.mode-tabs { display: flex; border: 1px solid var(--glass-border); border-radius: 8px; overflow: hidden; }
.mode-btn {
  background: 0; border: 0; color: var(--text-dim); font-size: 12px; padding: 5px 10px; cursor: pointer;
  border-right: 1px solid var(--glass-border); transition: all 0.15s; font-family: inherit;
}
.mode-btn:last-child { border-right: 0; }
.mode-btn:hover { color: var(--text-secondary); }
.mode-btn.active { background: var(--accent-dim); color: var(--accent); }

/* ─── 搜索栏 ─── */
.search-bar {
  display: none; position: sticky; top: 48px; z-index: 90;
  background: var(--surface-solid); border-bottom: 1px solid var(--border);
  padding: 6px 12px; gap: 8px; align-items: center;
}
.search-bar.visible { display: flex; }
.search-input {
  flex: 1; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 6px;
  padding: 6px 10px; color: var(--text); font-size: 14px; outline: none; font-family: inherit;
}
.search-input:focus { border-color: var(--accent-border); }
.search-count { font-size: 12px; color: var(--text-dim); white-space: nowrap; min-width: 60px; text-align: center; }
.search-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px; padding: 4px; }
.search-nav { display: flex; gap: 2px; }
.search-nav button { background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-secondary); cursor: pointer; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
.search-nav button:hover { background: var(--glass-hover); }

/* ─── 阅读统计条 ─── */
.peek-counter {
  text-align: center; font-size: 13px; color: var(--text-dim); padding: 6px;
}
.search-bar.visible + .peek-counter { top: 96px; }

/* ─── 主容器 ─── */
.main-container { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 20px 16px 100px; }

/* ─── 分屏布局容器 ─── */
.reader-layout {
  position: relative; z-index: 1;
  display: flex; flex-direction: row;
  width: 100%; max-width: none; min-width: 0;
  overflow-x: hidden; overflow-x: clip;
  padding: 0 0 60px;
}
/* 阅读区：flex-basis 百分比由 JS 动态控制 */
.reader-pane {
  flex: 0 0 70%;   /* 默认 70%，JS 可覆盖 */
  min-width: 25%;   /* 最小 25% */
  max-width: 85%;   /* 最大 85% */
  padding-left: 16px; padding-right: 8px;
}
/* 阅读区内的内容去除主容器最大宽度限制 */
.reader-pane .chapter-content { max-width: none; }
/* 分割线 */
.resize-handle {
  width: 8px; flex-shrink: 0; cursor: col-resize;
  background: transparent; border-radius: 4px;
  transition: background 0.2s;
  touch-action: none;         /* 禁止浏览器默认手势 */
  align-self: stretch;
  user-select: none;          /* 防止拖拽时选中文字 */
  -webkit-user-select: none;
}
.resize-handle:hover { background: var(--accent); opacity: 0.5; }
.resize-handle.active { background: var(--accent); opacity: 1; box-shadow: 0 0 12px var(--accent-dim); }
/* 详情面板 */
.detail-panel {
  flex: 1;                    /* 自动填满剩余空间 */
  min-width: 0;               /* 允许收缩 */
  position: sticky; top: 48px; align-self: flex-start;
  height: calc(100dvh - 48px); max-height: calc(100dvh - 48px); overflow-y: auto;
  overscroll-behavior: contain; scrollbar-gutter: stable;
  background: var(--surface-solid); border-left: 1px solid var(--border);
  /* 注意：无 transition！拖拽需要即时响应 */
}
.detail-panel-inner { padding: 20px; }
.dictionary-drawer-handle {
  display: none; border: 0; padding: 0; cursor: ns-resize;
  background: var(--text-dim);
}
.dictionary-global-panel {
  position: fixed; top: 48px; right: 0; bottom: 0; z-index: 210;
  width: min(420px, 38vw); max-height: none; padding-top: 8px;
  background: var(--surface-solid); border-left: 1px solid var(--border);
  box-shadow: -14px 0 42px rgba(0,0,0,0.2);
}
.dictionary-global-panel[data-dictionary-state="closed"] { display: none; }
.dictionary-phrase-lookup {
  position: fixed; z-index: 240; transform: translateX(-50%);
  border: 0; border-radius: 999px; padding: 8px 14px;
  color: white; background: var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,0.24);
  font: 600 13px/1.2 var(--ui-font); cursor: pointer;
}
.dictionary-phrase-lookup[hidden] { display: none; }
/* ─── 阅读理解：阅读 / 练习布局 ─── */
.rs-reader-mode-switch {
  display: inline-flex; align-items: center; gap: 4px; margin: 14px 0 0;
  padding: 4px; border: 1px solid var(--glass-border); border-radius: 10px; background: var(--glass);
}
.rs-reader-mode-switch button {
  min-height: 34px; padding: 0 11px; border: 0; border-radius: 7px; color: var(--text-secondary);
  background: transparent; cursor: pointer; font: inherit; font-size: 13px; transition: background .16s, color .16s;
}
.rs-reader-mode-switch button:hover { color: var(--text); background: var(--glass-hover); }
.rs-reader-mode-switch button[aria-pressed="true"] { color: #fff; background: var(--accent); box-shadow: 0 5px 14px rgba(0,0,0,.2); }
.rs-practice-panel { display: none; }
.reader-layout.rs-reading-mode .reader-pane { flex: 1 1 100%; width: 100%; min-width: 0; max-width: none; }
.reader-layout.rs-reading-mode .resize-handle { display: none; }
.reader-layout.rs-reading-mode #detailPanel[data-dictionary-state="closed"] { display: none; }
/* B2 阅读模式：练习侧栏整体隐藏（对齐 A 的纯阅读模式；练习模式侧栏由 rs-practice-panel 样式接管） */
.reader-layout.rs-reading-mode .rs-practice-panel { display: none; }
.b2-reading-done-row { display: flex; justify-content: center; padding: 2px 0 18px; }
.b2-reading-done-row .fab-mark-done { min-width: 160px; }
/* B2 阅读题目在 A 式练习侧栏内的紧凑排版 */
.rs-practice-panel .reading-practice-question { margin: 0 0 12px; padding: 13px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface-solid); }
.rs-practice-panel .reading-practice-question > p:first-child { font-size: 14px; line-height: 1.55; }
.rs-practice-panel .b2-option-row { padding: 8px 7px; font-size: 13px; }
.reader-layout.rs-practice-mode { flex-direction: column; }
.reader-layout.rs-practice-mode .reader-pane { flex: 1 1 auto; width: 100%; min-width: 0; max-width: none; padding-right: 8px; }
.reader-layout.rs-practice-mode .resize-handle { display: none; }
.reader-layout.rs-practice-mode .rs-practice-panel {
  display: block; order: 2; flex: 0 0 auto; width: 100%; min-width: 0; max-height: none; overflow: visible;
  position: static; padding: 20px 16px 90px;
  border-top: 1px solid var(--border); border-left: 0; background: var(--surface-solid);
}
.rs-practice-panel-header { margin: 0 0 14px; }
.rs-practice-panel-kicker { margin: 0 0 4px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
.rs-practice-panel-header h2 { margin: 0; color: var(--text); font-size: 17px; }
.rs-practice-panel-header p { margin: 6px 0 0; color: var(--text-secondary); font-size: 12px; line-height: 1.55; }
.rs-practice-progress { margin: 13px 0 16px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--glass); }
.rs-practice-progress-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--text-secondary); font-size: 12px; }
.rs-practice-progress-line strong { color: var(--text); font-variant-numeric: tabular-nums; }
.rs-practice-progress-track { height: 5px; margin-top: 8px; overflow: hidden; border-radius: 999px; background: var(--border); }
.rs-practice-progress-fill { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width .2s ease; }
.rs-chapter-completion { margin: 24px 0 8px; padding-top: 18px; border-top: 1px solid var(--border); text-align: center; }
.rs-chapter-completion p { margin: 0 0 10px; color: var(--text-secondary); font-size: 13px; }
.rs-chapter-completion .b2-finish { width: 100%; justify-content: center; }
.rs-practice-panel .b2-quiz-item { margin: 0 0 12px; padding: 13px; border-radius: 12px; }
.rs-practice-panel .b2-quiz-item h3 { font-size: 14px; line-height: 1.55; }
.rs-practice-panel .b2-option-row { padding: 8px 7px; font-size: 13px; }
.rs-practice-panel .b2-option-zh { margin-left: 25px; }
.reader-layout.rs-practice-mode #detailPanel {
  position: fixed; z-index: 260; top: var(--rs-dict-top, 88px); right: auto; bottom: auto;
  left: var(--rs-dict-left, 24px); width: min(360px, calc(100vw - 32px)); min-width: 0;
  max-height: min(480px, calc(100dvh - 104px)); overflow-y: auto; border: 1px solid var(--accent-border);
  border-radius: 14px; background: var(--surface-solid); box-shadow: 0 18px 46px rgba(0,0,0,.38);
}
.reader-layout.rs-practice-mode #detailPanel[data-dictionary-state="closed"] { display: none; }
.reader-layout.rs-practice-mode #detailPanel .detail-panel-inner { padding: 16px; }
.reader-layout.rs-practice-mode #detailPanel .dp-head { margin-bottom: 10px; }
.reader-layout.rs-practice-mode #detailPanel .dp-section { margin-bottom: 12px; }
.reader-layout.rs-practice-mode #detailPanel .dp-ai-section { margin-top: 14px; padding-top: 10px; }
@media (max-width: 1366px) and (orientation: portrait) {
  .reader-layout.rs-practice-mode { display: flex; flex-direction: column; }
  .reader-layout.rs-practice-mode .reader-pane { flex: 1 1 auto; width: 100%; padding-right: 0; }
  .reader-layout.rs-practice-mode .rs-practice-panel {
    order: 2; width: 100%; min-width: 0; max-height: none; position: static;
    padding: 20px 16px 90px; border-top: 1px solid var(--border); border-left: 0;
  }
  .reader-layout.rs-practice-mode #detailPanel {
    top: auto; right: 0; bottom: 0; left: 0; width: 100%; max-width: none; max-height: 88dvh;
    border: 0; border-top: 1px solid var(--accent-border); border-radius: 20px 20px 0 0;
  }
}
@media (max-width: 600px) {
  .rs-reader-mode-switch { margin-top: 10px; }
  .rs-reader-mode-switch button { min-height: 36px; padding: 0 10px; }
  .reader-layout.rs-practice-mode .rs-practice-panel { padding-left: 12px; padding-right: 12px; }
}
@media (max-width: 760px) {
  .rs-reader-mode-switch { display: none; }
}
/* 面板占位提示 */
.detail-placeholder {
  display: flex; align-items: center; justify-content: center;
  min-height: 200px; color: var(--text-dim); font-size: 14px;
  text-align: center; line-height: 1.8; padding: 20px;
}
/* ─── 叠加遮罩（竖屏）─── 已移除 .detail-overlay ─── */

/* ─── 面板卡片内容 ─── */
.dp-head { margin-bottom: 16px; }
.dict-morph-compact { margin: 10px 0 14px; padding: 10px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.dict-morph-compact strong, .dict-morph-compact span { display: block; overflow-wrap: anywhere; }
.dict-morph-compact span { margin-top: 4px; color: var(--text-secondary); font-size: 13px; }
.dp-word { font-size: 1.4em; font-weight: 700; color: var(--accent); margin-bottom: 4px; font-family: 'Segoe UI', system-ui, 'Noto Serif', serif; }
.dp-pos { font-size: 13px; color: var(--text-dim); }
.dp-section { margin-bottom: 16px; }
.dp-meaning { font-size: 1.1em; color: var(--text); line-height: 1.6; }
.dp-label { font-size: 12px; color: var(--text-dim); margin-right: 6px; }
.dp-tag { font-size: 12px; background: var(--accent-dim); color: var(--accent); padding: 1px 8px; border-radius: 4px; }
.dp-pair { font-size: 13px; color: var(--text-secondary); margin-left: 8px; }
.dp-meta { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
.dp-section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }

/* 搭配 */
.dp-coll { margin-bottom: 8px; padding: 6px 10px; background: rgba(255,255,255,0.04); border-radius: 6px; }
.dp-coll-phrase { font-size: 14px; color: var(--accent); font-weight: 500; }
.dp-coll-ru { font-size: 13px; color: var(--ru-text); margin-top: 2px; }
.dp-coll-zh { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

/* 折叠 */
.dp-collapse-toggle { font-size: 13px; color: var(--text-secondary); cursor: pointer; padding: 6px 0; user-select: none; display: flex; align-items: center; gap: 4px; min-height: 28px; }
.dp-collapse-toggle::before { content: '▸'; color: var(--text-dim); font-size: 11px; transition: transform 0.18s ease; }
.dp-collapse-toggle.expanded::before { transform: rotate(90deg); }
.dp-collapse-toggle:hover { color: var(--accent); }
.dp-collapse-toggle:hover::before { color: var(--accent); }
.dp-collapse-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
.dp-collapse-body.open { max-height: 640px; overflow-y: auto; }
.dp-detail { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-top: 6px; }

/* 变格/变位表 */
.dict-table-wrap { margin-top: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--border); border-radius: 8px; }
.dict-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 260px; }
.dict-table th { background: var(--accent-dim); color: var(--accent); font-weight: 600; padding: 7px 10px; text-align: left; white-space: nowrap; }
.dict-table td { padding: 6px 10px; border-top: 1px solid var(--border); color: var(--text); font-family: 'Segoe UI', system-ui, 'Noto Serif', serif; white-space: nowrap; }
.dict-table tr:nth-child(even) td { background: rgba(255,255,255,0.03); }
.dict-table td:first-child { color: var(--text-secondary); font-family: inherit; white-space: nowrap; }

/* 例句 */
.dp-example { margin-bottom: 8px; padding: 6px 10px; background: rgba(255,255,255,0.03); border-radius: 6px; }
.dp-ex-ru { font-size: 13px; color: var(--ru-text); line-height: 1.6; }
.dp-ex-zh { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

/* 备选原形 */
.dp-alt-label { font-size: 12px; color: var(--text-dim); }
.dp-alt-word { font-size: 12px; color: var(--text-secondary); margin-left: 4px; }

/* 🤖 AI */
.dp-ai-section { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--border); }
.dp-ai-btn { width: 100%; padding: 10px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-secondary); cursor: pointer; font-size: 14px; font-family: inherit; transition: all 0.2s; }
.dp-ai-btn:hover { background: var(--glass-hover); color: var(--accent); }
.dp-ai-btn.loading { opacity: 0.6; pointer-events: none; }
.dp-ai-result { margin-top: 12px; font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
.dp-ai-result:empty { display: none; }
.reader-ai-panel { margin-top: 12px; padding: 12px; border: 1px solid var(--accent-border); border-radius: 8px; background: var(--accent-dim); color: var(--text-secondary); overflow-wrap: anywhere; }
.reader-ai-panel h4 { margin: 0 0 8px; color: var(--text); font-size: 14px; letter-spacing: 0; }
.reader-ai-panel h5 { margin: 12px 0 5px; color: var(--text); font-size: 13px; letter-spacing: 0; }
.reader-ai-panel p { margin: 5px 0; }
.reader-ai-panel ul { margin: 5px 0; padding-left: 20px; }
.reader-ai-panel .reader-ai-badge { display: inline-block; margin-bottom: 8px; padding: 2px 7px; border: 1px solid var(--accent-border); border-radius: 6px; color: var(--accent); font-size: 11px; font-weight: 700; }
.reader-ai-panel .reader-ai-provisional { margin: 8px 0; padding: 8px; border-left: 3px solid #d97706; background: rgba(217,119,6,.1); color: var(--text); }
.reader-ai-usage { margin-top: 10px !important; color: var(--text-dim); font-size: 11px; font-variant-numeric: tabular-nums; }
.reader-ai-controls, .reader-ai-feedback { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.reader-ai-controls button, .reader-ai-feedback button { min-height: 36px; padding: 7px 11px; border: 1px solid var(--glass-border); border-radius: 7px; background: var(--glass); color: var(--text); cursor: pointer; font: inherit; font-size: 12px; }
.reader-ai-controls button:hover, .reader-ai-feedback button:hover { background: var(--glass-hover); }
.reader-ai-reading-panel h5 { margin-top: 18px; padding-top: 8px; border-top: 1px solid var(--border); }
.reader-ai-reading-evidence { margin: 8px 0; padding: 10px; border-left: 4px solid #2563eb; background: rgba(37,99,235,.08); }
.reader-ai-reading-evidence .reader-ai-ru { color: var(--text); font-family: Georgia, 'Times New Roman', serif; font-size: 14px; line-height: 1.65; }
.reader-ai-reading-evidence .reader-ai-zh { color: var(--text-secondary); }
.reader-ai-reading-source-term { color: #0f766e; font-weight: 700; }
.reader-ai-reading-option { margin: 8px 0; padding: 8px 10px; border-left: 4px solid var(--border); list-style-position: outside; }
.reader-ai-reading-option.is-correct { border-left-color: #16a34a; background: rgba(22,163,74,.08); }
.reader-ai-reading-option.is-wrong { border-left-color: #d97706; background: rgba(217,119,6,.08); }
.reader-ai-reading-option small { color: #b45309; font-weight: 700; }
.reader-ai-reading-option p { margin: 5px 0 0; }
.rs-structured-analysis { margin: 10px 0; }
.rs-structured-analysis > section { margin: 10px 0; padding: 10px 12px; border-left: 4px solid var(--border); background: var(--surface); }
.rs-structured-analysis .rs-analysis-evidence { border-left-color: #2563eb; background: rgba(37,99,235,.08); }
.rs-structured-analysis .rs-analysis-correct { border-left-color: #16a34a; background: rgba(22,163,74,.08); }
.rs-structured-analysis .rs-analysis-wrong { border-left-color: #d97706; background: rgba(217,119,6,.08); }
.rs-structured-analysis .rs-analysis-mapping { color: #0f766e; font-weight: 700; }
.rs-structured-analysis h4 { margin: 0 0 7px; }
.rs-structured-analysis p { margin: 5px 0; }
.rs-structured-analysis ul { margin: 5px 0; padding-left: 22px; }
.rs-analysis-quick { margin: 10px 0; }
.rs-analysis-quick > section { margin: 10px 0; padding: 10px 12px; border-left: 4px solid var(--border); background: var(--surface); }
.rs-analysis-quick .rs-analysis-conclusion { border-left-color: #16a34a; background: rgba(22,163,74,.08); }
.rs-analysis-expanded { margin-top: 10px; border-top: 1px solid var(--border); }
.rs-analysis-expanded > summary { min-height: 44px; display: flex; align-items: center; gap: 8px; padding: 10px 2px; color: var(--accent); font-weight: 700; cursor: pointer; list-style: none; }
.rs-analysis-expanded > summary::-webkit-details-marker { display: none; }
.rs-analysis-expanded > summary::before { content: '＋'; width: 22px; flex: 0 0 22px; font-size: 18px; line-height: 1; text-align: center; }
.rs-analysis-expanded[open] > summary::before { content: '−'; }
.rs-analysis-expanded-content { padding: 2px 0 4px; }
.rs-analysis-expanded-content > section { margin: 10px 0; padding: 10px 12px; border-left: 4px solid var(--border); background: var(--surface); }
.rs-analysis-expanded-content .rs-analysis-wrong { border-left-color: #d97706; background: rgba(217,119,6,.08); }
.rs-analysis-source { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--border); color: var(--text-dim); font-size: 12px; }
.rs-analysis-source p { margin: 4px 0; }
.rs-source-locate-status { display: inline-flex; align-items: center; min-height: 30px; margin-left: 6px; padding: 3px 8px; border: 1px solid var(--border); border-radius: 6px; color: var(--text-secondary); font-size: 12px; font-weight: 600; vertical-align: middle; }
.rs-source-locate-status--paragraph { border-color: rgba(217,119,6,.35); background: rgba(217,119,6,.08); color: #b45309; }
.rs-source-locate-status--unavailable { color: var(--text-dim); }
.reader-ai-status { display: flex; align-items: center; gap: 8px; min-height: 42px; }
.reader-ai-status .spinner { width: 18px; height: 18px; flex: 0 0 18px; }
.reader-ai-action .reader-ai-result { margin-top: 10px; }
.dp-action-bar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--border); }
.dp-action-bar .dp-ai-btn { grid-column: 1 / -1; }
.dp-action-bar .tb-btn, .dp-action-bar .btn-save-vocab { width: 100%; min-height: 40px; }
.reader-ai-action { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.reader-ai-action p { margin: 0 0 8px; color: var(--text-dim); font-size: 13px; line-height: 1.55; }

/* 来源 */
.dp-source { margin-top: 12px; font-size: 11px; color: var(--text-dim); }

/* ─── 书架 ─── */
.bookshelf { display: grid; gap: 16px; padding: 24px 0; }
.book-card {
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px;
  padding: 20px; cursor: pointer; transition: all 0.2s;
}
.book-card:hover { background: var(--glass-hover); transform: translateY(-2px); box-shadow: var(--shadow); }
.book-card:active { transform: scale(0.98); }
.book-card h3 { font-size: 1.1em; margin-bottom: 6px; }
.book-card .book-meta { font-size: 13px; color: var(--text-secondary); display: flex; gap: 12px; }
.book-card .book-desc { font-size: 13px; color: var(--text-dim); margin-top: 8px; }
.book-card .book-progress { margin-top: 12px; }
.reader-ai-settings-overlay { position: fixed; inset: 0; z-index: 420; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(12,15,22,.62); backdrop-filter: blur(5px); }
.reader-ai-settings-overlay.visible { display: flex; }
.reader-ai-settings-dialog { width: min(920px, 100%); max-height: min(820px, calc(100dvh - 40px)); overflow: hidden; border: 1px solid var(--glass-border); border-radius: 14px; background: var(--surface-solid); box-shadow: 0 24px 70px rgba(0,0,0,.34); }
.reader-ai-settings-dialog > header { display: flex; align-items: center; justify-content: space-between; min-height: 70px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.reader-ai-settings-dialog > header span { color: var(--accent); font-size: 11px; font-weight: 700; }
.reader-ai-settings-dialog > header h2 { margin: 2px 0 0; font-size: 20px; }
.reader-ai-settings-dialog > header button, .reader-ai-provider-list-head button { width: 38px; height: 38px; border: 1px solid var(--glass-border); border-radius: 8px; background: var(--glass); color: var(--text-secondary); cursor: pointer; font: inherit; font-size: 24px; line-height: 1; }
.reader-ai-settings-body { max-height: calc(min(820px, 100dvh - 40px) - 70px); overflow-y: auto; overscroll-behavior: contain; padding: 18px; }
.reader-ai-routing { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr) auto; align-items: end; gap: 12px; padding-bottom: 18px; border-bottom: 1px solid var(--border); }
.reader-ai-routing label, .reader-ai-config-form label { display: grid; gap: 6px; color: var(--text-secondary); font-size: 12px; }
.reader-ai-routing select, .reader-ai-config-form input, .reader-ai-config-form select { width: 100%; min-height: 42px; padding: 8px 10px; border: 1px solid var(--glass-border); border-radius: 7px; background: var(--surface); color: var(--text); font: inherit; font-size: 13px; }
.reader-ai-settings-workspace { display: grid; grid-template-columns: 260px minmax(0,1fr); min-height: 430px; }
.reader-ai-provider-list { padding: 18px 14px 18px 0; border-right: 1px solid var(--border); }
.reader-ai-provider-list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.reader-ai-provider-list-head h3 { margin: 0; font-size: 14px; }
.reader-ai-provider-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 60px; margin: 0 0 7px; padding: 9px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--text); text-align: left; cursor: pointer; font: inherit; }
.reader-ai-provider-row:hover, .reader-ai-provider-row.is-selected { border-color: var(--accent-border); background: var(--accent-dim); }
.reader-ai-provider-row strong, .reader-ai-provider-row small { display: block; max-width: 132px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.reader-ai-provider-row strong { font-size: 13px; }.reader-ai-provider-row small { margin-top: 4px; color: var(--text-dim); font-size: 11px; }
.reader-ai-provider-state { flex: 0 0 auto; color: var(--text-dim); font-size: 10px; }.reader-ai-provider-state.is-ready { color: #0f9f65; }
.reader-ai-config-form { padding: 20px 0 20px 20px; }
.reader-ai-config-form-head { display: flex; align-items: start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.reader-ai-config-form-head h3 { margin: 0; font-size: 16px; }.reader-ai-config-form-head p { margin: 5px 0 0; color: var(--text-dim); font-size: 11px; }
.reader-ai-config-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 12px; }.reader-ai-config-wide { grid-column: 1 / -1; }
.reader-ai-price-fields { margin: 18px 0 0; padding: 14px; border: 1px solid var(--border); border-radius: 8px; }.reader-ai-price-fields legend { padding: 0 6px; color: var(--text-secondary); font-size: 12px; }
.reader-ai-price-grid { grid-template-columns: repeat(5,minmax(0,1fr)); }.reader-ai-price-grid input, .reader-ai-price-grid select { min-width: 0; }
.reader-ai-config-actions { display: flex; gap: 9px; margin-top: 18px; }
.reader-ai-config-primary, .reader-ai-config-danger { min-height: 42px; padding: 9px 14px; border: 1px solid var(--accent-border); border-radius: 7px; background: var(--accent-dim); color: var(--accent); cursor: pointer; font: inherit; font-weight: 700; }
.reader-ai-config-danger { border-color: rgba(220,38,38,.3); background: rgba(220,38,38,.08); color: #dc2626; }
.reader-ai-env-summary { display: grid; gap: 10px; margin: 0; }.reader-ai-env-summary div { display: grid; grid-template-columns: 70px minmax(0,1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }.reader-ai-env-summary dt { color: var(--text-dim); font-size: 12px; }.reader-ai-env-summary dd { min-width: 0; margin: 0; overflow-wrap: anywhere; }
.reader-ai-settings-error { display: grid; justify-items: center; gap: 14px; padding: 50px 20px; color: var(--text-secondary); }
@media (max-width: 760px) { .reader-ai-settings-overlay { padding: 0; }.reader-ai-settings-dialog { width: 100%; max-height: 100dvh; height: 100dvh; border: 0; border-radius: 0; }.reader-ai-settings-body { max-height: calc(100dvh - 70px); padding: 14px; }.reader-ai-routing { grid-template-columns: 1fr; }.reader-ai-settings-workspace { grid-template-columns: 1fr; }.reader-ai-provider-list { padding: 16px 0; border-right: 0; border-bottom: 1px solid var(--border); }.reader-ai-config-form { padding: 18px 0; }.reader-ai-config-grid, .reader-ai-price-grid { grid-template-columns: 1fr; }.reader-ai-config-wide { grid-column: auto; } }
.b2-dashboard { max-width: 1080px; }
.b2-dashboard-hero { padding: 26px; margin-bottom: 20px; border: 1px solid var(--accent-border); border-radius: 18px; background: linear-gradient(135deg, var(--accent-dim), var(--surface)); }
.b2-dashboard-hero h1 { margin-bottom: 6px; }
.b2-continue-card { display: grid; grid-template-columns: 1fr auto; gap: 6px 18px; align-items: center; margin-bottom: 20px; padding: 20px; border: 1px solid var(--accent-border); border-radius: 16px; background: var(--surface-solid); }
.b2-continue-card p, .b2-continue-card h2, .b2-continue-card small { grid-column: 1; }
.b2-continue-card p { color: var(--accent); font-size: 13px; font-weight: 600; }
.b2-continue-card h2 { font-size: 20px; }
.b2-continue-card small { color: var(--text-secondary); }
.b2-continue-card button { grid-column: 2; grid-row: 1 / 4; padding: 9px 14px; border: 1px solid var(--accent-border); border-radius: 10px; background: var(--accent-dim); color: var(--accent); cursor: pointer; font: inherit; font-weight: 600; }
.b2-module-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.b2-module-card { display: flex; flex-direction: column; align-items: stretch; text-align: left; color: var(--text); border: 1px solid var(--glass-border); border-radius: 15px; background: var(--glass); padding: 18px; cursor: pointer; font: inherit; transition: transform .15s, background .15s, border-color .15s; }
.b2-module-card:hover { transform: translateY(-2px); background: var(--glass-hover); border-color: var(--accent-border); }
.b2-module-card h2 { font-size: 1.15em; margin: 8px 0 6px; }
.b2-module-card .b2-status { display: block; color: var(--accent); font-size: 13px; margin: 8px 0 0; }
.b2-module-card small { color: var(--text-secondary); margin-top: 8px; }
.b2-module-card .progress-bar { margin-top: 14px; }
.b2-module-card .world-module-resume { margin: 12px 0 0; }
.b2-module-card .world-module-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.b2-module-card .world-module-actions .b2-finish { margin: 0; }
.b2-module-card .world-module-actions .world-module-continue { padding: 8px 10px; border: 1px solid var(--accent-border); border-radius: 9px; background: transparent; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; }
.manual-completion { margin-top: 12px; border-color: var(--accent-border); color: var(--accent); }
@media (max-width: 540px) { .b2-continue-card { grid-template-columns: 1fr; } .b2-continue-card button { grid-column: 1; grid-row: auto; margin-top: 8px; } }
@media (max-width: 540px) { .b2-knowledge-resume-card { grid-template-columns: 1fr; } .b2-knowledge-resume-card button { grid-column: 1; grid-row: auto; margin-top: 6px; } }
.book-kind { color: var(--accent); font-size: 0.7em; margin-right: 6px; font-weight: 600; letter-spacing: 0.04em; }
.b2-quiz-item { margin: 0 0 18px; padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.reading-practice-question .b2-options { margin-top: 12px; }
.reading-answer-source { display: block; margin-top: 10px; color: var(--text-dim); font-size: 12px; }
.writing-workbench { margin-top: 20px; }
.writing-workbench { font-size: 16px; line-height: 1.75; }
.writing-workbench p, .writing-workbench li,
.writing-workbench .ru-text, .writing-workbench .cn-text,
.writing-workbench .writing-letter-text, .writing-workbench .writing-template,
.writing-workbench .writing-ad-layout { font-family: 'Segoe UI', 'Noto Sans', 'Noto Sans SC', sans-serif; font-size: 16px !important; line-height: 1.75; }
.writing-workbench .writing-letter-text,
.writing-workbench .writing-template,
.writing-workbench .writing-ad-layout { font-size: 16px !important; }
.writing-workbench .writing-status { font-size: 13px !important; line-height: 1.6; }
.writing-workbench .reading-answer-source { font-size: 12px !important; }
.writing-workbench section { margin: 18px 0; padding: 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.writing-draft { width: 100%; min-height: 260px; padding: 14px; border: 1px solid var(--glass-border); border-radius: 10px; background: var(--surface-solid); color: var(--text); font: 16px/1.7 'Crimson Pro', 'Noto Serif', serif; resize: vertical; }
.writing-draft:focus { outline: 2px solid var(--accent-border); border-color: var(--accent); }
.writing-status { color: var(--text-dim); font-size: 13px; margin-top: 8px; }
.writing-source-task { border-left: 4px solid var(--accent) !important; }
.writing-materials-grid { display: grid; grid-template-columns: 1fr; gap: 18px; }
.writing-material-card { margin: 0 !important; padding: 16px !important; background: var(--glass) !important; }
.writing-material-card h3 { margin-bottom: 8px; }
.writing-original-label { margin-bottom: 10px; color: var(--text-dim); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
.writing-ad-layout { margin: 0 0 18px; padding: 18px 22px; border: 1px solid var(--glass-border); background: var(--surface-solid); font-family: 'Crimson Pro', 'Noto Serif', serif; font-size: 16px; line-height: 1.75; }
.writing-ad-layout h3 { margin: 0 0 5px; font-size: 1.25em; }
.writing-ad-subtitle { margin: 0 0 14px; color: var(--text-secondary); }
.writing-ad-group { margin: 14px 0; }
.writing-ad-group h4 { margin: 0 0 5px; font-size: 1em; }
.writing-ad-group ul { margin: 0; padding-left: 22px; }
.writing-ad-group li { margin: 5px 0; }
.writing-ad-line { margin: 7px 0; }
.writing-material-source-heading { margin-top: 18px; color: var(--text-secondary); font-size: 13px; }
.writing-model-section { scroll-margin-top: 92px; }
.writing-model-inline { margin-top: 14px; padding: 16px; border: 1px solid var(--glass-border); background: var(--surface-solid); }
.writing-model-inline h3, .writing-model-inline h4 { margin-top: 0; }
.writing-letter-text { margin: 0; font-family: 'Crimson Pro', 'Noto Serif', serif; font-size: 16px; line-height: 1.8; }
.writing-letter-paragraph { margin: 0 0 10px; }
.writing-letter-line { display: block; text-indent: 2em; }
.writing-letter-paragraph:last-child { margin-bottom: 0; }
.writing-facts { margin-top: 10px; color: var(--text-secondary); font-size: 14px; }
.writing-metadata { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.writing-metadata span { padding: 4px 9px; border-radius: 999px; background: var(--accent-dim); color: var(--accent); font-size: 12px; }
.writing-support-box { border-left: 3px solid var(--warning) !important; }
.writing-lesson-plan { border-left: 4px solid var(--accent) !important; }
.writing-lesson-steps { padding-left: 22px; }
.writing-lesson-steps li { margin: 14px 0; }
.writing-lesson-steps p { margin: 6px 0 0; }
.writing-paper-task { color: var(--accent); font-size: 14px; }
.writing-pattern-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.writing-pattern-card { margin: 0 !important; padding: 14px !important; border: 1px solid var(--glass-border); border-radius: 8px; background: var(--glass); }
.writing-pattern-card h4 { margin: 0 0 8px; }
.writing-pattern-card p { margin: 5px 0; }
.writing-template { white-space: pre-wrap; padding: 16px; border: 1px dashed var(--accent-border); background: var(--surface-solid); color: var(--text); font: 16px/1.8 'Crimson Pro', 'Noto Serif', serif; overflow-x: auto; }
.writing-original-example { margin: 14px 0; padding: 14px; border: 1px solid var(--glass-border); border-radius: 8px; background: var(--glass); }
.writing-original-example h3, .writing-original-example h4 { margin-top: 0; }
.writing-genre-library { margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--border); }
.writing-genre-card { background: var(--surface-solid); }
.writing-source-excerpt { white-space: pre-wrap; margin: 10px 0 0; padding: 12px; border-left: 3px solid var(--accent); line-height: 1.75; font-size: 16px; overflow-x: auto; }
.application-workbench-shell { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: start; }
.application-workbench .writing-stage-nav { position: static; }
.application-genre-nav { position: sticky; top: 72px; display: grid; gap: 6px; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-solid); }
.application-genre-nav button { width: 100%; padding: 9px 10px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--text-secondary); cursor: pointer; font: inherit; text-align: left; }
.application-genre-nav button:hover, .application-genre-nav button.is-active { border-color: var(--accent-border); background: var(--accent-dim); color: var(--accent); }
.application-genre-detail { min-width: 0; }
.application-document { padding: 34px 38px; border: 1px solid var(--glass-border); background: var(--surface-solid); color: var(--text); font: 16px/1.8 'Crimson Pro', 'Noto Serif', Georgia, serif; }
.application-document pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; }
.application-document .application-doc-line { display: block; min-height: 1.8em; }
.application-document .application-doc-address { margin-left: auto; width: 100%; text-align: right; }
.application-document .application-doc-title { margin: 24px 0 22px; text-align: center; font-weight: 700; }
.application-document .application-doc-body { margin-top: 4px; }
.application-document .application-doc-body .application-doc-line { text-indent: 2em; }
.application-document .application-doc-footer { display: block; margin-top: 0; margin-left: 2em; }
.application-document .application-doc-date, .application-document .application-doc-signature { display: block; text-align: left; margin: 0; }
.writing-source-note { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--warning); color: var(--text-secondary); font-size: 13px; line-height: 1.6; }
.application-doc-line { display: block; min-height: 1.8em; }

.dict-preview .dict-pos { font-style: italic; color: var(--text-dim); font-size: 12px; }
.dict-preview .dict-meaning { margin-top: 4px; }
.dict-loading { padding: 8px 14px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
/* ─── 备选原形 ─── */
.dict-alternatives {
  margin-top: 8px; padding: 6px 10px;
  background: rgba(255,255,255,0.04); border-radius: 6px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font-size: 12px; color: var(--text-dim); line-height: 1.6;
}
.dict-alt-label { color: var(--text-dim); }
.dict-alt-word { color: var(--text-secondary); }
.dict-guess-label {
  margin-top: 4px; font-size: 11px; color: var(--text-dim);
  font-style: italic;
}
.dict-context {
  margin-top: 8px; padding: 6px 8px;
  background: rgba(255,255,255,0.03); border-radius: 4px;
  font-size: 12px; color: var(--text-secondary); line-height: 1.6;
}
.dict-context-word {
  padding: 0 2px; border-radius: 3px; color: var(--text);
  background: color-mix(in srgb, var(--accent) 24%, transparent); font-weight: 700;
}
.popup-actions { display: flex; gap: 8px; align-items: center; padding: 8px 10px; }
.btn-save-vocab {
  flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
  background: linear-gradient(135deg, rgba(251,191,36,0.3), rgba(251,191,36,0.1));
  color: #fbbf24; font-size: 14px; cursor: pointer; transition: all 0.2s;
  font-family: inherit; display: flex; align-items: center; gap: 6px; justify-content: center;
}
.btn-save-vocab:hover { background: rgba(251,191,36,0.4); }
.btn-save-vocab.saved { background: rgba(34,197,94,0.3); color: #22c55e; border-color: rgba(34,197,94,0.3); }
.btn-icon {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06); color: var(--text-dim); font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  font-family: inherit;
}
.btn-icon:hover { background: rgba(255,255,255,0.12); }

/* ─── Toast ─── */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: var(--surface-solid); color: var(--text); padding: 10px 24px; border-radius: 24px;
  font-size: 14px; z-index: 400; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  border: 1px solid var(--glass-border); box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.toast.visible { opacity: 1; }

/* ─── 回到顶部 ─── */
.back-top {
  position: fixed; bottom: 70px; right: 16px; z-index: 80;
  width: 40px; height: 40px; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-border);
  color: var(--text-secondary); font-size: 18px; cursor: pointer; display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: all 0.2s;
}
.back-top:hover { background: var(--glass-hover); color: var(--text); }
.back-top.visible { display: flex; }

/* ─── 弹窗通用 ─── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300;
  display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px);
}
.modal-overlay.visible { display: flex; }
.modal-content {
  background: var(--surface-solid); border: 1px solid var(--glass-border); border-radius: 20px;
  padding: 28px 24px; max-width: 400px; width: 90%; text-align: center; box-shadow: var(--shadow);
}
.modal-content h3 { font-size: 1.1em; margin-bottom: 12px; }
.modal-content p { color: var(--text-secondary); font-size: 14px; line-height: 1.7; }
.modal-content .stat { color: var(--accent); font-weight: 600; }
.modal-btn {
  background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-border);
  border-radius: 10px; padding: 10px 28px; font-size: 15px; cursor: pointer;
  margin-top: 16px; transition: all 0.15s; font-family: inherit;
}
.modal-btn:hover { background: rgba(129,140,248,0.30); }
.modal-btn:active { transform: scale(0.95); }

/* ─── 读书报告 ─── */
.report-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
.report-item { text-align: center; }
.report-item .val { font-size: 1.8em; font-weight: 700; color: var(--accent); }
.report-item .lbl { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.report-bar { margin: 8px 0; }
.report-bar-label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.report-bar-track { height: 6px; background: var(--glass); border-radius: 3px; overflow: hidden; }
.report-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.5s; }

/* ─── 加载 ─── */
.loading { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 14px; }
.loading .spinner { width: 32px; height: 32px; margin: 0 auto 16px; border: 3px solid var(--glass-border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── 字号/字体 ─── */
.size-small .ru-text { font-size: 0.9em; } .size-small .cn-text { font-size: 0.85em; }
.size-large .ru-text { font-size: 1.2em; } .size-large .cn-text { font-size: 1.1em; }
.size-xlarge .ru-text { font-size: 1.35em; } .size-xlarge .cn-text { font-size: 1.25em; }
.font-sans .ru-text, .font-sans .cn-text { font-family: 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif; }

/* ─── B2 知识点导航 ─── */
.b2-knowledge-nav { margin: 18px 0 24px; padding: 16px; border: 1px solid var(--accent-border); background: var(--accent-dim); border-radius: 14px; }
.b2-knowledge-nav h2 { font-size: 1em; margin-bottom: 10px; }
.b2-knowledge-nav h2 + p { color: var(--text-secondary); font-size: 13px; margin: -5px 0 10px; }
.b2-knowledge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.b2-knowledge-card { font: inherit; text-align: left; padding: 10px; border: 1px solid var(--glass-border); border-radius: 10px; background: var(--surface-solid); color: var(--text); cursor: pointer; }
.b2-knowledge-card strong, .b2-knowledge-card span, .b2-knowledge-card small { display: block; }
.b2-knowledge-card span { color: var(--accent); font-size: 12px; }
.b2-knowledge-card small { color: var(--text-secondary); line-height: 1.5; margin-top: 3px; }
.b2-knowledge-study-card { border-color: var(--accent); box-shadow: 0 4px 14px var(--accent-dim); }
.b2-knowledge-card em { display: block; margin-top: 8px; color: var(--accent); font-size: 12px; font-style: normal; font-weight: 600; }
.b2-knowledge-resume-card { margin: 0 0 14px; padding: 14px 16px; border: 1px solid var(--accent-border); border-radius: 12px; background: var(--accent-dim); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; align-items: center; }
.b2-knowledge-resume-card p, .b2-knowledge-resume-card h3, .b2-knowledge-resume-card small { grid-column: 1; margin: 0; }
.b2-knowledge-resume-card p { color: var(--accent); font-size: 12px; font-weight: 700; }
.b2-knowledge-resume-card h3 { font-size: 16px; }
.b2-knowledge-resume-card small { color: var(--text-secondary); line-height: 1.5; }
.b2-knowledge-resume-card button { grid-column: 2; grid-row: 1 / 4; padding: 8px 12px; border: 1px solid var(--accent-border); border-radius: 9px; background: var(--surface-solid); color: var(--accent); cursor: pointer; font: inherit; font-weight: 700; }
.b2-knowledge-position { display: flex; justify-content: flex-end; margin-top: 10px; }
.b2-knowledge-position button { padding: 7px 10px; border: 1px solid var(--accent-border); border-radius: 8px; background: transparent; color: var(--accent); cursor: pointer; font: inherit; font-size: 12px; }
.b2-knowledge-position button:hover, .b2-knowledge-resume-card button:hover { background: var(--accent-dim); }
.b2-knowledge-exercise-nav { margin-top: 16px; }
.b2-study-card { max-width: 860px; }
.b2-study-quick { border: 1px solid var(--accent-border); background: var(--accent-dim); }
.b2-study-outline { position: sticky; top: 50px; z-index: 20; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; margin: 0 0 16px; border: 1px solid var(--glass-border); border-radius: 10px; background: color-mix(in srgb, var(--surface-solid) 92%, transparent); backdrop-filter: blur(10px); }
.b2-study-outline a { color: var(--accent); text-decoration: none; font-size: 12px; padding: 4px 7px; border-radius: 6px; background: var(--glass); }
.b2-study-outline a:hover { background: var(--accent-dim); }
.b2-study-lesson { margin: 24px 0; padding: 20px; border: 1px solid var(--glass-border); border-radius: 14px; background: var(--surface-solid); scroll-margin-top: 90px; }
.b2-study-lesson.related { border-color: var(--warning); }
.b2-study-lesson h2 { margin-bottom: 8px; }
.b2-study-lesson h3 { margin: 16px 0 6px; font-size: 14px; color: var(--accent); }
.b2-study-conditions, .b2-study-boundaries { margin: 8px 0 0 20px; }
.b2-study-case-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.b2-study-case-change { padding: 9px; border: 1px solid var(--glass-border); border-radius: 9px; background: var(--glass); }
.b2-study-case-change code { color: var(--accent); font-family: Georgia, serif; }
.b2-study-example .kind, .b2-study-source-disclosure summary { color: var(--text-secondary); font-size: 12px; cursor: pointer; }
.b2-study-source-disclosure { margin-top: 8px; }
.b2-study-check { margin-top: 12px; padding: 12px; border: 1px dashed var(--accent-border); border-radius: 10px; background: var(--accent-dim); }
.b2-study-check-options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.b2-study-check-options button { font: inherit; color: var(--text); background: var(--surface-solid); border: 1px solid var(--glass-border); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.b2-study-check-options button:hover { border-color: var(--accent); }
.b2-study-check-result { margin-top: 8px; color: var(--text-secondary); }
.b2-study-check-result.correct { color: var(--success); }
.b2-study-check-result.wrong { color: var(--warning); }
.b2-study-synthesis { border-left: 3px solid var(--accent); padding-left: 12px; }
.b2-study-section { margin: 18px 0; padding: 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-solid); }
.b2-study-section h2 { margin-bottom: 8px; font-size: 1.1em; }
.b2-study-status { color: var(--accent); font-size: 13px; font-weight: 600; }
.b2-study-rule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.b2-study-rule, .b2-study-comparison, .b2-study-example { padding: 12px; border: 1px solid var(--glass-border); border-radius: 10px; background: var(--glass); }
.b2-study-rule p, .b2-study-example p { margin-top: 6px; }
.b2-study-source { display: block; margin-top: 9px; color: var(--text-secondary); font-size: 12px; line-height: 1.45; }
.b2-study-comparison + .b2-study-comparison, .b2-study-example + .b2-study-example { margin-top: 10px; }
.b2-study-comparison strong { color: var(--accent); }
.b2-study-example .ru { color: var(--ru-text); font-family: 'Segoe UI', system-ui, Georgia, serif; font-size: 1.06em; }
.b2-study-example .zh { color: var(--text-secondary); }
.b2-study-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0 48px; }
.b2-study-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; color: var(--text-secondary); font-size: 13px; }
.b2-study-meta span { padding: 3px 8px; border: 1px solid var(--glass-border); border-radius: 999px; background: var(--glass); }
.b2-study-empty { color: var(--text-secondary); font-style: italic; }
.world-dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.world-module-card { display: flex; flex-direction: column; min-height: 220px; padding: 20px; border: 1px solid var(--glass-border); border-radius: 14px; background: var(--glass); cursor: pointer; transition: transform .18s ease, background .18s ease, border-color .18s ease; }
.world-module-card:hover { transform: translateY(-2px); background: var(--glass-hover); border-color: var(--accent-border); }
.world-module-card h2 { font-size: 1.15em; margin: 8px 0 6px; }
.world-module-card p { color: var(--text-secondary); font-size: 14px; line-height: 1.6; }
.world-module-card .progress-bar { margin-top: auto; }
.world-module-card .progress-text { margin: 9px 0 14px; }
.world-module-card button { align-self: flex-start; }
.world-module-resume { margin: 0 0 14px; color: var(--text-secondary); font-size: 12px; line-height: 1.45; }
.world-module-resume strong { color: var(--text); font-weight: 650; }
.world-module-card .world-module-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 2px; }
.world-module-card .world-module-actions .b2-finish { margin: 0; }
.world-module-card .world-module-actions .world-module-continue, .world-module-card .world-module-actions .world-module-export { padding: 8px 10px; border: 1px solid var(--accent-border); border-radius: 9px; background: transparent; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; }
.world-module-card .world-module-actions .world-module-export { color: var(--text-secondary); border-color: var(--glass-border); }
.world-module-card .world-module-actions .world-module-export:disabled { opacity: .55; cursor: wait; }
.world-directory-resume { margin: 14px 0 18px; }
.world-directory-resume .b2-continue-card { margin: 0; }
.shelf-hero { padding: 24px 0 8px; }
.shelf-hero h1 { margin: 0; font-size: clamp(26px, 3vw, 36px); }
.shelf-hero p { margin: 7px 0 0; color: var(--text-secondary); }
.shelf-continue { margin: 14px 0 18px; }
.shelf-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; }
.shelf-tool { padding: 8px 11px; border: 1px solid var(--glass-border); border-radius: 9px; background: var(--glass); color: var(--text-secondary); cursor: pointer; font: inherit; font-size: 13px; transition: background .18s ease, border-color .18s ease; }
.shelf-tool:hover { background: var(--glass-hover); border-color: var(--accent-border); color: var(--text); }
.shelf-section { margin: 0 0 30px; }
.shelf-section-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 10px; }
.shelf-section-heading h2 { margin: 0; font-size: 18px; }
.shelf-book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.shelf-book-grid .book-card { min-height: 174px; }
.world-shelf-card { grid-column: 1 / -1; cursor: default; }
.world-shelf-card-main { display: flex; justify-content: space-between; gap: 18px; align-items: start; }
.world-shelf-card-main h3 { margin: 0; }
.world-shelf-open { flex: 0 0 auto; padding: 8px 11px; border: 1px solid var(--accent-border); border-radius: 9px; background: var(--accent-dim); color: var(--accent); cursor: pointer; font: inherit; font-weight: 600; }
.world-shelf-modules { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.world-shelf-module { min-width: 0; padding: 11px; border: 1px solid var(--glass-border); border-radius: 10px; background: var(--surface-solid); color: var(--text); cursor: pointer; font: inherit; text-align: left; transition: background .18s ease, border-color .18s ease; }
.world-shelf-module:hover { background: var(--glass-hover); border-color: var(--accent-border); }
.world-shelf-module strong, .world-shelf-module small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.world-shelf-module strong { font-size: 13px; }
.world-shelf-module small { margin-top: 5px; color: var(--text-secondary); font-size: 11px; }
.b2-shelf-modules { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.b2-shelf-module strong { color: var(--text); }
.b2-shelf-module small:last-child { color: var(--accent); font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .world-shelf-modules { grid-template-columns: repeat(2, minmax(0, 1fr)); } .world-shelf-card-main { flex-direction: column; } }
@media (max-width: 440px) { .world-shelf-modules { grid-template-columns: 1fr; } }
.b2-quiz-target { outline: 3px solid var(--accent); outline-offset: 5px; border-radius: 10px; }

/* ─── 移动端 ─── */
@media (max-width: 600px) {
  .main-container { padding: 12px 12px 80px; }
  .mode-btn { font-size: 11px; padding: 4px 8px; }
  .chapter-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
  .ch-item { padding: 8px 6px; font-size: 12px; }
  .toolbar { padding: 0 8px; min-height: 44px; }
  .peek-counter { top: 44px; }
  .search-bar.visible + .peek-counter { top: 88px; }
  .toolbar-timer { display: none; }
  .search-bar { top: 44px; }
  .reader-page-switcher { top: 6px; left: 6px; }
  .reader-page-switcher button { min-height: 32px; padding: 0 8px; font-size: 12px; }
}

@media (max-width: 760px) {
  /* ─── 竖屏分栏：上下布局 ─── */
  .reader-layout {
    flex-direction: column;
    max-width: 100%; padding: 0 0 80px;
  }
  .reader-pane {
    flex: 0 0 55%;        /* 竖屏默认上方 55% */
    min-width: 0; max-width: 100%;
    min-height: 25%; max-height: 85%;
    width: 100%;
    padding-right: 0; padding-left: 12px;
    padding-bottom: 4px;
  }
  .reader-pane { flex: 1 1 auto; min-height: 100%; }
  .resize-handle { display: none; }
  #detailPanel {
    --dictionary-half-height: 52dvh;
    --dictionary-full-height: 92dvh;
    position: fixed; inset: auto 0 0; width: 100%; height: var(--dictionary-half-height);
    min-height: 0; max-height: 92dvh; overflow-y: auto;
    z-index: 220; border-radius: 20px 20px 0 0;
    background: var(--surface-solid); box-shadow: 0 -12px 40px rgba(0,0,0,0.28);
    transform: translateY(105%); transition: transform 180ms ease, height 180ms ease;
    overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  }
  #detailPanel[data-dictionary-state="half"] { transform: translateY(0); height: var(--dictionary-half-height); }
  #detailPanel[data-dictionary-state="full"] { transform: translateY(0); height: var(--dictionary-full-height); }
  #detailPanel[data-dictionary-state="closed"] { transform: translateY(105%); }
  #detailPanel[data-dictionary-dragging="true"] { transition: none; will-change: height; }
  .dictionary-drawer-handle {
    position: sticky; top: 0; z-index: 12; display: block; width: 100%; height: 42px; margin: 0;
    border-radius: 20px 20px 0 0; touch-action: none; background: transparent;
  }
  .dictionary-drawer-handle::before { content: ""; display: block; width: 48px; height: 5px; margin: 11px auto 0; border-radius: 999px; background: var(--text-dim); }
  .detail-panel-inner { padding: 8px 20px 24px; }
  .detail-close { width: 42px; height: 42px; line-height: 42px; font-size: 18px; }
  html.dictionary-sheet-open body { overflow: hidden; overscroll-behavior: none; }
  .para-block, .ru-text { -webkit-tap-highlight-color: transparent; }
  .para-block:active { background: transparent; }
}
/* ─── 章节完成提示条 ─── */
.complete-prompt {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 150;
  background: var(--accent); color: #fff;
  text-align: center; padding: 14px 20px; font-size: 15px; font-weight: 600;
  cursor: pointer; letter-spacing: 0.02em;
  transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
  box-shadow: 0 -4px 24px rgba(0,0,0,0.25);
}
.complete-prompt.visible { transform: translateY(0); }
.complete-prompt.done {
  background: var(--success); cursor: default; pointer-events: none;
  animation: completeFadeOut 0.4s 2s forwards;
}
@keyframes completeFadeOut { to { opacity: 0; transform: translateY(100%); } }
.fab-mark-done {
  background: var(--accent) !important; color: #fff !important;
  border-color: var(--accent) !important; font-size: 13px !important;
  font-weight: 600 !important; padding: 6px 14px !important;
  min-width: auto !important;
}
.fab-mark-done:disabled { opacity: 0.35; pointer-events: none; }
/* ─── 完成弹窗加强 ─── */
.ch-summary-vocab { margin-top: 10px; font-size: 14px; color: var(--text-secondary); }
.ch-summary-vocab a {
  color: var(--accent); text-decoration: underline; cursor: pointer;
  font-weight: 600;
}
/* ─── 面包屑导航浮窗 ─── */
.breadcrumb-overlay { position: fixed; inset: 0; z-index: 9998; }
.breadcrumb-popup {
  position: fixed; top: 52px; right: 12px; z-index: 9999;
  min-width: 260px; max-width: min(430px, calc(100vw - 24px)); max-height: min(76vh, 720px); overflow-y: auto;
  background: var(--surface-solid); border: 1px solid var(--accent-border);
  border-radius: 14px; padding: 12px 0;
  box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  animation: breadcrumb-in 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes breadcrumb-in { from { opacity: 0; transform: translateY(-8px) scale(0.95); } }
.breadcrumb-section { padding: 0 16px; }
.breadcrumb-item {
  display: block; width: 100%; text-align: left; border: 0; background: none;
  color: var(--text-secondary); font-size: 14px; padding: 8px 16px 8px 20px;
  cursor: pointer; border-radius: 0; font-family: inherit; line-height: 1.6;
  transition: background 0.12s;
}
.breadcrumb-item:hover { background: var(--glass-hover); color: var(--text); }
.breadcrumb-item.current { color: var(--text); font-weight: 700; cursor: default; pointer-events: none; }
.breadcrumb-item.current:hover { background: none; }

/* ══════════════════════════════════════════════
   IndexedDB 轻量封装
   ══════════════════════════════════════════════ */
var _idbName = 'russian_reader_db';
var _idbStore = 'keyval';

function _idbOpen() {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open(_idbName, 1);
    req.onupgradeneeded = function() { req.result.createObjectStore(_idbStore); };
    req.onsuccess = function() { resolve(req.result); };
    req.onerror = function() { reject(req.error); };
  });
}

function _idbExec(mode, cb) {
  return _idbOpen().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(_idbStore, mode === 'readonly' ? 'readonly' : 'readwrite');
      var store = tx.objectStore(_idbStore);
      var ret = cb(store);
      if (ret && typeof ret.then === 'function') { ret.then(resolve, reject); }
      tx.oncomplete = function() { resolve(ret && ret.then ? undefined : ret); };
      tx.onerror = function() { reject(tx.error); };
    });
  });
}

function idbGet(key) {
  return _idbExec('readonly', function(store) {
    return new Promise(function(resolve) {
      var req = store.get(key);
      req.onsuccess = function() { resolve(req.result); };
      req.onerror = function() { reject(req.error); };
    });
  });
}

function idbSet(key, val) {
  return _idbExec('readwrite', function(store) {
    return new Promise(function(resolve) {
      var req = store.put(val, key);
      req.onsuccess = function() { resolve(); };
      req.onerror = function() { reject(req.error); };
    });
  });
}

/* ══════════════════════════════════════════════
   缓存管理 (LRU)
   ══════════════════════════════════════════════ */
function cachePut(bookId, idx, data) {
  if (!chaptersCache[bookId]) chaptersCache[bookId] = {};
  chaptersCache[bookId][idx] = data;
  cacheOrder.push({ bookId: bookId, idx: idx });
  while (cacheOrder.length > CACHE_LIMIT) {
    var old = cacheOrder.shift();
    if (chaptersCache[old.bookId]) {
      delete chaptersCache[old.bookId][old.idx];
      if (!Object.keys(chaptersCache[old.bookId]).length) delete chaptersCache[old.bookId];
    }
  }
}
function cacheGet(bookId, idx) {
  if (chaptersCache[bookId] && chaptersCache[bookId][idx]) {
    for (var i = 0; i < cacheOrder.length; i++) {
      if (cacheOrder[i].bookId === bookId && cacheOrder[i].idx === idx) {
        cacheOrder.splice(i, 1); cacheOrder.push({ bookId: bookId, idx: idx }); break;
      }
    }
    return chaptersCache[bookId][idx];
  }
  return null;
}

/* ─── 形态引擎：初始化 ─── */
function buildDict(mapData) {
  morphologyDict = Object.create(null);
  Object.assign(morphologyDict, mapData);
  morphologyReady = true;
}

function initMorphology() {
  var versionFetchOk = true;
  var remoteVersion = null;

  fetch('data/morphology-version.json')
    .then(function(r) {
      if (!r.ok) throw new Error('version fetch failed');
      return r.json();
    })
    .then(function(v) { remoteVersion = v.version; })
    .catch(function() { versionFetchOk = false; })
    .then(function() {
      return readMorphologyFromIDB()
        .then(function(localData) {
          if (versionFetchOk && localData.version === remoteVersion) {
            buildDict(localData.map);
            return;
          }
          throw new Error('need update');
        })
        .catch(function() {
          if (!versionFetchOk) {
            return readMorphologyFromIDB().then(function(ld) { buildDict(ld.map); }).catch(function() {});
          }
          if (sessionStorage.getItem('morph_retry') === '1') {
            return readMorphologyFromIDB().then(function(ld) { buildDict(ld.map); }).catch(function() {});
          }
          return fetch('data/morphology-map.json')
            .then(function(r) { return r.json(); })
            .then(function(json) {
              return writeMorphologyToIDB(json).then(function() {
                buildDict(json.map);
              });
            })
            .catch(function() {
              sessionStorage.setItem('morph_retry', '1');
              return readMorphologyFromIDB().then(function(ld) { buildDict(ld.map); }).catch(function() {});
            });
        });
    });
}

function getB2ArchiveValues() {

}
function exportB2LearningArchive() {
  if (!window.RussianB2Dashboard) { toast('备份组件未加载'); return; }
  var archive = window.RussianB2Dashboard.createArchive(getB2ArchiveValues());
  var blob = new Blob([JSON.stringify(archive, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob), link = document.createElement('a');
  link.href = url; link.download = 'russian-b2-learning-archive.json'; link.click();
  setTimeout(function() { URL.revokeObjectURL(url); }, 0);
  toast('已导出 B2 学习记录');
}
function importB2LearningArchive(event) {
  var file = event.target.files && event.target.files[0];
  if (!file || !window.RussianB2Dashboard) return;
  var reader = new FileReader();
  reader.onload = function() {
    var archive;
    try { archive = JSON.parse(String(reader.result)); } catch (e) { toast('备份文件不是有效 JSON'); return; }
    var errors = window.RussianB2Dashboard.validateArchive(archive);
    if (errors.length) { toast('备份文件校验失败：' + errors[0]); return; }
    var local = window.RussianB2Dashboard.createArchive(getB2ArchiveValues());
    var result = window.RussianB2Dashboard.mergeArchive(local, archive);
    Object.keys(result.merged.records).forEach(function(key) { localStorage.setItem(key, JSON.stringify(result.merged.records[key].value)); });
    toast(result.conflicts.length ? '已合并记录；' + result.conflicts.length + ' 项同时间冲突保留本地版本' : '已合并学习记录');
    showShelf();
  };
  reader.readAsText(file, 'utf-8'); event.target.value = '';
}

  app.innerHTML = b2FloatingNavigation({ backAction: 'showShelf()', backTitle: '书架', menuAction: 'showBreadcrumb()' }) + '<main class="main-container reader-workbench reader-workbench--archive"><header class="chapter-header"><h1>学习记录备份</h1><p>仅包含俄语 B2 的做题进度、知识卡自测与写作/口语草稿；不会导出其他书籍、词典缓存或界面设置。</p></header><section><h2>导出</h2><p>下载一份 JSON 文件，用于迁移或离线备份。</p><button class="tb-btn" onclick="exportB2LearningArchive()">导出学习记录</button></section><section><h2>恢复与合并</h2><p>选择此前导出的备份。较新的记录会合并；相同时间但内容不同的记录保留本机版本。</p><input type="file" accept="application/json,.json" onchange="importB2LearningArchive(event)"></section></main>';

function locateB2ReadingSource(questionId, evt) {

  var question = (currentReadingData && currentReadingData.questions || []).find(function(item) { return item.id === questionId; });
  var analysis = question && question.answerAnalysis;
  if (!analysis) { toast('这道题暂时没有可定位的原文句子'); return; }
  var anchors = [];
  if (analysis.contextEvidence && analysis.contextEvidence.quote) anchors.push({ paragraphIndex: analysis.contextEvidence.paragraphIndex, quote: analysis.contextEvidence.quote, level: 'context' });
  (analysis.evidenceItems || []).forEach(function(item) {
    if (item.quoteRu || item.quote) anchors.push({ paragraphIndex: item.paragraphIndex, quote: item.quoteRu || item.quote, level: 'core' });
  });
  if (!anchors.length && analysis.evidence && analysis.evidence.ru) anchors.push({ paragraphIndex: analysis.evidence.paragraphIndex, quote: analysis.evidence.ru, level: 'core' });

  var firstTarget = null, missing = 0;
  anchors.forEach(function(anchor) {

    if (!paragraph) { missing++; return; }

    var tokens = String(anchor.quote || '').split(/\s+/).map(normalizeB2ReadingSourceWord).filter(function(token) { return /^[а-я-]+$/.test(token); });
    var paraTokens = words.map(function(word) { return normalizeB2ReadingSourceWord(word.textContent); });
    var start = -1;
    for (var i = 0; i <= paraTokens.length - tokens.length; i++) {
      var matched = tokens.length > 0;
      for (var j = 0; matched && j < tokens.length; j++) if (paraTokens[i + j] !== tokens[j]) matched = false;

    for (var k = start; k < start + tokens.length; k++) words[k].classList.add(anchor.level === 'context' ? 'rs-source-context-word-highlight' : 'rs-source-word-highlight');

  firstTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function renderExercises(exercises) {

      '<div class="exercise-question">' +
        '<span class="exercise-num">' + ex.num + '.</span>' +
        '<span class="exercise-text">' + escapeHtml(ex.question) + '</span>' +
      '</div>';
    if (ex.zhQuestion) {
      html += '<div class="exercise-zh-hint">' + escapeHtml(ex.zhQuestion) + '</div>';

    html += '<div class="exercise-options">';
    for (var j = 0; j < ex.options.length; j++) {

        '<div class="answer-block" style="display:none">' +

      if (ex.detailed_explanation) {

        for (var p = 0; p < paragraphs.length; p++) {
          var para = paragraphs[p].trim();

/* ─── 恢复分栏比例 ─── */
function getHorizontalSplitBounds(layout, pane) {
  var rect = layout.getBoundingClientRect();
  var handle = document.getElementById('resizeHandle');
  var detail = document.getElementById('detailPanel');
  var handleWidth = handle ? handle.getBoundingClientRect().width : 0;
  var detailMinWidth = detail ? parseFloat(getComputedStyle(detail).minWidth) || 0 : 0;
  var minPaneWidth = rect.width * 0.25;
  var maxPaneWidth = Math.min(rect.width * 0.85, rect.width - handleWidth - detailMinWidth);
  return {
    width: rect.width,
    min: minPaneWidth,
    max: Math.max(minPaneWidth, maxPaneWidth)
  };
}

function setHorizontalSplitBasis(layout, pane, requestedWidth) {
  var bounds = getHorizontalSplitBounds(layout, pane);
  var width = Math.max(bounds.min, Math.min(bounds.max, requestedWidth));
  pane.style.flexBasis = Math.round(width) + 'px';
}

function restoreSplitRatio() {
  var layout = document.getElementById('readerLayout');
  var pane = document.getElementById('readerPane');
  if (!layout || !pane) return;

  var isH = getComputedStyle(layout).flexDirection === 'row';
  _lastSplitOrientation = isH ? 'h' : 'v';

  // The reading/speaking view has no draggable split. Never let a saved ratio
  // from another reader reserve an invisible column on tablet layouts.
  if (layout.classList.contains('rs-practice-mode') ||
      (layout.classList.contains('rs-reading-mode') && !isReadingSpeakingSplitViewport())) {
    pane.style.removeProperty('flex-basis');
    return;
  }

  var key = isH ? 'rr_split_h' : 'rr_split_v';
  var saved = null;
  try { saved = localStorage.getItem(key); } catch(e) {}

  if (saved && isH) {
    var bounds = getHorizontalSplitBounds(layout, pane);
    var requestedWidth = /%$/.test(saved)
      ? bounds.width * (parseFloat(saved) / 100)
      : parseFloat(saved);
    setHorizontalSplitBasis(layout, pane, Number.isFinite(requestedWidth) ? requestedWidth : bounds.width * 0.7);
  } else if (saved) {
    pane.style.flexBasis = saved;
  } else if (isH) {
    setHorizontalSplitBasis(layout, pane, layout.getBoundingClientRect().width * 0.7);
  } else {
    pane.style.flexBasis = '55%';
  }
}

/* ─── 拖拽分界线 ─── */
(function() {
  var layoutEl = null, paneEl = null, handleEl = null;
  var dragging = false, isHorizontal = true;

  function refreshRefs() {
    layoutEl = document.getElementById('readerLayout');
    paneEl = document.getElementById('readerPane');
    handleEl = document.getElementById('resizeHandle');
  }

  function getDirection() {
    if (!layoutEl) return 'row';
    return getComputedStyle(layoutEl).flexDirection;
  }

  document.addEventListener('pointerdown', function(e) {
    refreshRefs();
    if (!e.target.closest('#resizeHandle')) return;
    if (!paneEl) return;
    dragging = true;
    isHorizontal = getDirection() === 'row';
    handleEl.classList.add('active');
    handleEl.setPointerCapture(e.pointerId);
  });

  document.addEventListener('pointermove', function(e) {
    if (!dragging || !paneEl || !layoutEl) return;
    var rect = layoutEl.getBoundingClientRect();
    if (isHorizontal) {
      setHorizontalSplitBasis(layoutEl, paneEl, e.clientX - rect.left);
    } else {
      var percentage = ((e.clientY - rect.top) / rect.height) * 100;
      percentage = Math.max(25, Math.min(85, percentage));
      paneEl.style.flexBasis = percentage + '%';
    }
  });

  document.addEventListener('pointerup', function(e) {
    if (!dragging) return;
    dragging = false;
    if (handleEl) handleEl.classList.remove('active');
    if (handleEl) handleEl.releasePointerCapture(e.pointerId);
    // 持久化：横屏/竖屏各存一份
    try {
      var key = isHorizontal ? 'rr_split_h' : 'rr_split_v';
      if (paneEl) localStorage.setItem(key, paneEl.style.flexBasis);
    } catch(err) {}
  });
})();

// ─── 屏幕旋转时恢复分栏比例 ───
var _lastSplitOrientation = null;
window.addEventListener('resize', function() {
  var layout = document.getElementById('readerLayout');
  if (!layout) return;
  if (layout.classList.contains('rs-reading-mode') || layout.classList.contains('rs-practice-mode')) {
    restoreSplitRatio();
    return;
  }
  var isH = getComputedStyle(layout).flexDirection === 'row';
  var cur = isH ? 'h' : 'v';

    _lastSplitOrientation = cur;
    restoreSplitRatio();
  }
});
