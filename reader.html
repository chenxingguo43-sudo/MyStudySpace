/* ─── 生词高亮 ─── */
function loadSavedWords() {
  try {
    var records = JSON.parse(localStorage.getItem('vocabulary-review-records') || '{}');
    savedWords = Object.keys(records).map(function(w) { return w.toLowerCase(); }).filter(Boolean);
    savedWordsData = Object.keys(records).map(function(w) { return { word: w, meaning: '', source: records[w].source || '' }; });
  } catch(e) { savedWords = []; savedWordsData = []; }
}

function normalizeLookupWord(word) {
  return String(word || '')
    .normalize('NFD')
    .replace(/[\u0300\u0301]/g, '')
    .normalize('NFC')
    .replace(/ё/g, 'е')
    .replace(/Ё/g, 'е')
    .toLowerCase()
    .replace(/[^а-я-]/g, '');
}

function hasChineseText(text) {
  return /[\u4e00-\u9fff]/.test(String(text || ''));
}

var DICTIONARY_DATA_VERSION = '20260817-1';

function fetchDictionaryJson(path, fallback) {
  var separator = path.indexOf('?') >= 0 ? '&' : '?';
  var versionedUrl = path + separator + 'v=' + DICTIONARY_DATA_VERSION;
  function request(url, cacheMode) {
    return fetch(url, { cache: cacheMode }).then(function(response) {
      if (!response.ok) throw new Error(path + ' returned ' + response.status);
      return response.json();
    });
  }
  return request(versionedUrl, 'no-cache')
    .catch(function() { return request(versionedUrl + '&retry=1', 'reload'); })
    .then(function(result) {
      delete dictionaryLoadFailures[path];
      return result;
    })
    .catch(function(error) {
      dictionaryLoadFailures[path] = true;
      console.warn('[Dict] Failed to load ' + path + ':', error);
      return fallback;
    });
}

function loadLocalLookupData() {
  try { localLookupCache = JSON.parse(localStorage.getItem('rr_local_lookup_cache') || '{}'); } catch(e) { localLookupCache = {}; }

  // 统一词典架构：小文件（词形/虚词/人工核对）先行，unified-dictionary.json
  // 大文件最后加载，避免 iPad Safari 并发解析大 JSON 时丢弃整个词典。
  return Promise.all([
    fetchDictionaryJson('data/dictionary/function-word-forms.json', {}),
    fetchDictionaryJson('data/dictionary/corpus-morphology.json', {}),
    fetchDictionaryJson('data/dictionary/reviewed-function-entries.json', {}),
    fetchDictionaryJson('data/dictionary/reviewed-lexical-entries.json', {})
  ]).then(function(results) {
    functionWordForms = results[0] || {};
    corpusMorphology = results[1] || {};
    reviewedFunctionLookup = results[2] || {};
    reviewedLexicalLookup = results[3] || {};
    localLookupReady = true;

    supplementalLookupPromise = fetchDictionaryJson('data/dictionary/unified-dictionary.json', {})
      .then(function(result) {
        unifiedLookup = result || {};
        supplementalLookupReady = true;
        console.log('[Dict] Reviewed:', Object.keys(reviewedLexicalLookup).length, '; Unified:', Object.keys(unifiedLookup).length, '; Morphology:', Object.keys(corpusMorphology).length);
      });
  }).catch(function(error) {
    console.warn('本地查词核心数据加载失败:', error);
    localLookupReady = true;
    supplementalLookupReady = true;
  });
}

function getCachedLocalLookup(word) {
  var key = normalizeLookupWord(word);
  return key ? localLookupCache[key] : null;
}

function saveCachedLocalLookup(word, result) {
  var key = normalizeLookupWord(word);
  if (!key || !result) return;
  localLookupCache[key] = result;
  try { localStorage.setItem('rr_local_lookup_cache', JSON.stringify(localLookupCache)); } catch(e) {}
}

/* ─── 重音显示已全局关闭；源数据保留，Reader 只呈现无重音纯文本 ─── */
function stripStressMarks(text) {
  return String(text || '').normalize('NFD').replace(/[\u0300\u0301\u0341]/g, '').normalize('NFC');
}
function applyStressMarks(root) {
  var words = (root || document).querySelectorAll('.ru-word');
  for (var i = 0; i < words.length; i++) {
    var el = words[i];
    var plain = stripStressMarks(el.getAttribute('data-original-word') || el.getAttribute('data-word') || el.textContent || '').trim();
    if (!plain) continue;
    el.textContent = plain;
    el.setAttribute('data-word', plain);
    el.setAttribute('data-original-word', plain);
    el.removeAttribute('aria-label');
    el.removeAttribute('data-stress-source');
    el.removeAttribute('data-stress-index');
    el.removeAttribute('data-rendered-stress');
    el.style.removeProperty('--stress-left');
  }
}

function lookupLocalChineseMeaning(word) {
  var key = normalizeLookupWord(word);
  if (!key) return null;
  var reviewedLexical = reviewedLexicalLookup[key];
  if (reviewedLexical && reviewedLexical.meaning && hasChineseText(reviewedLexical.meaning)) {
    return {
      meaning: reviewedLexical.meaning,
      type: reviewedLexical.type || '',
      source: reviewedLexical.source || '项目词典 · 人工核对',
      _raw: reviewedLexical
    };
  }
  if (reviewedFunctionLookup[key]) {
    return { meaning: reviewedFunctionLookup[key].meaning, type: 'function word', source: reviewedFunctionLookup[key].source, _raw: {} };
  }
  var unified = unifiedLookup[key];
  if (unified && unified.meaning && hasChineseText(unified.meaning)) {
    var sourceLabel = Array.isArray(unified.source) ? unified.source[0] : (unified.source || '统一词典');
    var result = {
      meaning: unified.meaning,
      type: unified.pos || unified.type || '',
      source: sourceLabel === 'reviewed-lexical' ? '项目词典 · 人工核对' : sourceLabel,
      _raw: unified
    };
    saveCachedLocalLookup(key, result);
    return result;
  }
  var provisional = dictionaryStorage && dictionaryStorage.getProvisional ? dictionaryStorage.getProvisional(key) : null;
  if (provisional && (provisional.meaningZh || provisional.meaningRu)) {
    return {
      meaning: provisional.meaningZh || provisional.meaningRu,
      type: '',
      source: (provisional.provider || '联网查询') + ' · 未复核',
      _provisional: true,
      _raw: {}
    };
  }
  return null;
}

function combinedMorphologyFor(form) {
  var normalized = normalizeLookupWord(form);
  var corpus = corpusMorphology[normalized] || {};
  var reviewed = reviewedLexicalLookup[normalized] || {};
  var legacy = morphologyReady && morphologyDict[normalized] || [];
  var lemmas = [];
  var candidates = reviewed.lemma
    ? [reviewed.lemma]
    : (corpus.lemmas || []).concat(Array.isArray(legacy) ? legacy : (legacy.lemmas || []));
  candidates.forEach(function(lemma) {
    lemma = normalizeLookupWord(lemma);
    if (lemma && lemmas.indexOf(lemma) === -1) lemmas.push(lemma);
  });
  return { lemmas: lemmas };
}

function resolveDictionaryLookup(word, context, recordMissing) {
  var clean = normalizeLookupWord(word);
  var resolved = RussianDictionaryCore.resolveLemma(clean, {
    functionForms: functionWordForms,
    morphology: (function() { var map = {}; map[clean] = combinedMorphologyFor(clean); return map; })(),
    lookupLemma: lookupLocalChineseMeaning
  });
  resolved.alternatives = (resolved.alternatives || []).filter(function(candidate) {
    return normalizeLookupWord(candidate) !== clean;
  });
  if (resolved.entry && !hasChineseText(resolved.entry.meaning)) {
    var chineseCandidates = [resolved.lemma]
      .concat(combinedMorphologyFor(clean).lemmas || [], [clean], resolved.alternatives || []);
    for (var candidateIndex = 0; candidateIndex < chineseCandidates.length; candidateIndex++) {
      var chineseCandidate = normalizeLookupWord(chineseCandidates[candidateIndex]);
      var chineseEntry = chineseCandidate && lookupLocalChineseMeaning(chineseCandidate);
      if (!chineseEntry || !hasChineseText(chineseEntry.meaning)) continue;
      resolved.entry = chineseEntry;
      resolved.definitionForm = chineseCandidate;
      break;
    }
  }
  if (!resolved.entry && typeof morphologyGuess === 'function') {
    var guessed = morphologyGuess(clean);
    for (var i = 0; i < guessed.length; i++) {
      var guessedLemma = normalizeLookupWord(guessed[i]);
      var guessedEntry = guessedLemma && lookupLocalChineseMeaning(guessedLemma);
      if (!guessedEntry) continue;
      resolved = {
        form: word,
        normalized: clean,
        lemma: guessedLemma,
        entry: guessedEntry,
        reliability: 'morphology-guess',
        alternatives: guessed.filter(function(candidate) { return normalizeLookupWord(candidate) !== guessedLemma; })
      };
      break;
    }
  }
  if (!resolved.entry && recordMissing !== false) {
    dictionaryStorage.recordMissing({
      form: word,
      lemmaCandidates: [resolved.lemma].concat(resolved.alternatives || []),
      failureStage: 'definition-resolution',
      context: context || {}
    });
  }
  return resolved;
}

function onlineDictionaryLookup() {
  var term = normalizeLookupWord(selText || _lastLookupWord);
  if (!term) return;
  if (!appRuntime.canUseOnlineDictionary()) return;
  var includeContext = Boolean(selContext) && window.confirm('是否把当前俄语句子附在本地查询记录中？词典服务只查询单词本身。');
  var inner = document.getElementById('detailInner');
  if (inner) inner.innerHTML = '<div class="dict-loading">正在查询 Russian Wiktionary…</div>';
  appRuntime.lookupDictionary(term, { includeContext: includeContext, context: selContext || '' })
    .then(function(result) {
      if (!result.found) {
        if (inner) inner.innerHTML = renderDictionaryCloseButton() + '<div class="dict-word">' + escapeHtml(term) + '</div><div class="dict-meaning">Russian Wiktionary 也未找到可用词条。</div>' + renderDictionaryActionBar({ aiId: 'dpAiBtn', allowOnline: false });
        var missingContext = dictionaryController.getCurrent() && dictionaryController.getCurrent().context || {};
        var missingResolution = { lemma: term, alternatives: [], reliability: 'online-not-found', entry: null };
        _lastDictionaryResolution = missingResolution;
        recordReaderLookup(readerLookupEventInput(term, missingResolution, null, missingContext, {
          failureCategory: 'online_not_found'
        }));
        return;
      }
      dictionaryStorage.saveProvisional({
        form: term, lemma: term, provider: result.provider, sourceUrl: result.sourceUrl,
        queriedAt: result.queriedAt, meaningRu: result.meaningRu, meaningZh: '',
        context: includeContext ? (dictionaryController.getCurrent() && dictionaryController.getCurrent().context || {}) : {}
      });
      var onlineContext = dictionaryController.getCurrent() && dictionaryController.getCurrent().context || {};
      var onlineEntry = {
        meaning: result.meaningRu,
        type: '',
        source: result.provider + ' · 未复核',
        _provisional: true,
        _raw: { display: term }
      };
      _lastDictionaryResolution = {
        normalized: term,
        lemma: term,
        entry: onlineEntry,
        reliability: 'online-provisional',
        alternatives: []
      };
      recordReaderLookup(readerLookupEventInput(term, _lastDictionaryResolution, onlineEntry, onlineContext));
      if (inner) inner.innerHTML = renderDictionaryCloseButton() +
        '<div class="dict-word">' + escapeHtml(term) + '</div><div class="dict-pos">俄文释义（未翻译）</div>' +
        '<div class="dict-meaning" style="white-space:pre-wrap">' + escapeHtml(result.meaningRu) + '</div>' +
        '<div class="dict-source">' + escapeHtml(result.provider) + ' · 未复核</div>' +
        '<a class="tb-btn" href="' + escapeHtml(result.sourceUrl) + '" target="_blank" rel="noopener noreferrer">查看来源页面</a>' +
        renderDictionaryActionBar({ aiId: 'dpAiBtn', allowOnline: false });
    })
    .catch(function() {
      if (inner) inner.innerHTML = renderDictionaryCloseButton() + '<div class="dict-word">' + escapeHtml(term) + '</div><div class="dict-meaning">联网查询失败，请稍后再试。</div><button class="tb-btn" type="button" onclick="onlineDictionaryLookup()">重试</button>' + renderDictionaryActionBar({ aiId: 'dpAiBtn', allowOnline: false });
    });
}

function renderLocalLookup(clean, result) {
  var contextHtml = '';
  if (result.ru || result.zh) {
    contextHtml =
      '<div class="dict-context">' +
        (result.ru ? '<div><b>原文</b>：' + escapeHtml(result.ru) + '</div>' : '') +
        (result.zh ? '<div><b>中文</b>：' + escapeHtml(result.zh) + '</div>' : '') +
      '</div>';
  }

  // 备选原形区块
  var altHtml = '';
  if (result._alternatives && result._alternatives.length) {
    altHtml = '<div class="dict-alternatives">' +
      '<span class="dict-alt-label">也作：</span>' +
      result._alternatives.map(function(a) {
        return '<span class="dict-alt-word">' + escapeHtml(a) + '</span>';
      }).join('、') +
      '</div>';
  }

  // 猜测标注
  var guessLabel = '';
  if (result._guessed) {
    guessLabel = '<div class="dict-guess-label">形态推测还原</div>';
  }

  return '<div class="dict-word">' + escapeHtml(clean) + '</div>' +
    (result.type ? '<div class="dict-pos">' + escapeHtml(result.type) + '</div>' : '') +
    '<div class="dict-meaning">' + escapeHtml(result.meaning || '暂未收录') + '</div>' +
    '<div class="dict-source">' + escapeHtml(result.source || '本地') + '</div>' +
    guessLabel +
    altHtml +
    contextHtml;
}

/* ─── 详情面板渲染（按词性展示富字段）─── */
function renderDetailPanel(word, result) {
  if (!result || !result.meaning || result.meaning === '暂未收录') {
    return renderDictionaryCloseButton() + '<div class="dict-word">' + escapeHtml(word) + '</div>' +
      '<div class="dict-meaning" style="color:var(--text-dim)">暂未收录</div>' +
      renderDictionaryActionBar({ aiId: 'dpAiBtn', allowOnline: true });
  }

  var raw = result._raw || {};
  var posType = ((raw.type || result.type || '')).toLowerCase();

  var html = renderDictionaryCloseButton();

  // ── 头部：单词 + 词性 ──
  html += '<div class="dp-head">';
  html += '<div class="dp-word">' + escapeHtml(word) + '</div>';
  var posLabel = raw.type || result.type || '';
  html += '<div class="dp-pos">' + escapeHtml(posLabel) + '</div>';
  html += '</div>';
  if (result._morphoLemma && result._reliability !== 'morphology-guess') {
    html += '<div class="dict-morph-compact"><strong>' + escapeHtml(word) + ' → ' + escapeHtml(result._morphoLemma) + '</strong><span>原形 · ' + escapeHtml(posLabel || '词典已确认') + '</span></div>';
  }

  // ── 释义 ──
  html += '<div class="dp-section">';
  html += '<div class="dp-meaning">' + escapeHtml(result.meaning) + '</div>';
  html += '</div>';

  // ── 当前题干 / 选项翻译 ──
  if (selContext || selTranslationContext) {
    html += '<div class="dp-section dict-context">';
    if (selContext) html += '<div><b>所在原句</b>：' + renderHighlightedLookupContext(selContext, word) + '</div>';
    if (selTranslationContext) html += '<div><b>中文翻译</b>：' + escapeHtml(selTranslationContext) + '</div>';
    html += '</div>';
  }

  // ── 体 / 性 ──
  if (posType === 'verb') {
    var hasVerbMeta = raw.aspect || raw.pair || raw.case_gov;
    if (hasVerbMeta) {
      html += '<div class="dp-section">';
      if (raw.aspect) {
        var aspectRaw = raw.aspect.toLowerCase();
        var aspectCN = aspectRaw.indexOf('несов') >= 0 || aspectRaw.indexOf('нсв') >= 0 ? '未完成体' :
                       ((aspectRaw.indexOf('сов') >= 0 && aspectRaw.indexOf('несов') < 0) || aspectRaw.indexOf('св') >= 0) ? '完成体' : raw.aspect;
        html += '<span class="dp-tag">' + escapeHtml(aspectCN) + '</span>';
      }
      if (raw.pair) {
        html += ' <span class="dp-pair">→ ' + escapeHtml(raw.pair) + '</span>';
      }
      if (raw.case_gov) {
        html += '<div class="dp-meta"><span class="dp-label">接格</span> ' + escapeHtml(raw.case_gov) + '</div>';
      }
      html += '</div>';
    }
  } else if (posType === 'noun' || posType === 'adj' || posType === 'adjective') {
    if (raw.gender) {
      var genLabel = raw.gender === 'masculine' || raw.gender === 'm' ? '阳性' :
                     raw.gender === 'feminine' || raw.gender === 'f' ? '阴性' :
                     raw.gender === 'neuter' || raw.gender === 'n' ? '中性' : raw.gender;
      html += '<div class="dp-section"><span class="dp-label">性</span> <span class="dp-tag">' + escapeHtml(genLabel) + '</span></div>';
    }
  }

  // ── 变格/变位表 ──
  var grammarTable = raw.grammarTable || '';
  if (grammarTable && grammarTable.length > 20 && grammarTable.indexOf('|') > -1) {
    html += '<div class="dp-section">';
    var mt = grammarTable.replace(/\|/g, '\t').replace(/^\|(.+)\|\n\|[-| :]+\|\n/m, function(_, header) { return 'HDR:' + header + '\n'; });
    var lines = grammarTable.trim().split('\n');
    var tableRows = [];
    for (var l = 0; l < lines.length; l++) {
      var cells = lines[l].replace(/^\||\|$/g, '').split('|').map(function(c) { return c.trim(); });
      if (l === 1 && cells.every(function(c) { return /^[-: ]+$/.test(c); })) continue; // 分隔线
      if (cells.length > 0 && cells.some(function(c) { return c.length > 0; })) tableRows.push(cells);
    }
    if (tableRows.length > 0) {
      var isHeader = tableRows.length > 1;
      html += '<div class="dp-collapse-toggle" onclick="var n=this.nextElementSibling;n.classList.toggle(\'open\');this.classList.toggle(\'expanded\')">📐 变格/变位表</div>';
      html += '<div class="dp-collapse-body"><div class="dict-table-wrap"><table class="dict-table">';
      for (var r = 0; r < tableRows.length; r++) {
        html += '<tr>';
        for (var c2 = 0; c2 < tableRows[r].length; c2++) {
          html += (r === 0 ? '<th>' : '<td>') + escapeHtml(tableRows[r][c2]) + (r === 0 ? '</th>' : '</td>');
        }
        html += '</tr>';
      }
      html += '</table></div></div>';
    }
    html += '</div>';
  }

  // ── 常用搭配 ──
  var colls = raw.collocations || [];
  if (colls.length > 0) {
    html += '<div class="dp-section">';
    html += '<div class="dp-section-title">常用搭配</div>';
    var maxColl = Math.min(colls.length, 4);
    for (var c = 0; c < maxColl; c++) {
      var col = colls[c];
      html += '<div class="dp-coll">';
      html += '<div class="dp-coll-phrase">' + escapeHtml(col.phrase || col.word || '') + '</div>';
      if (col.ru) html += '<div class="dp-coll-ru">' + escapeHtml(col.ru) + '</div>';
      if (col.zh) html += '<div class="dp-coll-zh">' + escapeHtml(col.zh) + '</div>';
      html += '</div>';
    }
    html += '</div>';
  }

  // ── 详细释义（折叠）───
  if (raw.detailZh && raw.detailZh.length > 5 && raw.detailZh !== '（待补充）') {
    html += '<div class="dp-section">';
    html += '<div class="dp-collapse-toggle" onclick="var n=this.nextElementSibling;n.classList.toggle(\'open\');this.classList.toggle(\'expanded\')">详细释义</div>';
    html += '<div class="dp-collapse-body"><div class="dp-detail">' + escapeHtml(raw.detailZh) + '</div></div>';
    html += '</div>';
  }

  // ── 例句 ──
  var examples = raw.examples || [];
  if (examples.length > 0) {
    html += '<div class="dp-section">';
    html += '<div class="dp-collapse-toggle" onclick="var n=this.nextElementSibling;n.classList.toggle(\'open\');this.classList.toggle(\'expanded\')">例句</div>';
    html += '<div class="dp-collapse-body">';
    var maxEx = Math.min(examples.length, 5);
    for (var e = 0; e < maxEx; e++) {
      var ex = examples[e];
      html += '<div class="dp-example">';
      if (ex.ru) html += '<div class="dp-ex-ru">' + escapeHtml(ex.ru) + '</div>';
      if (ex.zh) html += '<div class="dp-ex-zh">' + escapeHtml(ex.zh) + '</div>';
      html += '</div>';
    }
    html += '</div></div>';
  }

  // ── 变位/变格表（折叠，旧版纯文本兜底：仅当非 markdown 表格格式时）───
  if (raw.grammarTable && raw.grammarTable.length > 10 && raw.grammarTable !== '（待补充）' && raw.grammarTable.indexOf('|') === -1) {
    html += '<div class="dp-section">';
    html += '<div class="dp-collapse-toggle" onclick="var n=this.nextElementSibling;n.classList.toggle(\'open\');this.classList.toggle(\'expanded\')">变位/变格表（原文格式）</div>';
    html += '<div class="dp-collapse-body" style="white-space:pre-wrap;font-size:13px">' + escapeHtml(raw.grammarTable) + '</div>';
    html += '</div>';
  }

  // ── 备选原形 ──
  if (result._alternatives && result._alternatives.length) {
    html += '<div class="dp-section">';
    html += '<span class="dp-alt-label">也作：</span>';
    html += result._alternatives.map(function(a) { return '<span class="dp-alt-word">' + escapeHtml(a) + '</span>'; }).join('、');
    html += '</div>';
  }

  // ── 猜测标注 ──
  if (result._guessed) {
    html += '<div class="dict-guess-label">形态推测还原</div>';
  }
  if (result._morphoLemma) {
    html += '<div class="dp-meta"><span class="dp-label">原形</span> ' + escapeHtml(result._morphoLemma) + '</div>';
  }
  if (result._reliability) {
    var reliabilityLabels = {
      'reviewed-function-form': '人工核对的功能词词形',
      'morphology-map': '语料词形分析',
      'dictionary-exact': '词典原形直查',
      'morphology-guess': '规则推测'
    };
    html += '<div class="dict-guess-label">' + escapeHtml(reliabilityLabels[result._reliability] || result._reliability) + '</div>';
  }

  // ── 统一底部操作区 ──
  html += renderDictionaryActionBar({ aiId: 'dpAiBtn', allowOnline: true });

  // ── 来源标注 ──
  html += '<div class="dp-source">来源：' + escapeHtml(result.source || '本地词库') + '</div>';

  return html;
}

function highlightSavedWords() {
  if (!savedWords.length) return;
  // 构建小写词表
  var wordSet = {};
  for (var w = 0; w < savedWords.length; w++) {
    wordSet[savedWords[w].toLowerCase()] = true;
  }

  // 快速路径：对已渲染为 .ru-word 的词（reading_speaking / B2 阅读视图）
  // 直接加 CSS class，不触 innerHTML 序列化（避免破坏 data-lookup-context 属性）
  var ruWords = document.querySelectorAll('.ru-word');
  for (var i = 0; i < ruWords.length; i++) {
    var el = ruWords[i];
    var wordText = (el.textContent || '').trim().toLowerCase();
    if (wordSet[wordText]) el.classList.add('highlight-word');
  }

  // 兼容路径：旧小说阅读视图（无 .ru-word，只有纯文本段落）
  var blocks = document.querySelectorAll('.para-block .ru-text');
  for (var b = 0; b < blocks.length; b++) {
    var block = blocks[b];
    // 已有 .ru-word 子元素 → 快速路径已处理，跳过
    if (block.querySelector('.ru-word')) continue;
    // 旧路径：innerHTML 替换（小说段落不含嵌套 span，安全）
    var text = block.textContent;
    var html = block.innerHTML;
    for (var w = 0; w < savedWords.length; w++) {
      var word = savedWords[w];
      if (text.toLowerCase().indexOf(word) < 0) continue;
      var re = new RegExp('(' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      html = html.replace(re, '<span class="highlight-word">$1</span>');
    }
    block.innerHTML = html;
  }
}

function toggleSearch() {
  var bar = document.getElementById('searchBar');
  bar.classList.toggle('visible');
  if (bar.classList.contains('visible')) document.getElementById('searchInput').focus();
  else closeSearch();
}
function closeSearch() {
  document.getElementById('searchBar').classList.remove('visible');
  document.getElementById('searchInput').value = '';
  clearSearchHighlights();
  searchMatches = []; searchIdx = -1;
  document.getElementById('searchCount').textContent = '';
}
function clearSearchHighlights() {
  var marks = document.querySelectorAll('.highlight-search');
  for (var i = 0; i < marks.length; i++) {
    var p = marks[i].parentNode;
    p.replaceChild(document.createTextNode(marks[i].textContent), marks[i]);
    p.normalize();
  }
}
function doSearch() {
  clearSearchHighlights();
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  searchMatches = []; searchIdx = -1;
  if (!q) { document.getElementById('searchCount').textContent = ''; return; }
  var blocks = document.querySelectorAll('.para-block');
  for (var b = 0; b < blocks.length; b++) {
    var texts = blocks[b].querySelectorAll('.ru-text, .cn-text');
    for (var t = 0; t < texts.length; t++) {
      var el = texts[t], walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
      var nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
      for (var n = 0; n < nodes.length; n++) {
        var lc = nodes[n].nodeValue.toLowerCase(), pos = lc.indexOf(q);
        if (pos < 0) continue;
        var range = document.createRange();
        range.setStart(nodes[n], pos); range.setEnd(nodes[n], pos + q.length);
        var mark = document.createElement('span');
        mark.className = 'highlight-search';
        range.surroundContents(mark);
        searchMatches.push(mark);
        n--; // re-check same node for multiple matches
      }
    }
  }
  document.getElementById('searchCount').textContent = searchMatches.length ? '0/' + searchMatches.length : '无结果';
  if (searchMatches.length) searchNav(1);
}
function searchNav(dir) {
  if (!searchMatches.length) return;
  if (searchIdx >= 0) searchMatches[searchIdx].classList.remove('current');
  searchIdx = (searchIdx + dir + searchMatches.length) % searchMatches.length;
  searchMatches[searchIdx].classList.add('current');
  searchMatches[searchIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
  document.getElementById('searchCount').textContent = (searchIdx + 1) + '/' + searchMatches.length;
}
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'f' && curView === 'reading') { e.preventDefault(); toggleSearch(); }
  if (e.key === 'Escape') closeSearch();
});
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); searchNav(e.shiftKey ? -1 : 1); }
});

function readerLookupEventInput(queryForm, resolved, result, context, overrides) {
  resolved = resolved || {};
  result = result || null;
  var raw = result && result._raw && typeof result._raw === 'object' ? result._raw : {};
  var candidates = [resolved.lemma].concat(resolved.alternatives || []);
  return Object.assign({
    succeeded: Boolean(result),
    queryForm: queryForm,
    surfaceForm: queryForm,
    lemma: raw.lemma || raw.display || resolved.lemma || '',
    lemmaCandidates: candidates,
    partOfSpeech: raw.type || raw.pos || (result && result.type) || '',
    reliability: resolved.reliability || (result ? 'dictionary-result' : 'not-found'),
    raw: raw,
    meaning: result && result.meaning || '',
    context: context || {}
  }, overrides || {});
}

function autoLookup(word) {
  var clean = normalizeLookupWord(word);
  if (!clean) return;
  _lastLookupWord = clean;
  _lastDictionaryResolution = null;
  _lastLearningLookupEvent = null;
  _lastLearningLookupPromise = null;
  // 追踪查词（去重）
  if (_sessionLookedUp.indexOf(clean) === -1) _sessionLookedUp.push(clean);

  var preview = document.getElementById('detailInner');
  if (!preview) return;
  preview.innerHTML = '<div class="dict-loading">查询中...</div>';
  if (!localLookupReady) {
    Promise.resolve(localLookupPromise).then(function() { if (_lastLookupWord === clean) autoLookup(word); });
    return;
  }
  var context = dictionaryController.getCurrent() && dictionaryController.getCurrent().context || {};
  var resolved = resolveDictionaryLookup(clean, context, false);
  if (!resolved.entry && !supplementalLookupReady && supplementalLookupPromise) {
    preview.innerHTML = '<div class="dict-loading">补充词典加载中...</div>';
    Promise.resolve(supplementalLookupPromise).then(function() {
      if (_lastLookupWord === clean) autoLookup(word);
    });
    return;
  }
  if (!resolved.entry) {
    resolved = resolveDictionaryLookup(clean, context, Object.keys(dictionaryLoadFailures).length === 0);
  }
  _lastDictionaryResolution = resolved;
  var result = resolved.entry;
  if (result) {
    result = Object.assign({}, result, {
      _morphoLemma: resolved.lemma !== clean ? resolved.lemma : '',
      _alternatives: resolved.alternatives || [],
      _reliability: resolved.reliability,
      _guessed: resolved.reliability === 'morphology-guess'
    });
  }
  var inner = document.getElementById('detailInner');
  var loadIncomplete = Object.keys(dictionaryLoadFailures).length > 0;
  if (inner) inner.innerHTML = result
    ? renderDetailPanel(clean, result)
    : renderMissingDictionaryCard(clean, loadIncomplete);
  updateSaveButton(clean);
  if (result || !loadIncomplete) {
    recordReaderLookup(readerLookupEventInput(selText || clean, resolved, result, context, {
      failureCategory: result ? '' : 'definition_not_found'
    }));
  }
}

function _queueFailedSync(payload) {
  _syncFailQueue.push(payload);
  try { localStorage.setItem('rr_sync_fail_queue', JSON.stringify(_syncFailQueue)); } catch(e) {}
  toast('📝 已保存到本机（同步笔记库失败，稍后自动重试）');

function _flushSyncQueue() {
  if (appRuntime.getRuntime() !== 'web-server') return;
  if (!_syncFailQueue.length) return;
  var queue = _syncFailQueue.slice();
  _syncFailQueue = [];
  try { localStorage.removeItem('rr_sync_fail_queue'); } catch(e) {}
  var remaining = queue.length;
  queue.forEach(function(p) {
    appRuntime.syncVocabularyEntry(p)
      .catch(function() { _syncFailQueue.push(p); })
      .then(function() {
        remaining--;
        if (remaining === 0 && _syncFailQueue.length === 0 && queue.length > 1) {
          toast('📝 之前 ' + queue.length + ' 个生词已同步到笔记库');
        }
      });

}

function exportNotes() {
  if (!curBook) return;
  var bookId = curBook.id;
  var bookTitle = curBook.title;
  var dir = curBook.direction || 'cn→ru';
  var bookMarks = bookmarks[bookId] || {};
  var chapterKeys = Object.keys(bookMarks).filter(function(k) { return bookMarks[k] && bookMarks[k].length > 0; });

  // 收集收藏段落：需要从缓存或 fetch 获取章节数据
  var tasks = chapterKeys.map(function(chIdx) {
    var cached = cacheGet(bookId, parseInt(chIdx));
    if (cached) return Promise.resolve({ idx: parseInt(chIdx), data: cached });
    return fetchChapter(bookId, parseInt(chIdx))
      .then(function(d) { return d ? { idx: parseInt(chIdx), data: d } : null; })
      .catch(function() { return null; });
  });

  Promise.all(tasks).then(function(results) {
    var lines = [];
    lines.push('---');
    lines.push('title: ' + bookTitle + ' 阅读笔记');
    lines.push('exported: ' + new Date().toISOString().split('T')[0]);
    lines.push('type: 阅读笔记');
    lines.push('---');
    lines.push('');
    lines.push('# 📖 ' + bookTitle + ' 阅读笔记');
    lines.push('');

    // 收藏段落
    var hasBookmarks = false;
    results.filter(Boolean).forEach(function(r) {
      var paras = r.data.original || [];
      var trans = r.data.translated || [];
      var marks = bookMarks[String(r.idx)] || [];
      if (!marks.length) return;
      if (!hasBookmarks) { lines.push('## ⭐ 收藏段落'); lines.push(''); hasBookmarks = true; }
      lines.push('### 第' + (r.idx + 1) + '章 ' + (r.data.title || ''));
      lines.push('');
      marks.forEach(function(pi) {
        var front = dir === 'cn→ru' ? (trans[pi] || '') : (paras[pi] || '');
        var back = dir === 'cn→ru' ? (paras[pi] || '') : (trans[pi] || '');
        if (front.trim()) {
          lines.push('> ' + front.trim());
          if (back.trim()) lines.push('> ' + back.trim());
          lines.push('');
        }
      });
    });

    // 生词
    var bookWords = savedWordsData.filter(function(w) {
      return w.source && w.source.indexOf(bookTitle) >= 0;
    });
    if (bookWords.length > 0) {
      lines.push('## 📝 生词');
      lines.push('');
      lines.push('| 单词 | 释义 | 来源 |');
      lines.push('|------|------|------|');
      bookWords.forEach(function(w) {
        lines.push('| ' + w.word + ' | ' + (w.meaning || '') + ' | ' + (w.source || '') + ' |');
      });
      lines.push('');
    }

    if (!hasBookmarks && !bookWords.length) {
      lines.push('暂无收藏段落或生词记录。');
      lines.push('');
    }

    // 生成文件下载
    var md = lines.join('\n');
    var blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = bookTitle.replace(/[<>:"/\\|?*]/g, '_') + '-阅读笔记.md';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('📋 笔记已导出');
  }).catch(function() {
    toast('❌ 导出失败');
  });
}

function segmentSentences(text, locale) {
  text = String(text || '');
  if (!text.trim()) return [];
  try {
    if (typeof Intl !== 'undefined' && Intl.Segmenter) {
      return Array.from(new Intl.Segmenter(locale || 'ru', { granularity: 'sentence' }).segment(text)).map(function(item) {
        return { text: item.segment, index: item.index };
      });
    }
  } catch (e) {}
  var segments = [], re = /[^.!?。！？…]+(?:[.!?。！？…]+[»”’"')\]]*)?|.+$/g, match;
  while ((match = re.exec(text))) segments.push({ text: match[0], index: match.index });
  return segments;
}

function sentenceAtOffset(text, offset, locale) {
  var segments = segmentSentences(text, locale);
  for (var i = 0; i < segments.length; i++) {
    var start = segments[i].index;
    var end = start + segments[i].text.length;
    if (offset >= start && offset <= end) return { text: segments[i].text.trim(), index: i };
  }
  return { text: String(text || '').trim(), index: 0 };
}

function extractLookupSentence(element) {
  var block = element && element.closest ? element.closest('.para-block') : null;
  if (!block) return { ru: '', zh: '' };
  var ruElement = block.querySelector('.ru-text');
  var zhElement = block.querySelector('.cn-text');
  if (!ruElement) return { ru: '', zh: zhElement ? zhElement.textContent.trim() : '' };
  var offset = 0;
  try {
    var range = document.createRange();
    range.selectNodeContents(ruElement);
    range.setEndBefore(element);
    offset = range.toString().length;
  } catch (e) {}
  var ruSentence = sentenceAtOffset(ruElement.textContent || '', offset, 'ru');
  var zhSegments = segmentSentences(zhElement ? zhElement.textContent || '' : '', 'zh');
  var zhSentence = zhSegments[ruSentence.index] || (zhSegments.length === 1 ? zhSegments[0] : null);
  return {
    ru: ruSentence.text,
    zh: zhSentence ? zhSentence.text.trim() : ''
  };
}

function renderHighlightedLookupContext(sentence, word) {
  sentence = String(sentence || '');
  word = stripStressMarks(String(word || ''));
  var haystack = stripStressMarks(sentence).toLocaleLowerCase('ru-RU');
  var needle = word.toLocaleLowerCase('ru-RU');
  var index = needle ? haystack.indexOf(needle) : -1;
  if (index < 0) return escapeHtml(sentence);
  return escapeHtml(sentence.slice(0, index)) +
    '<mark class="dict-context-word">' + escapeHtml(sentence.slice(index, index + word.length)) + '</mark>' +
    escapeHtml(sentence.slice(index + word.length));
}

function getWritingGuidance(task) {
  var type = (task.type || '').toLowerCase();
  if (type.indexOf('эссе') >= 0) return {
    goal: '先确定你的立场，再按“问题 - 正反影响 - 论证 - 展望”组织段落。每一段只推进一个观点。',
    patterns: [
      { role: '引出问题', ru: 'В настоящее время вопрос о {теме} приобретает особую актуальность.', zh: '当前，{主题}问题具有特别的重要性。' },
      { role: '表达立场', ru: 'На мой взгляд, {изобретение / явление} приносит больше пользы, чем вреда.', zh: '在我看来，{发明/现象}利大于弊。' },
      { role: '转入反面', ru: 'Однако нельзя не учитывать и возможные отрицательные последствия.', zh: '不过，也不能忽视可能带来的负面后果。' },
      { role: '收束展望', ru: 'Таким образом, многое зависит от того, как люди будут использовать {тему} в будущем.', zh: '因此，关键在于人们未来如何使用{主题}。' }
    ]
  };
  if (type.indexOf('сообщен') >= 0) return {
    goal: '把输入材料压缩成正式信息，不写个人感受。先写收件人与标题，再标来源、列数据、作简短结论。',
    patterns: [
      { role: '说明来信目的', ru: 'Сообщаю Вам о результатах {исследования / опроса}.', zh: '现向您通报{研究/调查}结果。' },
      { role: '标注来源', ru: 'Согласно данным, опубликованным в {источнике}, ...', zh: '根据{来源}公布的数据，……' },
      { role: '概括数据', ru: 'Наиболее значимым результатом является то, что ...', zh: '最值得注意的结果是……' },
      { role: '正式收束', ru: 'Представленные данные могут быть использованы при дальнейшем анализе.', zh: '上述数据可供后续分析使用。' }
    ]
  };
  if (type.indexOf('жалоб') >= 0 || type.indexOf('претенз') >= 0) return {
    goal: '投诉信要清楚交代事实、造成的后果和你的明确诉求，保持正式克制，不使用情绪化指责。',
    patterns: [
      { role: '说明缘由', ru: 'Обращаюсь к Вам в связи с {ситуацией}.', zh: '我因{情况}向您反映。' },
      { role: '陈述事实', ru: 'В результате {проблемы} мне были причинены неудобства.', zh: '由于{问题}，我遭受了不便。' },
      { role: '提出诉求', ru: 'Прошу принять меры и сообщить мне о результате.', zh: '请采取措施，并告知我处理结果。' }
    ]
  };
  if (type.indexOf('благодар') >= 0) return {
    goal: '感谢信应交代受益的具体事项，写出真诚感谢，并用合适的礼貌结尾。',
    patterns: [
      { role: '写明感谢', ru: 'Хочу выразить искреннюю благодарность за {помощь / организацию}.', zh: '我想对{帮助/组织安排}表示诚挚感谢。' },
      { role: '补充细节', ru: 'Благодаря Вашему вниманию {результат}.', zh: '多亏您的关注，{结果}得以实现。' },
      { role: '礼貌结尾', ru: 'С уважением и наилучшими пожеланиями, ...', zh: '谨致敬意并致以最美好的祝愿。' }
    ]
  };
  if (type.indexOf('рекомендац') >= 0) return {
    goal: '推荐信不只夸人，要给出关系背景、可验证的能力和与岗位的匹配理由。',
    patterns: [
      { role: '说明关系', ru: 'Я знаком(а) с {имя} уже {срок} и могу рекомендовать его/её.', zh: '我认识{姓名}已有{时间}，可以推荐他/她。' },
      { role: '举能力证据', ru: 'Он/она отличается {качествами} и имеет опыт в {сфере}.', zh: '他/她具备{品质}，并有{领域}经验。' },
      { role: '明确推荐', ru: 'Уверен(а), что он/она успешно справится с этой работой.', zh: '我相信他/她能胜任这项工作。' }
    ]
  };
  if (type.indexOf('аргумент') >= 0) return {
    goal: '先亮明立场，再给出至少两个理由和例子；回应相反观点后再得出结论。',
    patterns: [
      { role: '表明立场', ru: 'Я согласен(на) с тем, что {тезис}, потому что ...', zh: '我赞同{观点}，因为……' },
      { role: '补充论据', ru: 'Во-первых, ... Во-вторых, ...', zh: '第一，……；第二，……' },
      { role: '回应反方', ru: 'Хотя можно возразить, что ..., я считаю, что ...', zh: '尽管有人可能反驳说……，但我认为……' }
    ]
  };
  return {
    goal: '先圈出题目要求的交际对象、文体和必须覆盖的信息点，再在纸上选择最适合的句型。',
    patterns: [
      { role: '开头', ru: 'Я хотел(а) бы сообщить / объяснить, что ...', zh: '我想说明/解释的是……' },
      { role: '展开', ru: 'Прежде всего, необходимо отметить, что ...', zh: '首先，需要指出的是……' },
      { role: '结尾', ru: 'Надеюсь, что эта информация будет полезна.', zh: '希望这些信息会有所帮助。' }
    ]
  };
}

function stripWritingVocabularyMarkup(text) {

function renderWritingVocabularyDetail(data, item, index) {
  var dictionary = item.dictionary || null;
  var sourceExamples = item.sourceExamples || [];
  var hasDictionary = dictionary && (dictionary.meaning || dictionary.detailZh || (dictionary.collocations || []).length);
  if (!hasDictionary && !sourceExamples.length) return '';

  var html = '<details class="ws-vocab-detail"><summary>释义、例句与搭配</summary><div class="ws-vocab-detail-content">';
  if (hasDictionary) {
    var meta = [];
    if (dictionary.type) meta.push(dictionary.type);
    if (dictionary.gender) meta.push(dictionary.gender);
    if (dictionary.aspect) meta.push(dictionary.aspect + (dictionary.pair ? ' / ' + dictionary.pair : ''));
    if (dictionary.caseGov) meta.push(dictionary.caseGov);
    html += '<section class="ws-vocab-detail-section"><h4>项目词典</h4>';
    if (dictionary.detailZh) html += '<p>' + escapeHtml(dictionary.detailZh) + '</p>';
    if (meta.length) html += '<p class="ws-vocab-example-zh">' + escapeHtml(meta.join(' · ')) + '</p>';
    html += '<span class="ws-source-label">项目词典 · needs_review</span></section>';
    if ((dictionary.collocations || []).length) {
      html += '<section class="ws-vocab-detail-section"><h4>常见搭配</h4><ul class="ws-vocab-collocations">';
      dictionary.collocations.forEach(function(collocation) {
        html += '<li><strong>' + escapeHtml(collocation.phrase || '') + '</strong>';
        if (collocation.ru) html += '<br><span class="ws-vocab-example-ru">' + escapeHtml(collocation.ru) + '</span>';
        if (collocation.zh) html += '<br><span class="ws-vocab-example-zh">' + escapeHtml(collocation.zh) + '</span>';
        html += '</li>';
      });
      html += '</ul></section>';
    }
  }
  if (sourceExamples.length) {
    html += '<section class="ws-vocab-detail-section"><h4>本主题真实例句</h4>';
    sourceExamples.forEach(function(example, exampleIndex) {
      var sentence = stripWritingVocabularyMarkup(example.sentence || '');
      html += '<p class="ws-vocab-example-ru">' + renderRuText(sentence, lookupContext('vocab', data.id + '-v-source-' + index + '-' + exampleIndex, 'vocab-example', sentence, '', data.sourcePages || [])) + '</p>';
    });

function renderWritingSpeakingVocabulary(data) {

  });

  var html = '<details class="learning-card" open><summary class="ws-section-header"><h2>📝 待学词汇与改写准备</h2><span class="ws-task-badge">' + items.length + ' 项</span></summary><p class="ws-vocab-note">先完成词义、配对和改写，再进入写作。词条先露出核心释义；小三角里保留本主题例句、搭配和项目词典解析。配对答案不会直接展开。</p><div class="ws-vocab-grid">';
  items.forEach(function(item, index) {
    var isWord = !!item.word;
    var source = isWord ? item.word : item.sentence || '';
    var content = renderRuText(source, lookupContext('vocab', data.id + (isWord ? '-v-' : '-vs-') + index, 'vocab', source, '', data.sourcePages || []));
    var gloss = item.dictionary && item.dictionary.meaning;
    html += '<article class="ws-vocab-item' + (isWord ? '' : ' ws-vocab-rephrase') + '"><div class="' + (isWord ? 'ru-word' : 'sentence') + '">' + content + '</div>';
    if (gloss) html += '<div class="ws-vocab-gloss">' + escapeHtml(gloss) + '</div>';
    if (item.option) html += '<div class="option">配对候选：' + escapeHtml(item.option) + '</div>';
    html += '<div class="task-label">' + escapeHtml(item.task || '词汇准备') + '</div>';
    html += renderWritingVocabularyDetail(data, item, index);
    html += '</article>';
  });
  html += '</div>';
  if (suggestions.length) {
    html += '<details class="ws-vocab-study-cards"><summary>配对与卡片复盘（' + suggestions.length + ' 项）</summary>';
    suggestions.forEach(function(suggestion) {

  }
  return html + '<span class="ws-source-label">原书任务与项目词典分层展示 · OCR 内容未经人工核对</span></details>';

function renderWritingSpeakingChapter(data, scrollPosition, restoreState) {

/* ─── 折叠面板过渡动画 ─── */
function initCollapseAnimations() {
  var detailsEls = document.querySelectorAll('details.ws-animated-collapse');
  for (var i = 0; i < detailsEls.length; i++) (function(detailsEl) {
    var inner = document.createElement('div');
    inner.className = 'collapse-inner';
    while (detailsEl.children.length) inner.appendChild(detailsEl.children[0]);
    detailsEl.appendChild(inner);

    var summary = detailsEl.querySelector('summary');
    if (!summary || detailsEl.classList.contains('collapse-setup-done')) return;
    detailsEl.classList.add('collapse-setup-done');
    summary.addEventListener('click', function(e) {
      if (detailsEl.open) {
        e.preventDefault();
        var startH = inner.scrollHeight;
        inner.style.height = startH + 'px';
        inner.style.transition = 'height 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
        requestAnimationFrame(function() { inner.style.height = '0px'; });
        inner.addEventListener('transitionend', function h() {
          inner.removeEventListener('transitionend', h);
          detailsEl.open = false;
          inner.style.height = '';
          inner.style.transition = '';
        });
      } else {
        detailsEl.open = true;
        var h = inner.scrollHeight;
        inner.style.height = '0px';
        inner.style.transition = 'height 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
        requestAnimationFrame(function() { inner.style.height = h + 'px'; });
        inner.addEventListener('transitionend', function h() {
          inner.removeEventListener('transitionend', h);
          inner.style.height = '';
          inner.style.transition = '';
        });
      }
    });
  })(detailsEls[i]);
}

var READING_SPEAKING_LAYOUT_KEY = 'reader-reading-speaking-layout-mode';

function getReadingSpeakingLayoutMode() {
  try { return localStorage.getItem(READING_SPEAKING_LAYOUT_KEY) === 'practice' ? 'practice' : 'reading'; }
  catch (e) { return 'reading'; }
}

function isReadingSpeakingPhoneViewport() {
  return !!(window.matchMedia && window.matchMedia('(max-width: 760px)').matches);
}

function isReadingSpeakingSplitViewport() {
  return !!(window.matchMedia && window.matchMedia('(min-width: 900px) and (orientation: landscape)').matches);
}

function isReadingSpeakingPracticeMode() {
  var layout = document.getElementById('readerLayout');
  return !!layout && layout.classList.contains('rs-practice-mode');
}

function clearReadingSpeakingDictionaryPosition() {
  var panel = document.getElementById('detailPanel');
  if (!panel) return;
  panel.style.removeProperty('--rs-dict-left');
  panel.style.removeProperty('--rs-dict-top');
}

function positionReadingSpeakingDictionary(element) {
  if (!isReadingSpeakingPracticeMode() || !element) return;
  var panel = document.getElementById('detailPanel');
  if (!panel) return;
  var isPortrait = window.matchMedia && window.matchMedia('(max-width: 1366px) and (orientation: portrait)').matches;
  if (isPortrait) {
    clearReadingSpeakingDictionaryPosition();
    return;
  }
  var rect = element.getBoundingClientRect();
  var panelWidth = Math.min(360, Math.max(280, window.innerWidth - 32));
  var panelHeight = Math.min(480, Math.max(240, window.innerHeight - 104));
  var left = rect.right + 12;
  if (left + panelWidth > window.innerWidth - 16) left = rect.left - panelWidth - 12;
  if (left < 16) left = Math.max(16, Math.min(window.innerWidth - panelWidth - 16, rect.left));
  var top = rect.bottom + 10;
  if (top + panelHeight > window.innerHeight - 16) top = window.innerHeight - panelHeight - 16;
  top = Math.max(62, top);
  panel.style.setProperty('--rs-dict-left', Math.round(left) + 'px');
  panel.style.setProperty('--rs-dict-top', Math.round(top) + 'px');
}

function setReadingSpeakingLayoutMode(mode) {
  mode = mode === 'practice' ? 'practice' : 'reading';
  var isPhone = isReadingSpeakingPhoneViewport();
  if (!isPhone) {
    try { localStorage.setItem(READING_SPEAKING_LAYOUT_KEY, mode); } catch (e) {}
  }
  var layout = document.getElementById('readerLayout');
  if (!layout) return;
  var activeMode = isPhone ? 'practice' : mode;
  var isPractice = activeMode === 'practice';
  layout.classList.toggle('rs-practice-mode', isPractice);
  layout.classList.toggle('rs-reading-mode', !isPractice);
  document.querySelectorAll('.rs-reader-mode-switch button[data-rs-layout-mode]').forEach(function(button) {
    button.setAttribute('aria-pressed', String(button.getAttribute('data-rs-layout-mode') === activeMode));
  });
  var pane = document.getElementById('readerPane');
  if (pane) {
    pane.style.removeProperty('flex-basis');
    if (!isPractice) restoreSplitRatio();
  }
  clearReadingSpeakingDictionaryPosition();
  if (dictionaryController) dictionaryController.close();
  syncReaderShellState();
}

var _readingSpeakingPhoneViewport = isReadingSpeakingPhoneViewport();
window.addEventListener('resize', function() {
  var isPhone = isReadingSpeakingPhoneViewport();
  if (isPhone === _readingSpeakingPhoneViewport) return;
  _readingSpeakingPhoneViewport = isPhone;
  if (!document.querySelector('.rs-reader-mode-switch')) return;

function getReadingSpeakingPracticeProgress(exercises) {
  var list = exercises || _currentRSExercises || [];
  var completed = 0;
  for (var i = 0; i < list.length; i++) {
    var ex = list[i];
    var exId = ex._exId || ('rs-' + curCh + '-ex' + ex.num);
    if (getReadingSpeakingRecord(exId).submitted) completed++;
  }
  return { completed: completed, total: list.length };
}

function renderReadingSpeakingPracticeProgress(exercises) {
  var progress = getReadingSpeakingPracticeProgress(exercises);
  var percent = progress.total ? Math.round(progress.completed / progress.total * 100) : 0;
  return '<div class="rs-practice-progress" id="rsPracticeProgress" role="progressbar" aria-label="练习完成进度" aria-valuemin="0" aria-valuemax="' + progress.total + '" aria-valuenow="' + progress.completed + '">' +
    '<div class="rs-practice-progress-line"><span>完成进度</span><strong id="rsPracticeProgressText">已完成 ' + progress.completed + ' / ' + progress.total + '</strong></div>' +
    '<div class="rs-practice-progress-track"><span class="rs-practice-progress-fill" id="rsPracticeProgressFill" style="width:' + percent + '%"></span></div>' +
    '</div>';
}

function updateReadingSpeakingPracticeProgress() {
  var root = document.getElementById('rsPracticeProgress');
  if (!root) return;
  var progress = getReadingSpeakingPracticeProgress();
  var percent = progress.total ? Math.round(progress.completed / progress.total * 100) : 0;
  var text = document.getElementById('rsPracticeProgressText');
  var fill = document.getElementById('rsPracticeProgressFill');
  root.setAttribute('aria-valuemax', String(progress.total));
  root.setAttribute('aria-valuenow', String(progress.completed));
  if (text) text.textContent = '已完成 ' + progress.completed + ' / ' + progress.total;
  if (fill) fill.style.width = percent + '%';

function renderReadingSpeakingChapterCompletionAction(progress) {
  if (!progress.total || progress.completed !== progress.total) return '';
  if (isChapterCompleted('reading_speaking', curCh)) {
    return '<section class="rs-chapter-completion" id="rsChapterCompletion"><p>本篇已记录为完成。</p></section>';
  }
  return '<section class="rs-chapter-completion" id="rsChapterCompletion"><p>' + progress.total + ' 道题已全部提交。</p><button type="button" class="b2-finish" onclick="requestReadingSpeakingChapterCompletion()">标记本篇完成</button></section>';
}

function updateReadingSpeakingChapterCompletionAction(progress) {
  var panel = document.getElementById('readingSpeakingPracticePanel');
  if (!panel) return;
  var oldAction = document.getElementById('rsChapterCompletion');
  var html = renderReadingSpeakingChapterCompletionAction(progress || getReadingSpeakingPracticeProgress());
  if (oldAction) {
    if (html) oldAction.outerHTML = html;
    else oldAction.remove();
  } else if (html) {
    panel.insertAdjacentHTML('beforeend', html);
  }

function requestReadingSpeakingChapterCompletion() {
  var progress = getReadingSpeakingPracticeProgress();
  if (progress.completed !== progress.total) {
    toast('还有 ' + (progress.total - progress.completed) + ' 道题未提交。');
    return;
  }
  if (!window.confirm('已完成 ' + progress.total + ' 道题。确定标记本篇完成吗？')) return;

/* ══════════════════════════════════════════════

function renderReadingSpeakingExercise(ex) {
  var exId = ex._exId || ('rs-' + curCh + '-ex' + ex.num);
  var record = getReadingSpeakingRecord(exId);
  var submitted = record.submitted;
  var answerVerified = isReadingSpeakingAnswerVerified(ex);

  var html = '<div class="b2-quiz-item" data-question-id="' + escapeHtml(exId) + '">';
  var questionText = ex.question || '';
  html += '<h3><span class="b2-question-number">' + ex.num + '. </span><span class="b2-question-text">' +
    renderRuText(questionText, lookupContextWithSentence('reading', exId + '-question', 'quiz-question', questionText, ex.zhQuestion || '', [])) +
    '</span></h3>';

  // 中文提示
  if (ex.zhQuestion) {
    html += '<p class="exercise-zh-hint" style="color:var(--text-dim);font-size:0.9em;margin:4px 0 12px">' + escapeHtml(ex.zhQuestion) + '</p>';
  }

  // 选项
  html += '<div class="b2-options">';
  for (var j = 0; j < (ex.options || []).length; j++) {
    var key = extractOptionKey(ex.options[j]);
    var selected = record.selected === key;
    var isCorrectAnswer = answerVerified && key === ex.answer;
    var cls = 'b2-option-row';
    if (submitted && isCorrectAnswer) cls += ' correct';
    if (submitted && selected && !isCorrectAnswer) cls += ' wrong';
    if (selected && !submitted) cls += ' pending';
    var disabled = submitted ? ' style="pointer-events:none;opacity:0.85"' : '';

    var optionText = ex.options[j];
    var optionZh = ex.zhOptions && ex.zhOptions[j] ? ex.zhOptions[j] : '';
    var parenIdx = optionText.indexOf(')');
    var keyPart = parenIdx > 0 ? optionText.substring(0, parenIdx + 1) : optionText; // "а)"
    var textPart = parenIdx > 0 ? optionText.substring(parenIdx + 1).trim() : '';
    html += '<div class="' + cls + '" onclick="submitReadingSpeakingOption(\'' + escapeHtml(exId) + '\',\'' + escapeHtml(key) + '\',event)"' + disabled + '>' +
      '<span class="b2-option-radio">' + escapeHtml(keyPart) + '</span>' +
      '<span class="b2-option-text">' + renderRuText(textPart, lookupContextWithSentence('reading', exId + '-opt' + j, 'quiz-option', textPart, optionZh, [])) + '</span>';
    if (optionZh) {
      html += '<span class="b2-option-zh" style="display:block;font-size:0.85em;color:var(--text-dim);margin-top:2px">' + escapeHtml(optionZh) + '</span>';
    }
    html += '</div>';
  }
  html += '</div>';

  // 结果
  if (submitted) {
    var resultClass = record.unverified ? 'pending' : (record.wrong ? 'wrong' : 'correct');
    var resultText = record.unverified ? '已记录，标准答案待确认' : (record.wrong ? '回答错误' : '回答正确');
    html += '<p class="b2-quiz-result ' + resultClass + '">' + resultText + '</p>';
  }

  // 解析
  if (submitted) {
    html += '<button class="b2-explanation-toggle" onclick="toggleReadingSpeakingExplanation(\'' + escapeHtml(exId) + '\')">' +
      (record.expOpen ? '收起解析 ▲' : '查看解析 ▼') + '</button>';
    if (record.expOpen) {
      html += '<div class="b2-explanation">' + renderReadingSpeakingExplanationContent(ex, exId) + '</div>';
    }
  }

  html += '</div>';
  return html;
}

function renderReadingSpeakingExplanationContent(ex, exId) {
  var answerVerified = isReadingSpeakingAnswerVerified(ex);
  var html = '<div class="rs-explanation"><div class="rs-answer-banner"><span>' + (answerVerified ? '正确答案' : '答案状态') + '</span><strong>' + (answerVerified ? escapeHtml(ex.answer) : '标准答案待确认') + '</strong></div>';
  if (ex.answerAnalysis) {
    html += renderReadingStructuredExplanation(ex.answerAnalysis, exId);
  } else if (ex.detailed_explanation) {
    var paragraphs = ex.detailed_explanation.split('\n').filter(function(p) { return p.trim(); });
    var sections = [];
    var activeSection = null;
    for (var p = 0; p < paragraphs.length; p++) {
      var para = paragraphs[p].trim();
      if (para.startsWith('【') && para.includes('】')) {
        var titleEnd = para.indexOf('】') + 1;
        activeSection = { title: para.substring(0, titleEnd), body: [] };
        var sectionBody = para.substring(titleEnd).trim();
        if (sectionBody) activeSection.body.push(sectionBody);
        sections.push(activeSection);
      } else {
        if (activeSection) activeSection.body.push(para);
        else sections.push({ title: '', body: [para] });
      }
    }
    var classByTitle = {
      '【学习辅助·原文定位】': 'source', '【定位原文】': 'source', '【正确项】': 'correct', '【正确答案】': 'correct',
      '【排除项】': 'exclude', '【选项分析】': 'exclude', '【关键词】': 'keywords', '【原文逐句拆解】': 'breakdown',
      '【题干与选项核对】': 'check', '【进一步辨析】': 'check', '【一句话复盘】': 'review', '【解题思路】': 'review'
    };
    sections.forEach(function(section) {
      var kind = classByTitle[section.title] || 'review';
      html += '<section class="rs-explanation-block rs-explanation-block--' + kind + '">';
      if (section.title === '【学习辅助·原文定位】' || section.title === '【定位原文】') {
        html += '<h4>' + escapeHtml(section.title) + ' ' + renderReadingSpeakingLocatorControl(exId, ex.answerAnalysis && ex.answerAnalysis.locatorStatus) + '</h4>';
      } else if (section.title) {
        html += '<h4>' + escapeHtml(section.title) + '</h4>';
      }
      section.body.forEach(function(body) { html += '<p>' + escapeHtml(body) + '</p>'; });
      html += '</section>';
    });
  } else if (ex.explanation) {
    html += '<section class="rs-explanation-block rs-explanation-block--review"><p>' + escapeHtml(ex.explanation) + '</p></section>';
  }
  html += renderExerciseAiAction(exId, 'reading-speaking');
  return html + '</div>';
}

function renderReadingStructuredExplanation(analysis, exId) {
  analysis = analysis || {};
  if (analysis.presentation && analysis.presentation.mode === 'two-layer') {
    return renderReadingTwoLayerExplanation(analysis, exId);
  }
  var evidence = analysis.evidence || {};
  var evidenceItems = analysis.evidenceItems || [];
  var mappings = (analysis.mappings || []).map(function(item) {
    return '<li><span class="rs-analysis-mapping">' + escapeHtml(item.source) + ' → ' + escapeHtml(item.option) + '</span><br>' + escapeHtml(item.reason) + '</li>';
  }).join('');
  var options = (analysis.options || []).map(function(item) {
    var cls = item.status === 'correct' ? 'rs-analysis-correct' : 'rs-analysis-wrong';
    return '<section class="' + cls + '"><h4>' + escapeHtml(item.key) + '：' + escapeHtml(item.status === 'correct' ? '正确项' : '排除项') + '</h4>' +
      '<p><strong>关键处：</strong>' + escapeHtml((item.terms || []).join('、')) + '</p><p>' + escapeHtml(item.reason) + '</p></section>';
  }).join('');
  var locate = renderReadingSpeakingLocatorControl(exId, analysis.locatorStatus);
  var provenance = analysis.provenance && analysis.provenance.kind === 'ai-generated'
    ? '<p class="reader-ai-generated-label">AI 生成内容 · 已按原书答案整理</p>' : '';
  var evidenceHtml = evidenceItems.length ? evidenceItems.map(function(item, index) {
    return '<div class="rs-analysis-evidence-item"><p><strong>证据 ' + (index + 1) + '</strong></p><p class="ru-text">' + escapeHtml(item.quoteRu || '') + '</p><p>' + escapeHtml(item.quoteZh || '') + '</p></div>';
  }).join('') : '<p class="ru-text">' + escapeHtml(evidence.ru || '') + '</p><p>' + escapeHtml(evidence.zh || '') + '</p>';
  var correctHtml = analysis.correctReason
    ? '<p>' + escapeHtml(analysis.correctReason) + '</p>'
    : '<ul>' + mappings + '</ul>';
  var reviewHtml = analysis.review ? '<section><h4>一句话复盘</h4><p>' + escapeHtml(analysis.review) + '</p></section>' : '';
  var nextCheckHtml = analysis.nextCheck ? '<p><strong>下次先检查：</strong>' + escapeHtml(analysis.nextCheck) + '</p>' : '';
  return '<div class="rs-structured-analysis">' + provenance + '<section class="rs-analysis-evidence"><h4>原文证据 ' + locate + '</h4>' + evidenceHtml + '</section>' +
    '<section class="rs-analysis-correct"><h4>正确项如何对应原文</h4>' + correctHtml + '</section>' +
    '<section><h4>先说结论</h4><p>' + escapeHtml(analysis.conclusion || '') + '</p></section>' +
    '<div class="rs-analysis-options"><h4>逐项排除</h4>' + options + '</div>' +
    '<section class="rs-analysis-wrong"><h4>容易误选的原因</h4><p>' + escapeHtml(analysis.pitfall || '') + '</p>' + nextCheckHtml + '</section>' + reviewHtml + '</div>';
}

function renderReadingTwoLayerExplanation(analysis, exId) {
  var evidenceItems = analysis.evidenceItems || [];
  var evidence = analysis.evidence || {};
  var primaryEvidence = evidenceItems[0] || {};
  var quoteRu = primaryEvidence.quoteRu || primaryEvidence.quote || evidence.ru || '';
  var quoteZh = primaryEvidence.quoteZh || evidence.zh || '';
  var mapping = (analysis.mappings || [])[0];
  var mappingHtml = mapping
    ? '<p><span class="rs-analysis-mapping">' + escapeHtml(mapping.source || '') + ' → ' + escapeHtml(mapping.option || '') + '</span></p><p>' + escapeHtml(mapping.reason || '') + '</p>'
    : '<p>' + escapeHtml(analysis.correctReason || '') + '</p>';
  var wrongOptions = (analysis.options || []).filter(function(item) { return item.status !== 'correct'; }).map(function(item) {
    var terms = (item.terms || []).length ? '<p><strong>关键处：</strong>' + escapeHtml(item.terms.join('、')) + '</p>' : '';
    return '<section class="rs-analysis-wrong"><h4>' + escapeHtml(item.key || '') + '：为什么不选</h4>' + terms + '<p>' + escapeHtml(item.reason || '') + '</p></section>';
  }).join('');
  var pitfallHtml = analysis.pitfall
    ? '<section class="rs-analysis-wrong"><h4>可能卡在哪里</h4><p>' + escapeHtml(analysis.pitfall) + '</p></section>' : '';
  var nextCheckHtml = analysis.nextCheck
    ? '<section><h4>下次先检查</h4><p>' + escapeHtml(analysis.nextCheck) + '</p></section>' : '';
  var locate = renderReadingSpeakingLocatorControl(exId, analysis.locatorStatus);
  var provenance = analysis.provenance || {};
  var provenanceText = provenance.kind === 'ai-generated'
    ? '项目教学解析 · AI 辅助整理 · ' + (provenance.reviewStatus === 'draft' ? '试点待验收' : '已审核')
    : '项目教学解析';
  return '<div class="rs-structured-analysis rs-structured-analysis--two-layer">' +
    '<div class="rs-analysis-quick"><section class="rs-analysis-conclusion"><h4>快速看懂</h4><p>' + escapeHtml(analysis.conclusion || '') + '</p></section>' +
    '<section class="rs-analysis-evidence"><h4>核心原文 ' + locate + '</h4><p class="ru-text">' + escapeHtml(quoteRu) + '</p>' + (quoteZh ? '<p>' + escapeHtml(quoteZh) + '</p>' : '') + '</section>' +
    '<section class="rs-analysis-correct"><h4>原文怎样变成答案</h4>' + mappingHtml + '</section></div>' +
    '<details class="rs-analysis-expanded"><summary>展开详细解析</summary><div class="rs-analysis-expanded-content">' + wrongOptions + pitfallHtml + nextCheckHtml + '</div></details>' +
    '<div class="rs-analysis-source"><p>' + escapeHtml(provenanceText) + '</p><p>证据定位：' + escapeHtml(analysis.locatorStatus === 'exact' ? '可精确定位原文' : analysis.locatorStatus === 'paragraph' ? '定位到相关段落' : '原文待核对') + '</p></div></div>';
}

function getReadingSpeakingLocatorStatus(exId, status) {
  if (status === 'exact' || status === 'paragraph' || status === 'unavailable') return status;
  var exercise = getReadingSpeakingExercise(exId);
  var anchors = exercise && exercise.evidenceAnchors && exercise.evidenceAnchors.length
    ? exercise.evidenceAnchors
    : (exercise && exercise.sourceAnchor && exercise.sourceAnchor.quote ? [exercise.sourceAnchor] : []);
  if (!anchors.length) return 'unavailable';
  return anchors.some(function(anchor) { return anchor.locatorLevel === 'paragraph'; }) ? 'paragraph' : 'exact';
}

function renderReadingSpeakingLocatorControl(exId, status) {
  if (!exId) return '';
  var level = getReadingSpeakingLocatorStatus(exId, status);
  if (level === 'unavailable') {
    return '<span class="rs-source-locate-status rs-source-locate-status--unavailable" title="当前 Reader 的原文版本无法可靠匹配网页解析引用">原文待核对</span>';
  }
  var label = level === 'paragraph' ? '定位相关段落' : '定位原文句子';
  var hint = level === 'paragraph' ? '证据存在 OCR 或版本差异，将跳到相关段落' : '跳到并高亮原文证据句';
  return '<button type="button" class="rs-source-locate" title="' + hint + '" onclick="locateReadingSpeakingSource(\'' + escapeHtml(exId) + '\',event)">' + label + '</button>';
}

function normalizeReadingSpeakingSourceWord(value) {
  return String(value || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/ё/g, 'е').replace(/[^а-яa-z0-9-]/g, '');
}

function locateReadingSpeakingSource(exId, evt) {
  if (evt) { evt.preventDefault(); evt.stopPropagation(); }
  var exercise = _currentRSExercises.find(function(item) { return item._exId === exId; });
  var anchors = exercise && exercise.evidenceAnchors && exercise.evidenceAnchors.length
    ? exercise.evidenceAnchors.map(function(anchor) { return Object.assign({}, anchor, { highlightLevel: anchor.highlightLevel || 'core' }); })
    : (exercise && exercise.sourceAnchor && exercise.sourceAnchor.quote ? [Object.assign({}, exercise.sourceAnchor, { highlightLevel: 'core' })] : []);
  var contextEvidence = exercise && exercise.answerAnalysis && exercise.answerAnalysis.contextEvidence;
  if (contextEvidence && contextEvidence.quote) {
    anchors.unshift({
      paragraphIndex: contextEvidence.paragraphIndex,
      quote: contextEvidence.quote,
      role: contextEvidence.role || '完整证据链',
      highlightLevel: 'context'
    });
  }
  if (!anchors.length) { toast('这道题暂时没有可定位的原文句子'); return; }
  var locatorStatus = getReadingSpeakingLocatorStatus(exId, exercise.answerAnalysis && exercise.answerAnalysis.locatorStatus);

  var oldWords = document.querySelectorAll('.rs-source-word-highlight');
  for (var i = 0; i < oldWords.length; i++) oldWords[i].classList.remove('rs-source-word-highlight');
  var oldContextWords = document.querySelectorAll('.rs-source-context-word-highlight');
  for (var cw = 0; cw < oldContextWords.length; cw++) oldContextWords[cw].classList.remove('rs-source-context-word-highlight');
  var oldParas = document.querySelectorAll('.rs-source-paragraph-highlight');
  for (var p = 0; p < oldParas.length; p++) oldParas[p].classList.remove('rs-source-paragraph-highlight');
  var oldContextParas = document.querySelectorAll('.rs-source-context-highlight');
  for (var cp = 0; cp < oldContextParas.length; cp++) oldContextParas[cp].classList.remove('rs-source-context-highlight');

  var firstTarget = null, missing = 0;
  anchors.forEach(function(anchor) {
    var paragraph = typeof anchor.paragraphIndex === 'number'
      ? document.getElementById('rs-source-p-' + anchor.paragraphIndex)
      : null;
    var anchorTokens = String(anchor.quote || '').split(/\s+/).map(normalizeReadingSpeakingSourceWord).filter(function(token) {
      return /^[а-я-]+$/.test(token);
    });
    if (!paragraph) {
      var candidates = document.querySelectorAll('.rs-source-paragraph');
      var anchorPreview = anchorTokens.slice(0, Math.min(5, anchorTokens.length)).join(' ');
      for (var c = 0; c < candidates.length; c++) {
        var candidateWords = Array.from(candidates[c].querySelectorAll('.ru-word')).map(function(word) { return normalizeReadingSpeakingSourceWord(word.textContent); }).filter(Boolean);
        if (candidateWords.join(' ').indexOf(anchorPreview) >= 0) { paragraph = candidates[c]; break; }
      }
    }
    if (!paragraph || !anchorTokens.length) { missing++; return; }
    var wordElements = Array.from(paragraph.querySelectorAll('.ru-word'));
    var paragraphTokens = wordElements.map(function(word) { return normalizeReadingSpeakingSourceWord(word.textContent); });
    var matchStart = -1;
    for (var start = 0; start <= paragraphTokens.length - anchorTokens.length; start++) {
      var matches = true;
      for (var offset = 0; offset < anchorTokens.length; offset++) {
        if (paragraphTokens[start + offset] !== anchorTokens[offset]) { matches = false; break; }
      }
      if (matches) { matchStart = start; break; }
    }
    var paragraphBlock = paragraph.closest('.para-block');
    paragraphBlock.classList.add('rs-source-paragraph-highlight');
    if (anchor.highlightLevel === 'context') paragraphBlock.classList.add('rs-source-context-highlight');
    if (matchStart >= 0) {
      for (var w = matchStart; w < matchStart + anchorTokens.length; w++) {
        if (anchor.highlightLevel === 'context') wordElements[w].classList.add('rs-source-context-word-highlight');
        else wordElements[w].classList.add('rs-source-word-highlight');
      }
      if (!firstTarget) firstTarget = wordElements[matchStart];
    } else {
      missing++;
      if (!firstTarget) firstTarget = paragraph;
    }
  });
  if (!firstTarget) { toast('没有找到对应原文段落'); return; }
  if (locatorStatus === 'paragraph') toast('已定位到相关段落；原句存在 OCR 或版本差异，请结合解析核对。');
  else if (missing) toast('已定位可用证据，另有 ' + missing + ' 个片段需要复核');
  firstTarget.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ══════════════════════════════════════════════
   В мире людей — 答题交互

function submitReadingSpeakingOption(exId, key, evt) {
  // 点到了俄语单词 → 交给词典，不做答题操作
  if (evt && evt.target.closest('.ru-word')) return;
  var record = getReadingSpeakingRecord(exId);
  if (record.submitted) return;

  if (record.selected === key) {
    // 第二次点击同一选项 → 确认提交
    record.submitted = true;
    var ex = getReadingSpeakingExercise(exId);
    record.unverified = !isReadingSpeakingAnswerVerified(ex);
    record.wrong = !record.unverified && ex ? key !== ex.answer : false;
    var progress = getReadingSpeakingProgress();
    progress[exId] = record;
    saveReadingSpeakingProgress(progress);
    recordB2Submission('reading-speaking', _currentRSData && _currentRSData.id || String(curCh), [exId], ex ? [{
      questionId: exId, printedNumber: ex.number || ex.printedNumber, prompt: ex.question || ex.prompt,
      options: ex.options, selected: key, answer: ex.answer,
      answeredAt: new Date().toISOString(), result: record.unverified ? 'unverified' : (record.wrong ? 'wrong' : 'correct')
    }] : []);
  } else {
    // 第一次点击 → 选中
    record.selected = key;
    var progress = getReadingSpeakingProgress();
    progress[exId] = record;
    saveReadingSpeakingProgress(progress);
  }
  updateReadingSpeakingQuestionDOM(exId);
}

function toggleReadingSpeakingExplanation(exId) {
  var record = getReadingSpeakingRecord(exId);
  if (!record.submitted) return;
  record.expOpen = !record.expOpen;
  var progress = getReadingSpeakingProgress();
  progress[exId] = record;
  saveReadingSpeakingProgress(progress);
  updateReadingSpeakingQuestionDOM(exId);
}

function updateReadingSpeakingQuestionDOM(exId) {
  var el = document.querySelector('[data-question-id="' + exId + '"]');
  if (!el) return;
  var record = getReadingSpeakingRecord(exId);
  var ex = getReadingSpeakingExercise(exId);
  if (!ex) return;

  // 1. 更新选项行状态
  var rows = el.querySelectorAll('.b2-option-row');
  for (var j = 0; j < rows.length; j++) {
    var row = rows[j];
    var optionKey = extractOptionKey((ex.options || [])[j] || '');
    var selected = record.selected === optionKey;
    var correct = isReadingSpeakingAnswerVerified(ex) && optionKey === ex.answer;
    // 清除旧状态 class
    row.classList.remove('pending', 'correct', 'wrong');
    row.style.pointerEvents = '';
    row.style.opacity = '';
    if (record.submitted) {
      if (correct) row.classList.add('correct');
      if (selected && !correct) row.classList.add('wrong');
      row.style.pointerEvents = 'none';
      row.style.opacity = '0.85';
    } else if (selected) {
      row.classList.add('pending');
    }
  }

  // 2. 更新结果文字和解析区域
  var oldResult = el.querySelector('.b2-quiz-result');
  var oldToggle = el.querySelector('.b2-explanation-toggle');
  var oldExplanation = el.querySelector('.b2-explanation');

  if (record.submitted) {
    // 结果
    var resultClass = record.unverified ? 'pending' : (record.wrong ? 'wrong' : 'correct');
    var resultText = record.unverified ? '已记录，标准答案待确认' : (record.wrong ? '回答错误' : '回答正确');
    var resultHtml = '<p class="b2-quiz-result ' + resultClass + '">' + resultText + '</p>';
    if (oldResult) oldResult.outerHTML = resultHtml;
    else rows[rows.length - 1].insertAdjacentHTML('afterend', resultHtml);

    // 解析按钮
    var toggleHtml = '<button class="b2-explanation-toggle" onclick="toggleReadingSpeakingExplanation(\'' + exId + '\')">' +
      (record.expOpen ? '收起解析 ▲' : '查看解析 ▼') + '</button>';
    if (oldToggle) oldToggle.outerHTML = toggleHtml;
    else {
      var resultEl = el.querySelector('.b2-quiz-result');
      if (resultEl) resultEl.insertAdjacentHTML('afterend', toggleHtml);
    }

    // 解析内容
    if (record.expOpen) {
      var expHtml = '<div class="b2-explanation">' + renderReadingSpeakingExplanationContent(ex, exId) + '</div>';
      if (oldExplanation) oldExplanation.outerHTML = expHtml;
      else {
        var toggleEl = el.querySelector('.b2-explanation-toggle');
        if (toggleEl) toggleEl.insertAdjacentHTML('afterend', expHtml);
      }
    } else if (oldExplanation) {
      oldExplanation.remove();
    }
  } else {
    // 未提交：移除结果和解析
    if (oldResult) oldResult.remove();
    if (oldToggle) oldToggle.remove();
    if (oldExplanation) oldExplanation.remove();
  }
  updateReadingSpeakingPracticeProgress();
}

// Vocabulary source links carry context even when an exact Reader chapter is unavailable.
(function handleVocabularySourceLink() {
  var hash = String(window.location.hash || '');
  if (hash.indexOf('#vocabulary-source=') !== 0) return;
  var match = hash.match(/^#vocabulary-source=([^&]*)/);
  var chapter = hash.match(/[?&]chapter=([^&]*)/) || hash.match(/&chapter=([^&]*)/);
  var word = match ? decodeURIComponent(match[1] || '') : '';
  var chapterName = chapter ? decodeURIComponent(chapter[1] || '') : '';
  var message = chapterName ? 'Vocabulary 来源：' + chapterName : 'Vocabulary 来源：' + (word || '当前词条');
  if (typeof window.toast === 'function') window.toast(message);
  else setTimeout(function () { var app = document.getElementById('app'); if (app) { var note = document.createElement('div'); note.className = 'reader-source-return-note'; note.textContent = message + '（当前 Reader 暂无精确定位）'; app.insertBefore(note, app.firstChild); } }, 0);
})();
