<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reader | 白夜俄语</title>
<link rel="stylesheet" href="css/reader-listening-workbench.css?v=20260726-5">
<style>
/* ─── 主题变量 ─── */
:root {
  --bg: #020617; --surface: rgba(15,23,42,0.6); --surface-solid: #0f172a;
  --glass: rgba(255,255,255,0.06); --glass-border: rgba(255,255,255,0.10);
  --glass-hover: rgba(255,255,255,0.10);
  --text: rgba(255,255,255,0.90); --text-secondary: rgba(255,255,255,0.55);
  --text-dim: rgba(255,255,255,0.38);
  --accent: #818cf8; --accent-dim: rgba(129,140,248,0.20); --accent-border: rgba(129,140,248,0.30);
  --success: #34d399; --warning: #fbbf24;
  --ru-text: rgba(255,255,255,0.88); --cn-text: rgba(255,255,255,0.52);
  --border: rgba(255,255,255,0.08); --para-hover: rgba(255,255,255,0.04);
  --para-expanded-border: rgba(129,140,248,0.4);
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --highlight-word: rgba(251,191,36,0.25); --highlight-search: rgba(56,189,248,0.30);
}
body.theme-sepia {
  --bg: #1a1410; --surface: rgba(30,24,18,0.6); --surface-solid: #1e1812;
  --glass: rgba(180,150,100,0.08); --glass-border: rgba(180,150,100,0.15);
  --glass-hover: rgba(180,150,100,0.12);
  --text: rgba(230,210,170,0.92); --text-secondary: rgba(200,170,120,0.58);
  --text-dim: rgba(180,150,100,0.42);
  --accent: #d4a574; --accent-dim: rgba(212,165,116,0.20); --accent-border: rgba(212,165,116,0.30);
  --ru-text: rgba(230,210,170,0.90); --cn-text: rgba(200,170,120,0.52);
  --border: rgba(180,150,100,0.12); --para-hover: rgba(180,150,100,0.05);
  --para-expanded-border: rgba(212,165,116,0.4);
  --highlight-word: rgba(212,165,116,0.25); --highlight-search: rgba(100,180,220,0.25);
  --success: #34d399;
}
body.theme-warm {
  --bg: #ECE1C7; --surface: rgba(236,225,199,0.85); --surface-solid: #E6DABB;
  --glass: rgba(0,0,0,0.03); --glass-border: rgba(0,0,0,0.08);
  --glass-hover: rgba(0,0,0,0.06);
  --text: rgba(40,35,25,0.92); --text-secondary: rgba(80,65,40,0.68);
  --text-dim: rgba(80,65,40,0.50);
  --accent: #8c5a1e; --accent-dim: rgba(140,90,30,0.15); --accent-border: rgba(140,90,30,0.30);
  --ru-text: rgba(40,35,25,0.92); --cn-text: rgba(80,65,40,0.60);
  --border: rgba(0,0,0,0.08); --para-hover: rgba(0,0,0,0.03);
  --para-expanded-border: rgba(140,90,30,0.3);
  --shadow: 0 4px 16px rgba(0,0,0,0.06);
  --highlight-word: rgba(200,160,60,0.25); --highlight-search: rgba(60,140,200,0.20);
  --success: #0d6b4c;
}
body.theme-paper {
  --bg: #f5f0e8; --surface: rgba(245,240,232,0.8); --surface-solid: #efe8dc;
  --glass: rgba(0,0,0,0.03); --glass-border: rgba(0,0,0,0.08);
  --glass-hover: rgba(0,0,0,0.06);
  --text: rgba(30,25,18,0.90); --text-secondary: rgba(80,60,40,0.55);
  --text-dim: rgba(80,60,40,0.35);
  --accent: #7c5e3c; --accent-dim: rgba(124,94,60,0.12); --accent-border: rgba(124,94,60,0.25);
  --ru-text: rgba(30,25,18,0.90); --cn-text: rgba(80,60,40,0.55);
  --border: rgba(0,0,0,0.06); --para-hover: rgba(0,0,0,0.03);
  --para-expanded-border: rgba(124,94,60,0.3);
  --shadow: 0 4px 16px rgba(0,0,0,0.08);
  --highlight-word: rgba(200,160,60,0.20); --highlight-search: rgba(60,140,200,0.20);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Noto Sans SC', sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.8; min-height: 100vh;
  overflow-x: hidden; -webkit-font-smoothing: antialiased; transition: background 0.3s, color 0.3s;
  text-rendering: optimizeLegibility;
}
/* 全局俄语文字使用衬线字体，覆盖所有编辑器生成的动态内容 */
.expr-ru, .ru-expression-tag .ru-word, .ru-word, .ws-replica, .dp-coll-ru, .dp-ex-ru,
.ru-expression-tag, .expression-zh ~ .expr-ru {
  font-family: 'Noto Serif', 'PT Serif', Georgia, 'Segoe UI', serif;
  font-variant-ligatures: common-ligatures;
  font-variant-position: normal;
}
.ru-word[data-stress-source="auto"] { text-decoration: underline dotted color-mix(in srgb, var(--accent) 55%, transparent); text-underline-offset: 0.16em; }
.ru-word[data-stress-source="source"] { text-decoration: underline dotted color-mix(in srgb, var(--success) 55%, transparent); text-underline-offset: 0.16em; }
.ru-word[data-stress-index] { position: relative; }
.ru-word[data-stress-index]::after {
  content: "\00B4"; position: absolute; left: var(--stress-left, 50%); top: -0.28em;
  color: currentColor; font-family: Arial, sans-serif; font-size: 0.62em; font-weight: 700;
  line-height: 1; pointer-events: none; transform: translateX(-24%); text-decoration: none;
}
/* ─── 自定义滚动条 ─── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--text-dim); border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
.bg-orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(80px); opacity: 0.12; }
.bg-orb-1 { width: 400px; height: 400px; background: #4F46E5; top: -100px; left: -100px; }
.bg-orb-2 { width: 300px; height: 300px; background: #7C3AED; bottom: -80px; right: -80px; }

/* ─── 顶部进度条 ─── */
.progress-top { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 200; transition: width 0.15s; width: 0; border-radius: 0 2px 2px 0; }

/* ─── 工具栏 ─── */
.toolbar {
  position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between;
  background: rgba(10,10,20,0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border); padding: 0 12px; min-height: 48px;
}
.toolbar-left, .toolbar-right { display: flex; gap: 4px; align-items: center; }
.toolbar-center { display: flex; align-items: center; gap: 8px; }
.toolbar-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.toolbar-timer { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; margin-right: 4px; }
.tb-btn {
  background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-secondary);
  font-size: 16px; padding: 6px 10px; cursor: pointer; border-radius: 8px;
  min-width: 36px; min-height: 36px; transition: all 0.15s; display: flex; align-items: center; justify-content: center;
}
.tb-btn:hover { background: var(--glass-hover); color: var(--text); }
.tb-btn:active { transform: scale(0.95); }
.mode-tabs { display: flex; border: 1px solid var(--glass-border); border-radius: 8px; overflow: hidden; }
.mode-btn {
  background: 0; border: 0; color: var(--text-dim); font-size: 12px; padding: 5px 10px; cursor: pointer;
  border-right: 1px solid var(--glass-border); transition: all 0.15s; font-family: inherit;
}
.mode-btn:last-child { border-right: 0; }
.mode-btn:hover { color: var(--text-secondary); }
.mode-btn.active { background: var(--accent-dim); color: var(--accent); }

/* ─── 搜索栏 ─── */
.search-bar {
  display: none; position: sticky; top: 48px; z-index: 90;
  background: var(--surface-solid); border-bottom: 1px solid var(--border);
  padding: 6px 12px; gap: 8px; align-items: center;
}
.search-bar.visible { display: flex; }
.search-input {
  flex: 1; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 6px;
  padding: 6px 10px; color: var(--text); font-size: 14px; outline: none; font-family: inherit;
}
.search-input:focus { border-color: var(--accent-border); }
.search-count { font-size: 12px; color: var(--text-dim); white-space: nowrap; min-width: 60px; text-align: center; }
.search-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px; padding: 4px; }
.search-nav { display: flex; gap: 2px; }
.search-nav button { background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-secondary); cursor: pointer; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
.search-nav button:hover { background: var(--glass-hover); }

/* ─── 阅读统计条 ─── */
.peek-counter {
  text-align: center; font-size: 13px; color: var(--text-dim); padding: 6px;
}
.search-bar.visible + .peek-counter { top: 96px; }

/* ─── 主容器 ─── */
.main-container { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 20px 16px 100px; }

/* ─── 分屏布局容器 ─── */
.reader-layout {
  position: relative; z-index: 1;
  display: flex; flex-direction: row;
  width: 100%; max-width: none;
  padding: 0 0 60px;
}
/* 阅读区：flex-basis 百分比由 JS 动态控制 */
.reader-pane {
  flex: 0 0 70%;   /* 默认 70%，JS 可覆盖 */
  min-width: 25%;   /* 最小 25% */
  max-width: 85%;   /* 最大 85% */
  padding-left: 16px; padding-right: 8px;
}
/* 阅读区内的内容去除主容器最大宽度限制 */
.reader-pane .chapter-content { max-width: none; }
/* 分割线 */
.resize-handle {
  width: 8px; flex-shrink: 0; cursor: col-resize;
  background: transparent; border-radius: 4px;
  transition: background 0.2s;
  touch-action: none;         /* 禁止浏览器默认手势 */
  align-self: stretch;
  user-select: none;          /* 防止拖拽时选中文字 */
  -webkit-user-select: none;
}
.resize-handle:hover { background: var(--accent); opacity: 0.5; }
.resize-handle.active { background: var(--accent); opacity: 1; box-shadow: 0 0 12px var(--accent-dim); }
/* 详情面板 */
.detail-panel {
  flex: 1;                    /* 自动填满剩余空间 */
  min-width: 0;               /* 允许收缩 */
  position: sticky; top: 0; align-self: flex-start;
  max-height: 100vh; overflow-y: auto;
  background: var(--surface-solid); border-left: 1px solid var(--border);
  /* 注意：无 transition！拖拽需要即时响应 */
}
.detail-panel-inner { padding: 20px; }
.dictionary-drawer-handle {
  display: none; border: 0; padding: 0; cursor: ns-resize;
  background: var(--text-dim);
}
.dictionary-global-panel {
  position: fixed; top: 48px; right: 0; bottom: 0; z-index: 210;
  width: min(420px, 38vw); max-height: none; padding-top: 8px;
  background: var(--surface-solid); border-left: 1px solid var(--border);
  box-shadow: -14px 0 42px rgba(0,0,0,0.2);
}
.dictionary-global-panel[data-dictionary-state="closed"] { display: none; }
.dictionary-phrase-lookup {
  position: fixed; z-index: 240; transform: translateX(-50%);
  border: 0; border-radius: 999px; padding: 8px 14px;
  color: white; background: var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,0.24);
  font: 600 13px/1.2 var(--ui-font); cursor: pointer;
}
.dictionary-phrase-lookup[hidden] { display: none; }
/* ─── 阅读理解：阅读 / 练习布局 ─── */
.rs-reader-mode-switch {
  display: inline-flex; align-items: center; gap: 4px; margin: 14px 0 0;
  padding: 4px; border: 1px solid var(--glass-border); border-radius: 10px; background: var(--glass);
}
.rs-reader-mode-switch button {
  min-height: 34px; padding: 0 11px; border: 0; border-radius: 7px; color: var(--text-secondary);
  background: transparent; cursor: pointer; font: inherit; font-size: 13px; transition: background .16s, color .16s;
}
.rs-reader-mode-switch button:hover { color: var(--text); background: var(--glass-hover); }
.rs-reader-mode-switch button[aria-pressed="true"] { color: #fff; background: var(--accent); box-shadow: 0 5px 14px rgba(0,0,0,.2); }
.rs-practice-panel { display: none; }
.reader-layout.rs-reading-mode .reader-pane { flex: 1 1 100%; width: 100%; min-width: 0; max-width: none; }
.reader-layout.rs-reading-mode .resize-handle { display: none; }
.reader-layout.rs-reading-mode #detailPanel[data-dictionary-state="closed"] { display: none; }
.reader-layout.rs-practice-mode { flex-direction: column; }
.reader-layout.rs-practice-mode .reader-pane { flex: 1 1 auto; width: 100%; min-width: 0; max-width: none; padding-right: 8px; }
.reader-layout.rs-practice-mode .resize-handle { display: none; }
.reader-layout.rs-practice-mode .rs-practice-panel {
  display: block; order: 2; flex: 0 0 auto; width: 100%; min-width: 0; max-height: none; overflow: visible;
  position: static; padding: 20px 16px 90px;
  border-top: 1px solid var(--border); border-left: 0; background: var(--surface-solid);
}
.rs-practice-panel-header { margin: 0 0 14px; }
.rs-practice-panel-kicker { margin: 0 0 4px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
.rs-practice-panel-header h2 { margin: 0; color: var(--text); font-size: 17px; }
.rs-practice-panel-header p { margin: 6px 0 0; color: var(--text-secondary); font-size: 12px; line-height: 1.55; }
.rs-practice-progress { margin: 13px 0 16px; padding: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--glass); }
.rs-practice-progress-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--text-secondary); font-size: 12px; }
.rs-practice-progress-line strong { color: var(--text); font-variant-numeric: tabular-nums; }
.rs-practice-progress-track { height: 5px; margin-top: 8px; overflow: hidden; border-radius: 999px; background: var(--border); }
.rs-practice-progress-fill { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--accent); transition: width .2s ease; }
.rs-practice-panel .b2-quiz-item { margin: 0 0 12px; padding: 13px; border-radius: 12px; }
.rs-practice-panel .b2-quiz-item h3 { font-size: 14px; line-height: 1.55; }
.rs-practice-panel .b2-option-row { padding: 8px 7px; font-size: 13px; }
.rs-practice-panel .b2-option-zh { margin-left: 25px; }
.reader-layout.rs-practice-mode #detailPanel {
  position: fixed; z-index: 260; top: var(--rs-dict-top, 88px); right: auto; bottom: auto;
  left: var(--rs-dict-left, 24px); width: min(360px, calc(100vw - 32px)); min-width: 0;
  max-height: min(480px, calc(100dvh - 104px)); overflow-y: auto; border: 1px solid var(--accent-border);
  border-radius: 14px; background: var(--surface-solid); box-shadow: 0 18px 46px rgba(0,0,0,.38);
}
.reader-layout.rs-practice-mode #detailPanel[data-dictionary-state="closed"] { display: none; }
.reader-layout.rs-practice-mode #detailPanel .detail-panel-inner { padding: 16px; }
.reader-layout.rs-practice-mode #detailPanel .dp-head { margin-bottom: 10px; }
.reader-layout.rs-practice-mode #detailPanel .dp-section { margin-bottom: 12px; }
.reader-layout.rs-practice-mode #detailPanel .dp-ai-section { margin-top: 14px; padding-top: 10px; }
@media (max-width: 1366px) and (orientation: portrait) {
  .reader-layout.rs-practice-mode { display: flex; flex-direction: column; }
  .reader-layout.rs-practice-mode .reader-pane { flex: 1 1 auto; width: 100%; padding-right: 0; }
  .reader-layout.rs-practice-mode .rs-practice-panel {
    order: 2; width: 100%; min-width: 0; max-height: none; position: static;
    padding: 20px 16px 90px; border-top: 1px solid var(--border); border-left: 0;
  }
  .reader-layout.rs-practice-mode #detailPanel {
    top: auto; right: 0; bottom: 0; left: 0; width: 100%; max-width: none; max-height: 88dvh;
    border: 0; border-top: 1px solid var(--accent-border); border-radius: 20px 20px 0 0;
  }
}
@media (max-width: 600px) {
  .rs-reader-mode-switch { margin-top: 10px; }
  .rs-reader-mode-switch button { min-height: 36px; padding: 0 10px; }
  .reader-layout.rs-practice-mode .rs-practice-panel { padding-left: 12px; padding-right: 12px; }
}
@media (max-width: 760px) {
  .rs-reader-mode-switch { display: none; }
}
/* 面板占位提示 */
.detail-placeholder {
  display: flex; align-items: center; justify-content: center;
  min-height: 200px; color: var(--text-dim); font-size: 14px;
  text-align: center; line-height: 1.8; padding: 20px;
}
/* ─── 叠加遮罩（竖屏）─── 已移除 .detail-overlay ─── */

/* ─── 面板卡片内容 ─── */
.dp-head { margin-bottom: 16px; }
.dict-morph-compact { margin: 10px 0 14px; padding: 10px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.dict-morph-compact strong, .dict-morph-compact span { display: block; overflow-wrap: anywhere; }
.dict-morph-compact span { margin-top: 4px; color: var(--text-secondary); font-size: 13px; }
.dp-word { font-size: 1.4em; font-weight: 700; color: var(--accent); margin-bottom: 4px; font-family: 'Segoe UI', system-ui, 'Noto Serif', serif; }
.dp-pos { font-size: 13px; color: var(--text-dim); }
.dp-section { margin-bottom: 16px; }
.dp-meaning { font-size: 1.1em; color: var(--text); line-height: 1.6; }
.dp-label { font-size: 12px; color: var(--text-dim); margin-right: 6px; }
.dp-tag { font-size: 12px; background: var(--accent-dim); color: var(--accent); padding: 1px 8px; border-radius: 4px; }
.dp-pair { font-size: 13px; color: var(--text-secondary); margin-left: 8px; }
.dp-meta { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
.dp-section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }

/* 搭配 */
.dp-coll { margin-bottom: 8px; padding: 6px 10px; background: rgba(255,255,255,0.04); border-radius: 6px; }
.dp-coll-phrase { font-size: 14px; color: var(--accent); font-weight: 500; }
.dp-coll-ru { font-size: 13px; color: var(--ru-text); margin-top: 2px; }
.dp-coll-zh { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

/* 折叠 */
.dp-collapse-toggle { font-size: 13px; color: var(--text-secondary); cursor: pointer; padding: 4px 0; user-select: none; }
.dp-collapse-toggle:hover { color: var(--accent); }
.dp-collapse-toggle.expanded::after { content: ' ▾'; }
.dp-collapse-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
.dp-collapse-body.open { max-height: 600px; overflow-y: auto; }
.dp-detail { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-top: 6px; }

/* 例句 */
.dp-example { margin-bottom: 8px; padding: 6px 10px; background: rgba(255,255,255,0.03); border-radius: 6px; }
.dp-ex-ru { font-size: 13px; color: var(--ru-text); line-height: 1.6; }
.dp-ex-zh { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

/* 备选原形 */
.dp-alt-label { font-size: 12px; color: var(--text-dim); }
.dp-alt-word { font-size: 12px; color: var(--text-secondary); margin-left: 4px; }

/* 🤖 AI */
.dp-ai-section { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--border); }
.dp-ai-btn { width: 100%; padding: 10px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-secondary); cursor: pointer; font-size: 14px; font-family: inherit; transition: all 0.2s; }
.dp-ai-btn:hover { background: var(--glass-hover); color: var(--accent); }
.dp-ai-btn.loading { opacity: 0.6; pointer-events: none; }
.dp-ai-result { margin-top: 12px; font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
.dp-ai-result:empty { display: none; }

/* 来源 */
.dp-source { margin-top: 12px; font-size: 11px; color: var(--text-dim); }

/* ─── 书架 ─── */
.bookshelf { display: grid; gap: 16px; padding: 24px 0; }
.book-card {
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px;
  padding: 20px; cursor: pointer; transition: all 0.2s;
}
.book-card:hover { background: var(--glass-hover); transform: translateY(-2px); box-shadow: var(--shadow); }
.book-card:active { transform: scale(0.98); }
.book-card h3 { font-size: 1.1em; margin-bottom: 6px; }
.book-card .book-meta { font-size: 13px; color: var(--text-secondary); display: flex; gap: 12px; }
.book-card .book-desc { font-size: 13px; color: var(--text-dim); margin-top: 8px; }
.book-card .book-progress { margin-top: 12px; }
.b2-dashboard { max-width: 1080px; }
.b2-dashboard-hero { padding: 26px; margin-bottom: 20px; border: 1px solid var(--accent-border); border-radius: 18px; background: linear-gradient(135deg, var(--accent-dim), var(--surface)); }
.b2-dashboard-hero h1 { margin-bottom: 6px; }
.b2-continue-card { display: grid; grid-template-columns: 1fr auto; gap: 6px 18px; align-items: center; margin-bottom: 20px; padding: 20px; border: 1px solid var(--accent-border); border-radius: 16px; background: var(--surface-solid); }
.b2-continue-card p, .b2-continue-card h2, .b2-continue-card small { grid-column: 1; }
.b2-continue-card p { color: var(--accent); font-size: 13px; font-weight: 600; }

}

.ws-risks li::before { content: '⚠'; position: absolute; left: 0; }
.ws-ai-warning {
  margin: 24px 0 16px; padding: 12px 16px; border-radius: 8px;
  background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.20);

.source-warning {

}

/* 可复用表达 */
.ru-expression-tag {
  display: inline-block; margin-right: 8px; padding: 2px 10px;
  border-radius: 6px; background: var(--accent-dim);
  transition: background 0.2s, transform 0.2s;
}
.ru-expression-tag:hover { background: var(--glass-hover); transform: translateY(-1px); }
.ru-expression-tag .ru-word { font-weight: 600; }
.expression-zh { color: var(--text-dim); font-size: 0.95em; }
.speaking-steps { margin: 0; padding-left: 22px; }
.speaking-steps li { margin: 12px 0; }
.speaking-transcript { width: 100%; min-height: 160px; padding: 14px; border: 1px solid var(--glass-border); border-radius: 10px; background: var(--surface-solid); color: var(--text); font: 16px/1.7 'Crimson Pro', 'Noto Serif', serif; resize: vertical; }
.speaking-recording-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }

.speaking-playback { width: 100%; margin-top: 12px; }
.b2-context-group { margin: 28px 0 16px; padding: 18px; border: 1px solid var(--accent-border); border-radius: 12px; background: var(--accent-dim); }

.b2-context-source { display: block; margin-top: 7px; color: var(--text-dim); font-size: 12px; }
.b2-options { display: grid; gap: 10px; margin: 16px 0; border: 0; padding: 0; }
.b2-options input { position: absolute; opacity: 0; }
.b2-options label, .b2-confirm, .b2-explanation-toggle, .b2-finish { min-height: 44px; display: flex; align-items: center; border-radius: 9px; }
.b2-options label { padding: 10px 14px; border: 1px solid var(--border); cursor: pointer; }
.b2-options input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }

.b2-option-row {
  display: flex; align-items: center; gap: 0; min-height: 44px; border-radius: 10px;
  padding: 0 14px 0 0; border: 1px solid var(--border); background: var(--glass);
  transition: opacity 0.2s, border-color 0.2s, background 0.2s;
}
.b2-option-row { cursor: pointer; }
.b2-option-row:hover:not(.correct):not(.wrong) {
  background: var(--glass-hover); border-color: var(--text-dim);
}

.b2-option-radio {
  flex: 0 0 44px; min-height: 44px;

.b2-option-text { flex: 1; padding: 10px 0; }

.b2-option-row.wrong { border-color: #ef4444; background: rgba(239, 68, 68, 0.06); }

.b2-option-row.pending { animation: pulse-select 0.6s ease; }
@keyframes pulse-select { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
/* ─── 阅读题卡片 ─── */

.zlatoust-virtual-row .b2-quiz-item { scroll-margin-top: 72px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
@media (max-width: 767px) { .b2-quiz-item { padding: 16px; } .b2-options label { font-size: 16px; } }
.progress-bar { height: 4px; background: var(--glass); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
.progress-text { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.shelf-toolbar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.sort-select {
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: 6px;
  color: var(--text-secondary); font-size: 12px; padding: 4px 8px; cursor: pointer; font-family: inherit;
}

/* ─── 章节目录 ─── */
.chapter-list-header { padding: 16px 0; }
.chapter-list-header h2 { font-size: 1.3em; margin-bottom: 4px; }
.chapter-list-header .ch-meta { font-size: 13px; color: var(--text-secondary); }
.chapter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; padding: 8px 0; }
.ch-item {
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: 10px;
  padding: 10px 8px; text-align: center; cursor: pointer; transition: all 0.15s; font-size: 13px;
}
.ch-item:hover { background: var(--glass-hover); color: var(--accent); }
.ch-item:active { transform: scale(0.95); }
.ch-item.done { border-color: var(--accent-border); }
.ch-item.done .ch-num { color: var(--success); }
.ch-num { font-weight: 600; display: block; margin-bottom: 2px; }
.ch-title { font-size: 11px; color: var(--text-dim); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.world-chapter-directory { max-width: 1240px; }
.world-chapter-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
.world-chapter-item { min-height: 66px; padding: 9px 12px; display: flex; align-items: center; gap: 10px; text-align: left; }
.world-chapter-item .ch-num { min-width: 28px; margin: 0; font-variant-numeric: tabular-nums; }
.world-chapter-item .ch-title { font-size: 12px; line-height: 1.4; color: var(--text-secondary); white-space: normal; display: -webkit-box; overflow: hidden; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.world-chapter-loading { color: var(--text-dim); font-size: 12px; margin: 4px 0 10px; }
.world-chapter-directory .chapter-list-header { padding: 22px 0 18px; }
.world-chapter-directory .chapter-list-header h2 { color: var(--text); font-size: clamp(26px, 2.2vw, 34px); line-height: 1.25; }
.listening-directory { display: grid; gap: 14px; padding: 8px 0 30px; }
.listening-mock-entry { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 15px 16px; border: 1px solid var(--accent-border); border-radius: 14px; background: var(--surface-solid); box-shadow: 0 4px 12px rgba(120, 90, 40, 0.05); }
.listening-mock-entry strong { display: block; color: var(--text); font: 650 17px/1.4 'Noto Serif', 'PT Serif', Georgia, serif; }
.listening-mock-entry span { display: block; margin-top: 4px; color: var(--text-secondary); font-size: 13px; line-height: 1.4; }
.listening-mock-entry button { flex: 0 0 auto; min-height: 36px; padding: 0 14px; border: 1px solid var(--accent-border); border-radius: 8px; background: var(--glass); color: var(--text); cursor: pointer; font: 600 13px/1 inherit; }
.listening-mock-entry button:hover { background: var(--glass-hover); border-color: var(--accent); }
.listening-mock-entry button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.listening-section { border: 1px solid var(--accent-border); border-radius: 14px; background: var(--surface-solid); box-shadow: 0 4px 12px rgba(120, 90, 40, 0.05); overflow: clip; }
.listening-section summary { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px 16px; color: var(--text); cursor: pointer; font-weight: 650; list-style: none; }
.listening-section summary::-webkit-details-marker { display: none; }
.listening-section summary::after { content: '∨'; color: var(--accent); font-size: 20px; line-height: 1; }
.listening-section[open] summary::after { content: '∧'; }
.listening-section-label { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.listening-section-count { color: var(--text-secondary); font-size: 12px; font-weight: 500; white-space: nowrap; }
.listening-entry-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 12px; border-top: 1px solid var(--border); }
.listening-entry { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: 10px; min-height: 74px; padding: 12px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 10px; color: var(--text); cursor: pointer; text-align: left; font: inherit; transition: background .18s ease, border-color .18s ease, transform .18s ease; }
.listening-entry:hover { background: var(--glass-hover); border-color: var(--accent-border); transform: translateY(-1px); }
.listening-entry:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.listening-entry-num { align-self: center; color: var(--accent); font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: center; }
.listening-entry-ru { display: block; color: var(--text); font: 600 15px/1.45 'Noto Serif', 'PT Serif', Georgia, serif; }
.listening-entry-zh { display: block; margin-top: 4px; color: var(--text-secondary); font-size: 13px; line-height: 1.4; }
.listening-entry.done .listening-entry-num { color: var(--success); }
body.theme-warm .listening-section { background: #e6ddc9; border-color: rgba(139, 119, 89, .20); box-shadow: none; }
body.theme-warm .listening-mock-entry { background: #e6ddc9; border-color: rgba(139, 119, 89, .20); box-shadow: none; }
body.theme-warm .listening-mock-entry strong { color: #493d32; }
body.theme-warm .listening-mock-entry span { color: #766a5a; }
body.theme-warm .listening-mock-entry button { background: #e9e1d1; border-color: rgba(139, 119, 89, .10); color: #493d32; }
body.theme-warm .listening-mock-entry button:hover { background: #e9e1d1; border-color: rgba(139, 119, 89, .26); }
body.theme-warm .listening-entry { background: #e9e1d1; border-color: rgba(139, 119, 89, .10); }
body.theme-warm .listening-entry:hover { background: #e9e1d1; border-color: rgba(139, 119, 89, .26); }
body.theme-warm .listening-entry-ru, body.theme-warm .listening-section summary { color: #493d32; }
body.theme-warm .listening-entry-zh, body.theme-warm .listening-section-count { color: #766a5a; }
@media (max-width: 760px) { .listening-entry-grid { grid-template-columns: 1fr; } }
@media (max-width: 460px) { .listening-mock-entry { align-items: flex-start; flex-direction: column; } .listening-mock-entry button { width: 100%; } }
@media (max-width: 600px) {
  .world-chapter-grid { grid-template-columns: 1fr; }
  .world-chapter-directory { max-width: 720px; }
}

/* ─── 阅读视图 ─── */
.chapter-content { padding: 20px 0 40px; animation: fadeIn 0.3s ease; }
/* 练习题 */
.exercises-section { margin-top: 40px; border-top: 1px dashed var(--border); padding-top: 20px; }
.exercises-toggle { width: 100%; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 16px; cursor: pointer; text-align: left; transition: background 0.2s; }
.exercises-toggle:hover { background: var(--hover); }
.exercises-list { margin-top: 12px; }
.exercise-item { padding: 16px; margin-bottom: 12px; background: var(--surface); border-radius: 8px; border: 1px solid var(--border); }
.exercise-question { font-size: 15px; line-height: 1.6; margin-bottom: 6px; }
.exercise-num { font-weight: 700; color: var(--accent); margin-right: 4px; }
.exercise-zh-hint { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; padding-left: 20px; }
.exercise-options { margin: 8px 0; padding-left: 20px; }
.exercise-option { font-size: 14px; line-height: 1.8; color: var(--text); }
.exercise-option-zh { font-size: 12px; color: var(--text-secondary); padding-left: 16px; margin-bottom: 4px; }
.answer-toggle { padding: 6px 14px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; margin-top: 8px; transition: opacity 0.2s, transform 0.1s; }
.answer-toggle:hover { opacity: 0.85; }
.answer-toggle:active { transform: scale(0.97); }
.answer-block { margin-top: 10px; padding: 12px; background: rgba(76,175,80,0.08); border-radius: 6px; border-left: 3px solid #4caf50; }
.answer-label { font-size: 14px; margin-bottom: 6px; }
.answer-explanation { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
.answer-section-title { font-size: 14px; font-weight: 700; color: var(--accent); margin: 12px 0 6px; padding-top: 8px; border-top: 1px dashed var(--border); }
.answer-section-title:first-child { margin-top: 0; border-top: none; padding-top: 0; }
.answer-para { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 6px; }
.answer-source-row { line-height: 1.7; }
.rs-source-locate {
  display: inline-flex; align-items: center; width: auto; margin: 0 5px 0 0;
  padding: 2px 6px; border: 1px solid rgba(180,83,9,0.48); border-radius: 5px;
  background: transparent; color: inherit; cursor: pointer; vertical-align: baseline;
  font: inherit; font-weight: 700; transition: background 0.16s, border-color 0.16s, transform 0.16s;
}
.rs-source-locate:hover { background: rgba(245,158,11,0.10); border-color: rgba(180,83,9,0.72); }
.rs-source-locate:active { transform: translateY(1px); }
[data-theme="dark"] .rs-source-locate { color: #fbbf24; }
.para-block.rs-source-paragraph-highlight { border-color: rgba(245,158,11,0.52); box-shadow: 0 0 0 2px rgba(245,158,11,0.12); }
.ru-word.rs-source-word-highlight,
.ru-word.rs-source-word-highlight:hover,
.ru-word.rs-source-word-highlight:active {
  background: #fde68a !important; color: #422006 !important;
  box-shadow: 0 1px 0 rgba(180,83,9,0.32); border-radius: 3px;
}
@keyframes rsSourceFlash { 0%, 100% { filter: none; } 45% { filter: brightness(1.08); } }
.ru-word.rs-source-word-highlight { animation: rsSourceFlash 0.7s ease 1; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.chapter-header { text-align: center; margin-bottom: 2em; }
.chapter-header h1 { font-size: 1.5em; font-weight: 700; margin-bottom: 4px; }
.chapter-header h2 { font-size: 1.1em; color: var(--text-secondary); font-weight: 400; }
.para-block {
  margin-bottom: 0.6em; border-radius: 8px; cursor: pointer; padding: 6px 10px;
  border-left: 3px solid transparent; transition: all 0.2s; position: relative;
}
.para-block:hover { background: var(--para-hover); }
.para-block.expanded { border-left-color: var(--para-expanded-border); }
.para-block:hover .para-actions { opacity: 1; }
.ru-text { color: var(--ru-text); font-size: 1.05em; line-height: 1.9; font-family: Georgia, 'Noto Serif', 'Segoe UI', serif; text-rendering: optimizeLegibility; font-feature-settings: "kern" 1, "liga" 1; text-indent: 2em; }
.cn-text { text-indent: 2em; }
.para-block:not(.expanded) .ru-text::after { content: " ▸"; font-size: .6em; color: var(--text-dim); }
.cn-text {
  color: var(--cn-text); margin: 0; padding: 0; max-height: 0; overflow: hidden; opacity: 0;
  transition: max-height 0.35s ease, opacity 0.25s ease, padding 0.25s; font-size: 0.95em;
}
.cn-text.visible { max-height: none; opacity: 1; padding: 4px 0 4px 0.8em; border-left: 2px solid var(--border); }
.para-actions {
  position: absolute; right: 4px; top: 4px; opacity: 0; transition: opacity 0.15s;
  display: flex; gap: 2px;
}
.para-actions button {
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: 4px;
  color: var(--text-dim); font-size: 12px; padding: 2px 6px; cursor: pointer;
}
.para-actions button:hover { color: var(--accent); background: var(--accent-dim); }
.para-actions button.bookmarked { color: var(--warning); }
.highlight-word { background: var(--highlight-word); border-radius: 2px; padding: 0 1px; }
.highlight-search { background: var(--highlight-search); border-radius: 2px; padding: 0 1px; outline: 1px solid rgba(56,189,248,0.4); }
.highlight-search.current { outline: 2px solid rgba(56,189,248,0.8); }

/* ─── 可点击单词 ─── */
.ru-word { cursor: pointer; border-radius: 2px; transition: background 0.1s; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; letter-spacing: normal; word-spacing: normal; white-space: nowrap; }
.ru-word:hover { background: var(--highlight-word); }
.ru-word:active { background: var(--accent-dim); }

/* ─── 右上悬浮功能按钮 ─── */
.fab-group-top {
  position: fixed; top: 12px; right: 12px; z-index: 150;
  display: flex; gap: 8px;
}
.fab-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(255,255,255,0.3);
  border: 1px solid rgba(255,255,255,0.4);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  color: rgba(40,35,25,0.85); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, box-shadow 0.2s;
}
.fab-btn:hover {
  background: rgba(255,255,255,0.5);
  box-shadow: 0 4px 16px rgba(0,0,0,0.10);
}
.fab-btn:active { transform: scale(0.92); }
.fab-btn:focus-visible, .fab-nav:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* ─── 双页学习导航 ─── */
.reader-page-switcher {
  position: fixed; top: 12px; left: 12px; z-index: 150;
  display: inline-flex; align-items: center; padding: 3px;
  background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.4);
  border-radius: 10px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.reader-page-switcher button {
  min-height: 32px; border: 0; border-radius: 7px; padding: 0 10px;
  background: transparent; color: var(--text-secondary); cursor: pointer;
  font: inherit; font-size: 13px; white-space: nowrap;
}
.reader-page-switcher button:hover { background: rgba(255,255,255,0.22); color: var(--text); }
.reader-page-switcher button.is-active { background: var(--surface-solid); color: var(--accent); font-weight: 700; }
.reader-page-switcher button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ─── 右下悬浮章节导航 ─── */
.fab-group-bottom {
  position: fixed; bottom: 16px; right: 12px; z-index: 150;
  display: flex; align-items: center; gap: 8px;
}
.fab-nav {
  height: 36px; padding: 0 14px; border-radius: 18px;
  background: rgba(255,255,255,0.3);
  border: 1px solid rgba(255,255,255,0.4);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  color: rgba(40,35,25,0.85); font-size: 13px; cursor: pointer;
  display: flex; align-items: center; gap: 4px;
  transition: background 0.2s, box-shadow 0.2s; font-family: inherit;
}
.fab-nav:hover {
  background: rgba(255,255,255,0.5);
  box-shadow: 0 4px 16px rgba(0,0,0,0.10);
}
.fab-nav:active { transform: scale(0.95); }
.fab-nav.disabled { color: rgba(40,35,25,0.3); opacity: 0.5; pointer-events: none; }
.fab-chapter {
  font-size: 12px; color: rgba(40,35,25,0.65); padding: 0 4px;
}

/* ─── 面板关闭按钮 ─── */
.detail-close {
  position: sticky; top: 0; right: 0; z-index: 10;
  float: right;
  width: 28px; height: 28px; line-height: 28px; text-align: center;
  border-radius: 50%; cursor: pointer;
  color: var(--text-dim); font-size: 14px;
  background: var(--glass); border: 1px solid var(--glass-border);
  transition: all 0.15s;
}
.detail-close:hover { color: var(--text); background: var(--glass-hover); }

/* ─── 选词弹窗 ─── */
.selection-popup {
  position: fixed; z-index: 200; background: var(--surface-solid); border: 1px solid var(--glass-border);
  border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); overflow: hidden;
  display: none; flex-direction: column; min-width: 180px;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.selection-popup.visible { display: flex; }
.selection-popup .popup-header { padding: 8px 14px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--border); font-weight: 500; }
.selection-popup button .icon { font-size: 16px; width: 20px; text-align: center; }
.dict-preview { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-secondary); max-height: 120px; overflow-y: auto; line-height: 1.6; }
.dict-preview .dict-word { font-weight: 600; color: var(--accent); font-size: 14px; }
.dict-preview .dict-pos { font-style: italic; color: var(--text-dim); font-size: 12px; }
.dict-preview .dict-meaning { margin-top: 4px; }
.dict-loading { padding: 8px 14px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
/* ─── 备选原形 ─── */
.dict-alternatives {
  margin-top: 8px; padding: 6px 10px;
  background: rgba(255,255,255,0.04); border-radius: 6px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font-size: 12px; color: var(--text-dim); line-height: 1.6;
}
.dict-alt-label { color: var(--text-dim); }
.dict-alt-word { color: var(--text-secondary); }
.dict-guess-label {
  margin-top: 4px; font-size: 11px; color: var(--text-dim);
  font-style: italic;
}
.dict-context {
  margin-top: 8px; padding: 6px 8px;
  background: rgba(255,255,255,0.03); border-radius: 4px;
  font-size: 12px; color: var(--text-secondary); line-height: 1.6;
}
.popup-actions { display: flex; gap: 8px; align-items: center; padding: 8px 10px; }
.btn-save-vocab {
  flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
  background: linear-gradient(135deg, rgba(251,191,36,0.3), rgba(251,191,36,0.1));
  color: #fbbf24; font-size: 14px; cursor: pointer; transition: all 0.2s;
  font-family: inherit; display: flex; align-items: center; gap: 6px; justify-content: center;
}
.btn-save-vocab:hover { background: rgba(251,191,36,0.4); }
.btn-save-vocab.saved { background: rgba(34,197,94,0.3); color: #22c55e; border-color: rgba(34,197,94,0.3); }
.btn-icon {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06); color: var(--text-dim); font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  font-family: inherit;
}
.btn-icon:hover { background: rgba(255,255,255,0.12); }

/* ─── Toast ─── */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: var(--surface-solid); color: var(--text); padding: 10px 24px; border-radius: 24px;
  font-size: 14px; z-index: 400; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  border: 1px solid var(--glass-border); box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.toast.visible { opacity: 1; }

/* ─── 回到顶部 ─── */
.back-top {
  position: fixed; bottom: 70px; right: 16px; z-index: 80;
  width: 40px; height: 40px; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-border);
  color: var(--text-secondary); font-size: 18px; cursor: pointer; display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: all 0.2s;
}
.back-top:hover { background: var(--glass-hover); color: var(--text); }
.back-top.visible { display: flex; }

/* ─── 弹窗通用 ─── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300;
  display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px);
}
.modal-overlay.visible { display: flex; }
.modal-content {
  background: var(--surface-solid); border: 1px solid var(--glass-border); border-radius: 20px;
  padding: 28px 24px; max-width: 400px; width: 90%; text-align: center; box-shadow: var(--shadow);
}
.modal-content h3 { font-size: 1.1em; margin-bottom: 12px; }
.modal-content p { color: var(--text-secondary); font-size: 14px; line-height: 1.7; }
.modal-content .stat { color: var(--accent); font-weight: 600; }
.modal-btn {
  background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-border);
  border-radius: 10px; padding: 10px 28px; font-size: 15px; cursor: pointer;
  margin-top: 16px; transition: all 0.15s; font-family: inherit;
}
.modal-btn:hover { background: rgba(129,140,248,0.30); }
.modal-btn:active { transform: scale(0.95); }

/* ─── 读书报告 ─── */
.report-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
.report-item { text-align: center; }
.report-item .val { font-size: 1.8em; font-weight: 700; color: var(--accent); }
.report-item .lbl { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.report-bar { margin: 8px 0; }
.report-bar-label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.report-bar-track { height: 6px; background: var(--glass); border-radius: 3px; overflow: hidden; }
.report-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.5s; }

/* ─── 加载 ─── */

.shelf-hero { padding: 24px 0 8px; }

.shelf-hero p { margin: 7px 0 0; color: var(--text-secondary); }

.shelf-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; }

.shelf-section { margin: 0 0 30px; }
.shelf-section-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 10px; }
.shelf-section-heading h2 { margin: 0; font-size: 18px; }
.shelf-book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.shelf-book-grid .book-card { min-height: 174px; }
.world-shelf-card { grid-column: 1 / -1; cursor: default; }
.world-shelf-card-main { display: flex; justify-content: space-between; gap: 18px; align-items: start; }
.world-shelf-card-main h3 { margin: 0; }
.world-shelf-open { flex: 0 0 auto; padding: 8px 11px; border: 1px solid var(--accent-border); border-radius: 9px; background: var(--accent-dim); color: var(--accent); cursor: pointer; font: inherit; font-weight: 600; }
.world-shelf-modules { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.world-shelf-module { min-width: 0; padding: 11px; border: 1px solid var(--glass-border); border-radius: 10px; background: var(--surface-solid); color: var(--text); cursor: pointer; font: inherit; text-align: left; transition: background .18s ease, border-color .18s ease; }
.world-shelf-module:hover { background: var(--glass-hover); border-color: var(--accent-border); }
.world-shelf-module strong, .world-shelf-module small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.world-shelf-module strong { font-size: 13px; }
.world-shelf-module small { margin-top: 5px; color: var(--text-secondary); font-size: 11px; }
.b2-shelf-modules { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.b2-shelf-module strong { color: var(--text); }
.b2-shelf-module small:last-child { color: var(--accent); font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .world-shelf-modules { grid-template-columns: repeat(2, minmax(0, 1fr)); } .world-shelf-card-main { flex-direction: column; } }
@media (max-width: 440px) { .world-shelf-modules { grid-template-columns: 1fr; } }
.b2-quiz-target { outline: 3px solid var(--accent); outline-offset: 5px; border-radius: 10px; }

/* ─── 移动端 ─── */
@media (max-width: 600px) {
  .main-container { padding: 12px 12px 80px; }
  .mode-btn { font-size: 11px; padding: 4px 8px; }
  .chapter-grid { grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 6px; }
  .ch-item { padding: 8px 6px; font-size: 12px; }
  .toolbar { padding: 0 8px; min-height: 44px; }
  .peek-counter { top: 44px; }
  .search-bar.visible + .peek-counter { top: 88px; }
  .toolbar-timer { display: none; }
  .search-bar { top: 44px; }
  .reader-page-switcher { top: 6px; left: 6px; }
  .reader-page-switcher button { min-height: 32px; padding: 0 8px; font-size: 12px; }
}

@media (max-width: 760px) {
  /* ─── 竖屏分栏：上下布局 ─── */
  .reader-layout {
    flex-direction: column;
    max-width: 100%; padding: 0 0 80px;
  }
  .reader-pane {
    flex: 0 0 55%;        /* 竖屏默认上方 55% */
    min-width: 0; max-width: 100%;
    min-height: 25%; max-height: 85%;
    width: 100%;
    padding-right: 0; padding-left: 12px;
    padding-bottom: 4px;
  }
  .reader-pane { flex: 1 1 auto; min-height: 100%; }
  .resize-handle { display: none; }
  #detailPanel {
    position: fixed; inset: auto 0 0; width: 100%; height: 52dvh;
    min-height: 0; max-height: 92dvh; overflow-y: auto;
    z-index: 220; border-radius: 20px 20px 0 0;
    background: var(--surface-solid); box-shadow: 0 -12px 40px rgba(0,0,0,0.28);
    transform: translateY(105%); transition: transform 180ms ease, height 180ms ease;
  }
  #detailPanel[data-dictionary-state="half"] { transform: translateY(0); height: 52dvh; }
  #detailPanel[data-dictionary-state="full"] { transform: translateY(0); height: 92dvh; }
  #detailPanel[data-dictionary-state="closed"] { transform: translateY(105%); }
  .dictionary-drawer-handle {
    display: block; width: 48px; height: 5px; margin: 10px auto 2px;
    border-radius: 999px; touch-action: none;
  }
  .detail-panel-inner { padding: 8px 20px 24px; }
}
/* ─── 章节完成提示条 ─── */
.complete-prompt {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 150;
  background: var(--accent); color: #fff;
  text-align: center; padding: 14px 20px; font-size: 15px; font-weight: 600;
  cursor: pointer; letter-spacing: 0.02em;
  transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
  box-shadow: 0 -4px 24px rgba(0,0,0,0.25);
}
.complete-prompt.visible { transform: translateY(0); }
.complete-prompt.done {
  background: var(--success); cursor: default; pointer-events: none;
  animation: completeFadeOut 0.4s 2s forwards;
}
@keyframes completeFadeOut { to { opacity: 0; transform: translateY(100%); } }
.fab-mark-done {
  background: var(--accent) !important; color: #fff !important;
  border-color: var(--accent) !important; font-size: 13px !important;
  font-weight: 600 !important; padding: 6px 14px !important;
  min-width: auto !important;
}
.fab-mark-done:disabled { opacity: 0.35; pointer-events: none; }
/* ─── 完成弹窗加强 ─── */
.ch-summary-vocab { margin-top: 10px; font-size: 14px; color: var(--text-secondary); }
.ch-summary-vocab a {
  color: var(--accent); text-decoration: underline; cursor: pointer;
  font-weight: 600;
}
/* ─── 面包屑导航浮窗 ─── */
.breadcrumb-overlay { position: fixed; inset: 0; z-index: 9998; }
.breadcrumb-popup {
  position: fixed; top: 52px; right: 12px; z-index: 9999;
  min-width: 260px; max-width: min(430px, calc(100vw - 24px)); max-height: min(76vh, 720px); overflow-y: auto;
  background: var(--surface-solid); border: 1px solid var(--accent-border);
  border-radius: 14px; padding: 12px 0;
  box-shadow: 0 12px 40px rgba(0,0,0,0.35);
  animation: breadcrumb-in 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes breadcrumb-in { from { opacity: 0; transform: translateY(-8px) scale(0.95); } }
.breadcrumb-section { padding: 0 16px; }
.breadcrumb-item {
  display: block; width: 100%; text-align: left; border: 0; background: none;
  color: var(--text-secondary); font-size: 14px; padding: 8px 16px 8px 20px;
  cursor: pointer; border-radius: 0; font-family: inherit; line-height: 1.6;
  transition: background 0.12s;
}
.breadcrumb-item:hover { background: var(--glass-hover); color: var(--text); }
.breadcrumb-item.current { color: var(--text); font-weight: 700; cursor: default; pointer-events: none; }
.breadcrumb-item.current:hover { background: none; }
.breadcrumb-divider { height: 1px; margin: 6px 16px; background: var(--border); }
.breadcrumb-shortcut { font-weight: 600; color: var(--accent); }
.breadcrumb-shortcut:hover { background: var(--accent-dim); }
.breadcrumb-heading { padding: 2px 16px 8px; color: var(--text-dim); font-size: 11px; font-weight: 700; letter-spacing: .04em; }
.breadcrumb-tree { padding: 0 8px; }
.breadcrumb-tree-row { display: grid; grid-template-columns: 28px minmax(0, 1fr); align-items: center; min-height: 36px; padding-left: calc(var(--tree-level) * 14px); }
.breadcrumb-tree-row.is-current > .breadcrumb-tree-label { color: var(--accent); font-weight: 700; background: var(--accent-dim); }
.breadcrumb-tree-toggle { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 7px; background: transparent; color: var(--text-secondary); cursor: pointer; font: inherit; font-size: 15px; line-height: 1; }
.breadcrumb-tree-toggle:hover { color: var(--accent); background: var(--glass-hover); }
.breadcrumb-tree-toggle:focus-visible, .breadcrumb-tree-label:focus-visible { outline: 3px solid var(--accent); outline-offset: -2px; }
.breadcrumb-tree-label { min-width: 0; padding: 6px 8px; border: 0; border-radius: 7px; background: transparent; color: var(--text); cursor: pointer; font: inherit; font-size: 13px; line-height: 1.4; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.breadcrumb-tree-label:hover { background: var(--glass-hover); }
.breadcrumb-tree-detail { display: block; color: var(--text-secondary); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.breadcrumb-tree-leaf { grid-template-columns: 28px minmax(0, 1fr); }
.breadcrumb-tree-leaf::before { content: '·'; color: var(--text-dim); text-align: center; font-size: 16px; }
@media (min-width: 761px) and (max-width: 1366px) and (orientation: portrait) {
  .reader-layout { display: block; max-width: 100%; padding: 0 0 72px; }
  .reader-pane { width: 100%; min-width: 0; padding: 0 clamp(22px, 5vw, 52px); }
  .resize-handle { display: none; }
  #detailPanel { position: fixed; inset: auto 0 0; z-index: 220; width: 100%; max-width: none; border-left: 0; border-radius: 16px 16px 0 0; transform: translateY(105%); }
  #detailPanel[data-dictionary-state="half"] { height: 46dvh; transform: translateY(0); }
  #detailPanel[data-dictionary-state="full"] { height: 88dvh; transform: translateY(0); }
  .dictionary-drawer-handle { display: block; }
}
@media (min-width: 900px) and (max-width: 1366px) and (orientation: landscape) {
  .reader-layout { display: flex; max-width: 100%; }
  .reader-pane { flex: 0 0 65%; min-width: 0; }
  .detail-panel { flex: 1 1 35%; min-width: 300px; }
  .resize-handle { display: block; }
}
/* ─── Zlatoust grammar reference system ─── */
.zlatoust-theory-nav { margin: 22px 0; padding: 18px; border: 1px solid var(--accent-border); border-radius: 16px; background: linear-gradient(135deg, var(--accent-dim), var(--surface-solid)); }

.zlatoust-section-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }

.zlatoust-section-card { display: flex; min-height: 104px; flex-direction: column; align-items: flex-start; gap: 5px; padding: 13px; text-align: left; color: var(--text); border: 1px solid var(--border); border-radius: 12px; background: var(--surface-solid); }
.zlatoust-section-card:hover, .zlatoust-section-card:focus-visible { border-color: var(--accent); background: var(--glass-hover); }

.zlatoust-decision-step { position: relative; padding: 11px 12px 11px 48px; border-left: 2px solid var(--accent-border); background: var(--glass); line-height: 1.6; counter-increment: zlatoust-step; }
.zlatoust-decision-step::before { content: counter(zlatoust-step); position: absolute; left: 12px; top: 12px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: white; font-size: 13px; font-weight: 700; line-height: 24px; text-align: center; }
.zlatoust-learning-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(235px, 1fr)); gap: 12px; margin-top: 14px; }

.zlatoust-learning-panel h3 { margin: 0 0 8px; font-size: 15px; }

.zlatoust-badge, .zlatoust-source-badge { display: inline-flex; align-items: center; gap: 4px; width: fit-content; border-radius: 999px; padding: 3px 8px; font-size: 11px; font-weight: 700; line-height: 1.25; }

/* ══════════════════════════════════════════════
   IndexedDB 轻量封装
   ══════════════════════════════════════════════ */
var _idbName = 'russian_reader_db';
var _idbStore = 'keyval';

function _idbOpen() {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open(_idbName, 1);
    req.onupgradeneeded = function() { req.result.createObjectStore(_idbStore); };
    req.onsuccess = function() { resolve(req.result); };
    req.onerror = function() { reject(req.error); };
  });
}

function _idbExec(mode, cb) {
  return _idbOpen().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(_idbStore, mode === 'readonly' ? 'readonly' : 'readwrite');
      var store = tx.objectStore(_idbStore);
      var ret = cb(store);
      if (ret && typeof ret.then === 'function') { ret.then(resolve, reject); }
      tx.oncomplete = function() { resolve(ret && ret.then ? undefined : ret); };
      tx.onerror = function() { reject(tx.error); };
    });
  });
}

function idbGet(key) {
  return _idbExec('readonly', function(store) {
    return new Promise(function(resolve) {
      var req = store.get(key);
      req.onsuccess = function() { resolve(req.result); };
      req.onerror = function() { reject(req.error); };
    });
  });
}

function idbSet(key, val) {
  return _idbExec('readwrite', function(store) {
    return new Promise(function(resolve) {
      var req = store.put(val, key);
      req.onsuccess = function() { resolve(); };
      req.onerror = function() { reject(req.error); };
    });
  });
}

/* ─── 形态引擎：IndexedDB 读写 ─── */
var MORPH_IDB_KEY = 'morphology_data';

function readMorphologyFromIDB() {
  return idbGet(MORPH_IDB_KEY).then(function(data) {
    if (!data || !data.map || Object.keys(data.map).length === 0) {
      throw new Error('empty morphology data');
    }
    return data;
  });
}

function writeMorphologyToIDB(data) {
  return idbSet(MORPH_IDB_KEY, data);
}

/* ══════════════════════════════════════════════
   缓存管理 (LRU)
   ══════════════════════════════════════════════ */
function cachePut(bookId, idx, data) {
  if (!chaptersCache[bookId]) chaptersCache[bookId] = {};
  chaptersCache[bookId][idx] = data;
  cacheOrder.push({ bookId: bookId, idx: idx });
  while (cacheOrder.length > CACHE_LIMIT) {
    var old = cacheOrder.shift();
    if (chaptersCache[old.bookId]) {
      delete chaptersCache[old.bookId][old.idx];
      if (!Object.keys(chaptersCache[old.bookId]).length) delete chaptersCache[old.bookId];
    }
  }
}
function cacheGet(bookId, idx) {
  if (chaptersCache[bookId] && chaptersCache[bookId][idx]) {
    for (var i = 0; i < cacheOrder.length; i++) {
      if (cacheOrder[i].bookId === bookId && cacheOrder[i].idx === idx) {
        cacheOrder.splice(i, 1); cacheOrder.push({ bookId: bookId, idx: idx }); break;
      }
    }
    return chaptersCache[bookId][idx];
  }
  return null;
}

/* ══════════════════════════════════════════════

   ══════════════════════════════════════════════ */
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

}

function buildDict(mapData) {
  morphologyDict = Object.create(null);
  Object.assign(morphologyDict, mapData);
  morphologyReady = true;
}

function initMorphology() {
  var versionFetchOk = true;
  var remoteVersion = null;

  fetch('data/morphology-version.json')
    .then(function(r) {
      if (!r.ok) throw new Error('version fetch failed');
      return r.json();
    })
    .then(function(v) { remoteVersion = v.version; })
    .catch(function() { versionFetchOk = false; })
    .then(function() {
      return readMorphologyFromIDB()
        .then(function(localData) {
          if (versionFetchOk && localData.version === remoteVersion) {
            buildDict(localData.map);
            return;
          }
          throw new Error('need update');
        })
        .catch(function() {
          if (!versionFetchOk) {
            return readMorphologyFromIDB().then(function(ld) { buildDict(ld.map); }).catch(function() {});
          }
          if (sessionStorage.getItem('morph_retry') === '1') {
            return readMorphologyFromIDB().then(function(ld) { buildDict(ld.map); }).catch(function() {});
          }
          return fetch('data/morphology-map.json')
            .then(function(r) { return r.json(); })
            .then(function(json) {
              return writeMorphologyToIDB(json).then(function() {
                buildDict(json.map);
              });
            })
            .catch(function() {
              sessionStorage.setItem('morph_retry', '1');
              return readMorphologyFromIDB().then(function(ld) { buildDict(ld.map); }).catch(function() {});
            });
        });
    });
}

function importB2LearningArchive(event) {

    '<div class="main-container' + (isWorldModule ? ' world-chapter-directory' : '') + '"><div class="chapter-list-header">' +
    '<h2>' + escapeHtml(curBook.title) + '</h2>' +
    '<div class="ch-meta">' + curBook.chapters + ' 章 · 已读 ' + done + ' 章' +

/* ─── 一键打包整题+选项+Prompt 复制到剪贴板 ─── */
function copyQuestionAsAiPrompt(exerciseId) {
  var exercise = getQuizExercise(exerciseId);
  if (!exercise) { toast('未找到题目数据'); return; }

  var record = getQuizRecord(exerciseId);

  // 拼接完整句子
  var selectedText = '';
  var selectedKey = '';
  if (record.submitted && record.selected) {
    var selOpt = (exercise.options || []).find(function(o) { return o.key === record.selected; });
    if (selOpt) { selectedText = selOpt.text; selectedKey = record.selected; }
  } else if (!record.submitted && record.selected) {
    selectedKey = record.selected + '（已选，待确认）';
    var pendingOpt = (exercise.options || []).find(function(o) { return o.key === record.selected; });
    if (pendingOpt) selectedText = pendingOpt.text;
  }
  var completedSentence = selectedText
    ? exercise.question.replace(/\.{3,}/, selectedText)
    : exercise.question;

  // 所有选项
  var optionsList = (exercise.options || []).map(function(o) {
    return o.key + '. ' + o.text + (o.key === exercise.answer ? ' ★正确答案' : '');
  }).join('\n');

  // 我选的
  var myChoice = selectedKey || '未选';

  var prompt = [
    '你是一位专业的俄语教授和 TRKI-2 (B2) 考试专家。请为我深度解析以下这道俄语选择题：',
    '',
    '【完整题干】',
    completedSentence,
    '',
    '【所有选项】',
    optionsList,
    '',
    '【我目前的选项】',
    myChoice,
    '',
    '【请从以下几个维度为我详细讲解】',
    '1. 语境与语义分析：这句话翻译成中文是什么意思？整个语境在表达什么？',
    '2. 核心词汇辨析：请重点对比这几个选项（尤其是词体/完成体与未完成体、接格关系、或者前缀的细微区别），解释为什么正确答案是它，而其他选项错在哪里。',
    '3. 语法点与形态学：这道题涉及到了哪些 B2 级别必须掌握的俄语语法规则？（如动词变位、名词格的变化、特定句型等）',
    '4. 拓展造句：请用这道题的核心考点或正确选项的单词，另外提供 2 个实用的俄语例句并附带中文翻译，帮我加深记忆。'
  ];

  if (exercise.sourceExplanation) {
    prompt.push('', '【附：原书解析（供参考）】', exercise.sourceExplanation);
  }

  navigator.clipboard.writeText(prompt.join('\n'))
    .then(function() { toast('✅ 题目已打包到剪贴板，发给 AI 即可'); })
    .catch(function() { toast('❌ 复制失败'); });
}

      zlatoustQuizPage = Math.floor(exerciseIndex / ZLATOUST_QUIZ_PAGE_SIZE);

function getZlatoustVirtualHeight(state, index) {
  return state.heights[index] || ZLATOUST_VIRTUAL_ESTIMATED_HEIGHT;
}
function getZlatoustVirtualOffset(state, index) {
  var offset = 0;
  for (var i = 0; i < index; i++) offset += getZlatoustVirtualHeight(state, i);
  return offset;
}
function findZlatoustVirtualIndex(state, offset) {
  var total = 0;
  for (var i = 0; i < state.exercises.length; i++) {
    var height = getZlatoustVirtualHeight(state, i);
    if (total + height > offset) return i;
    total += height;
  }
  return Math.max(0, state.exercises.length - 1);
}
function getZlatoustVirtualRange(state, scrollTop) {
  var rootTop = state.root.getBoundingClientRect().top + window.scrollY;
  var localTop = Math.max(0, scrollTop - rootTop);
  var firstVisible = findZlatoustVirtualIndex(state, localTop);
  var lastVisible = findZlatoustVirtualIndex(state, localTop + window.innerHeight);
  var start = Math.max(0, firstVisible - ZLATOUST_VIRTUAL_OVERSCAN_BEFORE);
  var end = Math.min(state.exercises.length, lastVisible + ZLATOUST_VIRTUAL_OVERSCAN_AFTER + 1);
  if (end - start < ZLATOUST_VIRTUAL_MINIMUM_ITEMS) {
    end = Math.min(state.exercises.length, start + ZLATOUST_VIRTUAL_MINIMUM_ITEMS);
    start = Math.max(0, end - ZLATOUST_VIRTUAL_MINIMUM_ITEMS);
  }
  return { start: start, end: end };
}
function getZlatoustVirtualAnchor(state) {
  var rootTop = state.root.getBoundingClientRect().top + window.scrollY;
  var localTop = Math.max(0, window.scrollY - rootTop);
  var index = findZlatoustVirtualIndex(state, localTop);
  return { index: index, offset: localTop - getZlatoustVirtualOffset(state, index) };
}
function renderZlatoustVirtualRow(exercise, record, contextGroup) {

function updateZlatoustVirtualSpacers(state) {
  if (!state.topSpacer || !state.bottomSpacer) return;
  state.topSpacer.style.height = getZlatoustVirtualOffset(state, state.start) + 'px';
  var bottom = getZlatoustVirtualOffset(state, state.exercises.length) - getZlatoustVirtualOffset(state, state.end);
  state.bottomSpacer.style.height = Math.max(0, bottom) + 'px';
}

  state.items.querySelectorAll('[data-zlatoust-virtual-id]').forEach(function(row) { state.resizeObserver.observe(row); });

function renderZlatoustVirtualWindow(state, range, preserveAnchor) {
  if (!state.root || state !== zlatoustQuizVirtualState) return;
  var anchor = preserveAnchor ? getZlatoustVirtualAnchor(state) : null;
  state.start = range.start;
  state.end = range.end;
  var records = getB2Progress()[getQuizUnitKey()] || {}, html = '';
  for (var i = state.start; i < state.end; i++) {
    var exercise = state.exercises[i];
    html += renderZlatoustVirtualRow(exercise, records[exercise.id] || createEmptyQuizRecord(), state.contextGroups[exercise.id]);

  state.resizeObserver.disconnect();

function initializeZlatoustVirtualQuiz(exercises, contextGroups, initialExerciseId) {
  var root = document.getElementById('zlatoustVirtualQuiz');
  if (!root) return;
  if (zlatoustQuizVirtualState && zlatoustQuizVirtualState.resizeObserver) zlatoustQuizVirtualState.resizeObserver.disconnect();
  var state = {
    root: root,
    exercises: exercises,
    contextGroups: contextGroups,
    heights: {},
    start: 0,
    end: 0,
    topSpacer: root.querySelector('[data-zlatoust-virtual-spacer="top"]'),
    items: root.querySelector('[data-zlatoust-virtual-items]'),
    bottomSpacer: root.querySelector('[data-zlatoust-virtual-spacer="bottom"]'),

    var changed = false;

  var initialStart = Math.max(0, Math.min(initialIndex - ZLATOUST_VIRTUAL_OVERSCAN_BEFORE, initialEnd - ZLATOUST_VIRTUAL_MINIMUM_ITEMS));

  setTimeout(function() { if (state === zlatoustQuizVirtualState) scheduleZlatoustVirtualWindow(); }, 0);

function restoreSplitRatio() {
  var layout = document.getElementById('readerLayout');
  var pane = document.getElementById('readerPane');
  if (!layout || !pane) return;

  var isH = getComputedStyle(layout).flexDirection === 'row';
  _lastSplitOrientation = isH ? 'h' : 'v';

  // The reading/speaking view has no draggable split. Never let a saved ratio
  // from another reader reserve an invisible column on tablet layouts.
  if (layout.classList.contains('rs-reading-mode') || layout.classList.contains('rs-practice-mode')) {
    pane.style.removeProperty('flex-basis');
    return;
  }

  var key = isH ? 'rr_split_h' : 'rr_split_v';
  var saved = null;
  try { saved = localStorage.getItem(key); } catch(e) {}

  if (saved) {
    pane.style.flexBasis = saved;
  } else {
    // 默认值：横屏 70%，竖屏 55%
    pane.style.flexBasis = isH ? '70%' : '55%';
  }
}

/* ─── 拖拽分界线 ─── */
(function() {
  var layoutEl = null, paneEl = null, handleEl = null;
  var dragging = false, isHorizontal = true;

  function refreshRefs() {
    layoutEl = document.getElementById('readerLayout');
    paneEl = document.getElementById('readerPane');
    handleEl = document.getElementById('resizeHandle');
  }

  function getDirection() {
    if (!layoutEl) return 'row';
    return getComputedStyle(layoutEl).flexDirection;
  }

  document.addEventListener('pointerdown', function(e) {
    refreshRefs();
    if (!e.target.closest('#resizeHandle')) return;
    if (!paneEl) return;
    dragging = true;
    isHorizontal = getDirection() === 'row';
    handleEl.classList.add('active');
    handleEl.setPointerCapture(e.pointerId);
  });

  document.addEventListener('pointermove', function(e) {
    if (!dragging || !paneEl || !layoutEl) return;
    var rect = layoutEl.getBoundingClientRect();
    var percentage;
    if (isHorizontal) {
      percentage = ((e.clientX - rect.left) / rect.width) * 100;
    } else {
      percentage = ((e.clientY - rect.top) / rect.height) * 100;
    }
    percentage = Math.max(25, Math.min(85, percentage));
    paneEl.style.flexBasis = percentage + '%';
  });

  document.addEventListener('pointerup', function(e) {
    if (!dragging) return;
    dragging = false;
    if (handleEl) handleEl.classList.remove('active');
    if (handleEl) handleEl.releasePointerCapture(e.pointerId);
    // 持久化：横屏/竖屏各存一份
    try {
      var key = isHorizontal ? 'rr_split_h' : 'rr_split_v';
      if (paneEl) localStorage.setItem(key, paneEl.style.flexBasis);
    } catch(err) {}
  });
})();

// ─── 屏幕旋转时恢复分栏比例 ───

window.addEventListener('resize', function() {

  var isH = getComputedStyle(layout).flexDirection === 'row';
  var cur = isH ? 'h' : 'v';
  if (cur !== _lastSplitOrientation) {

});

function normalizeLookupWord(word) {
  return String(word || '')
    .normalize('NFD')
    .replace(/[\u0300\u0301]/g, '')
    .normalize('NFC')
    .replace(/ё/g, 'е')
    .replace(/Ё/g, 'е')
    .toLowerCase()
    .replace(/[^а-я-]/g, '');
}

function hasChineseText(text) {
  return /[\u4e00-\u9fff]/.test(String(text || ''));
}

function loadLocalLookupData() {
  try { localLookupCache = JSON.parse(localStorage.getItem('rr_local_lookup_cache') || '{}'); } catch(e) { localLookupCache = {}; }
  return Promise.all([
    fetch('data/vocabulary.json').then(function(r) { return r.ok ? r.json() : []; }),
    fetch('data/external-vocab.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
    fetch('data/dictionary/function-word-forms.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
    fetch('data/dictionary/corpus-morphology.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
    fetch('data/dictionary/freedict-rus-zh.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
    fetch('data/dictionary/markdown-glossary.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
    fetch('data/dictionary/reviewed-function-entries.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
    fetch('data/dictionary/openrussian-en.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
    fetch('data/dictionary/wiktionary-ru.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
    fetch('data/dictionary/salad-vocab.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; })
  ])
    .then(function(results) {
      var words = results[0], extVocab = results[1];
      functionWordForms = results[2] || {};
      corpusMorphology = results[3] || {};
      freeDictLookup = results[4] || {};
      markdownGlossaryLookup = results[5] || {};
      reviewedFunctionLookup = results[6] || {};
      openRussianLookup = results[7] || {};
      wiktionaryRuLookup = results[8] || {};
      saladVocabLookup = results[9] || {};
      localVocabLookup = {};
      // 主词典
      if (!Array.isArray(words)) words = [];
      words.forEach(function(w) {
        if (!w || !w.word || !w.meaning || !hasChineseText(w.meaning)) return;
        var key = normalizeLookupWord(w.word);
        if (!key || localVocabLookup[key]) return;
        localVocabLookup[key] = {
          meaning: w.meaning,
          type: w.type || '',
          source: '本地词库',
          _raw: w  // 保留原始词条用于详情面板渲染
        };
      });
      // 外部补充词库 (Gemini 翻译)
      Object.keys(extVocab).forEach(function(lemma) {
        var e = extVocab[lemma];
        var key = normalizeLookupWord(lemma);
        if (!key) return;
        if (localVocabLookup[key]) return; // 不覆盖主词典
        if (!hasChineseText(e.meaning)) return;
        localVocabLookup[key] = {
          meaning: e.meaning,
          type: e.type || '',
          source: '扩展词库'
        };
      });
      console.log('[Dict] Local:', Object.keys(localVocabLookup).length, 'entries; Salad:', Object.keys(saladVocabLookup).length, '; FreeDict:', Object.keys(freeDictLookup).length);
      localLookupReady = true;
    })
    .catch(function(err) {
      console.warn('本地查词数据加载失败:', err);
      localLookupReady = true;
    });
}
