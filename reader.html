var _lastLookupWord = '';
function autoLookup(word) {
  var clean = normalizeLookupWord(word);
  if (!clean) return;
  _lastLookupWord = clean;
  // 追踪查词（去重）
  if (_sessionLookedUp.indexOf(clean) === -1) _sessionLookedUp.push(clean);

  var preview = document.getElementById('detailInner');
  if (!preview) return;
  preview.innerHTML = '<div class="dict-loading">查询中...</div>';
  if (!localLookupReady) {
    Promise.resolve(localLookupPromise).then(function() { if (_lastLookupWord === clean) autoLookup(word); });
    return;
  }
  var context = dictionaryController.getCurrent() && dictionaryController.getCurrent().context || {};
  var resolved = resolveDictionaryLookup(clean, context, true);
  var result = resolved.entry;
  if (result) {
    result = Object.assign({}, result, {
      _morphoLemma: resolved.lemma !== clean ? resolved.lemma : '',
      _alternatives: resolved.alternatives || [],
      _reliability: resolved.reliability,
      _guessed: resolved.reliability === 'morphology-guess'
    });
  }
  var inner = document.getElementById('detailInner');
  if (inner) inner.innerHTML = result
    ? renderDetailPanel(clean, result)
    : '<button class="detail-close" type="button" onclick="event.stopPropagation();dictionaryController.close()" aria-label="关闭词典">✕</button><div class="dict-word">' + escapeHtml(clean) + '</div><div class="dict-meaning" style="color:var(--text-dim)">本地词典暂未收录</div><div class="dict-source">已加入缺词清单</div><button class="tb-btn" type="button" onclick="onlineDictionaryLookup()">一键联网查询</button>';
  updateSaveButton(clean);
}
function updateSaveButton(word) {
  var records = {};
  try { records = JSON.parse(localStorage.getItem('vocabulary-review-records') || '{}'); } catch(e) {}
  var saveBtn = document.querySelector('.btn-save-vocab');
  if (!saveBtn) return;
  if (records[word]) {
    saveBtn.classList.add('saved');
    saveBtn.innerHTML = '<span class="icon">✓</span> 已在背单词中';
  } else {
    saveBtn.classList.remove('saved');
    saveBtn.innerHTML = '<span class="icon">⭐</span> 加入背单词';
  }
}
function doLookup() {

  navigator.clipboard.writeText(text)

function doAskAI() {
  if (!selText) return;

  // 拼接完整上下文：句子 + 选项 + 译文
  var parts = [];
  var word = selText.trim();
  var sentence = selContext || '';
  var translation = selTranslationContext || '';

  // 1) 尝试从当前 quiz/lookup 上下文中找出完整句子和选项
  var lookupCtx = dictionaryController.getCurrent && dictionaryController.getCurrent().context || {};
  var fullSentence = lookupCtx.sentenceRu || sentence;
  var fullTranslation = lookupCtx.sentenceZh || translation;

  // 2) 如果当前在 quiz 页面，尝试找到对应题目
  if (fullSentence && curView === 'reading' && currentQuizData) {
    var exerciseId = lookupCtx.taskId || '';
    var exercise = exerciseId && getQuizExercise(exerciseId);
    if (exercise) {
      // 拼接完整句子（填入用户选中的选项或提示有挖空）
      var selectedText = '';
      var record = getQuizRecord(exerciseId);
      if (record.submitted && record.selected) {
        var selOpt = (exercise.options || []).find(function(o) { return o.key === record.selected; });
        if (selOpt) selectedText = selOpt.text;
      }
      var completedSentence = selectedText
        ? exercise.question.replace(/\.{3,}/, selectedText)
        : exercise.question;
      fullSentence = completedSentence;

      // 列出所有选项
      var optionsList = (exercise.options || []).map(function(o) {
        return o.key + '. ' + o.text + (o.key === exercise.answer ? ' ✓' : '');
      }).join('\n');

      parts.push('【原题】' + fullSentence);
      parts.push('【选项】\n' + optionsList);
      if (exercise.sourceExplanation) {
        parts.push('【原书解析】' + exercise.sourceExplanation);
      }
      if (fullTranslation) parts.push('【译文】' + fullTranslation);
    }
  }

  // 3) 兜底：如果没有 quiz 上下文，用基本格式
  if (parts.length === 0) {
    parts.push('【原句】' + (fullSentence || '(无)'));
    if (fullTranslation) parts.push('【译文】' + fullTranslation);
  }

  // 4) 核心问题
  parts.push('【目标词】' + word);
  parts.push('请详细解析这个词在以上句子中的：词性、原形、语法形式、在此语境中的准确含义。如果有近义词或易混淆词，也请对比说明。请用中文回答。');

  navigator.clipboard.writeText(parts.join('\n\n'))
    .then(function() { toast('✅ 已复制完整上下文（含题干+选项+解析）'); })
    .catch(function() { toast('❌ 复制失败'); });
  closeDetailPanel();
}

  localStorage.setItem('vocabulary-review-records', JSON.stringify(records));
  */

  // 更新高亮
  savedWords.push(clean.toLowerCase());

function _syncWordToServer(payload) {
  fetch('/api/novel-vocab', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
    .then(function(r) {
      if (r.ok) { _flushSyncQueue(); return; }
      throw new Error('server error ' + r.status);
    })
    .catch(function() { _queueFailedSync(payload); });
}
function _queueFailedSync(payload) {
  _syncFailQueue.push(payload);
  try { localStorage.setItem('rr_sync_fail_queue', JSON.stringify(_syncFailQueue)); } catch(e) {}
  toast('📝 已保存到本机（同步笔记库失败，稍后自动重试）');
}
function _flushSyncQueue() {
  if (!_syncFailQueue.length) return;
  var queue = _syncFailQueue.slice();
  _syncFailQueue = [];
  try { localStorage.removeItem('rr_sync_fail_queue'); } catch(e) {}
  var remaining = queue.length;
  queue.forEach(function(p) {
    fetch('/api/novel-vocab', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p) })
      .then(function(r) { if (!r.ok) throw new Error('fail'); })
      .catch(function() { _syncFailQueue.push(p); })
      .then(function() {
        remaining--;
        if (remaining === 0 && _syncFailQueue.length === 0 && queue.length > 1) {
          toast('📝 之前 ' + queue.length + ' 个生词已同步到笔记库');
        }
      });
  });
}

   ══════════════════════════════════════════════ */
function exportNotes() {
  if (!curBook) return;
  var bookId = curBook.id;
  var bookTitle = curBook.title;
  var dir = curBook.direction || 'cn→ru';
  var bookMarks = bookmarks[bookId] || {};
  var chapterKeys = Object.keys(bookMarks).filter(function(k) { return bookMarks[k] && bookMarks[k].length > 0; });

  // 收集收藏段落：需要从缓存或 fetch 获取章节数据
  var tasks = chapterKeys.map(function(chIdx) {
    var cached = cacheGet(bookId, parseInt(chIdx));
    if (cached) return Promise.resolve({ idx: parseInt(chIdx), data: cached });
    return fetchChapter(bookId, parseInt(chIdx))
      .then(function(d) { return d ? { idx: parseInt(chIdx), data: d } : null; })
      .catch(function() { return null; });
  });

  Promise.all(tasks).then(function(results) {
    var lines = [];
    lines.push('---');
    lines.push('title: ' + bookTitle + ' 阅读笔记');
    lines.push('exported: ' + new Date().toISOString().split('T')[0]);
    lines.push('type: 阅读笔记');
    lines.push('---');
    lines.push('');
    lines.push('# 📖 ' + bookTitle + ' 阅读笔记');
    lines.push('');

    // 收藏段落
    var hasBookmarks = false;
    results.filter(Boolean).forEach(function(r) {
      var paras = r.data.original || [];
      var trans = r.data.translated || [];
      var marks = bookMarks[String(r.idx)] || [];
      if (!marks.length) return;
      if (!hasBookmarks) { lines.push('## ⭐ 收藏段落'); lines.push(''); hasBookmarks = true; }
      lines.push('### 第' + (r.idx + 1) + '章 ' + (r.data.title || ''));
      lines.push('');
      marks.forEach(function(pi) {
        var front = dir === 'cn→ru' ? (trans[pi] || '') : (paras[pi] || '');
        var back = dir === 'cn→ru' ? (paras[pi] || '') : (trans[pi] || '');
        if (front.trim()) {
          lines.push('> ' + front.trim());
          if (back.trim()) lines.push('> ' + back.trim());
          lines.push('');
        }
      });
    });

    // 生词
    var bookWords = savedWordsData.filter(function(w) {
      return w.source && w.source.indexOf(bookTitle) >= 0;
    });
    if (bookWords.length > 0) {
      lines.push('## 📝 生词');
      lines.push('');
      lines.push('| 单词 | 释义 | 来源 |');
      lines.push('|------|------|------|');
      bookWords.forEach(function(w) {
        lines.push('| ' + w.word + ' | ' + (w.meaning || '') + ' | ' + (w.source || '') + ' |');
      });
      lines.push('');
    }

    if (!hasBookmarks && !bookWords.length) {
      lines.push('暂无收藏段落或生词记录。');
      lines.push('');
    }

    // 生成文件下载
    var md = lines.join('\n');
    var blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = bookTitle.replace(/[<>:"/\\|?*]/g, '_') + '-阅读笔记.md';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('📋 笔记已导出');
  }).catch(function() {
    toast('❌ 导出失败');
  });
}

  // ─── Study Support (AI-generated) ───

/* ─── 折叠面板过渡动画 ─── */
function initCollapseAnimations() {
  var detailsEls = document.querySelectorAll('details.ws-animated-collapse');
  for (var i = 0; i < detailsEls.length; i++) (function(detailsEl) {
    var inner = document.createElement('div');
    inner.className = 'collapse-inner';
    while (detailsEl.children.length) inner.appendChild(detailsEl.children[0]);
    detailsEl.appendChild(inner);

    var summary = detailsEl.querySelector('summary');
    if (!summary || detailsEl.classList.contains('collapse-setup-done')) return;
    detailsEl.classList.add('collapse-setup-done');
    summary.addEventListener('click', function(e) {
      if (detailsEl.open) {
        e.preventDefault();
        var startH = inner.scrollHeight;
        inner.style.height = startH + 'px';
        inner.style.transition = 'height 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
        requestAnimationFrame(function() { inner.style.height = '0px'; });
        inner.addEventListener('transitionend', function h() {
          inner.removeEventListener('transitionend', h);
          detailsEl.open = false;
          inner.style.height = '';
          inner.style.transition = '';
        });
      } else {
        detailsEl.open = true;
        var h = inner.scrollHeight;
        inner.style.height = '0px';
        inner.style.transition = 'height 0.4s cubic-bezier(0.16, 1, 0.3, 1)';
        requestAnimationFrame(function() { inner.style.height = h + 'px'; });
        inner.addEventListener('transitionend', function h() {
          inner.removeEventListener('transitionend', h);
          inner.style.height = '';
          inner.style.transition = '';
        });
      }
    });
  })(detailsEls[i]);
}

function renderReadingSpeakingChapter(data, scrollPosition, restoreState) {
  _currentRSData = data;

  var bookMarks = (bookmarks['reading_speaking'] && bookmarks['reading_speaking'][curCh]) || [];
  var parts = [], visibleCount = 0;

  for (var i = 0; i < paras.length; i++) {
    if (!paras[i] || !paras[i].trim()) continue;
    visibleCount++;
    var isBm = bookMarks.indexOf(i) >= 0;
    // 移除 Markdown ** 标记（数据文件中残留的加粗语法）
    var cleanPara = paras[i].replace(/\*\*/g, '');
    parts.push(
      '<div class="para-block" data-idx="' + i + '">' +
      '<div class="para-actions">' +
        '<button class="' + (isBm ? 'bookmarked' : '') + '" onclick="toggleBookmark(' + i + ',event)" title="收藏段落">' + (isBm ? '★' : '☆') + '</button>' +
      '</div>' +

      '<p class="cn-text">' + escapeHtml(trans[i] || '') + '</p></div>'
    );
  }
  if (!visibleCount) parts.push('<div class="loading">📭 本章暂无内容</div>');

  // 练习题
  var exercises = data.exercises || [];
  _currentRSExercises = exercises.map(function(ex) {
    return Object.assign({}, ex, { _exId: 'rs-' + curCh + '-ex' + ex.num });
  });

  var exercisesHtml = '';
  if (_currentRSExercises.length > 0) {
    exercisesHtml = '<section class="exercises-section">' +
      '<h2 style="margin-bottom:16px;color:var(--text);font-size:1.2em">📝 练习题 (' + _currentRSExercises.length + ' 道)</h2>' +

      '</section>';

  var totalChapters = (curBook && curBook.chapters) || 30;
  var navP = curCh > 0 ? '<button class="fab-nav" onclick="goChapter(' + (curCh - 1) + ')">← 上一章</button>' : '<span class="fab-nav disabled">← 上一章</span>';
  var navN = curCh < totalChapters - 1 ? '<button class="fab-nav" onclick="goChapter(' + (curCh + 1) + ')">下一章 →</button>' : '<span class="fab-nav disabled">下一章 →</span>';

  document.getElementById('app').innerHTML =
    b2FloatingNavigation({ backAction: 'showChapters(\'reading_speaking\')', backTitle: '目录', menuAction: 'showBreadcrumb()' }) +
    '<div class="peek-counter">👁 查看原文: <span id="peekCnt">0</span> / <span id="totalParas">' + visibleCount + '</span> 段</div>' +
    '<div class="main-container" style="padding-bottom:20px"><header class="chapter-header"><h1>第 ' + (curCh + 1) + ' 章</h1><h2>' + escapeHtml(data.title || '') + '</h2></header></div>' +
    '<div class="reader-layout" id="readerLayout">' +
    '<div class="reader-pane" id="readerPane"><div class="chapter-content">' +
    parts.join('') + exercisesHtml +
    '</div></div>' +
    '<div class="resize-handle" id="resizeHandle"></div>' +
    '<div class="detail-panel" id="detailPanel" data-dictionary-state="closed">' +
    '<button class="dictionary-drawer-handle" type="button" aria-label="展开或收起词典"></button>' +
    '<div class="detail-panel-inner" id="detailInner" aria-live="polite">' +
    '<button class="detail-close" type="button" onclick="event.stopPropagation();dictionaryController.close()" aria-label="关闭词典" title="关闭">✕</button>' +
    '<div class="detail-placeholder">👆 点击俄语单词查看详情</div>' +
    '</div></div>' +
    '</div>' +
    '<div class="fab-group-bottom">' + navP +
    '<span class="fab-chapter">第 ' + (curCh + 1) + ' / ' + totalChapters + ' 章</span>' +
    '<button id="markDoneBtn" class="fab-nav fab-mark-done" onclick="markChapterDone()"' + (isChapterCompleted('reading_speaking', curCh) ? ' disabled' : '') + '>✓ 标记完成</button>' +
    navN + '</div>';

  window.scrollTo(0, typeof scrollPosition === 'number' ? scrollPosition : 0); applyTheme(); saveLastRead(restoreState);
  restoreSplitRatio();
  highlightSavedWords();
  applyStressMarks();
}

/* ══════════════════════════════════════════════
   В мире людей — 单题渲染
   ══════════════════════════════════════════════ */
function renderReadingSpeakingExercise(ex) {
  var exId = ex._exId || ('rs-' + curCh + '-ex' + ex.num);
  var record = getReadingSpeakingRecord(exId);
  var submitted = record.submitted;

  var html = '<div class="b2-quiz-item" data-question-id="' + escapeHtml(exId) + '">';
  html += '<h3>' + ex.num + '. ' + escapeHtml(ex.question || '') + '</h3>';

  // 中文提示
  if (ex.zhQuestion) {
    html += '<p class="exercise-zh-hint" style="color:var(--text-dim);font-size:0.9em;margin:4px 0 12px">' + escapeHtml(ex.zhQuestion) + '</p>';
  }

  // 选项
  html += '<div class="b2-options">';
  for (var j = 0; j < (ex.options || []).length; j++) {
    var key = extractOptionKey(ex.options[j]);
    var selected = record.selected === key;
    var isCorrectAnswer = key === ex.answer;
    var cls = 'b2-option-row';
    if (submitted && isCorrectAnswer) cls += ' correct';
    if (submitted && selected && !isCorrectAnswer) cls += ' wrong';
    if (selected && !submitted) cls += ' pending';
    var disabled = submitted ? ' style="pointer-events:none;opacity:0.85"' : '';

    var optionText = ex.options[j];
    var parenIdx = optionText.indexOf(')');
    var keyPart = parenIdx > 0 ? optionText.substring(0, parenIdx + 1) : optionText; // "а)"
    var textPart = parenIdx > 0 ? optionText.substring(parenIdx + 1).trim() : '';
    html += '<div class="' + cls + '" onclick="submitReadingSpeakingOption(\'' + escapeHtml(exId) + '\',\'' + escapeHtml(key) + '\',event)"' + disabled + '>' +
      '<span class="b2-option-radio">' + escapeHtml(keyPart) + '</span>' +
      '<span class="b2-option-text">' + renderRuText(textPart, lookupContext('reading', exId + '-opt' + j, 'quiz-option', textPart, '', [])) + '</span>';
    if (ex.zhOptions && ex.zhOptions[j]) {
      html += '<span class="b2-option-zh" style="display:block;font-size:0.85em;color:var(--text-dim);margin-top:2px">' + escapeHtml(ex.zhOptions[j]) + '</span>';
    }
    html += '</div>';
  }
  html += '</div>';

  // 结果
  if (submitted) {
    html += '<p class="b2-quiz-result ' + (record.wrong ? 'wrong' : 'correct') + '">' +
      (record.wrong ? '回答错误' : '回答正确') + '</p>';
  }

  // 解析
  if (submitted) {
    html += '<button class="b2-explanation-toggle" onclick="toggleReadingSpeakingExplanation(\'' + escapeHtml(exId) + '\')">' +
      (record.expOpen ? '收起解析 ▲' : '查看解析 ▼') + '</button>';
    if (record.expOpen) {
      html += '<div class="b2-explanation">' +
        '<p><strong>答案：' + escapeHtml(ex.answer) + '</strong></p>';
      if (ex.detailed_explanation) {
        // Use \n to split (same pattern as renderExercises does for the old format)
        var paragraphs = ex.detailed_explanation.split('\n').filter(function(p) { return p.trim(); });
        for (var p = 0; p < paragraphs.length; p++) {
          var para = paragraphs[p].trim();
          if (para.startsWith('【') && para.includes('】')) {
            html += '<div class="answer-section-title" style="font-weight:600;margin-top:12px;color:var(--text)">' + escapeHtml(para) + '</div>';
          } else {
            html += '<div class="answer-para" style="margin:4px 0;line-height:1.7">' + escapeHtml(para) + '</div>';
          }
        }
      } else if (ex.explanation) {
        html += '<p>' + escapeHtml(ex.explanation) + '</p>';
      }
      html += '</div>';
    }
  }

  html += '</div>';
  return html;
}

/* ══════════════════════════════════════════════
   В мире людей — 答题交互
   ══════════════════════════════════════════════ */
function submitReadingSpeakingOption(exId, key, evt) {
  // 点到了俄语单词 → 交给词典，不做答题操作
  if (evt && evt.target.closest('.ru-word')) return;
  var record = getReadingSpeakingRecord(exId);
  if (record.submitted) return;

  if (record.selected === key) {
    // 第二次点击同一选项 → 确认提交
    record.submitted = true;
    var ex = getReadingSpeakingExercise(exId);
    record.wrong = ex ? key !== ex.answer : false;
    var progress = getReadingSpeakingProgress();
    progress[exId] = record;
    saveReadingSpeakingProgress(progress);
  } else {
    // 第一次点击 → 选中
    record.selected = key;
    var progress = getReadingSpeakingProgress();
    progress[exId] = record;
    saveReadingSpeakingProgress(progress);
  }
  updateReadingSpeakingQuestionDOM(exId);
}

function toggleReadingSpeakingExplanation(exId) {
  var record = getReadingSpeakingRecord(exId);
  if (!record.submitted) return;
  record.expOpen = !record.expOpen;
  var progress = getReadingSpeakingProgress();
  progress[exId] = record;
  saveReadingSpeakingProgress(progress);
  updateReadingSpeakingQuestionDOM(exId);
}

function updateReadingSpeakingQuestionDOM(exId) {
  var el = document.querySelector('[data-question-id="' + exId + '"]');
  if (!el) return;
  var record = getReadingSpeakingRecord(exId);
  var ex = getReadingSpeakingExercise(exId);
  if (!ex) return;

  // 1. 更新选项行状态
  var rows = el.querySelectorAll('.b2-option-row');
  for (var j = 0; j < rows.length; j++) {
    var row = rows[j];
    var optionKey = extractOptionKey((ex.options || [])[j] || '');
    var selected = record.selected === optionKey;
    var correct = optionKey === ex.answer;
    // 清除旧状态 class
    row.classList.remove('pending', 'correct', 'wrong');
    row.style.pointerEvents = '';
    row.style.opacity = '';
    if (record.submitted) {
      if (correct) row.classList.add('correct');
      if (selected && !correct) row.classList.add('wrong');
      row.style.pointerEvents = 'none';
      row.style.opacity = '0.85';
    } else if (selected) {
      row.classList.add('pending');
    }
  }

  // 2. 更新结果文字和解析区域
  var oldResult = el.querySelector('.b2-quiz-result');
  var oldToggle = el.querySelector('.b2-explanation-toggle');
  var oldExplanation = el.querySelector('.b2-explanation');

  if (record.submitted) {
    // 结果
    var resultHtml = '<p class="b2-quiz-result ' + (record.wrong ? 'wrong' : 'correct') + '">' +
      (record.wrong ? '回答错误' : '回答正确') + '</p>';
    if (oldResult) oldResult.outerHTML = resultHtml;
    else rows[rows.length - 1].insertAdjacentHTML('afterend', resultHtml);

    // 解析按钮
    var toggleHtml = '<button class="b2-explanation-toggle" onclick="toggleReadingSpeakingExplanation(\'' + exId + '\')">' +
      (record.expOpen ? '收起解析 ▲' : '查看解析 ▼') + '</button>';
    if (oldToggle) oldToggle.outerHTML = toggleHtml;
    else {
      var resultEl = el.querySelector('.b2-quiz-result');
      if (resultEl) resultEl.insertAdjacentHTML('afterend', toggleHtml);
    }

    // 解析内容
    if (record.expOpen) {
      var expHtml = '<div class="b2-explanation"><p><strong>答案：' + escapeHtml(ex.answer) + '</strong></p>';
      if (ex.detailed_explanation) {
        var paragraphs = ex.detailed_explanation.split('\n').filter(function(p) { return p.trim(); });
        for (var p = 0; p < paragraphs.length; p++) {
          var para = paragraphs[p].trim();
          if (para.startsWith('【') && para.includes('】')) {
            expHtml += '<div class="answer-section-title" style="font-weight:600;margin-top:12px;color:var(--text)">' + escapeHtml(para) + '</div>';
          } else {
            expHtml += '<div class="answer-para" style="margin:4px 0;line-height:1.7">' + escapeHtml(para) + '</div>';
          }
        }
      } else if (ex.explanation) {
        expHtml += '<p>' + escapeHtml(ex.explanation) + '</p>';
      }
      expHtml += '</div>';
      if (oldExplanation) oldExplanation.outerHTML = expHtml;
      else {
        var toggleEl = el.querySelector('.b2-explanation-toggle');
        if (toggleEl) toggleEl.insertAdjacentHTML('afterend', expHtml);
      }
    } else if (oldExplanation) {
      oldExplanation.remove();
    }
  } else {
    // 未提交：移除结果和解析
    if (oldResult) oldResult.remove();
    if (oldToggle) oldToggle.remove();
    if (oldExplanation) oldExplanation.remove();
  }
}
</script>
