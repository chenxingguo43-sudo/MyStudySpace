<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 小说阅读 — 俄语学习舱</title>
<style>
/* ─── 主题变量 ─── */
:root {
  --bg: #020617; --surface: rgba(15,23,42,0.6); --surface-solid: #0f172a;
  --glass: rgba(255,255,255,0.06); --glass-border: rgba(255,255,255,0.10);
  --glass-hover: rgba(255,255,255,0.10);
  --text: rgba(255,255,255,0.90); --text-secondary: rgba(255,255,255,0.48);
  --text-dim: rgba(255,255,255,0.30);
  --accent: #818cf8; --accent-dim: rgba(129,140,248,0.20); --accent-border: rgba(129,140,248,0.30);
  --success: #34d399; --warning: #fbbf24;
  --ru-text: rgba(255,255,255,0.88); --cn-text: rgba(255,255,255,0.45);
  --border: rgba(255,255,255,0.06); --para-hover: rgba(255,255,255,0.04);
  --para-expanded-border: rgba(129,140,248,0.4);
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --highlight-word: rgba(251,191,36,0.25); --highlight-search: rgba(56,189,248,0.30);
}
body.theme-sepia {
  --bg: #1a1410; --surface: rgba(30,24,18,0.6); --surface-solid: #1e1812;
  --glass: rgba(180,150,100,0.08); --glass-border: rgba(180,150,100,0.15);
  --glass-hover: rgba(180,150,100,0.12);
  --text: rgba(230,210,170,0.92); --text-secondary: rgba(200,170,120,0.50);
  --text-dim: rgba(180,150,100,0.35);
  --accent: #d4a574; --accent-dim: rgba(212,165,116,0.20); --accent-border: rgba(212,165,116,0.30);
  --ru-text: rgba(230,210,170,0.90); --cn-text: rgba(200,170,120,0.45);
  --border: rgba(180,150,100,0.08); --para-hover: rgba(180,150,100,0.05);
  --para-expanded-border: rgba(212,165,116,0.4);
  --highlight-word: rgba(212,165,116,0.25); --highlight-search: rgba(100,180,220,0.25);
}
body.theme-warm {
  --bg: #ECE1C7; --surface: rgba(236,225,199,0.85); --surface-solid: #E6DABB;
  --glass: rgba(0,0,0,0.03); --glass-border: rgba(0,0,0,0.08);
  --glass-hover: rgba(0,0,0,0.06);
  --text: rgba(40,35,25,0.92); --text-secondary: rgba(80,65,40,0.55);
  --text-dim: rgba(80,65,40,0.35);
  --accent: #8b6914; --accent-dim: rgba(139,105,20,0.12); --accent-border: rgba(139,105,20,0.25);
  --ru-text: rgba(40,35,25,0.92); --cn-text: rgba(80,65,40,0.55);
  --border: rgba(0,0,0,0.06); --para-hover: rgba(0,0,0,0.03);
  --para-expanded-border: rgba(139,105,20,0.3);
  --shadow: 0 4px 16px rgba(0,0,0,0.06);
  --highlight-word: rgba(200,160,60,0.20); --highlight-search: rgba(60,140,200,0.20);
}
body.theme-paper {
  --bg: #f5f0e8; --surface: rgba(245,240,232,0.8); --surface-solid: #efe8dc;
  --glass: rgba(0,0,0,0.03); --glass-border: rgba(0,0,0,0.08);
  --glass-hover: rgba(0,0,0,0.06);
  --text: rgba(30,25,18,0.90); --text-secondary: rgba(80,60,40,0.55);
  --text-dim: rgba(80,60,40,0.35);
  --accent: #7c5e3c; --accent-dim: rgba(124,94,60,0.12); --accent-border: rgba(124,94,60,0.25);
  --ru-text: rgba(30,25,18,0.90); --cn-text: rgba(80,60,40,0.55);
  --border: rgba(0,0,0,0.06); --para-hover: rgba(0,0,0,0.03);
  --para-expanded-border: rgba(124,94,60,0.3);
  --shadow: 0 4px 16px rgba(0,0,0,0.08);
  --highlight-word: rgba(200,160,60,0.20); --highlight-search: rgba(60,140,200,0.20);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, 'SF Pro Text', 'Inter', 'Noto Sans SC', sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.8; min-height: 100vh;
  overflow-x: hidden; -webkit-font-smoothing: antialiased; transition: background 0.3s, color 0.3s;
}
/* ─── 自定义滚动条 ─── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--text-dim); border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
.bg-orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(80px); opacity: 0.12; }
.bg-orb-1 { width: 400px; height: 400px; background: #4F46E5; top: -100px; left: -100px; }
.bg-orb-2 { width: 300px; height: 300px; background: #7C3AED; bottom: -80px; right: -80px; }

/* ─── 顶部进度条 ─── */
.progress-top { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 200; transition: width 0.15s; width: 0; border-radius: 0 2px 2px 0; }

/* ─── 工具栏 ─── */
.toolbar {
  position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between;
  background: rgba(10,10,20,0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border); padding: 0 12px; min-height: 48px;
}
.toolbar-left, .toolbar-right { display: flex; gap: 4px; align-items: center; }
.toolbar-center { display: flex; align-items: center; gap: 8px; }
.toolbar-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.toolbar-timer { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; margin-right: 4px; }
.tb-btn {
  background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-secondary);
  font-size: 16px; padding: 6px 10px; cursor: pointer; border-radius: 8px;
  min-width: 36px; min-height: 36px; transition: all 0.15s; display: flex; align-items: center; justify-content: center;
}
.tb-btn:hover { background: var(--glass-hover); color: var(--text); }
.tb-btn:active { transform: scale(0.95); }
.mode-tabs { display: flex; border: 1px solid var(--glass-border); border-radius: 8px; overflow: hidden; }
.mode-btn {
  background: 0; border: 0; color: var(--text-dim); font-size: 12px; padding: 5px 10px; cursor: pointer;
  border-right: 1px solid var(--glass-border); transition: all 0.15s; font-family: inherit;
}
.mode-btn:last-child { border-right: 0; }
.mode-btn:hover { color: var(--text-secondary); }
.mode-btn.active { background: var(--accent-dim); color: var(--accent); }

/* ─── 搜索栏 ─── */
.search-bar {
  display: none; position: sticky; top: 48px; z-index: 90;
  background: var(--surface-solid); border-bottom: 1px solid var(--border);
  padding: 6px 12px; gap: 8px; align-items: center;
}
.search-bar.visible { display: flex; }
.search-input {
  flex: 1; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 6px;
  padding: 6px 10px; color: var(--text); font-size: 14px; outline: none; font-family: inherit;
}
.search-input:focus { border-color: var(--accent-border); }
.search-count { font-size: 12px; color: var(--text-dim); white-space: nowrap; min-width: 60px; text-align: center; }
.search-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px; padding: 4px; }
.search-nav { display: flex; gap: 2px; }
.search-nav button { background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-secondary); cursor: pointer; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
.search-nav button:hover { background: var(--glass-hover); }

/* ─── 阅读统计条 ─── */
.peek-counter {
  text-align: center; font-size: 13px; color: var(--text-dim); padding: 6px;
}
.search-bar.visible + .peek-counter { top: 96px; }

/* ─── 主容器 ─── */
.main-container { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 20px 16px 100px; }

/* ─── 分屏布局容器 ─── */
.reader-layout {
  position: relative; z-index: 1;
  display: flex; flex-direction: row;
  width: 100%; max-width: none;
  padding: 0 0 60px;
}
/* 阅读区：flex-basis 百分比由 JS 动态控制 */
.reader-pane {
  flex: 0 0 70%;   /* 默认 70%，JS 可覆盖 */
  min-width: 25%;   /* 最小 25% */
  max-width: 85%;   /* 最大 85% */
  padding-left: 16px; padding-right: 8px;
}
/* 分割线 */
.resize-handle {
  width: 8px; flex-shrink: 0; cursor: col-resize;
  background: transparent; border-radius: 4px;
  transition: background 0.2s;
  touch-action: none;         /* 禁止浏览器默认手势 */
  align-self: stretch;
  user-select: none;          /* 防止拖拽时选中文字 */
  -webkit-user-select: none;
}
.resize-handle:hover { background: var(--accent); opacity: 0.5; }
.resize-handle.active { background: var(--accent); opacity: 1; box-shadow: 0 0 12px var(--accent-dim); }
/* 详情面板 */
.detail-panel {
  flex: 1;                    /* 自动填满剩余空间 */
  min-width: 0;               /* 允许收缩 */
  position: sticky; top: 0; align-self: flex-start;
  max-height: 100vh; overflow-y: auto;
  /* 注意：无 transition！拖拽需要即时响应 */
}
.detail-panel-inner { padding: 20px; }
/* 面板占位提示 */
.detail-placeholder {
  display: flex; align-items: center; justify-content: center;
  min-height: 200px; color: var(--text-dim); font-size: 14px;
  text-align: center; line-height: 1.8; padding: 20px;
}
/* ─── 叠加遮罩（竖屏）─── 已移除 .detail-overlay ─── */

/* ─── 面板卡片内容 ─── */
.dp-head { margin-bottom: 16px; }
.dp-word { font-size: 1.4em; font-weight: 700; color: var(--accent); margin-bottom: 4px; font-family: 'Noto Serif', serif; }
.dp-pos { font-size: 13px; color: var(--text-dim); }
.dp-section { margin-bottom: 16px; }
.dp-meaning { font-size: 1.1em; color: var(--text); line-height: 1.6; }
.dp-label { font-size: 12px; color: var(--text-dim); margin-right: 6px; }
.dp-tag { font-size: 12px; background: var(--accent-dim); color: var(--accent); padding: 1px 8px; border-radius: 4px; }
.dp-pair { font-size: 13px; color: var(--text-secondary); margin-left: 8px; }
.dp-meta { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
.dp-section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }

/* 搭配 */
.dp-coll { margin-bottom: 8px; padding: 6px 10px; background: rgba(255,255,255,0.04); border-radius: 6px; }
.dp-coll-phrase { font-size: 14px; color: var(--accent); font-weight: 500; }
.dp-coll-ru { font-size: 13px; color: var(--ru-text); margin-top: 2px; }
.dp-coll-zh { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

/* 折叠 */
.dp-collapse-toggle { font-size: 13px; color: var(--text-secondary); cursor: pointer; padding: 4px 0; user-select: none; }
.dp-collapse-toggle:hover { color: var(--accent); }
.dp-collapse-toggle.expanded::after { content: ' ▾'; }
.dp-collapse-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
.dp-collapse-body.open { max-height: 600px; overflow-y: auto; }
.dp-detail { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-top: 6px; }

/* 例句 */
.dp-example { margin-bottom: 8px; padding: 6px 10px; background: rgba(255,255,255,0.03); border-radius: 6px; }
.dp-ex-ru { font-size: 13px; color: var(--ru-text); line-height: 1.6; }
.dp-ex-zh { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

/* 备选原形 */
.dp-alt-label { font-size: 12px; color: var(--text-dim); }
.dp-alt-word { font-size: 12px; color: var(--text-secondary); margin-left: 4px; }

/* 🤖 AI */
.dp-ai-section { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--border); }
.dp-ai-btn { width: 100%; padding: 10px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-secondary); cursor: pointer; font-size: 14px; font-family: inherit; transition: all 0.2s; }
.dp-ai-btn:hover { background: var(--glass-hover); color: var(--accent); }
.dp-ai-btn.loading { opacity: 0.6; pointer-events: none; }
.dp-ai-result { margin-top: 12px; font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
.dp-ai-result:empty { display: none; }

/* 来源 */
.dp-source { margin-top: 12px; font-size: 11px; color: var(--text-dim); }

/* ─── 书架 ─── */
.bookshelf { display: grid; gap: 16px; padding: 24px 0; }
.book-card {
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px;
  padding: 20px; cursor: pointer; transition: all 0.2s;
}
.book-card:hover { background: var(--glass-hover); transform: translateY(-2px); box-shadow: var(--shadow); }
.book-card:active { transform: scale(0.98); }
.book-card h3 { font-size: 1.1em; margin-bottom: 6px; }
.book-card .book-meta { font-size: 13px; color: var(--text-secondary); display: flex; gap: 12px; }
.book-card .book-desc { font-size: 13px; color: var(--text-dim); margin-top: 8px; }
.book-card .book-progress { margin-top: 12px; }
.book-kind { color: var(--accent); font-size: 0.7em; margin-right: 6px; font-weight: 600; letter-spacing: 0.04em; }
.b2-quiz-item { margin: 0 0 18px; padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.b2-options { display: grid; gap: 10px; margin: 16px 0; border: 0; padding: 0; }
.b2-options input { position: absolute; opacity: 0; }
.b2-options label, .b2-confirm, .b2-explanation-toggle, .b2-finish { min-height: 44px; display: flex; align-items: center; border-radius: 9px; }
.b2-options label { padding: 10px 14px; border: 1px solid var(--border); cursor: pointer; }
.b2-options input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 2px; }
.b2-options input:checked + label { border-color: var(--accent); background: var(--accent-dim); }
.b2-confirm, .b2-explanation-toggle, .b2-finish { border: 1px solid var(--accent-border); background: var(--accent-dim); color: var(--text); padding: 8px 14px; cursor: pointer; font: inherit; }
.b2-confirm:disabled, .b2-explanation-toggle:disabled { opacity: 0.45; cursor: not-allowed; }
.b2-result.is-correct, .b2-result.is-wrong { font-weight: 700; margin-top: 12px; }
.b2-result.is-correct { color: var(--success); }.b2-result.is-wrong { color: var(--warning); }
.b2-explanation { margin-top: 12px; padding: 16px; border-left: 3px solid var(--accent); background: var(--glass); }
.b2-explanation p { margin: 0 0 10px; }.b2-explanation p:last-child { margin-bottom: 0; }
.b2-quiz-header { margin: 0 0 20px; }.b2-quiz-header p { color: var(--text-secondary); }
.b2-quiz-page { max-width: 1200px; }
.b2-quiz-nav { display: flex; gap: 10px; justify-content: space-between; margin-top: 28px; }
.b2-quiz-layout { display: flex; min-width: 0; gap: 18px; }.b2-quiz-pane { min-width: 0; flex: 1 1 62%; }
.b2-source-viewer { width: min(38%, 480px); flex: 0 0 min(38%, 480px); position: sticky; top: 72px; align-self: flex-start; }
.b2-source-viewer img { width: 100%; max-height: calc(100vh - 110px); object-fit: contain; border: 1px solid var(--border); border-radius: 10px; background: #111; }
.b2-source-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }.b2-source-page { min-height: 38px; border: 1px solid var(--accent-border); border-radius: 8px; padding: 6px 10px; background: var(--glass); color: var(--text); cursor: pointer; }
.b2-source-mobile { display: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
@media (max-width: 767px) { .b2-quiz-item { padding: 16px; } .b2-options label { font-size: 16px; } }
@media (max-width: 959px) { .b2-source-viewer { display: none; } .b2-source-viewer.is-open { display: block; position: fixed; inset: 56px 12px 70px; z-index: 220; width: auto; background: var(--bg); padding: 12px; overflow: auto; box-shadow: var(--shadow); } .b2-source-mobile { display: inline-flex; } }
@media (max-width: 767px) { .b2-quiz-layout { display: block; } .b2-source-viewer.is-open { inset: 48px 8px 60px; } }
.progress-bar { height: 4px; background: var(--glass); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
.progress-text { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
.shelf-toolbar { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.sort-select {
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: 6px;
  color: var(--text-secondary); font-size: 12px; padding: 4px 8px; cursor: pointer; font-family: inherit;
}

/* ─── 章节目录 ─── */
.chapter-list-header { padding: 16px 0; }
.chapter-list-header h2 { font-size: 1.3em; margin-bottom: 4px; }
.chapter-list-header .ch-meta { font-size: 13px; color: var(--text-secondary); }
.chapter-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; padding: 8px 0; }
.ch-item {
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: 10px;
  padding: 10px 8px; text-align: center; cursor: pointer; transition: all 0.15s; font-size: 13px;
}
.ch-item:hover { background: var(--glass-hover); color: var(--accent); }
.ch-item:active { transform: scale(0.95); }
.ch-item.done { border-color: var(--accent-border); }
.ch-item.done .ch-num { color: var(--success); }
.ch-num { font-weight: 600; display: block; margin-bottom: 2px; }
.ch-title { font-size: 11px; color: var(--text-dim); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ─── 阅读视图 ─── */
.chapter-content { padding: 20px 0 40px; animation: fadeIn 0.3s ease; }
/* 练习题 */
.exercises-section { margin-top: 40px; border-top: 1px dashed var(--border); padding-top: 20px; }
.exercises-toggle { width: 100%; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-size: 16px; cursor: pointer; text-align: left; transition: background 0.2s; }
.exercises-toggle:hover { background: var(--hover); }
.exercises-list { margin-top: 12px; }
.exercise-item { padding: 16px; margin-bottom: 12px; background: var(--surface); border-radius: 8px; border: 1px solid var(--border); }
.exercise-question { font-size: 15px; line-height: 1.6; margin-bottom: 6px; }
.exercise-num { font-weight: 700; color: var(--accent); margin-right: 4px; }
.exercise-zh-hint { font-size: 13px; color: var(--text-secondary); margin-bottom: 8px; padding-left: 20px; }
.exercise-options { margin: 8px 0; padding-left: 20px; }
.exercise-option { font-size: 14px; line-height: 1.8; color: var(--text); }
.exercise-option-zh { font-size: 12px; color: var(--text-secondary); padding-left: 16px; margin-bottom: 4px; }
.answer-toggle { padding: 6px 14px; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; margin-top: 8px; transition: opacity 0.2s; }
.answer-toggle:hover { opacity: 0.85; }
.answer-block { margin-top: 10px; padding: 12px; background: rgba(76,175,80,0.08); border-radius: 6px; border-left: 3px solid #4caf50; }
.answer-label { font-size: 14px; margin-bottom: 6px; }
.answer-explanation { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
.answer-section-title { font-size: 14px; font-weight: 700; color: var(--accent); margin: 12px 0 6px; padding-top: 8px; border-top: 1px dashed var(--border); }
.answer-section-title:first-child { margin-top: 0; border-top: none; padding-top: 0; }
.answer-para { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 6px; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.chapter-header { text-align: center; margin-bottom: 2em; }
.chapter-header h1 { font-size: 1.5em; font-weight: 700; margin-bottom: 4px; }
.chapter-header h2 { font-size: 0.95em; color: var(--text-secondary); font-weight: 400; }
.para-block {
  margin-bottom: 0.6em; border-radius: 8px; cursor: pointer; padding: 6px 10px;
  border-left: 3px solid transparent; transition: all 0.2s; position: relative;
}
.para-block:hover { background: var(--para-hover); }
.para-block.expanded { border-left-color: var(--para-expanded-border); }
.para-block:hover .para-actions { opacity: 1; }
.ru-text { color: var(--ru-text); font-size: 1.05em; line-height: 1.9; font-family: 'Noto Serif', Georgia, 'Noto Serif SC', serif; }
.para-block:not(.expanded) .ru-text::after { content: " ▸"; font-size: .6em; color: var(--text-dim); }
.cn-text {
  color: var(--cn-text); margin: 0; padding: 0; max-height: 0; overflow: hidden; opacity: 0;
  transition: max-height 0.35s ease, opacity 0.25s ease, padding 0.25s; font-size: 0.95em;
}
.cn-text.visible { max-height: none; opacity: 1; padding: 4px 0 4px 0.8em; border-left: 2px solid var(--border); }
.para-actions {
  position: absolute; right: 4px; top: 4px; opacity: 0; transition: opacity 0.15s;

<script>
/* ══════════════════════════════════════════════
   状态管理
   ══════════════════════════════════════════════ */
var NOVEL_ID = 'study_novel';
var THEMES = ['warm', 'dark', 'sepia', 'paper'];
var THEME_LABELS = { dark: '暗色', sepia: '护眼', paper: '纸质' };
var SIZES = ['small', 'medium', 'large', 'xlarge'];
var SIZE_LABELS = { small: '小', medium: '中', large: '大', xlarge: '超大' };
var SORT_OPTIONS = [
  { value: 'default', label: '默认排序' },
  { value: 'progress', label: '按阅读进度' },
  { value: 'unread', label: '未读优先' }
];

var state = { theme: 'warm', fontSize: 'medium', fontFamily: 'serif', sort: 'default' };
var curView = 'shelf', curBook = null, curCh = -1, chDone = false, chStart = 0;
var selText = '', selContext = '', selTranslationContext = '';
var booksData = null;
var chaptersCache = {}, cacheOrder = [], CACHE_LIMIT = 20;
var readStats = {};
var _fetchId = 0, peekCount = 0;
var readTimer = 0, timerInterval = null;
var savedWords = []; // 当前书的已保存单词 (小写)
var savedWordsData = []; // 完整词汇数据 [{word, meaning, source}]
var bookmarks = {}; // {bookId: {chIdx: [paraIdx, ...]}}
var searchMatches = [], searchIdx = -1;
var localLookupReady = false;
var localVocabLookup = {};
var localLookupCache = {};

/* ─── 形态引擎状态 ─── */
var morphologyDict = null;         // Object.create(null) 字典
var morphologyVersion = 0;         // 当前映射表版本
var morphologyReady = false;       // 就绪标志

/* ─── URL 参数解析（从背单词跳转） ─── */
var _urlParams = new URLSearchParams(window.location.search);
var _jumpBook = _urlParams.get('book');
var _jumpCh = _urlParams.get('ch');

// 加载持久化
try { var s = JSON.parse(localStorage.getItem('rr_state_' + NOVEL_ID)); if (s) { Object.assign(state, s); } } catch(e) {}
try { readStats = JSON.parse(localStorage.getItem('rr_stats_' + NOVEL_ID)) || {}; } catch(e) {}
try { var lr = JSON.parse(localStorage.getItem('rr_lastread_' + NOVEL_ID)); } catch(e) {}
try { bookmarks = JSON.parse(localStorage.getItem('rr_bookmarks_' + NOVEL_ID)) || {}; } catch(e) {}

function saveState() { try { localStorage.setItem('rr_state_' + NOVEL_ID, JSON.stringify(state)); } catch(e) {} }
function saveStats() { try { localStorage.setItem('rr_stats_' + NOVEL_ID, JSON.stringify(readStats)); } catch(e) {} }
function saveBookmarks() { try { localStorage.setItem('rr_bookmarks_' + NOVEL_ID, JSON.stringify(bookmarks)); } catch(e) {} }
function saveLastRead() {
  try {
    if (curBook && curCh >= 0) {
      localStorage.setItem('rr_lastread_' + NOVEL_ID, JSON.stringify({ bookId: curBook.id, chapter: curCh, scroll: window.scrollY }));
    }
  } catch(e) {}
}

/* ══════════════════════════════════════════════
   IndexedDB 轻量封装
   ══════════════════════════════════════════════ */
var _idbName = 'russian_reader_db';
var _idbStore = 'keyval';

function _idbOpen() {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open(_idbName, 1);
    req.onupgradeneeded = function() { req.result.createObjectStore(_idbStore); };
    req.onsuccess = function() { resolve(req.result); };
    req.onerror = function() { reject(req.error); };
  });
}

function _idbExec(mode, cb) {
  return _idbOpen().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(_idbStore, mode === 'readonly' ? 'readonly' : 'readwrite');
      var store = tx.objectStore(_idbStore);
      var ret = cb(store);
      if (ret && typeof ret.then === 'function') { ret.then(resolve, reject); }
      tx.oncomplete = function() { resolve(ret && ret.then ? undefined : ret); };
      tx.onerror = function() { reject(tx.error); };
    });
  });
}

function idbGet(key) {
  return _idbExec('readonly', function(store) {
    return new Promise(function(resolve) {
      var req = store.get(key);
      req.onsuccess = function() { resolve(req.result); };
      req.onerror = function() { reject(req.error); };
    });
  });
}

function idbSet(key, val) {
  return _idbExec('readwrite', function(store) {
    return new Promise(function(resolve) {
      var req = store.put(val, key);
      req.onsuccess = function() { resolve(); };
      req.onerror = function() { reject(req.error); };
    });
  });
}

/* ─── 形态引擎：IndexedDB 读写 ─── */
var MORPH_IDB_KEY = 'morphology_data';

function readMorphologyFromIDB() {
  return idbGet(MORPH_IDB_KEY).then(function(data) {
    if (!data || !data.map || Object.keys(data.map).length === 0) {
      throw new Error('empty morphology data');
    }
    return data;
  });
}

function writeMorphologyToIDB(data) {
  return idbSet(MORPH_IDB_KEY, data);
}

/* ══════════════════════════════════════════════
   主题 / 字号 / 字体
   ══════════════════════════════════════════════ */
function applyTheme() {
  document.body.className = 'theme-' + state.theme + ' size-' + state.fontSize + ' ';
  if (state.fontFamily === 'sans') document.body.className += 'font-sans';
}
function cycleTheme() {
  var i = THEMES.indexOf(state.theme);
  state.theme = THEMES[(i + 1) % THEMES.length];
  saveState(); applyTheme();
  toast('主题: ' + THEME_LABELS[state.theme]);
}
function cycleFont() {
  var i = SIZES.indexOf(state.fontSize);
  state.fontSize = SIZES[(i + 1) % 4];
  saveState(); applyTheme();
  toast('字号: ' + SIZE_LABELS[state.fontSize]);
}
function cycleFontFamily() {
  state.fontFamily = state.fontFamily === 'sans' ? 'serif' : 'sans';
  saveState(); applyTheme();
  toast('字体: ' + (state.fontFamily === 'sans' ? '无衬线' : '衬线'));
}

/* ══════════════════════════════════════════════
   缓存管理 (LRU)
   ══════════════════════════════════════════════ */
function cachePut(bookId, idx, data) {
  if (!chaptersCache[bookId]) chaptersCache[bookId] = {};
  chaptersCache[bookId][idx] = data;
  cacheOrder.push({ bookId: bookId, idx: idx });
  while (cacheOrder.length > CACHE_LIMIT) {
    var old = cacheOrder.shift();
    if (chaptersCache[old.bookId]) {
      delete chaptersCache[old.bookId][old.idx];
      if (!Object.keys(chaptersCache[old.bookId]).length) delete chaptersCache[old.bookId];
    }
  }
}
function cacheGet(bookId, idx) {
  if (chaptersCache[bookId] && chaptersCache[bookId][idx]) {
    for (var i = 0; i < cacheOrder.length; i++) {
      if (cacheOrder[i].bookId === bookId && cacheOrder[i].idx === idx) {
        cacheOrder.splice(i, 1); cacheOrder.push({ bookId: bookId, idx: idx }); break;
      }
    }
    return chaptersCache[bookId][idx];
  }
  return null;
}

/* ══════════════════════════════════════════════
   工具函数
   ══════════════════════════════════════════════ */
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function toolbar(title, extra) {
  return '<header class="toolbar">' +
    '<div class="toolbar-left">' +
      '<button class="tb-btn" onclick="cycleTheme()" title="切换主题">🎨</button>' +
      '<button class="tb-btn" onclick="cycleFont()" title="字号">Aa</button>' +
      '<button class="tb-btn" onclick="cycleFontFamily()" title="字体">A̲A̲</button>' +
    '</div>' +
    '<div class="toolbar-center"><span class="toolbar-title">' + title + '</span></div>' +
    '<div class="toolbar-right">' +
      '<span class="toolbar-timer" id="toolbarTimer"></span>' +
      (extra || '') +
    '</div></header>';
}

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('visible');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() { t.classList.remove('visible'); }, 2500);
}

/* ─── 形态引擎：初始化 ─── */
function buildDict(mapData) {
  morphologyDict = Object.create(null);
  Object.assign(morphologyDict, mapData);
  morphologyReady = true;
}

function initMorphology() {
  var versionFetchOk = true;
  var remoteVersion = null;

  fetch('data/morphology-version.json')
    .then(function(r) {
      if (!r.ok) throw new Error('version fetch failed');
      return r.json();
    })
    .then(function(v) { remoteVersion = v.version; })
    .catch(function() { versionFetchOk = false; })
    .then(function() {
      return readMorphologyFromIDB()
        .then(function(localData) {
          if (versionFetchOk && localData.version === remoteVersion) {
            buildDict(localData.map);
            return;
          }
          throw new Error('need update');
        })
        .catch(function() {
          if (!versionFetchOk) {
            return readMorphologyFromIDB().then(function(ld) { buildDict(ld.map); }).catch(function() {});
          }
          if (sessionStorage.getItem('morph_retry') === '1') {
            return readMorphologyFromIDB().then(function(ld) { buildDict(ld.map); }).catch(function() {});
          }
          return fetch('data/morphology-map.json')
            .then(function(r) { return r.json(); })
            .then(function(json) {
              return writeMorphologyToIDB(json).then(function() {
                buildDict(json.map);
              });
            })
            .catch(function() {
              sessionStorage.setItem('morph_retry', '1');
              return readMorphologyFromIDB().then(function(ld) { buildDict(ld.map); }).catch(function() {});
            });
        });
    });
}

/* ─── 计时器 ─── */
function startTimer() {
  stopTimer(); readTimer = 0;
  timerInterval = setInterval(function() {
    readTimer++;
    var el = document.getElementById('toolbarTimer');
    if (el) {
      var m = Math.floor(readTimer / 60), s = readTimer % 60;
      el.textContent = '⏱ ' + m + ':' + (s < 10 ? '0' : '') + s;
    }
  }, 1000);
}
function stopTimer() { clearInterval(timerInterval); timerInterval = null; }

/* ─── 进度条 ─── */
function updateProgress() {
  var el = document.getElementById('progressTop');
  if (!el) return;
  var h = document.documentElement.scrollHeight - window.innerHeight;
  el.style.width = h > 0 ? Math.min(100, Math.round(window.scrollY / h * 100)) + '%' : '0%';
}

/* ══════════════════════════════════════════════
   数据加载（支持server API和静态文件）
   ══════════════════════════════════════════════ */
function fetchJson(url, staticUrl) {
  return fetch(url)
    .then(function(r) { if (!r.ok) throw 0; return r.json(); })
    .catch(function() {
      if (staticUrl) return fetch(staticUrl).then(function(r) { if (!r.ok) throw 0; return r.json(); });
      throw 0;
    });
}
function fetchIndex() {
  return fetchJson('/api/novel/index', 'data/novel/index.json')
    .then(function(d) { return d; })
    .catch(function() {
      // 合并novel和textbook的index
      return Promise.all([
        fetchJson('data/novel/index.json', null).catch(function() { return {books:[]}; }),
        fetchJson('data/textbook/index.json', null).catch(function() { return {books:[]}; })
      ]).then(function(arr) {
        return { books: arr[0].books.concat(arr[1].books) };
      });
    });
}
function getBookById(bookId) {
  for (var i = 0; i < booksData.length; i++) {
    if (booksData[i].id === bookId) return booksData[i];
  }
  return null;
}
function getBookDataDir(bookId) {
  var book = getBookById(bookId);
  return book && book.kind === 'textbook' ? 'data/textbook' : 'data/novel';
}
function isQuizFirstBook(book) {
  return !!book && book.kind === 'textbook' && book.format === 'quiz-first';
}
function fetchChapter(bookId, idx) {
  var padIdx = String(idx).padStart(4, '0');
  var book = getBookById(bookId);
  var dataDir = getBookDataDir(bookId);
  var directory = book && book.dir ? book.dir : bookId;
  return fetchJson(
    '/api/novel/' + encodeURIComponent(bookId) + '/' + idx,
    dataDir + '/' + directory + '/ch' + padIdx + '.json'
  );
}

function showShelf() {
  curView = 'shelf'; curBook = null; curCh = -1; stopTimer();
  var app = document.getElementById('app');
  app.innerHTML = toolbar('📖 小说阅读') +
    '<div class="main-container"><div class="loading"><div class="spinner"></div><div>加载书架...</div></div></div>';

function getBookProgress(bookId) {
  var stats = readStats[bookId] || {}, done = 0;
  for (var k in stats) { if (stats[k] && stats[k].completed) done++; }
  return done;
}

function renderShelf() {
  var sorted = booksData.slice();
  if (state.sort === 'progress') {
    sorted.sort(function(a, b) { return getBookProgress(b.id) - getBookProgress(a.id); });
  } else if (state.sort === 'unread') {
    sorted.sort(function(a, b) { return getBookProgress(a.id) - getBookProgress(b.id); });
  }

  var parts = [
    '<div class="main-container">',
    '<div class="shelf-toolbar">',
    '<select class="sort-select" onchange="changeSort(this.value)">'
  ];
  SORT_OPTIONS.forEach(function(o) {
    parts.push('<option value="' + o.value + '"' + (state.sort === o.value ? ' selected' : '') + '>' + o.label + '</option>');
  });
  parts.push('</select></div><div class="bookshelf">');

  for (var i = 0; i < sorted.length; i++) {
    var b = sorted[i], done = getBookProgress(b.id), pct = b.chapters > 0 ? Math.round(done / b.chapters * 100) : 0;
    parts.push(
      '<div class="book-card" onclick="showChapters(\'' + escapeHtml(b.id) + '\')">' +
      '<h3>' + (b.kind === 'textbook' ? '<span class="book-kind">教材</span>' : '') + escapeHtml(b.title) + '</h3>' +
      '<div class="book-meta">' + (b.author ? '<span>✍️ ' + escapeHtml(b.author) + '</span>' : '') +
      '<span>📚 ' + b.chapters + ' 章</span>' +
      '<span>' + (b.direction === 'cn→ru' ? '🇨🇳→🇷🇺' : '🇷🇺→🇨🇳') + '</span></div>' +
      (b.description ? '<div class="book-desc">' + escapeHtml(b.description) + '</div>' : '') +
      '<div class="book-progress"><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="progress-text">已读 ' + done + '/' + b.chapters + ' (' + pct + '%)</div></div></div>'
    );
  }
  parts.push('</div></div>');
  document.getElementById('app').innerHTML = parts.join('');
}
function changeSort(v) { state.sort = v; saveState(); renderShelf(); }

function showChapters(bookId) {
  curView = 'chapters'; stopTimer();

    if (booksData[i].id === bookId) { curBook = booksData[i]; break; }
  }

  var stats = readStats[bookId] || {}, done = 0;
  for (var k in stats) { if (stats[k] && stats[k].completed) done++; }

  var html = toolbar(escapeHtml(curBook.title),

    '<button class="tb-btn" onclick="showBookReport()" title="读书报告">📊</button>' +

    '</div></div><div class="chapter-grid">';

function goChapter(idx) {
  curView = 'reading'; curCh = idx; chDone = false; chStart = Date.now(); peekCount = 0;
  _fetchId++;
  var localFetchId = _fetchId;
  closeSearch();

  var app = document.getElementById('app');
  app.innerHTML = toolbar('第 ' + (idx + 1) + ' 章',
    '<button class="tb-btn" onclick="toggleSearch()" title="搜索 (Ctrl+F)">🔍</button>' +
    '<button class="tb-btn" onclick="showChapters(\'' + escapeHtml(curBook.id) + '\')" title="目录">☰</button>') +
    '<div class="peek-counter">👁 查看原文: <span id="peekCnt">0</span> / <span id="totalParas">0</span> 段</div>' +
    '<div class="main-container"><div class="loading"><div class="spinner"></div><div>加载...</div></div></div>';
  startTimer();

  var cached = cacheGet(curBook.id, idx);
  if (cached) { renderChapter(cached); return; }

  fetchChapter(curBook.id, idx)
    .then(function(data) { if (localFetchId !== _fetchId) return; cachePut(curBook.id, idx, data); renderChapter(data); })
    .catch(function() { if (localFetchId !== _fetchId) return; document.querySelector('.main-container').innerHTML = '<div class="loading">❌ 加载失败</div>'; });
}

var B2_PROGRESS_KEY = 'rr_b2_progress_v1';
var quizProgress = {};
var currentQuizData = null;
var currentQuizExercises = [];

function getB2Progress() {
  try { return JSON.parse(localStorage.getItem(B2_PROGRESS_KEY)) || {}; }
  catch (e) { return {}; }
}
function saveB2Progress(progress) {
  quizProgress = progress;
  try { localStorage.setItem(B2_PROGRESS_KEY, JSON.stringify(progress)); } catch (e) {}
}
function getQuizRecord(questionId) {
  var chapterKey = curBook.id + ':' + curCh;
  var all = getB2Progress();
  if (!all[chapterKey]) all[chapterKey] = {};
  if (!all[chapterKey][questionId]) all[chapterKey][questionId] = { selected: '', submitted: false, attempts: 0, wrong: false, explanationOpen: false };
  saveB2Progress(all);
  return all[chapterKey][questionId];
}
function getQuizExercise(questionId) {
  for (var i = 0; i < currentQuizExercises.length; i++) if (currentQuizExercises[i].id === questionId) return currentQuizExercises[i];
  return null;
}
function renderQuizResult(exercise, record) {
  if (!record.submitted) return '';
  return record.wrong ? '<span class="is-wrong">错误：你的答案是 ' + escapeHtml(record.selected) + '。</span>' : '<span class="is-correct">正确：你的答案是 ' + escapeHtml(record.selected) + '。</span>';
}
function renderQuizExplanation(exercise) {
  var questionPages = exercise.questionPages.map(function(page) { return 'PDF-' + String(page).padStart(3, '0'); }).join('、');
  var answerPages = exercise.answerPages.map(function(page) { return 'PDF-' + String(page).padStart(3, '0'); }).join('、');

    '<p><strong>参考解析（AI，待复核）</strong><br>' + escapeHtml(exercise.referenceExplanation) + '</p>' +
    '<p><strong>易错点</strong><br>' + escapeHtml(exercise.pitfalls.join('；')) + '</p>' +

function sourcePageUrl(pageNumber) {

}
function renderSourceViewer(sourcePages) {
  var pages = [].concat(sourcePages.questions || [], sourcePages.rules || [], sourcePages.answers || []);
  var unique = pages.filter(function(page, index) { return pages.indexOf(page) === index; });

    '<div class="b2-source-tabs">' + buttons + '</div>' +

function setSourcePage(pageNumber) {

  if (!image) return;
  image.src = sourcePageUrl(pageNumber);
  image.alt = '原书 PDF 第 ' + pageNumber + ' 页';
}
function openQuizSourceViewer() {
  var viewer = document.getElementById('b2SourceViewer');
  if (viewer) viewer.classList.toggle('is-open');
}
function renderQuizItem(exercise, record) {
  var html = '<section class="b2-quiz-item" data-question-id="' + escapeHtml(exercise.id) + '">';
  html += '<h3>' + escapeHtml(exercise.id) + '. ' + escapeHtml(exercise.question) + '</h3>';
  html += '<fieldset class="b2-options"><legend class="sr-only">选择答案</legend>';
  for (var i = 0; i < exercise.options.length; i++) {
    var option = exercise.options[i], inputId = 'b2-' + exercise.id + '-' + option.key;
    var checked = record.selected === option.key ? ' checked' : '';
    var disabled = record.submitted ? ' disabled' : '';
    html += '<input type="radio" id="' + inputId + '" name="b2-' + exercise.id + '" value="' + option.key + '"' + checked + disabled + ' onchange="selectQuizOption(\'' + exercise.id + '\',\'' + option.key + '\')">';
    html += '<label for="' + inputId + '"><strong>' + option.key + '.</strong> ' + escapeHtml(option.text) + '</label>';
  }
  html += '</fieldset>';

  html += '<button class="b2-explanation-toggle" onclick="toggleQuizExplanation(\'' + exercise.id + '\')"' + (!record.submitted ? ' disabled' : '') + '>查看答案与解析</button>';
  html += '<div class="b2-explanation"' + (record.explanationOpen ? '' : ' hidden') + '>' + renderQuizExplanation(exercise) + '</div></section>';

function renderQuizChapter(data) {
  currentQuizData = data; currentQuizExercises = data.exercises || [];
  var html = '<div class="main-container b2-quiz-page"><div class="b2-quiz-header">' +
    '<button class="tb-btn" onclick="showShelf()">← 书架</button><button class="tb-btn b2-source-mobile" onclick="openQuizSourceViewer()">查看原书页</button><h1>' + escapeHtml(data.title || '') + '</h1>' +
    '<p>先独立作答；确认后只显示对错。答案与解析需要你手动展开。</p></div>';
  html += '<div class="b2-quiz-layout"><main class="b2-quiz-pane">';
  for (var i = 0; i < currentQuizExercises.length; i++) html += renderQuizItem(currentQuizExercises[i], getQuizRecord(currentQuizExercises[i].id));
  html += '<button class="b2-finish" onclick="finishQuizChapter()">结束本单元</button>';
  html += '<div class="b2-quiz-nav">' +
    (curCh > 0 ? '<button class="fab-nav" onclick="goChapter(' + (curCh - 1) + ')">← 上一章</button>' : '<span class="fab-nav disabled">← 上一章</span>') +
    (curCh < curBook.chapters - 1 ? '<button class="fab-nav" onclick="goChapter(' + (curCh + 1) + ')">下一章 →</button>' : '<span class="fab-nav disabled">下一章 →</span>') +
    '</div></main>' + renderSourceViewer(data.sourcePages) + '</div></div>';
  document.getElementById('app').innerHTML = html;
  window.scrollTo(0, 0); applyTheme(); saveLastRead();
}
function selectQuizOption(questionId, key) {
  var record = getQuizRecord(questionId);
  if (record.submitted) return;
  record.selected = key;
  var all = getB2Progress(); all[curBook.id + ':' + curCh][questionId] = record; saveB2Progress(all);
  renderQuizChapter(currentQuizData);
}
function submitQuizQuestion(questionId) {
  var exercise = getQuizExercise(questionId), record = getQuizRecord(questionId);
  if (!exercise || !record.selected || record.submitted) return;
  record.submitted = true; record.attempts += 1; record.wrong = record.selected !== exercise.answer;
  var all = getB2Progress(); all[curBook.id + ':' + curCh][questionId] = record; saveB2Progress(all);
  renderQuizChapter(currentQuizData);
}
function toggleQuizExplanation(questionId) {
  var record = getQuizRecord(questionId);
  if (!record.submitted) return;
  record.explanationOpen = !record.explanationOpen;
  var all = getB2Progress(); all[curBook.id + ':' + curCh][questionId] = record; saveB2Progress(all);
  renderQuizChapter(currentQuizData);
}
function finishQuizChapter() {
  var records = getB2Progress()[curBook.id + ':' + curCh] || {};
  var complete = currentQuizExercises.length > 0 && currentQuizExercises.every(function(exercise) { return records[exercise.id] && records[exercise.id].submitted; });
  if (!complete) { toast('请先确认全部题目，再结束本单元'); return; }
  if (!readStats[curBook.id]) readStats[curBook.id] = {};
  readStats[curBook.id][curCh] = { completed: true, completed_at: new Date().toISOString(), quiz: true };
  saveStats(); toast('本单元已完成');
}

function renderChapter(data) {
  if (isQuizFirstBook(curBook) && data.format === 'quiz-first') { renderQuizChapter(data); return; }
  var paras = data.original || [], trans = data.translated || [], dir = curBook.direction || 'cn→ru';
  var bookMarks = (bookmarks[curBook.id] && bookmarks[curBook.id][curCh]) || [];
  var parts = [], visibleCount = 0;
  for (var i = 0; i < paras.length; i++) {
    var front = dir === 'cn→ru' ? (trans[i] || '') : (paras[i] || '');
    var back = dir === 'cn→ru' ? (paras[i] || '') : (trans[i] || '');
    if (!front.trim()) continue;
    visibleCount++;
    var isBm = bookMarks.indexOf(i) >= 0;
    parts.push(
      '<div class="para-block" data-idx="' + i + '">' +
      '<div class="para-actions">' +
        '<button class="' + (isBm ? 'bookmarked' : '') + '" onclick="toggleBookmark(' + i + ',event)" title="收藏段落">' + (isBm ? '★' : '☆') + '</button>' +
      '</div>' +
      '<p class="ru-text">' + renderRuText(front) + '</p>' +
      '<p class="cn-text">' + escapeHtml(back) + '</p></div>'
    );
  }
  if (!visibleCount) parts.push('<div class="loading">📭 本章暂无内容</div>');

  // 练习题部分
  var exercisesHtml = '';
  if (data.exercises && data.exercises.length > 0) {
    exercisesHtml = renderExercises(data.exercises);
  }

  var navP = curCh > 0 ? '<button class="fab-nav" onclick="goChapter(' + (curCh - 1) + ')">← 上一章</button>' : '<span class="fab-nav disabled">← 上一章</span>';
  var navN = curCh < curBook.chapters - 1 ? '<button class="fab-nav" onclick="goChapter(' + (curCh + 1) + ')">下一章 →</button>' : '<span class="fab-nav disabled">下一章 →</span>';

  document.getElementById('app').innerHTML =
    '<div class="fab-group-top">' +
    '<button class="fab-btn" onclick="cycleTheme()" title="切换主题">🎨</button>' +
    '<button class="fab-btn" onclick="cycleFont()" title="字号">Aa</button>' +
    '<button class="fab-btn" onclick="toggleSearch()" title="搜索 (Ctrl+F)">🔍</button>' +
    '<button class="fab-btn" onclick="showChapters(\'' + escapeHtml(curBook.id) + '\')" title="目录">☰</button>' +
    '</div>' +
    '<div class="peek-counter">👁 查看原文: <span id="peekCnt">0</span> / <span id="totalParas">' + visibleCount + '</span> 段</div>' +
    '<div class="reader-layout" id="readerLayout">' +
    '<div class="reader-pane" id="readerPane"><div class="chapter-content">' +
    '<div class="chapter-header"><h1>Глава ' + (curCh + 1) + '</h1><h2>' + escapeHtml(data.title || '') + '</h2></div>' +
    parts.join('') + exercisesHtml + '</div></div>' +
    '<div class="resize-handle" id="resizeHandle"></div>' +
    '<div class="detail-panel" id="detailPanel"><div class="detail-panel-inner" id="detailInner">' +
    '<div class="detail-close" onclick="event.stopPropagation();closeDetailPanel()" title="关闭">✕</div>' +
    '<div class="detail-placeholder">👆 点击俄语单词查看详情</div>' +
    '</div></div>' +
    '</div>' +
    '<div class="fab-group-bottom">' + navP + '<span class="fab-chapter">第 ' + (curCh + 1) + ' / ' + curBook.chapters + ' 章</span>' + navN + '</div>';

  window.scrollTo(0, 0); applyTheme(); saveLastRead();
  // 恢复分栏比例
  restoreSplitRatio();
  // 恢复滚动
  try { var lr2 = JSON.parse(localStorage.getItem('rr_lastread_' + NOVEL_ID)); if (lr2 && lr2.bookId === curBook.id && lr2.chapter === curCh && lr2.scroll > 0) setTimeout(function() { window.scrollTo(0, lr2.scroll); }, 100); } catch(e) {}
  // 高亮已保存单词
  highlightSavedWords();
}

/* ─── 练习题渲染 ─── */

  var html = '<div class="exercises-section">' +
    '<button class="exercises-toggle" onclick="toggleExercises(this)">' +
    '📝 练习题 (' + exercises.length + ' 道) ▼</button>' +

    var ex = exercises[i];
    html += '<div class="exercise-item">' +
      '<div class="exercise-question">' +
        '<span class="exercise-num">' + ex.num + '.</span>' +
        '<span class="exercise-text">' + escapeHtml(ex.question) + '</span>' +
      '</div>';
    if (ex.zhQuestion) {
      html += '<div class="exercise-zh-hint">' + escapeHtml(ex.zhQuestion) + '</div>';
    }
    html += '<div class="exercise-options">';
    for (var j = 0; j < ex.options.length; j++) {
      html += '<div class="exercise-option">' + escapeHtml(ex.options[j]) + '</div>';
      if (ex.zhOptions && ex.zhOptions[j]) {
        html += '<div class="exercise-option-zh">' + escapeHtml(ex.zhOptions[j]) + '</div>';
      }
    }
    html += '</div>';
    if (ex.answer) {
      html += '<button class="answer-toggle" onclick="toggleAnswer(this)">显示答案</button>' +
        '<div class="answer-block" style="display:none">' +
        '<div class="answer-label">答案: <strong>' + escapeHtml(ex.answer) + '</strong></div>';
      if (ex.detailed_explanation) {
        // 详细解析：按段落渲染
        var paragraphs = ex.detailed_explanation.split('\\n').filter(function(p) { return p.trim(); });
        for (var p = 0; p < paragraphs.length; p++) {
          var para = paragraphs[p].trim();
          if (para.startsWith('【') && para.includes('】')) {
            // Section header
            html += '<div class="answer-section-title">' + escapeHtml(para) + '</div>';
          } else {

}

/* ─── 恢复分栏比例 ─── */
function restoreSplitRatio() {
  var layout = document.getElementById('readerLayout');
  var pane = document.getElementById('readerPane');
  if (!layout || !pane) return;

  var isH = getComputedStyle(layout).flexDirection === 'row';
  _lastSplitOrientation = isH ? 'h' : 'v';
  var key = isH ? 'rr_split_h' : 'rr_split_v';
  var saved = null;
  try { saved = localStorage.getItem(key); } catch(e) {}

  if (saved) {
    pane.style.flexBasis = saved;
  } else {
    // 默认值：横屏 70%，竖屏 55%
    pane.style.flexBasis = isH ? '70%' : '55%';
  }
}

/* ─── 拖拽分界线 ─── */
(function() {
  var layoutEl = null, paneEl = null, handleEl = null;
  var dragging = false, isHorizontal = true;

  function refreshRefs() {
    layoutEl = document.getElementById('readerLayout');
    paneEl = document.getElementById('readerPane');
    handleEl = document.getElementById('resizeHandle');
  }

  function getDirection() {
    if (!layoutEl) return 'row';
    return getComputedStyle(layoutEl).flexDirection;
  }

  document.addEventListener('pointerdown', function(e) {
    refreshRefs();
    if (!e.target.closest('#resizeHandle')) return;
    if (!paneEl) return;
    dragging = true;
    isHorizontal = getDirection() === 'row';
    handleEl.classList.add('active');
    handleEl.setPointerCapture(e.pointerId);
  });

  document.addEventListener('pointermove', function(e) {
    if (!dragging || !paneEl || !layoutEl) return;
    var rect = layoutEl.getBoundingClientRect();
    var percentage;
    if (isHorizontal) {
      percentage = ((e.clientX - rect.left) / rect.width) * 100;
    } else {
      percentage = ((e.clientY - rect.top) / rect.height) * 100;
    }
    percentage = Math.max(25, Math.min(85, percentage));
    paneEl.style.flexBasis = percentage + '%';
  });

  document.addEventListener('pointerup', function(e) {
    if (!dragging) return;
    dragging = false;
    if (handleEl) handleEl.classList.remove('active');
    if (handleEl) handleEl.releasePointerCapture(e.pointerId);
    // 持久化：横屏/竖屏各存一份
    try {
      var key = isHorizontal ? 'rr_split_h' : 'rr_split_v';
      if (paneEl) localStorage.setItem(key, paneEl.style.flexBasis);
    } catch(err) {}
  });
})();

// ─── 屏幕旋转时恢复分栏比例 ───
var _lastSplitOrientation = null;
window.addEventListener('resize', function() {
  var layout = document.getElementById('readerLayout');
  if (!layout) return;
  var isH = getComputedStyle(layout).flexDirection === 'row';
  var cur = isH ? 'h' : 'v';
  if (cur !== _lastSplitOrientation) {
    _lastSplitOrientation = cur;
    restoreSplitRatio();
  }
});

/* ─── 生词高亮 ─── */
function loadSavedWords() {
  try {
    var records = JSON.parse(localStorage.getItem('vocabulary-review-records') || '{}');
    savedWords = Object.keys(records).map(function(w) { return w.toLowerCase(); }).filter(Boolean);
    savedWordsData = Object.keys(records).map(function(w) { return { word: w, meaning: '', source: records[w].source || '' }; });
  } catch(e) { savedWords = []; savedWordsData = []; }
}

function normalizeLookupWord(word) {
  return String(word || '')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/ё/g, 'е')
    .replace(/Ё/g, 'е')
    .toLowerCase()
    .replace(/[^а-я-]/g, '');
}

function hasChineseText(text) {
  return /[\u4e00-\u9fff]/.test(String(text || ''));
}

function loadLocalLookupData() {
  try { localLookupCache = JSON.parse(localStorage.getItem('rr_local_lookup_cache') || '{}'); } catch(e) { localLookupCache = {}; }
  return Promise.all([
    fetch('data/vocabulary.json').then(function(r) { return r.ok ? r.json() : []; }),
    fetch('data/external-vocab.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; })
  ])
    .then(function(results) {
      var words = results[0], extVocab = results[1];
      localVocabLookup = {};
      // 主词典
      if (!Array.isArray(words)) words = [];
      words.forEach(function(w) {
        if (!w || !w.word || !w.meaning || !hasChineseText(w.meaning)) return;
        var posType = (w.type || '').toLowerCase();
        var allowedTypes = { verb:1, noun:1, adj:1, adjective:1, adv:1, adverb:1 };
        if (!allowedTypes[posType]) return;
        var key = normalizeLookupWord(w.word);
        if (!key || localVocabLookup[key]) return;
        localVocabLookup[key] = {
          meaning: w.meaning,
          type: w.type || '',
          source: '本地词库',
          _raw: w  // 保留原始词条用于详情面板渲染
        };
      });
      // 外部补充词库 (Gemini 翻译)
      Object.keys(extVocab).forEach(function(lemma) {
        var e = extVocab[lemma];
        var key = normalizeLookupWord(lemma);
        if (!key) return;
        if (localVocabLookup[key]) return; // 不覆盖主词典
        if (!hasChineseText(e.meaning)) return;
        localVocabLookup[key] = {
          meaning: e.meaning,
          type: e.type || '',
          source: '扩展词库'
        };
      });
      console.log('[Dict] Local:', Object.keys(localVocabLookup).length, 'words (incl. external)');
      localLookupReady = true;
    })
    .catch(function(err) {
      console.warn('本地查词数据加载失败:', err);
      localLookupReady = true;
    });
}

function getCachedLocalLookup(word) {
  var key = normalizeLookupWord(word);
  return key ? localLookupCache[key] : null;
}

function saveCachedLocalLookup(word, result) {
  var key = normalizeLookupWord(word);
  if (!key || !result) return;
  localLookupCache[key] = result;
  try { localStorage.setItem('rr_local_lookup_cache', JSON.stringify(localLookupCache)); } catch(e) {}
}

function lookupLocalChineseMeaning(word) {
  var key = normalizeLookupWord(word);
  if (!key) return null;
  var cached = getCachedLocalLookup(key);
  if (cached) return cached;
  if (localVocabLookup[key]) {
    saveCachedLocalLookup(key, localVocabLookup[key]);
    return localVocabLookup[key];
  }
  return {
    meaning: '待补中文释义',
    type: '',
    source: '小说上下文',
    ru: selContext || '',
    zh: selTranslationContext || ''
  };
}

function renderLocalLookup(clean, result) {
  var contextHtml = '';
  if (result.ru || result.zh) {
    contextHtml =
      '<div class="dict-context">' +
        (result.ru ? '<div><b>原文</b>：' + escapeHtml(result.ru) + '</div>' : '') +
        (result.zh ? '<div><b>中文</b>：' + escapeHtml(result.zh) + '</div>' : '') +
      '</div>';
  }

  // 备选原形区块
  var altHtml = '';
  if (result._alternatives && result._alternatives.length) {
    altHtml = '<div class="dict-alternatives">' +
      '<span class="dict-alt-label">也作：</span>' +
      result._alternatives.map(function(a) {
        return '<span class="dict-alt-word">' + escapeHtml(a) + '</span>';
      }).join('、') +
      '</div>';
  }

  // 猜测标注
  var guessLabel = '';
  if (result._guessed) {
    guessLabel = '<div class="dict-guess-label">形态推测还原</div>';
  }

  return '<div class="dict-word">' + escapeHtml(clean) + '</div>' +
    (result.type ? '<div class="dict-pos">' + escapeHtml(result.type) + '</div>' : '') +
    '<div class="dict-meaning">' + escapeHtml(result.meaning || '暂未收录') + '</div>' +
    '<div class="dict-source">' + escapeHtml(result.source || '本地') + '</div>' +
    guessLabel +
    altHtml +
    contextHtml;
}

/* ─── 详情面板渲染（按词性展示富字段）─── */
function renderDetailPanel(word, result) {
  if (!result || !result.meaning || result.meaning === '暂未收录') {
    return '<div class="dict-word">' + escapeHtml(word) + '</div>' +
      '<div class="dict-meaning" style="color:var(--text-dim)">暂未收录</div>';
  }

  var raw = result._raw || {};
  var posType = ((raw.type || result.type || '')).toLowerCase();

  var html = '';

  // ── 头部：单词 + 词性 ──
  html += '<div class="dp-head">';
  html += '<div class="dp-word">' + escapeHtml(word) + '</div>';
  var posLabel = raw.type || result.type || '';
  html += '<div class="dp-pos">' + escapeHtml(posLabel) + '</div>';
  html += '</div>';

  // ── 释义 ──
  html += '<div class="dp-section">';
  html += '<div class="dp-meaning">' + escapeHtml(result.meaning) + '</div>';
  html += '</div>';

  // ── 体 / 性 ──
  if (posType === 'verb') {
    var hasVerbMeta = raw.aspect || raw.pair || raw.case_gov;
    if (hasVerbMeta) {
      html += '<div class="dp-section">';
      if (raw.aspect) {
        var aspectRaw = raw.aspect.toLowerCase();
        var aspectCN = aspectRaw.indexOf('несов') >= 0 || aspectRaw.indexOf('нсв') >= 0 ? '未完成体' :
                       ((aspectRaw.indexOf('сов') >= 0 && aspectRaw.indexOf('несов') < 0) || aspectRaw.indexOf('св') >= 0) ? '完成体' : raw.aspect;
        html += '<span class="dp-tag">' + escapeHtml(aspectCN) + '</span>';
      }
      if (raw.pair) {
        html += ' <span class="dp-pair">→ ' + escapeHtml(raw.pair) + '</span>';
      }
      if (raw.case_gov) {
        html += '<div class="dp-meta"><span class="dp-label">接格</span> ' + escapeHtml(raw.case_gov) + '</div>';
      }
      html += '</div>';
    }
  } else if (posType === 'noun' || posType === 'adj' || posType === 'adjective') {
    if (raw.gender) {
      var genLabel = raw.gender === 'masculine' || raw.gender === 'm' ? '阳性' :
                     raw.gender === 'feminine' || raw.gender === 'f' ? '阴性' :
                     raw.gender === 'neuter' || raw.gender === 'n' ? '中性' : raw.gender;
      html += '<div class="dp-section"><span class="dp-label">性</span> <span class="dp-tag">' + escapeHtml(genLabel) + '</span></div>';
    }
  }

  // ── 常用搭配 ──
  var colls = raw.collocations || [];
  if (colls.length > 0) {
    html += '<div class="dp-section">';
    html += '<div class="dp-section-title">常用搭配</div>';
    var maxColl = Math.min(colls.length, 4);
    for (var c = 0; c < maxColl; c++) {
      var col = colls[c];
      html += '<div class="dp-coll">';
      html += '<div class="dp-coll-phrase">' + escapeHtml(col.phrase || col.word || '') + '</div>';
      if (col.ru) html += '<div class="dp-coll-ru">' + escapeHtml(col.ru) + '</div>';
      if (col.zh) html += '<div class="dp-coll-zh">' + escapeHtml(col.zh) + '</div>';
      html += '</div>';
    }
    html += '</div>';
  }

  // ── 详细释义（折叠）───
  if (raw.detailZh && raw.detailZh.length > 5 && raw.detailZh !== '（待补充）') {
    html += '<div class="dp-section">';
    html += '<div class="dp-collapse-toggle" onclick="var n=this.nextElementSibling;n.classList.toggle(\'open\');this.classList.toggle(\'expanded\')">详细释义</div>';
    html += '<div class="dp-collapse-body"><div class="dp-detail">' + escapeHtml(raw.detailZh) + '</div></div>';
    html += '</div>';
  }

  // ── 例句 ──
  var examples = raw.examples || [];
  if (examples.length > 0) {
    html += '<div class="dp-section">';
    html += '<div class="dp-collapse-toggle" onclick="var n=this.nextElementSibling;n.classList.toggle(\'open\');this.classList.toggle(\'expanded\')">例句</div>';
    html += '<div class="dp-collapse-body">';
    var maxEx = Math.min(examples.length, 5);
    for (var e = 0; e < maxEx; e++) {
      var ex = examples[e];
      html += '<div class="dp-example">';
      if (ex.ru) html += '<div class="dp-ex-ru">' + escapeHtml(ex.ru) + '</div>';
      if (ex.zh) html += '<div class="dp-ex-zh">' + escapeHtml(ex.zh) + '</div>';
      html += '</div>';
    }
    html += '</div></div>';
  }

  // ── 变位/变格表（折叠）───
  if (raw.grammarTable && raw.grammarTable.length > 10 && raw.grammarTable !== '（待补充）') {
    html += '<div class="dp-section">';
    html += '<div class="dp-collapse-toggle" onclick="var n=this.nextElementSibling;n.classList.toggle(\'open\');this.classList.toggle(\'expanded\')">变位/变格表</div>';
    html += '<div class="dp-collapse-body" style="white-space:pre-wrap;font-size:13px">' + escapeHtml(raw.grammarTable) + '</div>';
    html += '</div>';
  }

  // ── 备选原形 ──
  if (result._alternatives && result._alternatives.length) {
    html += '<div class="dp-section">';
    html += '<span class="dp-alt-label">也作：</span>';
    html += result._alternatives.map(function(a) { return '<span class="dp-alt-word">' + escapeHtml(a) + '</span>'; }).join('、');
    html += '</div>';
  }

  // ── 猜测标注 ──
  if (result._guessed) {
    html += '<div class="dict-guess-label">形态推测还原</div>';
  }

  // ── AI 解析按钮 ──
  html += '<div class="dp-ai-section">';
  html += '<button class="dp-ai-btn" id="dpAiBtn" onclick="requestAiAnalysis()">AI 深度解析</button>';
  html += '</div>';

  // ── 来源标注 ──
  html += '<div class="dp-source">来源：' + escapeHtml(result.source || '本地词库') + '</div>';

  return html;
}

function highlightSavedWords() {
  if (!savedWords.length) return;
  var blocks = document.querySelectorAll('.para-block .ru-text');
  for (var b = 0; b < blocks.length; b++) {
    var text = blocks[b].textContent;
    var html = blocks[b].innerHTML;
    for (var w = 0; w < savedWords.length; w++) {
      var word = savedWords[w];
      if (text.toLowerCase().indexOf(word) < 0) continue;
      var re = new RegExp('(' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      html = html.replace(re, '<span class="highlight-word">$1</span>');
    }
    blocks[b].innerHTML = html;
  }
}

/* ══════════════════════════════════════════════
   搜索
   ══════════════════════════════════════════════ */
function toggleSearch() {
  var bar = document.getElementById('searchBar');
  bar.classList.toggle('visible');
  if (bar.classList.contains('visible')) document.getElementById('searchInput').focus();
  else closeSearch();
}
function closeSearch() {
  document.getElementById('searchBar').classList.remove('visible');
  document.getElementById('searchInput').value = '';
  clearSearchHighlights();
  searchMatches = []; searchIdx = -1;
  document.getElementById('searchCount').textContent = '';
}
function clearSearchHighlights() {
  var marks = document.querySelectorAll('.highlight-search');
  for (var i = 0; i < marks.length; i++) {
    var p = marks[i].parentNode;
    p.replaceChild(document.createTextNode(marks[i].textContent), marks[i]);
    p.normalize();
  }
}
function doSearch() {
  clearSearchHighlights();
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  searchMatches = []; searchIdx = -1;
  if (!q) { document.getElementById('searchCount').textContent = ''; return; }
  var blocks = document.querySelectorAll('.para-block');
  for (var b = 0; b < blocks.length; b++) {
    var texts = blocks[b].querySelectorAll('.ru-text, .cn-text');
    for (var t = 0; t < texts.length; t++) {
      var el = texts[t], walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
      var nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
      for (var n = 0; n < nodes.length; n++) {
        var lc = nodes[n].nodeValue.toLowerCase(), pos = lc.indexOf(q);
        if (pos < 0) continue;
        var range = document.createRange();
        range.setStart(nodes[n], pos); range.setEnd(nodes[n], pos + q.length);
        var mark = document.createElement('span');
        mark.className = 'highlight-search';
        range.surroundContents(mark);
        searchMatches.push(mark);
        n--; // re-check same node for multiple matches
      }
    }
  }
  document.getElementById('searchCount').textContent = searchMatches.length ? '0/' + searchMatches.length : '无结果';
  if (searchMatches.length) searchNav(1);
}
function searchNav(dir) {
  if (!searchMatches.length) return;
  if (searchIdx >= 0) searchMatches[searchIdx].classList.remove('current');
  searchIdx = (searchIdx + dir + searchMatches.length) % searchMatches.length;
  searchMatches[searchIdx].classList.add('current');
  searchMatches[searchIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
  document.getElementById('searchCount').textContent = (searchIdx + 1) + '/' + searchMatches.length;
}
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'f' && curView === 'reading') { e.preventDefault(); toggleSearch(); }
  if (e.key === 'Escape') closeSearch();
});
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); searchNav(e.shiftKey ? -1 : 1); }
});

/* ══════════════════════════════════════════════
   选词系统
   统一 click 事件在段落展开区块（上方）
   ══════════════════════════════════════════════ */

var _lastLookupWord = '';
function autoLookup(word) {
  var clean = normalizeLookupWord(word);
  if (!clean) return;
  _lastLookupWord = clean;

  var preview = document.getElementById('detailInner');
  preview.innerHTML = '<div class="dict-loading">查询中...</div>';

  var result = null;

  // 第1级：查内存映射表
  if (morphologyReady && morphologyDict[clean]) {
    var lemmas = morphologyDict[clean];
    for (var i = 0; i < lemmas.length; i++) {
      var r = lookupLocalChineseMeaning(lemmas[i]);
      if (r && r.meaning !== '待补中文释义') {
        result = r;
        result._morphoLemma = lemmas[i];
        if (lemmas.length > 1) {
          result._alternatives = lemmas.filter(function(l) { return l !== lemmas[i]; });
        }
        break;
      }
    }
  }

  // 第2级：JS 规则引擎
  if (!result && typeof morphologyGuess === 'function') {
    var guesses = morphologyGuess(clean);
    for (var g = 0; g < guesses.length; g++) {
      var r2 = lookupLocalChineseMeaning(guesses[g]);
      if (r2 && r2.meaning !== '待补中文释义') {
        result = r2;
        result._morphoLemma = guesses[g];
        result._guessed = true;
        break;
      }
    }
  }

  // 第3级：原词直查
  if (!result) {
    result = lookupLocalChineseMeaning(clean);
  }

  var inner = document.getElementById('detailInner');
  if (inner) inner.innerHTML = renderDetailPanel(clean, result);
  updateSaveButton(clean);
}
function updateSaveButton(word) {
  var records = {};
  try { records = JSON.parse(localStorage.getItem('vocabulary-review-records') || '{}'); } catch(e) {}
  var saveBtn = document.querySelector('.btn-save-vocab');
  if (!saveBtn) return;
  if (records[word]) {
    saveBtn.classList.add('saved');
    saveBtn.innerHTML = '<span class="icon">✓</span> 已在背单词中';
  } else {
    saveBtn.classList.remove('saved');
    saveBtn.innerHTML = '<span class="icon">⭐</span> 加入背单词';
  }
}
function doLookup() {
  if (!selText) return;
  var text = '单词：' + selText + '\n俄文：' + (selContext || '') + '\n中文：' + (selTranslationContext || '');
  navigator.clipboard.writeText(text)
    .then(function() { toast('📋 已复制中俄上下文'); })
    .catch(function() { toast('❌ 复制失败'); });
  closeDetailPanel();
}
function doAskAI() {
  if (!selText) return;
  navigator.clipboard.writeText('Что означает слово "' + selText + '" в этом контексте? Какая часть речи, форма, начальная форма? Дай краткий перевод на китайский.')
    .then(function() { toast('✅ 已复制'); }).catch(function() { toast('❌ 复制失败'); });
  closeDetailPanel();
}
function doSaveWord() {
  if (!selText) return;
  var preview = document.getElementById('detailInner');
  if (preview && preview.querySelector('.dict-loading')) { toast('⏳ 释义加载中，请稍候'); return; }
  var clean = selText.replace(/[^a-zA-Zа-яА-ЯёЁ-]/g, '').trim();
  if (!clean) { toast('❌ 无效'); closeDetailPanel(); return; }

  // 读取统一存储
  var records = {};
  try { records = JSON.parse(localStorage.getItem('vocabulary-review-records') || '{}'); } catch(e) {}

  // 重复检查
  if (records[clean]) { toast('⭐ 已存在: ' + clean); closeDetailPanel(); return; }

  // 获取释义
  var meaning = '', posEl = document.querySelector('#detailInner .dict-pos'), defEl = document.querySelector('#detailInner .dict-meaning');
  if (posEl) meaning += posEl.textContent + ' ';
  if (defEl) meaning += defEl.textContent;

  // 写入统一存储
  var today = new Date().toISOString().slice(0, 10);
  records[clean] = {
    mastery: 0,
    nextReview: today,
    interval: 1,
    easeFactor: 2.5,
    count: 0,
    source: 'novel',
    sourceBook: curBook ? curBook.id : null,
    sourceChapter: curCh,
    meaning: meaning.trim(),
    context: selContext ? selContext.substring(0, 300) : '',
    sourceSentenceRu: selContext ? selContext.substring(0, 500) : '',
    sourceSentenceZh: selTranslationContext ? selTranslationContext.substring(0, 500) : ''
  };
  localStorage.setItem('vocabulary-review-records', JSON.stringify(records));

  // 更新高亮
  savedWords.push(clean.toLowerCase());
  highlightSavedWords();
  toast('⭐ 已加入背单词: ' + clean);

  // 可选：同步到 server（Obsidian 备份）
  var source = curBook ? (curBook.title + ' 第' + (curCh + 1) + '章') : '';
  try {
    fetch('/api/novel-vocab', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        word: clean,
        meaning: meaning.trim(),
        type: posEl ? posEl.textContent : '',
        source: source,
        context: selContext ? selContext.substring(0, 300) : '',
        sourceSentenceRu: selContext ? selContext.substring(0, 500) : '',
        sourceSentenceZh: selTranslationContext ? selTranslationContext.substring(0, 500) : ''
      })
    });
  } catch(e) {}
  closeDetailPanel();
}
function hidePopup() { document.getElementById('selPopup').classList.remove('visible'); selText = ''; }

/* ══════════════════════════════════════════════
   滚动 / 完成 / 键盘
   ══════════════════════════════════════════════ */
var _scrollTimer = null;
window.addEventListener('scroll', function() {
  updateProgress();
  clearTimeout(_scrollTimer); _scrollTimer = setTimeout(saveLastRead, 500);
  var btn = document.getElementById('backTop');
  if (btn) { if (window.scrollY > 400) btn.classList.add('visible'); else btn.classList.remove('visible'); }
  if (chDone || curView !== 'reading' || curCh < 0 || isQuizFirstBook(curBook)) return;
  if (window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 100) {
    chDone = true; stopTimer();
    if (!readStats[curBook.id]) readStats[curBook.id] = {};
    var total = document.querySelectorAll('.para-block').length;
    readStats[curBook.id][curCh] = { completed: true, peeks: peekCount, time_spent_sec: readTimer, completed_at: new Date().toISOString() };
    saveStats();
    // 通知父页面（学习舱）阅读完成
    try { window.parent.postMessage({ type: 'NOVEL_CHAPTER_DONE', bookId: curBook.id, chapter: curCh, timeSec: readTimer, bookTitle: curBook.title }, '*'); } catch(e) {}
    var pct = total > 0 ? Math.round(peekCount / total * 100) : 0;
    document.getElementById('sumText').innerHTML =
      '📖 本章已读完<br>👁 <span class="stat">' + peekCount + '/' + total + '</span> 段 (' + pct + '%)<br>⏱ <span class="stat">' + Math.round(readTimer / 60) + '</span> 分钟';
    document.getElementById('chSummary').classList.add('visible');
  }
}, { passive: true });
function closeSummary() { document.getElementById('chSummary').classList.remove('visible'); }
document.addEventListener('keydown', function(e) {
  if (curView !== 'reading') return;
  var sel = window.getSelection(); if (sel && sel.toString().trim().length > 0) return;
  if (e.key === 'ArrowLeft' && curCh > 0) goChapter(curCh - 1);
  if (e.key === 'ArrowRight' && curCh < curBook.chapters - 1) goChapter(curCh + 1);
});

/* ══════════════════════════════════════════════
   阅读笔记导出
   ══════════════════════════════════════════════ */
function exportNotes() {
  if (!curBook) return;
  var bookId = curBook.id;
  var bookTitle = curBook.title;
  var dir = curBook.direction || 'cn→ru';
  var bookMarks = bookmarks[bookId] || {};
  var chapterKeys = Object.keys(bookMarks).filter(function(k) { return bookMarks[k] && bookMarks[k].length > 0; });

  // 收集收藏段落：需要从缓存或 fetch 获取章节数据
  var tasks = chapterKeys.map(function(chIdx) {
    var cached = cacheGet(bookId, parseInt(chIdx));
    if (cached) return Promise.resolve({ idx: parseInt(chIdx), data: cached });
    return fetchChapter(bookId, parseInt(chIdx))
      .then(function(d) { return d ? { idx: parseInt(chIdx), data: d } : null; })
      .catch(function() { return null; });
  });

  Promise.all(tasks).then(function(results) {
    var lines = [];
    lines.push('---');
    lines.push('title: ' + bookTitle + ' 阅读笔记');
    lines.push('exported: ' + new Date().toISOString().split('T')[0]);
    lines.push('type: 阅读笔记');
    lines.push('---');
    lines.push('');
    lines.push('# 📖 ' + bookTitle + ' 阅读笔记');
    lines.push('');

    // 收藏段落
    var hasBookmarks = false;
    results.filter(Boolean).forEach(function(r) {
      var paras = r.data.original || [];
      var trans = r.data.translated || [];
      var marks = bookMarks[String(r.idx)] || [];
      if (!marks.length) return;
      if (!hasBookmarks) { lines.push('## ⭐ 收藏段落'); lines.push(''); hasBookmarks = true; }
      lines.push('### 第' + (r.idx + 1) + '章 ' + (r.data.title || ''));
      lines.push('');
      marks.forEach(function(pi) {
        var front = dir === 'cn→ru' ? (trans[pi] || '') : (paras[pi] || '');
        var back = dir === 'cn→ru' ? (paras[pi] || '') : (trans[pi] || '');
        if (front.trim()) {
          lines.push('> ' + front.trim());
          if (back.trim()) lines.push('> ' + back.trim());
          lines.push('');
        }
      });
    });

    // 生词
    var bookWords = savedWordsData.filter(function(w) {
      return w.source && w.source.indexOf(bookTitle) >= 0;
    });
    if (bookWords.length > 0) {
      lines.push('## 📝 生词');
      lines.push('');
      lines.push('| 单词 | 释义 | 来源 |');
      lines.push('|------|------|------|');
      bookWords.forEach(function(w) {
        lines.push('| ' + w.word + ' | ' + (w.meaning || '') + ' | ' + (w.source || '') + ' |');
      });
      lines.push('');
    }

    if (!hasBookmarks && !bookWords.length) {
      lines.push('暂无收藏段落或生词记录。');
      lines.push('');
    }

    // 生成文件下载
    var md = lines.join('\n');
    var blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = bookTitle.replace(/[<>:"/\\|?*]/g, '_') + '-阅读笔记.md';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('📋 笔记已导出');
  }).catch(function() {
    toast('❌ 导出失败');
  });
}

/* ══════════════════════════════════════════════
   读书报告
   ══════════════════════════════════════════════ */
function showBookReport() {
  if (!curBook) return;
  var stats = readStats[curBook.id] || {};
  var done = 0, totalTime = 0, totalPeeks = 0, totalParas = 0;
  for (var k in stats) {
    if (stats[k] && stats[k].completed) {
      done++;
      totalTime += stats[k].time_spent_sec || 0;
      totalPeeks += stats[k].peeks || 0;
    }
  }
  var pct = curBook.chapters > 0 ? Math.round(done / curBook.chapters * 100) : 0;
  var avgPeek = done > 0 ? Math.round(totalPeeks / done) : 0;
  var vocabCount = savedWords.length;
  var body = document.getElementById('reportBody');
  if (done === 0) {
    body.innerHTML = '<p style="color:var(--text-dim);margin:16px 0;">还没有阅读记录，开始阅读第一章后这里会显示统计。</p>';
    document.getElementById('bookReport').classList.add('visible');
    return;
  }
  body.innerHTML =
    '<div class="report-stats">' +
      '<div class="report-item"><div class="val">' + done + '</div><div class="lbl">已读章节</div></div>' +
      '<div class="report-item"><div class="val">' + Math.round(totalTime / 60) + '</div><div class="lbl">总阅读分钟</div></div>' +
      '<div class="report-item"><div class="val">' + avgPeek + '</div><div class="lbl">平均查看原文</div></div>' +
      '<div class="report-item"><div class="val">' + vocabCount + '</div><div class="lbl">保存生词</div></div>' +
    '</div>' +
    '<div class="report-bar"><div class="report-bar-label">阅读进度 ' + pct + '%</div>' +
      '<div class="report-bar-track"><div class="report-bar-fill" style="width:' + pct + '%"></div></div></div>';
  document.getElementById('bookReport').classList.add('visible');
}

/* ══════════════════════════════════════════════
   初始化
   ══════════════════════════════════════════════ */
applyTheme();
loadSavedWords();
loadLocalLookupData();  // 启动词典加载（异步）
initMorphology();  // 后台异步加载形态映射表

if (_jumpBook) {
  fetchIndex()
    .then(function(data) {
      if (!data) { showShelf(); return; }
      booksData = data.books;
      var target = booksData.find(function(b) { return b.id === _jumpBook; });
      if (target) {
        curBook = target;
        var chIdx = _jumpCh ? parseInt(_jumpCh, 10) : 0;
        if (isNaN(chIdx) || chIdx < 0) chIdx = 0;
        window.history.replaceState({}, '', 'reader.html');
        _jumpBook = null;
        goChapter(chIdx);
      } else { showShelf(); }
    }).catch(function() { showShelf(); });
} else if (lr && lr.bookId && typeof lr.chapter === 'number') {
  fetchIndex()
    .then(function(data) {
      if (!data) { showShelf(); return; }
      booksData = data.books;
      for (var i = 0; i < booksData.length; i++) {
        if (booksData[i].id === lr.bookId) { curBook = booksData[i]; goChapter(lr.chapter); return; }
      }
      showShelf();
    }).catch(function() { showShelf(); });
} else { showShelf(); }
