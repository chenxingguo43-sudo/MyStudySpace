<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📖 小说阅读 — 俄语学习舱</title>
<style>
/* ─── 主题变量 ─── */
:root {
  --bg: #020617; --surface: rgba(15,23,42,0.6); --surface-solid: #0f172a;
  --glass: rgba(255,255,255,0.06); --glass-border: rgba(255,255,255,0.10);
  --glass-hover: rgba(255,255,255,0.10);
  --text: rgba(255,255,255,0.90); --text-secondary: rgba(255,255,255,0.55);
  --text-dim: rgba(255,255,255,0.38);
  --accent: #818cf8; --accent-dim: rgba(129,140,248,0.20); --accent-border: rgba(129,140,248,0.30);
  --success: #34d399; --warning: #fbbf24;
  --ru-text: rgba(255,255,255,0.88); --cn-text: rgba(255,255,255,0.52);
  --border: rgba(255,255,255,0.08); --para-hover: rgba(255,255,255,0.04);
  --para-expanded-border: rgba(129,140,248,0.4);
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --highlight-word: rgba(251,191,36,0.25); --highlight-search: rgba(56,189,248,0.30);
}
body.theme-sepia {
  --bg: #1a1410; --surface: rgba(30,24,18,0.6); --surface-solid: #1e1812;
  --glass: rgba(180,150,100,0.08); --glass-border: rgba(180,150,100,0.15);
  --glass-hover: rgba(180,150,100,0.12);
  --text: rgba(230,210,170,0.92); --text-secondary: rgba(200,170,120,0.58);
  --text-dim: rgba(180,150,100,0.42);
  --accent: #d4a574; --accent-dim: rgba(212,165,116,0.20); --accent-border: rgba(212,165,116,0.30);
  --ru-text: rgba(230,210,170,0.90); --cn-text: rgba(200,170,120,0.52);
  --border: rgba(180,150,100,0.12); --para-hover: rgba(180,150,100,0.05);
  --para-expanded-border: rgba(212,165,116,0.4);
  --highlight-word: rgba(212,165,116,0.25); --highlight-search: rgba(100,180,220,0.25);
  --success: #34d399;
}
body.theme-warm {
  --bg: #ECE1C7; --surface: rgba(236,225,199,0.85); --surface-solid: #E6DABB;
  --glass: rgba(0,0,0,0.03); --glass-border: rgba(0,0,0,0.08);
  --glass-hover: rgba(0,0,0,0.06);
  --text: rgba(40,35,25,0.92); --text-secondary: rgba(80,65,40,0.68);
  --text-dim: rgba(80,65,40,0.50);
  --accent: #8c5a1e; --accent-dim: rgba(140,90,30,0.15); --accent-border: rgba(140,90,30,0.30);
  --ru-text: rgba(40,35,25,0.92); --cn-text: rgba(80,65,40,0.60);
  --border: rgba(0,0,0,0.08); --para-hover: rgba(0,0,0,0.03);
  --para-expanded-border: rgba(140,90,30,0.3);
  --shadow: 0 4px 16px rgba(0,0,0,0.06);
  --highlight-word: rgba(200,160,60,0.25); --highlight-search: rgba(60,140,200,0.20);
  --success: #0d6b4c;
}
body.theme-paper {
  --bg: #f5f0e8; --surface: rgba(245,240,232,0.8); --surface-solid: #efe8dc;
  --glass: rgba(0,0,0,0.03); --glass-border: rgba(0,0,0,0.08);
  --glass-hover: rgba(0,0,0,0.06);
  --text: rgba(30,25,18,0.90); --text-secondary: rgba(80,60,40,0.55);
  --text-dim: rgba(80,60,40,0.35);
  --accent: #7c5e3c; --accent-dim: rgba(124,94,60,0.12); --accent-border: rgba(124,94,60,0.25);
  --ru-text: rgba(30,25,18,0.90); --cn-text: rgba(80,60,40,0.55);
  --border: rgba(0,0,0,0.06); --para-hover: rgba(0,0,0,0.03);
  --para-expanded-border: rgba(124,94,60,0.3);
  --shadow: 0 4px 16px rgba(0,0,0,0.08);
  --highlight-word: rgba(200,160,60,0.20); --highlight-search: rgba(60,140,200,0.20);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', 'Noto Sans SC', sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.8; min-height: 100vh;
  overflow-x: hidden; -webkit-font-smoothing: antialiased; transition: background 0.3s, color 0.3s;
  text-rendering: optimizeLegibility;
}
/* 全局俄语文字使用衬线字体，覆盖所有编辑器生成的动态内容 */
.expr-ru, .ru-expression-tag .ru-word, .ru-word, .ws-replica, .dp-coll-ru, .dp-ex-ru,
.ru-expression-tag, .expression-zh ~ .expr-ru {
  font-family: 'Noto Serif', 'PT Serif', Georgia, 'Segoe UI', serif;
  font-variant-ligatures: common-ligatures;
  font-variant-position: normal;
}
.ru-word[data-stress-source="auto"] { text-decoration: underline dotted color-mix(in srgb, var(--accent) 55%, transparent); text-underline-offset: 0.16em; }
.ru-word[data-stress-source="source"] { text-decoration: underline dotted color-mix(in srgb, var(--success) 55%, transparent); text-underline-offset: 0.16em; }
/* ─── 自定义滚动条 ─── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--text-dim); border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
.bg-orb { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(80px); opacity: 0.12; }
.bg-orb-1 { width: 400px; height: 400px; background: #4F46E5; top: -100px; left: -100px; }
.bg-orb-2 { width: 300px; height: 300px; background: #7C3AED; bottom: -80px; right: -80px; }

/* ─── 顶部进度条 ─── */
.progress-top { position: fixed; top: 0; left: 0; height: 3px; background: var(--accent); z-index: 200; transition: width 0.15s; width: 0; border-radius: 0 2px 2px 0; }

/* ─── 工具栏 ─── */
.toolbar {
  position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between;
  background: rgba(10,10,20,0.88); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border); padding: 0 12px; min-height: 48px;
}
.toolbar-left, .toolbar-right { display: flex; gap: 4px; align-items: center; }
.toolbar-center { display: flex; align-items: center; gap: 8px; }
.toolbar-title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
.toolbar-timer { font-size: 12px; color: var(--text-dim); font-variant-numeric: tabular-nums; margin-right: 4px; }
.tb-btn {
  background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-secondary);
  font-size: 16px; padding: 6px 10px; cursor: pointer; border-radius: 8px;
  min-width: 36px; min-height: 36px; transition: all 0.15s; display: flex; align-items: center; justify-content: center;
}
.tb-btn:hover { background: var(--glass-hover); color: var(--text); }
.tb-btn:active { transform: scale(0.95); }
.mode-tabs { display: flex; border: 1px solid var(--glass-border); border-radius: 8px; overflow: hidden; }
.mode-btn {
  background: 0; border: 0; color: var(--text-dim); font-size: 12px; padding: 5px 10px; cursor: pointer;
  border-right: 1px solid var(--glass-border); transition: all 0.15s; font-family: inherit;
}
.mode-btn:last-child { border-right: 0; }
.mode-btn:hover { color: var(--text-secondary); }
.mode-btn.active { background: var(--accent-dim); color: var(--accent); }

/* ─── 搜索栏 ─── */
.search-bar {
  display: none; position: sticky; top: 48px; z-index: 90;
  background: var(--surface-solid); border-bottom: 1px solid var(--border);
  padding: 6px 12px; gap: 8px; align-items: center;
}
.search-bar.visible { display: flex; }
.search-input {
  flex: 1; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 6px;
  padding: 6px 10px; color: var(--text); font-size: 14px; outline: none; font-family: inherit;
}
.search-input:focus { border-color: var(--accent-border); }
.search-count { font-size: 12px; color: var(--text-dim); white-space: nowrap; min-width: 60px; text-align: center; }
.search-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 18px; padding: 4px; }
.search-nav { display: flex; gap: 2px; }
.search-nav button { background: var(--glass); border: 1px solid var(--glass-border); color: var(--text-secondary); cursor: pointer; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
.search-nav button:hover { background: var(--glass-hover); }

/* ─── 阅读统计条 ─── */
.peek-counter {
  text-align: center; font-size: 13px; color: var(--text-dim); padding: 6px;
}
.search-bar.visible + .peek-counter { top: 96px; }

/* ─── 主容器 ─── */
.main-container { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 20px 16px 100px; }

/* ─── 分屏布局容器 ─── */
.reader-layout {
  position: relative; z-index: 1;
  display: flex; flex-direction: row;
  width: 100%; max-width: none;
  padding: 0 0 60px;
}
/* 阅读区：flex-basis 百分比由 JS 动态控制 */
.reader-pane {
  flex: 0 0 70%;   /* 默认 70%，JS 可覆盖 */
  min-width: 25%;   /* 最小 25% */
  max-width: 85%;   /* 最大 85% */
  padding-left: 16px; padding-right: 8px;
}
/* 阅读区内的内容去除主容器最大宽度限制 */
.reader-pane .chapter-content { max-width: none; }
/* 分割线 */
.resize-handle {
  width: 8px; flex-shrink: 0; cursor: col-resize;
  background: transparent; border-radius: 4px;
  transition: background 0.2s;
  touch-action: none;         /* 禁止浏览器默认手势 */
  align-self: stretch;
  user-select: none;          /* 防止拖拽时选中文字 */
  -webkit-user-select: none;
}
.resize-handle:hover { background: var(--accent); opacity: 0.5; }
.resize-handle.active { background: var(--accent); opacity: 1; box-shadow: 0 0 12px var(--accent-dim); }
/* 详情面板 */
.detail-panel {
  flex: 1;                    /* 自动填满剩余空间 */
  min-width: 0;               /* 允许收缩 */
  position: sticky; top: 0; align-self: flex-start;
  max-height: 100vh; overflow-y: auto;
  /* 注意：无 transition！拖拽需要即时响应 */
}
.detail-panel-inner { padding: 20px; }
.dictionary-drawer-handle {
  display: none; border: 0; padding: 0; cursor: ns-resize;
  background: var(--text-dim);
}
.dictionary-global-panel {
  position: fixed; top: 48px; right: 0; bottom: 0; z-index: 210;
  width: min(420px, 38vw); max-height: none; padding-top: 8px;
  background: var(--surface-solid); border-left: 1px solid var(--border);
  box-shadow: -14px 0 42px rgba(0,0,0,0.2);
}
.dictionary-global-panel[data-dictionary-state="closed"] { display: none; }
.dictionary-phrase-lookup {
  position: fixed; z-index: 240; transform: translateX(-50%);
  border: 0; border-radius: 999px; padding: 8px 14px;
  color: white; background: var(--accent); box-shadow: 0 8px 24px rgba(0,0,0,0.24);
  font: 600 13px/1.2 var(--ui-font); cursor: pointer;
}
.dictionary-phrase-lookup[hidden] { display: none; }
/* 面板占位提示 */
.detail-placeholder {
  display: flex; align-items: center; justify-content: center;
  min-height: 200px; color: var(--text-dim); font-size: 14px;
  text-align: center; line-height: 1.8; padding: 20px;
}
/* ─── 叠加遮罩（竖屏）─── 已移除 .detail-overlay ─── */

/* ─── 面板卡片内容 ─── */
.dp-head { margin-bottom: 16px; }
.dict-morph-compact { margin: 10px 0 14px; padding: 10px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
.dict-morph-compact strong, .dict-morph-compact span { display: block; overflow-wrap: anywhere; }
.dict-morph-compact span { margin-top: 4px; color: var(--text-secondary); font-size: 13px; }
.dp-word { font-size: 1.4em; font-weight: 700; color: var(--accent); margin-bottom: 4px; font-family: 'Segoe UI', system-ui, 'Noto Serif', serif; }
.dp-pos { font-size: 13px; color: var(--text-dim); }
.dp-section { margin-bottom: 16px; }
.dp-meaning { font-size: 1.1em; color: var(--text); line-height: 1.6; }
.dp-label { font-size: 12px; color: var(--text-dim); margin-right: 6px; }
.dp-tag { font-size: 12px; background: var(--accent-dim); color: var(--accent); padding: 1px 8px; border-radius: 4px; }
.dp-pair { font-size: 13px; color: var(--text-secondary); margin-left: 8px; }
.dp-meta { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
.dp-section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; }

/* 搭配 */
.dp-coll { margin-bottom: 8px; padding: 6px 10px; background: rgba(255,255,255,0.04); border-radius: 6px; }
.dp-coll-phrase { font-size: 14px; color: var(--accent); font-weight: 500; }
.dp-coll-ru { font-size: 13px; color: var(--ru-text); margin-top: 2px; }
.dp-coll-zh { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

/* 折叠 */
.dp-collapse-toggle { font-size: 13px; color: var(--text-secondary); cursor: pointer; padding: 4px 0; user-select: none; }
.dp-collapse-toggle:hover { color: var(--accent); }
.dp-collapse-toggle.expanded::after { content: ' ▾'; }
.dp-collapse-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
.dp-collapse-body.open { max-height: 600px; overflow-y: auto; }
.dp-detail { font-size: 13px; color: var(--text-secondary); line-height: 1.7; margin-top: 6px; }

/* 例句 */
.dp-example { margin-bottom: 8px; padding: 6px 10px; background: rgba(255,255,255,0.03); border-radius: 6px; }
.dp-ex-ru { font-size: 13px; color: var(--ru-text); line-height: 1.6; }
.dp-ex-zh { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

/* 备选原形 */
.dp-alt-label { font-size: 12px; color: var(--text-dim); }
.dp-alt-word { font-size: 12px; color: var(--text-secondary); margin-left: 4px; }

/* 🤖 AI */
.dp-ai-section { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--border); }
.dp-ai-btn { width: 100%; padding: 10px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text-secondary); cursor: pointer; font-size: 14px; font-family: inherit; transition: all 0.2s; }
.dp-ai-btn:hover { background: var(--glass-hover); color: var(--accent); }
.dp-ai-btn.loading { opacity: 0.6; pointer-events: none; }
.dp-ai-result { margin-top: 12px; font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
.dp-ai-result:empty { display: none; }

/* 来源 */
.dp-source { margin-top: 12px; font-size: 11px; color: var(--text-dim); }

/* ─── 书架 ─── */
.bookshelf { display: grid; gap: 16px; padding: 24px 0; }
.book-card {
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: 16px;
  padding: 20px; cursor: pointer; transition: all 0.2s;
}
.book-card:hover { background: var(--glass-hover); transform: translateY(-2px); box-shadow: var(--shadow); }
.book-card:active { transform: scale(0.98); }
.book-card h3 { font-size: 1.1em; margin-bottom: 6px; }
.book-card .book-meta { font-size: 13px; color: var(--text-secondary); display: flex; gap: 12px; }
.book-card .book-desc { font-size: 13px; color: var(--text-dim); margin-top: 8px; }
.book-card .book-progress { margin-top: 12px; }
.b2-dashboard { max-width: 1080px; }
.b2-dashboard-hero { padding: 26px; margin-bottom: 20px; border: 1px solid var(--accent-border); border-radius: 18px; background: linear-gradient(135deg, var(--accent-dim), var(--surface)); }
.b2-dashboard-hero h1 { margin-bottom: 6px; }
.b2-continue-card { display: grid; grid-template-columns: 1fr auto; gap: 6px 18px; align-items: center; margin-bottom: 20px; padding: 20px; border: 1px solid var(--accent-border); border-radius: 16px; background: var(--surface-solid); }
.b2-continue-card p, .b2-continue-card h2, .b2-continue-card small { grid-column: 1; }
.b2-continue-card p { color: var(--accent); font-size: 13px; font-weight: 600; }
.b2-continue-card h2 { font-size: 20px; }
.b2-continue-card small { color: var(--text-secondary); }
.b2-continue-card button { grid-column: 2; grid-row: 1 / 4; padding: 9px 14px; border: 1px solid var(--accent-border); border-radius: 10px; background: var(--accent-dim); color: var(--accent); cursor: pointer; font: inherit; font-weight: 600; }
.b2-module-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.b2-module-card { text-align: left; color: var(--text); border: 1px solid var(--glass-border); border-radius: 15px; background: var(--glass); padding: 18px; cursor: pointer; font: inherit; transition: transform .15s, background .15s; }
.b2-module-card:hover { transform: translateY(-2px); background: var(--glass-hover); }
.b2-module-card strong, .b2-module-card span, .b2-module-card small { display: block; }
.b2-module-card strong { font-size: 18px; margin-bottom: 6px; }
.b2-module-card span { color: var(--accent); font-size: 13px; }
.b2-module-card small { color: var(--text-secondary); margin-top: 8px; }
.b2-module-card .b2-module-progress { position: relative; height: 6px; margin-top: 12px; overflow: hidden; border-radius: 999px; background: var(--surface-solid); }
.b2-module-card .b2-module-progress::after { content: ''; position: absolute; inset: 0 auto 0 0; width: var(--progress); border-radius: inherit; background: var(--accent); }
.manual-completion { margin-top: 12px; border-color: var(--accent-border); color: var(--accent); }
@media (max-width: 540px) { .b2-continue-card { grid-template-columns: 1fr; } .b2-continue-card button { grid-column: 1; grid-row: auto; margin-top: 8px; } }
.book-kind { color: var(--accent); font-size: 0.7em; margin-right: 6px; font-weight: 600; letter-spacing: 0.04em; }
.b2-quiz-item { margin: 0 0 18px; padding: 20px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.reading-practice-question .b2-options { margin-top: 12px; }
.reading-answer-source { display: block; margin-top: 10px; color: var(--text-dim); font-size: 12px; }
.writing-workbench { margin-top: 20px; }
.writing-workbench section { margin: 18px 0; padding: 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.writing-draft { width: 100%; min-height: 260px; padding: 14px; border: 1px solid var(--glass-border); border-radius: 10px; background: var(--surface-solid); color: var(--text); font: 16px/1.7 'Crimson Pro', 'Noto Serif', serif; resize: vertical; }
.writing-draft:focus { outline: 2px solid var(--accent-border); border-color: var(--accent); }
.writing-status { color: var(--text-dim); font-size: 13px; margin-top: 8px; }
.writing-source-task { border-left: 4px solid var(--accent) !important; }
.writing-materials-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.writing-material-card { margin: 0 !important; padding: 16px !important; background: var(--glass) !important; }
.writing-material-card h3 { margin-bottom: 8px; }
.writing-facts { margin-top: 10px; color: var(--text-secondary); font-size: 14px; }
.writing-metadata { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.writing-metadata span { padding: 4px 9px; border-radius: 999px; background: var(--accent-dim); color: var(--accent); font-size: 12px; }
.writing-support-box { border-left: 3px solid var(--warning) !important; }
@media (max-width: 720px) { .writing-materials-grid { grid-template-columns: 1fr; } }
.speaking-practice { margin-top: 20px; }
.speaking-practice section, .speaking-practice details { margin: 18px 0; padding: 18px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); }
.speaking-practice .source-warning { border-left: 3px solid var(--warning); color: var(--text-secondary); }

/* ─── 写作口语 (writing-speaking) ─── */
.ws-chapter { max-width: 860px; margin: 0 auto; padding: 0 20px 60px; }
.ws-section-header {
  display: flex; align-items: center; gap: 8px; padding: 0;
}
.ws-section-header h2 { font-size: 1.15em; font-weight: 600; color: var(--text); margin: 0; flex: 1; }
.ws-task-badge {
  padding: 3px 10px; border-radius: 999px; font-size: 0.78em; font-weight: 500;
  background: var(--accent-dim); color: var(--accent);
}
.ws-task-type-badge {
  padding: 3px 10px; border-radius: 999px; font-size: 0.78em; font-weight: 500;
  background: var(--accent-dim); color: var(--success);
}
.ws-reading-text {
  font-size: 1.02em; line-height: 1.9; color: var(--ru-text); font-weight: 500; font-family: Georgia, 'Noto Serif', 'Segoe UI', serif;
  white-space: pre-wrap; margin: 12px 0;
}
.ws-reading-note {
  margin-top: 10px; padding: 8px 12px; border-radius: 8px;
  background: rgba(251,191,36,0.10); color: var(--text-secondary); font-size: 0.85em;
}
.ws-vocab-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px;
}
.ws-vocab-item {
  padding: 12px 16px; border-radius: 10px; background: var(--glass);
  border: 1px solid var(--glass-border);
}
.ws-vocab-item .ru-word { font-weight: 600; color: var(--ru-text); font-size: 1.02em; font-family: Georgia, 'Noto Serif', 'Segoe UI', serif; }
.ws-vocab-item .task-label { color: var(--text-secondary); font-size: 0.82em; margin-top: 4px; }

.b2-option-row.pending { animation: pulse-select 0.6s ease; }

/* ─── 章节目录 ─── */
.chapter-list-header { padding: 16px 0; }

.ch-item {
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: 10px;
  padding: 10px 8px; text-align: center; cursor: pointer; transition: all 0.15s; font-size: 13px;
}
.ch-item:hover { background: var(--glass-hover); color: var(--accent); }

.ch-num { font-weight: 600; display: block; margin-bottom: 2px; }
.ch-title { font-size: 11px; color: var(--text-dim); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.world-chapter-directory { max-width: 1240px; }

.world-chapter-item { min-height: 66px; padding: 9px 12px; display: flex; align-items: center; gap: 10px; text-align: left; }

.listening-directory { display: grid; gap: 14px; padding: 8px 0 30px; }
.listening-section { border: 1px solid var(--accent-border); border-radius: 14px; background: var(--surface-solid); box-shadow: 0 4px 12px rgba(120, 90, 40, 0.05); overflow: clip; }
.listening-section summary { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 15px 16px; color: var(--text); cursor: pointer; font-weight: 650; list-style: none; }
.listening-section summary::-webkit-details-marker { display: none; }
.listening-section summary::after { content: '∨'; color: var(--accent); font-size: 20px; line-height: 1; }
.listening-section[open] summary::after { content: '∧'; }
.listening-section-label { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }

.listening-entry.done .listening-entry-num { color: var(--success); }
body.theme-warm .listening-section { background: #e6ddc9; border-color: rgba(139, 119, 89, .20); box-shadow: none; }

@media (max-width: 760px) { .listening-entry-grid { grid-template-columns: 1fr; } }
@media (max-width: 600px) {
  .world-chapter-grid { grid-template-columns: 1fr; }

.chapter-header h1 { font-size: 1.5em; font-weight: 700; margin-bottom: 4px; }
.chapter-header h2 { font-size: 1.1em; color: var(--text-secondary); font-weight: 400; }
.para-block {
  margin-bottom: 0.6em; border-radius: 8px; cursor: pointer; padding: 6px 10px;
  border-left: 3px solid transparent; transition: all 0.2s; position: relative;
}
.para-block:hover { background: var(--para-hover); }
.para-block.expanded { border-left-color: var(--para-expanded-border); }
.para-block:hover .para-actions { opacity: 1; }
.ru-text { color: var(--ru-text); font-size: 1.05em; line-height: 1.9; font-family: Georgia, 'Noto Serif', 'Segoe UI', serif; text-rendering: optimizeLegibility; font-feature-settings: "kern" 1, "liga" 1; text-indent: 2em; }
.cn-text { text-indent: 2em; }
.para-block:not(.expanded) .ru-text::after { content: " ▸"; font-size: .6em; color: var(--text-dim); }
.cn-text {
  color: var(--cn-text); margin: 0; padding: 0; max-height: 0; overflow: hidden; opacity: 0;
  transition: max-height 0.35s ease, opacity 0.25s ease, padding 0.25s; font-size: 0.95em;
}
.cn-text.visible { max-height: none; opacity: 1; padding: 4px 0 4px 0.8em; border-left: 2px solid var(--border); }
.para-actions {
  position: absolute; right: 4px; top: 4px; opacity: 0; transition: opacity 0.15s;
  display: flex; gap: 2px;
}
.para-actions button {
  background: var(--glass); border: 1px solid var(--glass-border); border-radius: 4px;
  color: var(--text-dim); font-size: 12px; padding: 2px 6px; cursor: pointer;
}
.para-actions button:hover { color: var(--accent); background: var(--accent-dim); }
.para-actions button.bookmarked { color: var(--warning); }
.highlight-word { background: var(--highlight-word); border-radius: 2px; padding: 0 1px; }
.highlight-search { background: var(--highlight-search); border-radius: 2px; padding: 0 1px; outline: 1px solid rgba(56,189,248,0.4); }
.highlight-search.current { outline: 2px solid rgba(56,189,248,0.8); }

/* ─── 可点击单词 ─── */
.ru-word { cursor: pointer; border-radius: 2px; transition: background 0.1s; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.ru-word:hover { background: var(--highlight-word); }
.ru-word:active { background: var(--accent-dim); }

/* ─── 右上悬浮功能按钮 ─── */
.fab-group-top {
  position: fixed; top: 12px; right: 12px; z-index: 150;
  display: flex; gap: 8px;
}
.fab-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(255,255,255,0.3);
  border: 1px solid rgba(255,255,255,0.4);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  color: rgba(40,35,25,0.85); font-size: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s, box-shadow 0.2s;
}
.fab-btn:hover {
  background: rgba(255,255,255,0.5);
  box-shadow: 0 4px 16px rgba(0,0,0,0.10);
}
.fab-btn:active { transform: scale(0.92); }
.fab-btn:focus-visible, .fab-nav:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }

/* ─── 双页学习导航 ─── */
.reader-page-switcher {
  position: fixed; top: 12px; left: 12px; z-index: 150;
  display: inline-flex; align-items: center; padding: 3px;
  background: rgba(255,255,255,0.3); border: 1px solid rgba(255,255,255,0.4);
  border-radius: 10px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.reader-page-switcher button {
  min-height: 32px; border: 0; border-radius: 7px; padding: 0 10px;
  background: transparent; color: var(--text-secondary); cursor: pointer;
  font: inherit; font-size: 13px; white-space: nowrap;
}
.reader-page-switcher button:hover { background: rgba(255,255,255,0.22); color: var(--text); }
.reader-page-switcher button.is-active { background: var(--surface-solid); color: var(--accent); font-weight: 700; }
.reader-page-switcher button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ─── 右下悬浮章节导航 ─── */
.fab-group-bottom {
  position: fixed; bottom: 16px; right: 12px; z-index: 150;
  display: flex; align-items: center; gap: 8px;
}
.fab-nav {
  height: 36px; padding: 0 14px; border-radius: 18px;
  background: rgba(255,255,255,0.3);
  border: 1px solid rgba(255,255,255,0.4);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  color: rgba(40,35,25,0.85); font-size: 13px; cursor: pointer;
  display: flex; align-items: center; gap: 4px;
  transition: background 0.2s, box-shadow 0.2s; font-family: inherit;
}
.fab-nav:hover {
  background: rgba(255,255,255,0.5);
  box-shadow: 0 4px 16px rgba(0,0,0,0.10);
}
.fab-nav:active { transform: scale(0.95); }
.fab-nav.disabled { color: rgba(40,35,25,0.3); opacity: 0.5; pointer-events: none; }
.fab-chapter {
  font-size: 12px; color: rgba(40,35,25,0.65); padding: 0 4px;
}

/* ─── 面板关闭按钮 ─── */
.detail-close {
  position: sticky; top: 0; right: 0; z-index: 10;
  float: right;
  width: 28px; height: 28px; line-height: 28px; text-align: center;
  border-radius: 50%; cursor: pointer;
  color: var(--text-dim); font-size: 14px;
  background: var(--glass); border: 1px solid var(--glass-border);
  transition: all 0.15s;
}
.detail-close:hover { color: var(--text); background: var(--glass-hover); }

/* ─── 选词弹窗 ─── */
.selection-popup {
  position: fixed; z-index: 200; background: var(--surface-solid); border: 1px solid var(--glass-border);
  border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,0.5); overflow: hidden;
  display: none; flex-direction: column; min-width: 180px;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
}
.selection-popup.visible { display: flex; }
.selection-popup .popup-header { padding: 8px 14px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--border); font-weight: 500; }
.selection-popup button .icon { font-size: 16px; width: 20px; text-align: center; }
.dict-preview { padding: 10px 14px; border-bottom: 1px solid var(--border); font-size: 13px; color: var(--text-secondary); max-height: 120px; overflow-y: auto; line-height: 1.6; }
.dict-preview .dict-word { font-weight: 600; color: var(--accent); font-size: 14px; }
.dict-preview .dict-pos { font-style: italic; color: var(--text-dim); font-size: 12px; }
.dict-preview .dict-meaning { margin-top: 4px; }
.dict-loading { padding: 8px 14px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
/* ─── 备选原形 ─── */
.dict-alternatives {
  margin-top: 8px; padding: 6px 10px;
  background: rgba(255,255,255,0.04); border-radius: 6px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  font-size: 12px; color: var(--text-dim); line-height: 1.6;
}
.dict-alt-label { color: var(--text-dim); }
.dict-alt-word { color: var(--text-secondary); }
.dict-guess-label {
  margin-top: 4px; font-size: 11px; color: var(--text-dim);
  font-style: italic;
}
.dict-context {
  margin-top: 8px; padding: 6px 8px;
  background: rgba(255,255,255,0.03); border-radius: 4px;
  font-size: 12px; color: var(--text-secondary); line-height: 1.6;
}
.popup-actions { display: flex; gap: 8px; align-items: center; padding: 8px 10px; }
.btn-save-vocab {
  flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
  background: linear-gradient(135deg, rgba(251,191,36,0.3), rgba(251,191,36,0.1));
  color: #fbbf24; font-size: 14px; cursor: pointer; transition: all 0.2s;
  font-family: inherit; display: flex; align-items: center; gap: 6px; justify-content: center;
}
.btn-save-vocab:hover { background: rgba(251,191,36,0.4); }
.btn-save-vocab.saved { background: rgba(34,197,94,0.3); color: #22c55e; border-color: rgba(34,197,94,0.3); }
.btn-icon {
  width: 36px; height: 36px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.06); color: var(--text-dim); font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s;
  font-family: inherit;
}
.btn-icon:hover { background: rgba(255,255,255,0.12); }

/* ─── Toast ─── */
.toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: var(--surface-solid); color: var(--text); padding: 10px 24px; border-radius: 24px;
  font-size: 14px; z-index: 400; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  border: 1px solid var(--glass-border); box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.toast.visible { opacity: 1; }

/* ─── 回到顶部 ─── */
.back-top {
  position: fixed; bottom: 70px; right: 16px; z-index: 80;
  width: 40px; height: 40px; border-radius: 50%; background: var(--glass); border: 1px solid var(--glass-border);
  color: var(--text-secondary); font-size: 18px; cursor: pointer; display: none; align-items: center; justify-content: center;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); transition: all 0.2s;
}
.back-top:hover { background: var(--glass-hover); color: var(--text); }
.back-top.visible { display: flex; }

/* ─── 弹窗通用 ─── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300;
  display: none; align-items: center; justify-content: center; backdrop-filter: blur(4px);
}
.modal-overlay.visible { display: flex; }
.modal-content {
  background: var(--surface-solid); border: 1px solid var(--glass-border); border-radius: 20px;
  padding: 28px 24px; max-width: 400px; width: 90%; text-align: center; box-shadow: var(--shadow);
}
.modal-content h3 { font-size: 1.1em; margin-bottom: 12px; }
.modal-content p { color: var(--text-secondary); font-size: 14px; line-height: 1.7; }
.modal-content .stat { color: var(--accent); font-weight: 600; }
.modal-btn {
  background: var(--accent-dim); color: var(--accent); border: 1px solid var(--accent-border);
  border-radius: 10px; padding: 10px 28px; font-size: 15px; cursor: pointer;
  margin-top: 16px; transition: all 0.15s; font-family: inherit;
}
.modal-btn:hover { background: rgba(129,140,248,0.30); }
.modal-btn:active { transform: scale(0.95); }

/* ─── 读书报告 ─── */
.report-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
.report-item { text-align: center; }
.report-item .val { font-size: 1.8em; font-weight: 700; color: var(--accent); }
.report-item .lbl { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.report-bar { margin: 8px 0; }
.report-bar-label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; }
.report-bar-track { height: 6px; background: var(--glass); border-radius: 3px; overflow: hidden; }
.report-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.5s; }

/* ─── 加载 ─── */
.loading { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 14px; }
.loading .spinner { width: 32px; height: 32px; margin: 0 auto 16px; border: 3px solid var(--glass-border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ─── 字号/字体 ─── */
.size-small .ru-text { font-size: 0.9em; } .size-small .cn-text { font-size: 0.85em; }
.size-large .ru-text { font-size: 1.2em; } .size-large .cn-text { font-size: 1.1em; }
.size-xlarge .ru-text { font-size: 1.35em; } .size-xlarge .cn-text { font-size: 1.25em; }
.font-sans .ru-text, .font-sans .cn-text { font-family: 'Segoe UI', system-ui, 'Helvetica Neue', Arial, sans-serif; }

/* ─── B2 知识点导航 ─── */
.b2-knowledge-nav { margin: 18px 0 24px; padding: 16px; border: 1px solid var(--accent-border); background: var(--accent-dim); border-radius: 14px; }
.b2-knowledge-nav h2 { font-size: 1em; margin-bottom: 10px; }
.b2-knowledge-nav h2 + p { color: var(--text-secondary); font-size: 13px; margin: -5px 0 10px; }
.b2-knowledge-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.b2-knowledge-card { font: inherit; text-align: left; padding: 10px; border: 1px solid var(--glass-border); border-radius: 10px; background: var(--surface-solid); color: var(--text); cursor: pointer; }
.b2-knowledge-card strong, .b2-knowledge-card span, .b2-knowledge-card small { display: block; }
.b2-knowledge-card span { color: var(--accent); font-size: 12px; }
.b2-knowledge-card small { color: var(--text-secondary); line-height: 1.5; margin-top: 3px; }
.b2-knowledge-study-card { border-color: var(--accent); box-shadow: 0 4px 14px var(--accent-dim); }
.b2-knowledge-card em { display: block; margin-top: 8px; color: var(--accent); font-size: 12px; font-style: normal; font-weight: 600; }
.b2-knowledge-exercise-nav { margin-top: 16px; }
.b2-study-card { max-width: 860px; }
.b2-study-quick { border: 1px solid var(--accent-border); background: var(--accent-dim); }
.b2-study-outline { position: sticky; top: 50px; z-index: 20; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; margin: 0 0 16px; border: 1px solid var(--glass-border); border-radius: 10px; background: color-mix(in srgb, var(--surface-solid) 92%, transparent); backdrop-filter: blur(10px); }
.b2-study-outline a { color: var(--accent); text-decoration: none; font-size: 12px; padding: 4px 7px; border-radius: 6px; background: var(--glass); }
.b2-study-outline a:hover { background: var(--accent-dim); }
.b2-study-lesson { margin: 24px 0; padding: 20px; border: 1px solid var(--glass-border); border-radius: 14px; background: var(--surface-solid); scroll-margin-top: 90px; }
.b2-study-lesson.related { border-color: var(--warning); }
.b2-study-lesson h2 { margin-bottom: 8px; }
.b2-study-lesson h3 { margin: 16px 0 6px; font-size: 14px; color: var(--accent); }
.b2-study-conditions, .b2-study-boundaries { margin: 8px 0 0 20px; }
.b2-study-case-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.b2-study-case-change { padding: 9px; border: 1px solid var(--glass-border); border-radius: 9px; background: var(--glass); }
.b2-study-case-change code { color: var(--accent); font-family: Georgia, serif; }
.b2-study-example .kind, .b2-study-source-disclosure summary { color: var(--text-secondary); font-size: 12px; cursor: pointer; }
.b2-study-source-disclosure { margin-top: 8px; }
.b2-study-check { margin-top: 12px; padding: 12px; border: 1px dashed var(--accent-border); border-radius: 10px; background: var(--accent-dim); }
.b2-study-check-options { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.b2-study-check-options button { font: inherit; color: var(--text); background: var(--surface-solid); border: 1px solid var(--glass-border); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
.b2-study-check-options button:hover { border-color: var(--accent); }
.b2-study-check-result { margin-top: 8px; color: var(--text-secondary); }
.b2-study-check-result.correct { color: var(--success); }
.b2-study-check-result.wrong { color: var(--warning); }
.b2-study-synthesis { border-left: 3px solid var(--accent); padding-left: 12px; }
.b2-study-section { margin: 18px 0; padding: 16px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-solid); }
.b2-study-section h2 { margin-bottom: 8px; font-size: 1.1em; }
.b2-study-status { color: var(--accent); font-size: 13px; font-weight: 600; }
.b2-study-rule-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.b2-study-rule, .b2-study-comparison, .b2-study-example { padding: 12px; border: 1px solid var(--glass-border); border-radius: 10px; background: var(--glass); }
.b2-study-rule p, .b2-study-example p { margin-top: 6px; }
.b2-study-source { display: block; margin-top: 9px; color: var(--text-secondary); font-size: 12px; line-height: 1.45; }
.b2-study-comparison + .b2-study-comparison, .b2-study-example + .b2-study-example { margin-top: 10px; }
.b2-study-comparison strong { color: var(--accent); }
.b2-study-example .ru { color: var(--ru-text); font-family: 'Segoe UI', system-ui, Georgia, serif; font-size: 1.06em; }
.b2-study-example .zh { color: var(--text-secondary); }
.b2-study-actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0 48px; }
.b2-study-meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; color: var(--text-secondary); font-size: 13px; }
.b2-study-meta span { padding: 3px 8px; border: 1px solid var(--glass-border); border-radius: 999px; background: var(--glass); }
.b2-study-empty { color: var(--text-secondary); font-style: italic; }
.world-dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; }
.world-module-card { display: flex; flex-direction: column; min-height: 220px; padding: 20px; border: 1px solid var(--glass-border); border-radius: 14px; background: var(--glass); cursor: pointer; transition: transform .18s ease, background .18s ease, border-color .18s ease; }
.world-module-card:hover { transform: translateY(-2px); background: var(--glass-hover); border-color: var(--accent-border); }
.world-module-card h2 { font-size: 1.15em; margin: 8px 0 6px; }
.world-module-card p { color: var(--text-secondary); font-size: 14px; line-height: 1.6; }
.world-module-card .progress-bar { margin-top: auto; }
.world-module-card .progress-text { margin: 9px 0 14px; }
.world-module-card button { align-self: flex-start; }
.world-module-resume { margin: 0 0 14px; color: var(--text-secondary); font-size: 12px; line-height: 1.45; }
.world-module-resume strong { color: var(--text); font-weight: 650; }
.world-module-card .world-module-actions { display: flex; gap: 8px; align-items: center; margin-top: 2px; }
.world-module-card .world-module-actions .b2-finish { margin: 0; }
.world-module-card .world-module-actions .world-module-continue { padding: 8px 10px; border: 1px solid var(--accent-border); border-radius: 9px; background: transparent; color: var(--accent); font: inherit; font-size: 13px; cursor: pointer; }
.world-directory-resume { margin: 14px 0 18px; }
.world-directory-resume .b2-continue-card { margin: 0; }
.shelf-hero { padding: 24px 0 8px; }
.shelf-hero h1 { margin: 0; font-size: clamp(26px, 3vw, 36px); }
.shelf-hero p { margin: 7px 0 0; color: var(--text-secondary); }
.shelf-continue { margin: 14px 0 18px; }
.shelf-tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 24px; }
.shelf-tool { padding: 8px 11px; border: 1px solid var(--glass-border); border-radius: 9px; background: var(--glass); color: var(--text-secondary); cursor: pointer; font: inherit; font-size: 13px; transition: background .18s ease, border-color .18s ease; }
.shelf-tool:hover { background: var(--glass-hover); border-color: var(--accent-border); color: var(--text); }
.shelf-section { margin: 0 0 30px; }
.shelf-section-heading { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 0 0 10px; }
.shelf-section-heading h2 { margin: 0; font-size: 18px; }
.shelf-book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.shelf-book-grid .book-card { min-height: 174px; }
.world-shelf-card { grid-column: 1 / -1; cursor: default; }
.world-shelf-card-main { display: flex; justify-content: space-between; gap: 18px; align-items: start; }
.world-shelf-card-main h3 { margin: 0; }
.world-shelf-open { flex: 0 0 auto; padding: 8px 11px; border: 1px solid var(--accent-border); border-radius: 9px; background: var(--accent-dim); color: var(--accent); cursor: pointer; font: inherit; font-weight: 600; }
.world-shelf-modules { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 16px; }
.world-shelf-module { min-width: 0; padding: 11px; border: 1px solid var(--glass-border); border-radius: 10px; background: var(--surface-solid); color: var(--text); cursor: pointer; font: inherit; text-align: left; transition: background .18s ease, border-color .18s ease; }
.world-shelf-module:hover { background: var(--glass-hover); border-color: var(--accent-border); }
.world-shelf-module strong, .world-shelf-module small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.world-shelf-module strong { font-size: 13px; }
.world-shelf-module small { margin-top: 5px; color: var(--text-secondary); font-size: 11px; }
.b2-shelf-modules { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
.b2-shelf-module strong { color: var(--text); }
.b2-shelf-module small:last-child { color: var(--accent); font-variant-numeric: tabular-nums; }
@media (max-width: 760px) { .world-shelf-modules { grid-template-columns: repeat(2, minmax(0, 1fr)); } .world-shelf-card-main { flex-direction: column; } }
@media (max-width: 440px) { .world-shelf-modules { grid-template-columns: 1fr; } }
.b2-quiz-target { outline: 3px solid var(--accent); outline-offset: 5px; border-radius: 10px; }

/* ─── 移动端 ─── */
@media (max-width: 600px) {
  .main-container { padding: 12px 12px 80px; }
  .mode-btn { font-size: 11px; padding: 4px 8px; }

  return active.getAttribute('data-question-id') || '';
}

    curBook && curBook.id === 'listening_speaking' ? currentListeningData :

  return data && data.title || (curBook && curBook.chapterTitles && curBook.chapterTitles[curCh]) || '';
}
function getActiveB2QuestionId(restoreState) {
  if (!curBook || !curBook.isB2Module) return '';
  if (restoreState && typeof restoreState.activeQuestionId === 'string') return restoreState.activeQuestionId;
  var items = document.querySelectorAll('[data-question-id]');

  for (var i = 0; i < items.length; i++) {
    if (items[i].getBoundingClientRect().top > focusLine) break;

function saveLastRead() {

/* ══════════════════════════════════════════════
   IndexedDB 轻量封装
   ══════════════════════════════════════════════ */
var _idbName = 'russian_reader_db';
var _idbStore = 'keyval';

function _idbOpen() {
  return new Promise(function(resolve, reject) {
    var req = indexedDB.open(_idbName, 1);
    req.onupgradeneeded = function() { req.result.createObjectStore(_idbStore); };
    req.onsuccess = function() { resolve(req.result); };
    req.onerror = function() { reject(req.error); };
  });
}

function _idbExec(mode, cb) {
  return _idbOpen().then(function(db) {
    return new Promise(function(resolve, reject) {
      var tx = db.transaction(_idbStore, mode === 'readonly' ? 'readonly' : 'readwrite');
      var store = tx.objectStore(_idbStore);
      var ret = cb(store);
      if (ret && typeof ret.then === 'function') { ret.then(resolve, reject); }
      tx.oncomplete = function() { resolve(ret && ret.then ? undefined : ret); };
      tx.onerror = function() { reject(tx.error); };
    });
  });
}

function idbGet(key) {
  return _idbExec('readonly', function(store) {
    return new Promise(function(resolve) {
      var req = store.get(key);
      req.onsuccess = function() { resolve(req.result); };
      req.onerror = function() { reject(req.error); };
    });
  });
}

function idbSet(key, val) {
  return _idbExec('readwrite', function(store) {
    return new Promise(function(resolve) {
      var req = store.put(val, key);
      req.onsuccess = function() { resolve(); };
      req.onerror = function() { reject(req.error); };
    });
  });
}

/* ─── 形态引擎：IndexedDB 读写 ─── */
var MORPH_IDB_KEY = 'morphology_data';

function readMorphologyFromIDB() {
  return idbGet(MORPH_IDB_KEY).then(function(data) {
    if (!data || !data.map || Object.keys(data.map).length === 0) {
      throw new Error('empty morphology data');
    }
    return data;
  });
}

function writeMorphologyToIDB(data) {
  return idbSet(MORPH_IDB_KEY, data);
}

/* ══════════════════════════════════════════════
   主题 / 字号 / 字体
   ══════════════════════════════════════════════ */
function applyTheme() {
  document.body.className = 'theme-' + state.theme + ' size-' + state.fontSize + ' ';
  if (state.fontFamily === 'sans') document.body.className += 'font-sans';
}
function cycleTheme() {
  var i = THEMES.indexOf(state.theme);
  state.theme = THEMES[(i + 1) % THEMES.length];
  saveState(); applyTheme();
  toast('主题: ' + THEME_LABELS[state.theme]);
}
function cycleFont() {
  var i = SIZES.indexOf(state.fontSize);
  state.fontSize = SIZES[(i + 1) % 4];
  saveState(); applyTheme();
  toast('字号: ' + SIZE_LABELS[state.fontSize]);
}
function cycleFontFamily() {
  state.fontFamily = state.fontFamily === 'sans' ? 'serif' : 'sans';
  saveState(); applyTheme();
  toast('字体: ' + (state.fontFamily === 'sans' ? '无衬线' : '衬线'));
}

/* ══════════════════════════════════════════════
   缓存管理 (LRU)
   ══════════════════════════════════════════════ */
function cachePut(bookId, idx, data) {
  if (!chaptersCache[bookId]) chaptersCache[bookId] = {};
  chaptersCache[bookId][idx] = data;
  cacheOrder.push({ bookId: bookId, idx: idx });
  while (cacheOrder.length > CACHE_LIMIT) {
    var old = cacheOrder.shift();
    if (chaptersCache[old.bookId]) {
      delete chaptersCache[old.bookId][old.idx];
      if (!Object.keys(chaptersCache[old.bookId]).length) delete chaptersCache[old.bookId];
    }
  }
}
function cacheGet(bookId, idx) {
  if (chaptersCache[bookId] && chaptersCache[bookId][idx]) {
    for (var i = 0; i < cacheOrder.length; i++) {
      if (cacheOrder[i].bookId === bookId && cacheOrder[i].idx === idx) {
        cacheOrder.splice(i, 1); cacheOrder.push({ bookId: bookId, idx: idx }); break;
      }
    }
    return chaptersCache[bookId][idx];
  }
  return null;
}

/* ══════════════════════════════════════════════
   工具函数
   ══════════════════════════════════════════════ */
function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  }

    buttons.push('<button class="fab-btn" id="breadcrumbTrigger" onclick="' + options.menuAction + '" title="导航" aria-label="导航目录">☰</button>');

    '<nav class="fab-group-top b2-floating-navigation" aria-label="学习页面导航">' + buttons.join('') + '</nav>';
}

/* ─── 形态引擎：初始化 ─── */
function buildDict(mapData) {
  morphologyDict = Object.create(null);
  Object.assign(morphologyDict, mapData);
  morphologyReady = true;
}

function initMorphology() {
  var versionFetchOk = true;
  var remoteVersion = null;

  fetch('data/morphology-version.json')
    .then(function(r) {
      if (!r.ok) throw new Error('version fetch failed');
      return r.json();
    })
    .then(function(v) { remoteVersion = v.version; })
    .catch(function() { versionFetchOk = false; })
    .then(function() {
      return readMorphologyFromIDB()
        .then(function(localData) {
          if (versionFetchOk && localData.version === remoteVersion) {
            buildDict(localData.map);
            return;
          }
          throw new Error('need update');
        })
        .catch(function() {
          if (!versionFetchOk) {
            return readMorphologyFromIDB().then(function(ld) { buildDict(ld.map); }).catch(function() {});
          }
          if (sessionStorage.getItem('morph_retry') === '1') {
            return readMorphologyFromIDB().then(function(ld) { buildDict(ld.map); }).catch(function() {});
          }
          return fetch('data/morphology-map.json')
            .then(function(r) { return r.json(); })
            .then(function(json) {
              return writeMorphologyToIDB(json).then(function() {
                buildDict(json.map);
              });
            })
            .catch(function() {
              sessionStorage.setItem('morph_retry', '1');
              return readMorphologyFromIDB().then(function(ld) { buildDict(ld.map); }).catch(function() {});
            });
        });
    });
}

function getB2ArchiveValues() {

function exportB2LearningArchive() {

  var blob = new Blob([JSON.stringify(archive, null, 2)], { type: 'application/json' });

  link.href = url; link.download = 'russian-b2-learning-archive.json'; link.click();

function importB2LearningArchive(event) {
  var file = event.target.files && event.target.files[0];
  if (!file || !window.RussianB2Dashboard) return;
  var reader = new FileReader();
  reader.onload = function() {
    var archive;
    try { archive = JSON.parse(String(reader.result)); } catch (e) { toast('备份文件不是有效 JSON'); return; }
    var errors = window.RussianB2Dashboard.validateArchive(archive);
    if (errors.length) { toast('备份文件校验失败：' + errors[0]); return; }
    var local = window.RussianB2Dashboard.createArchive(getB2ArchiveValues());
    var result = window.RussianB2Dashboard.mergeArchive(local, archive);
    Object.keys(result.merged.records).forEach(function(key) { localStorage.setItem(key, JSON.stringify(result.merged.records[key].value)); });
    toast(result.conflicts.length ? '已合并记录；' + result.conflicts.length + ' 项同时间冲突保留本地版本' : '已合并学习记录');

}

function showChapters(bookId) {
  saveLastRead();
  curView = 'chapters'; curCh = -1; stopTimer();
  var prompt = document.getElementById('completePrompt'); if (prompt) prompt.classList.remove('visible');
  document.getElementById('searchBar').classList.remove('visible');
  if (curBook && curBook.id === bookId && curBook.isB2Module) {
    renderB2ModuleChapters();
    return;
  }
  for (var i = 0; i < booksData.length; i++) {
    if (booksData[i].id === bookId) { curBook = booksData[i]; break; }
  }
  if (!curBook) return;
  if (curBook.format === 'b2-full') {
    showB2Dashboard();
    return;
  }
  var stats = readStats[bookId] || {}, done = getBookProgress(bookId);

  var html = b2FloatingNavigation({
    backAction: isWorldPeopleBook(curBook) ? 'showWorldPeopleDashboard()' : 'showShelf()',
    backTitle: isWorldPeopleBook(curBook) ? '仪表盘' : '书架',
    menuAction: 'showBreadcrumb()'
  });
  var directoryActions = !isQuizFirstBook(curBook)
    ? '<div class="b2-study-actions"><button class="b2-finish" onclick="exportNotes()">导出阅读笔记</button><button class="b2-finish" onclick="showBookReport()">查看读书报告</button></div>'
    : '';
  var isWorldModule = isWorldPeopleBook(curBook);
  var usesGroupedWorldDirectory = curBook.id === 'listening_speaking' || !!WORLD_DIRECTORY_GROUP_CONFIG[curBook.id];
  html +=
    '<div class="main-container' + (isWorldModule ? ' world-chapter-directory' : '') + '"><div class="chapter-list-header">' +
    '<h2>' + escapeHtml(curBook.title) + '</h2>' +
    '<div class="ch-meta">' + curBook.chapters + ' 章 · 已读 ' + done + ' 章' +
    (curBook.direction ? ' · ' + (curBook.direction === 'cn→ru' ? '中文→俄语' : '俄语→中文') : '') +
    '</div>' + (isWorldModule && !usesGroupedWorldDirectory && (!curBook.chapterTitles || curBook.chapterTitles.length !== curBook.chapters) ? '<div class="world-chapter-loading">正在载入章节标题…</div>' : '') +
    '</div>' + (isWorldModule ? renderWorldDirectoryResume(curBook) : '');
  if (usesGroupedWorldDirectory) {
    html += renderWorldGroupedDirectory(curBook, stats) + directoryActions + '</div>';
  } else {
    html += '<div class="chapter-grid' + (isWorldModule ? ' world-chapter-grid' : '') + '">';
    for (var i = 0; i < curBook.chapters; i++) {
      var isDone = isQuizFirstBook(curBook) ? isB2ChapterComplete(bookId, i) : (stats[i] && stats[i].completed);
      var chapterLabel = curBook.chapterTitles ? curBook.chapterTitles[i] : '第' + (i + 1) + '章';
      html += '<div class="ch-item' + (isWorldModule ? ' world-chapter-item' : '') + (isDone ? ' done' : '') + '" onclick="goChapter(' + i + ')"' + (isWorldModule ? ' title="' + escapeHtml(chapterLabel) + '"' : '') + '>' +
        '<span class="ch-num">' + (isDone ? '✓' : (i + 1)) + '</span>' +

function copyQuestionAsAiPrompt(exerciseId) {
  var exercise = getQuizExercise(exerciseId);
  if (!exercise) { toast('未找到题目数据'); return; }

  var record = getQuizRecord(exerciseId);

  // 拼接完整句子
  var selectedText = '';
  var selectedKey = '';
  if (record.submitted && record.selected) {
    var selOpt = (exercise.options || []).find(function(o) { return o.key === record.selected; });
    if (selOpt) { selectedText = selOpt.text; selectedKey = record.selected; }
  } else if (!record.submitted && record.selected) {
    selectedKey = record.selected + '（已选，待确认）';
    var pendingOpt = (exercise.options || []).find(function(o) { return o.key === record.selected; });
    if (pendingOpt) selectedText = pendingOpt.text;
  }
  var completedSentence = selectedText
    ? exercise.question.replace(/\.{3,}/, selectedText)
    : exercise.question;

  // 所有选项
  var optionsList = (exercise.options || []).map(function(o) {
    return o.key + '. ' + o.text + (o.key === exercise.answer ? ' ★正确答案' : '');
  }).join('\n');

  // 我选的
  var myChoice = selectedKey || '未选';

  var prompt = [
    '你是一位专业的俄语教授和 TRKI-2 (B2) 考试专家。请为我深度解析以下这道俄语选择题：',
    '',
    '【完整题干】',
    completedSentence,
    '',
    '【所有选项】',
    optionsList,
    '',
    '【我目前的选项】',
    myChoice,
    '',
    '【请从以下几个维度为我详细讲解】',
    '1. 语境与语义分析：这句话翻译成中文是什么意思？整个语境在表达什么？',
    '2. 核心词汇辨析：请重点对比这几个选项（尤其是词体/完成体与未完成体、接格关系、或者前缀的细微区别），解释为什么正确答案是它，而其他选项错在哪里。',
    '3. 语法点与形态学：这道题涉及到了哪些 B2 级别必须掌握的俄语语法规则？（如动词变位、名词格的变化、特定句型等）',
    '4. 拓展造句：请用这道题的核心考点或正确选项的单词，另外提供 2 个实用的俄语例句并附带中文翻译，帮我加深记忆。'
  ];

  if (exercise.sourceExplanation) {
    prompt.push('', '【附：原书解析（供参考）】', exercise.sourceExplanation);
  }

  navigator.clipboard.writeText(prompt.join('\n'))
    .then(function() { toast('✅ 题目已打包到剪贴板，发给 AI 即可'); })
    .catch(function() { toast('❌ 复制失败'); });
}

function restoreSplitRatio() {
  var layout = document.getElementById('readerLayout');
  var pane = document.getElementById('readerPane');
  if (!layout || !pane) return;

  var isH = getComputedStyle(layout).flexDirection === 'row';
  _lastSplitOrientation = isH ? 'h' : 'v';
  var key = isH ? 'rr_split_h' : 'rr_split_v';
  var saved = null;
  try { saved = localStorage.getItem(key); } catch(e) {}

  if (saved) {
    pane.style.flexBasis = saved;
  } else {
    // 默认值：横屏 70%，竖屏 55%
    pane.style.flexBasis = isH ? '70%' : '55%';
  }
}

/* ─── 拖拽分界线 ─── */
(function() {
  var layoutEl = null, paneEl = null, handleEl = null;
  var dragging = false, isHorizontal = true;

  function refreshRefs() {
    layoutEl = document.getElementById('readerLayout');
    paneEl = document.getElementById('readerPane');
    handleEl = document.getElementById('resizeHandle');
  }

  function getDirection() {
    if (!layoutEl) return 'row';
    return getComputedStyle(layoutEl).flexDirection;
  }

  document.addEventListener('pointerdown', function(e) {
    refreshRefs();
    if (!e.target.closest('#resizeHandle')) return;
    if (!paneEl) return;
    dragging = true;
    isHorizontal = getDirection() === 'row';
    handleEl.classList.add('active');
    handleEl.setPointerCapture(e.pointerId);
  });

  document.addEventListener('pointermove', function(e) {
    if (!dragging || !paneEl || !layoutEl) return;
    var rect = layoutEl.getBoundingClientRect();
    var percentage;
    if (isHorizontal) {
      percentage = ((e.clientX - rect.left) / rect.width) * 100;
    } else {
      percentage = ((e.clientY - rect.top) / rect.height) * 100;
    }
    percentage = Math.max(25, Math.min(85, percentage));
    paneEl.style.flexBasis = percentage + '%';
  });

  document.addEventListener('pointerup', function(e) {
    if (!dragging) return;
    dragging = false;
    if (handleEl) handleEl.classList.remove('active');
    if (handleEl) handleEl.releasePointerCapture(e.pointerId);
    // 持久化：横屏/竖屏各存一份
    try {
      var key = isHorizontal ? 'rr_split_h' : 'rr_split_v';
      if (paneEl) localStorage.setItem(key, paneEl.style.flexBasis);
    } catch(err) {}
  });
})();

// ─── 屏幕旋转时恢复分栏比例 ───
var _lastSplitOrientation = null;
window.addEventListener('resize', function() {
  var layout = document.getElementById('readerLayout');
  if (!layout) return;
  var isH = getComputedStyle(layout).flexDirection === 'row';
  var cur = isH ? 'h' : 'v';
  if (cur !== _lastSplitOrientation) {
    _lastSplitOrientation = cur;
    restoreSplitRatio();
  }
});

function normalizeLookupWord(word) {
  return String(word || '')
    .normalize('NFD')
    .replace(/[\u0300\u0301]/g, '')
    .normalize('NFC')
    .replace(/ё/g, 'е')
    .replace(/Ё/g, 'е')
    .toLowerCase()
    .replace(/[^а-я-]/g, '');
}

function hasChineseText(text) {
  return /[\u4e00-\u9fff]/.test(String(text || ''));
}

function loadLocalLookupData() {
  try { localLookupCache = JSON.parse(localStorage.getItem('rr_local_lookup_cache') || '{}'); } catch(e) { localLookupCache = {}; }
  return Promise.all([
    fetch('data/vocabulary.json').then(function(r) { return r.ok ? r.json() : []; }),
    fetch('data/external-vocab.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
    fetch('data/dictionary/function-word-forms.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
    fetch('data/dictionary/corpus-morphology.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
    fetch('data/dictionary/freedict-rus-zh.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
    fetch('data/dictionary/markdown-glossary.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
    fetch('data/dictionary/reviewed-function-entries.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
    fetch('data/dictionary/openrussian-en.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
    fetch('data/dictionary/wiktionary-ru.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; }),
    fetch('data/dictionary/salad-vocab.json').then(function(r) { return r.ok ? r.json() : {}; }).catch(function() { return {}; })
  ])
    .then(function(results) {
      var words = results[0], extVocab = results[1];
      functionWordForms = results[2] || {};
      corpusMorphology = results[3] || {};
      freeDictLookup = results[4] || {};
      markdownGlossaryLookup = results[5] || {};
      reviewedFunctionLookup = results[6] || {};
      openRussianLookup = results[7] || {};
      wiktionaryRuLookup = results[8] || {};
      saladVocabLookup = results[9] || {};
      localVocabLookup = {};
      // 主词典
      if (!Array.isArray(words)) words = [];
      words.forEach(function(w) {
        if (!w || !w.word || !w.meaning || !hasChineseText(w.meaning)) return;
        var key = normalizeLookupWord(w.word);
        if (!key || localVocabLookup[key]) return;
        localVocabLookup[key] = {
          meaning: w.meaning,
          type: w.type || '',
          source: '本地词库',
          _raw: w  // 保留原始词条用于详情面板渲染
        };
      });
      // 外部补充词库 (Gemini 翻译)
      Object.keys(extVocab).forEach(function(lemma) {
        var e = extVocab[lemma];
        var key = normalizeLookupWord(lemma);
        if (!key) return;
        if (localVocabLookup[key]) return; // 不覆盖主词典
        if (!hasChineseText(e.meaning)) return;
        localVocabLookup[key] = {
          meaning: e.meaning,
          type: e.type || '',
          source: '扩展词库'
        };
      });
      console.log('[Dict] Local:', Object.keys(localVocabLookup).length, 'entries; Salad:', Object.keys(saladVocabLookup).length, '; FreeDict:', Object.keys(freeDictLookup).length);
      localLookupReady = true;
    })
    .catch(function(err) {
      console.warn('本地查词数据加载失败:', err);
      localLookupReady = true;
    });
}

/* ─── 重音表 ─── */
function loadStressMap() {
  fetch('data/dictionary/stress-map.json')
    .then(function(r) { return r.ok ? r.json() : {}; })
    .then(function(data) { _stressMap = data || {}; applyStressMarks(); })
    .catch(function() { _stressMap = {}; });
}
function hasStressMark(text) { return /[\u0301\u0341]/.test(String(text || '').normalize('NFD')); }
function normalizeStressKey(text) {
  return String(text || '').normalize('NFD').replace(/[\u0300\u0301\u0341]/g, '').normalize('NFC').toLowerCase();
}
function preserveStressCase(source, stressed) {
  if (source === source.toUpperCase()) return stressed.toUpperCase();
  if (source.charAt(0) === source.charAt(0).toUpperCase()) return stressed.charAt(0).toUpperCase() + stressed.slice(1);
  return stressed;
}
function applyStressMarks() {
  if (!Object.keys(_stressMap).length) return;
  var words = document.querySelectorAll('.ru-word');
  for (var i = 0; i < words.length; i++) {
    var el = words[i];
    var original = (el.getAttribute('data-original-word') || el.getAttribute('data-word') || el.textContent || '').trim().normalize('NFC');
    if (!original) continue;
    if (!el.getAttribute('data-original-word')) el.setAttribute('data-original-word', original);
    if (hasStressMark(original)) {
      el.setAttribute('data-word', original); el.setAttribute('data-stress-source', 'source');
      continue;
    }
    var key = normalizeStressKey(original);
    var stressed = _stressMap[original.toLowerCase()] || _stressMap[key] || _stressMap[key.replace(/ё/g, 'е')];
    if (stressed) {
      var result = preserveStressCase(original, String(stressed).normalize('NFC'));
      el.setAttribute('data-word', result); el.setAttribute('data-stress-source', 'auto');
      if (el.textContent !== result) el.textContent = result;
    } else {
      el.setAttribute('data-word', original); el.setAttribute('data-stress-source', 'none');
    }
  }
}

function lookupLocalChineseMeaning(word) {
  var key = normalizeLookupWord(word);
  if (!key) return null;
  if (localVocabLookup[key]) {
    saveCachedLocalLookup(key, localVocabLookup[key]);
    return localVocabLookup[key];
  }
  if (reviewedFunctionLookup[key]) {
    return { meaning: reviewedFunctionLookup[key].meaning, type: 'function word', source: reviewedFunctionLookup[key].source, _raw: {} };
  }
  if (markdownGlossaryLookup[key] && Array.isArray(markdownGlossaryLookup[key].meanings)) {
    return {
      meaning: markdownGlossaryLookup[key].meanings.slice(0, 6).join('；'), type: '',
      source: markdownGlossaryLookup[key].source || '项目 Markdown 已核对词汇表', _raw: {}
    };
  }
  if (saladVocabLookup[key]) {
    return { meaning: saladVocabLookup[key], type: '', source: '沙拉俄语词库', _raw: {} };
  }
  if (freeDictLookup[key] && Array.isArray(freeDictLookup[key].meanings) && freeDictLookup[key].meanings.length) {
    return {
      meaning: freeDictLookup[key].meanings.slice(0, 8).join('；'),
      type: '',
      source: freeDictLookup[key].source || 'FreeDict zho-rus 2025.11.23',
      _raw: {}
    };
  }
  if (openRussianLookup[key] && Array.isArray(openRussianLookup[key].meaningsEn) && openRussianLookup[key].meaningsEn.length) {
    return {
      meaning: openRussianLookup[key].meaningsEn.slice(0, 6).join('; '),
      type: '英文释义',
      source: openRussianLookup[key].source || 'OpenRussian · 英文释义 · CC BY-SA 4.0',
      _raw: {}
    };
  }
  if (wiktionaryRuLookup[key] && Array.isArray(wiktionaryRuLookup[key].definitionsRu) && wiktionaryRuLookup[key].definitionsRu.length) {
    return {
      meaning: wiktionaryRuLookup[key].definitionsRu.slice(0, 6).join('；'),
      type: '俄文释义',
      source: wiktionaryRuLookup[key].source || 'Русский Викисловарь · CC BY-SA 4.0',
      _raw: {}
    };
  }
  var provisional = dictionaryStorage && dictionaryStorage.getProvisional ? dictionaryStorage.getProvisional(key) : null;
  if (provisional && (provisional.meaningZh || provisional.meaningRu)) {
    return {
      meaning: provisional.meaningZh || provisional.meaningRu,
      type: '',
      source: (provisional.provider || '联网查询') + ' · 未复核',
      _provisional: true,
      _raw: {}
    };
  }
  return null;
}

function combinedMorphologyFor(form) {
  var normalized = normalizeLookupWord(form);
  var corpus = corpusMorphology[normalized] || {};
  var legacy = morphologyReady && morphologyDict[normalized] || [];
  var lemmas = [];
  (corpus.lemmas || []).concat(Array.isArray(legacy) ? legacy : (legacy.lemmas || [])).forEach(function(lemma) {
    lemma = normalizeLookupWord(lemma);
    if (lemma && lemmas.indexOf(lemma) === -1) lemmas.push(lemma);
  });
  return { lemmas: lemmas };
}

function resolveDictionaryLookup(word, context, recordMissing) {
  var clean = normalizeLookupWord(word);
  var resolved = RussianDictionaryCore.resolveLemma(clean, {
    functionForms: functionWordForms,
    morphology: (function() { var map = {}; map[clean] = combinedMorphologyFor(clean); return map; })(),
    lookupLemma: lookupLocalChineseMeaning
  });
  if (!resolved.entry && recordMissing !== false) {
    dictionaryStorage.recordMissing({
      form: word,
      lemmaCandidates: [resolved.lemma].concat(resolved.alternatives || []),
      failureStage: 'definition-resolution',
      context: context || {}
    });
  }
  return resolved;
}

function onlineDictionaryLookup() {
  var term = normalizeLookupWord(selText || _lastLookupWord);
  if (!term) return;
  var includeContext = Boolean(selContext) && window.confirm('是否把当前俄语句子附在本地查询记录中？词典服务只查询单词本身。');
  var inner = document.getElementById('detailInner');
  if (inner) inner.innerHTML = '<div class="dict-loading">正在查询 Russian Wiktionary…</div>';
  var params = new URLSearchParams({ term: term, includeContext: includeContext ? '1' : '0', context: includeContext ? (selContext || '').slice(0, 500) : '' });
  fetch('/api/dictionary/lookup?' + params.toString())
    .then(function(response) { if (!response.ok) throw new Error('lookup failed'); return response.json(); })
    .then(function(result) {
      if (!result.found) {
        if (inner) inner.innerHTML = '<div class="dict-word">' + escapeHtml(term) + '</div><div class="dict-meaning">Russian Wiktionary 也未找到可用词条。</div>';
        return;
      }
      dictionaryStorage.saveProvisional({
        form: term, lemma: term, provider: result.provider, sourceUrl: result.sourceUrl,
        queriedAt: result.queriedAt, meaningRu: result.meaningRu, meaningZh: '',
        context: includeContext ? (dictionaryController.getCurrent() && dictionaryController.getCurrent().context || {}) : {}
      });
      if (inner) inner.innerHTML = '<button class="detail-close" type="button" onclick="event.stopPropagation();dictionaryController.close()" aria-label="关闭词典">✕</button>' +
        '<div class="dict-word">' + escapeHtml(term) + '</div><div class="dict-pos">俄文释义（未翻译）</div>' +
        '<div class="dict-meaning" style="white-space:pre-wrap">' + escapeHtml(result.meaningRu) + '</div>' +
        '<div class="dict-source">' + escapeHtml(result.provider) + ' · 未复核</div>' +
        '<a class="tb-btn" href="' + escapeHtml(result.sourceUrl) + '" target="_blank" rel="noopener noreferrer">查看来源页面</a>';
    })
    .catch(function() {
      if (inner) inner.innerHTML = '<div class="dict-word">' + escapeHtml(term) + '</div><div class="dict-meaning">联网查询失败，请稍后再试。</div><button class="tb-btn" type="button" onclick="onlineDictionaryLookup()">重试</button>';
    });
}

/* ─── 详情面板渲染（按词性展示富字段）─── */
function renderDetailPanel(word, result) {
  if (!result || !result.meaning || result.meaning === '暂未收录') {
    return '<div class="dict-word">' + escapeHtml(word) + '</div>' +
      '<div class="dict-meaning" style="color:var(--text-dim)">暂未收录</div>';
  }

  var raw = result._raw || {};
  var posType = ((raw.type || result.type || '')).toLowerCase();

  var html = '';

  // ── 头部：单词 + 词性 ──
  html += '<div class="dp-head">';
  html += '<div class="dp-word">' + escapeHtml(word) + '</div>';
  var posLabel = raw.type || result.type || '';
  html += '<div class="dp-pos">' + escapeHtml(posLabel) + '</div>';
  html += '</div>';
  if (result._morphoLemma && result._reliability !== 'morphology-guess') {
    html += '<div class="dict-morph-compact"><strong>' + escapeHtml(word) + ' → ' + escapeHtml(result._morphoLemma) + '</strong><span>原形 · ' + escapeHtml(posLabel || '词典已确认') + '</span></div>';
  }

  // ── 释义 ──
  html += '<div class="dp-section">';
  html += '<div class="dp-meaning">' + escapeHtml(result.meaning) + '</div>';
  html += '</div>';

  // ── 体 / 性 ──
  if (posType === 'verb') {
    var hasVerbMeta = raw.aspect || raw.pair || raw.case_gov;
    if (hasVerbMeta) {
      html += '<div class="dp-section">';
      if (raw.aspect) {
        var aspectRaw = raw.aspect.toLowerCase();
        var aspectCN = aspectRaw.indexOf('несов') >= 0 || aspectRaw.indexOf('нсв') >= 0 ? '未完成体' :
                       ((aspectRaw.indexOf('сов') >= 0 && aspectRaw.indexOf('несов') < 0) || aspectRaw.indexOf('св') >= 0) ? '完成体' : raw.aspect;
        html += '<span class="dp-tag">' + escapeHtml(aspectCN) + '</span>';
      }
      if (raw.pair) {
        html += ' <span class="dp-pair">→ ' + escapeHtml(raw.pair) + '</span>';
      }
      if (raw.case_gov) {
        html += '<div class="dp-meta"><span class="dp-label">接格</span> ' + escapeHtml(raw.case_gov) + '</div>';
      }
      html += '</div>';
    }
  } else if (posType === 'noun' || posType === 'adj' || posType === 'adjective') {
    if (raw.gender) {
      var genLabel = raw.gender === 'masculine' || raw.gender === 'm' ? '阳性' :
                     raw.gender === 'feminine' || raw.gender === 'f' ? '阴性' :
                     raw.gender === 'neuter' || raw.gender === 'n' ? '中性' : raw.gender;
      html += '<div class="dp-section"><span class="dp-label">性</span> <span class="dp-tag">' + escapeHtml(genLabel) + '</span></div>';
    }
  }

  // ── 变格/变位表 ──
  var grammarTable = raw.grammarTable || '';
  if (grammarTable && grammarTable.length > 20) {
    html += '<div class="dp-section">';
    var mt = grammarTable.replace(/\|/g, '\t').replace(/^\|(.+)\|\n\|[-| :]+\|\n/m, function(_, header) { return 'HDR:' + header + '\n'; });
    var lines = grammarTable.trim().split('\n');
    var tableRows = [];
    for (var l = 0; l < lines.length; l++) {
      var cells = lines[l].replace(/^\||\|$/g, '').split('|').map(function(c) { return c.trim(); });
      if (l === 1 && cells.every(function(c) { return /^[-: ]+$/.test(c); })) continue; // 分隔线
      if (cells.length > 0 && cells.some(function(c) { return c.length > 0; })) tableRows.push(cells);
    }
    if (tableRows.length > 0) {
      var isHeader = tableRows.length > 1;
      html += '<div class="dp-collapse-toggle" onclick="var n=this.nextElementSibling;n.classList.toggle(\'open\');this.classList.toggle(\'expanded\')">📐 变格/变位表</div>';
      html += '<div class="dp-collapse-body"><div class="dict-table-wrap"><table class="dict-table">';
      for (var r = 0; r < tableRows.length; r++) {
        html += '<tr>';
        for (var c2 = 0; c2 < tableRows[r].length; c2++) {
          html += (r === 0 ? '<th>' : '<td>') + escapeHtml(tableRows[r][c2]) + (r === 0 ? '</th>' : '</td>');
        }
        html += '</tr>';
      }
      html += '</table></div></div>';
    }
    html += '</div>';
  }

  // ── 常用搭配 ──
  var colls = raw.collocations || [];
  if (colls.length > 0) {
    html += '<div class="dp-section">';
    html += '<div class="dp-section-title">常用搭配</div>';
    var maxColl = Math.min(colls.length, 4);
    for (var c = 0; c < maxColl; c++) {
      var col = colls[c];
      html += '<div class="dp-coll">';
      html += '<div class="dp-coll-phrase">' + escapeHtml(col.phrase || col.word || '') + '</div>';
      if (col.ru) html += '<div class="dp-coll-ru">' + escapeHtml(col.ru) + '</div>';
      if (col.zh) html += '<div class="dp-coll-zh">' + escapeHtml(col.zh) + '</div>';
      html += '</div>';
    }
    html += '</div>';
  }

  // ── 详细释义（折叠）───
  if (raw.detailZh && raw.detailZh.length > 5 && raw.detailZh !== '（待补充）') {
    html += '<div class="dp-section">';
    html += '<div class="dp-collapse-toggle" onclick="var n=this.nextElementSibling;n.classList.toggle(\'open\');this.classList.toggle(\'expanded\')">详细释义</div>';
    html += '<div class="dp-collapse-body"><div class="dp-detail">' + escapeHtml(raw.detailZh) + '</div></div>';
    html += '</div>';
  }

  // ── 例句 ──
  var examples = raw.examples || [];
  if (examples.length > 0) {
    html += '<div class="dp-section">';
    html += '<div class="dp-collapse-toggle" onclick="var n=this.nextElementSibling;n.classList.toggle(\'open\');this.classList.toggle(\'expanded\')">例句</div>';
    html += '<div class="dp-collapse-body">';
    var maxEx = Math.min(examples.length, 5);
    for (var e = 0; e < maxEx; e++) {
      var ex = examples[e];
      html += '<div class="dp-example">';
      if (ex.ru) html += '<div class="dp-ex-ru">' + escapeHtml(ex.ru) + '</div>';
      if (ex.zh) html += '<div class="dp-ex-zh">' + escapeHtml(ex.zh) + '</div>';
      html += '</div>';
    }
    html += '</div></div>';
  }

  // ── 变位/变格表（折叠）───
  if (raw.grammarTable && raw.grammarTable.length > 10 && raw.grammarTable !== '（待补充）') {
    html += '<div class="dp-section">';
    html += '<div class="dp-collapse-toggle" onclick="var n=this.nextElementSibling;n.classList.toggle(\'open\');this.classList.toggle(\'expanded\')">变位/变格表</div>';
    html += '<div class="dp-collapse-body" style="white-space:pre-wrap;font-size:13px">' + escapeHtml(raw.grammarTable) + '</div>';
    html += '</div>';
  }

  // ── 备选原形 ──
  if (result._alternatives && result._alternatives.length) {
    html += '<div class="dp-section">';
    html += '<span class="dp-alt-label">也作：</span>';
    html += result._alternatives.map(function(a) { return '<span class="dp-alt-word">' + escapeHtml(a) + '</span>'; }).join('、');
    html += '</div>';
  }

  // ── 猜测标注 ──
  if (result._guessed) {
    html += '<div class="dict-guess-label">形态推测还原</div>';
  }
  if (result._morphoLemma) {
    html += '<div class="dp-meta"><span class="dp-label">原形</span> ' + escapeHtml(result._morphoLemma) + '</div>';
  }
  if (result._reliability) {
    var reliabilityLabels = {
      'reviewed-function-form': '人工核对的功能词词形',
      'morphology-map': '语料词形分析',
      'dictionary-exact': '词典原形直查',
      'morphology-guess': '规则推测'
    };
    html += '<div class="dict-guess-label">' + escapeHtml(reliabilityLabels[result._reliability] || result._reliability) + '</div>';
  }

  // ── AI 解析按钮 ──
  html += '<div class="dp-ai-section">';
  html += '<button class="dp-ai-btn" id="dpAiBtn" onclick="requestAiAnalysis()">AI 深度解析</button>';
  html += '</div>';

  // ── 来源标注 ──
  html += '<div class="dp-source">来源：' + escapeHtml(result.source || '本地词库') + '</div>';

  return html;
}

function highlightSavedWords() {
  if (!savedWords.length) return;
  // 构建小写词表
  var wordSet = {};
  for (var w = 0; w < savedWords.length; w++) {
    wordSet[savedWords[w].toLowerCase()] = true;
  }

  // 快速路径：对已渲染为 .ru-word 的词（reading_speaking / B2 阅读视图）
  // 直接加 CSS class，不触 innerHTML 序列化（避免破坏 data-lookup-context 属性）
  var ruWords = document.querySelectorAll('.ru-word');
  for (var i = 0; i < ruWords.length; i++) {
    var el = ruWords[i];
    var wordText = (el.textContent || '').trim().toLowerCase();
    if (wordSet[wordText]) el.classList.add('highlight-word');
  }

  // 兼容路径：旧小说阅读视图（无 .ru-word，只有纯文本段落）
  var blocks = document.querySelectorAll('.para-block .ru-text');
  for (var b = 0; b < blocks.length; b++) {
    var block = blocks[b];
    // 已有 .ru-word 子元素 → 快速路径已处理，跳过
    if (block.querySelector('.ru-word')) continue;
    // 旧路径：innerHTML 替换（小说段落不含嵌套 span，安全）
    var text = block.textContent;
    var html = block.innerHTML;
    for (var w = 0; w < savedWords.length; w++) {
      var word = savedWords[w];
      if (text.toLowerCase().indexOf(word) < 0) continue;
      var re = new RegExp('(' + word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      html = html.replace(re, '<span class="highlight-word">$1</span>');
    }
    block.innerHTML = html;
  }
}

   搜索
   ══════════════════════════════════════════════ */
function toggleSearch() {
  var bar = document.getElementById('searchBar');
  bar.classList.toggle('visible');
  if (bar.classList.contains('visible')) document.getElementById('searchInput').focus();
  else closeSearch();
}
function closeSearch() {
  document.getElementById('searchBar').classList.remove('visible');
  document.getElementById('searchInput').value = '';
  clearSearchHighlights();
  searchMatches = []; searchIdx = -1;
  document.getElementById('searchCount').textContent = '';
}
function clearSearchHighlights() {
  var marks = document.querySelectorAll('.highlight-search');
  for (var i = 0; i < marks.length; i++) {
    var p = marks[i].parentNode;
    p.replaceChild(document.createTextNode(marks[i].textContent), marks[i]);
    p.normalize();
  }
}
function doSearch() {
  clearSearchHighlights();
  var q = document.getElementById('searchInput').value.trim().toLowerCase();
  searchMatches = []; searchIdx = -1;
  if (!q) { document.getElementById('searchCount').textContent = ''; return; }
  var blocks = document.querySelectorAll('.para-block');
  for (var b = 0; b < blocks.length; b++) {
    var texts = blocks[b].querySelectorAll('.ru-text, .cn-text');
    for (var t = 0; t < texts.length; t++) {
      var el = texts[t], walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, null, false);
      var nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
      for (var n = 0; n < nodes.length; n++) {
        var lc = nodes[n].nodeValue.toLowerCase(), pos = lc.indexOf(q);
        if (pos < 0) continue;
        var range = document.createRange();
        range.setStart(nodes[n], pos); range.setEnd(nodes[n], pos + q.length);
        var mark = document.createElement('span');
        mark.className = 'highlight-search';
        range.surroundContents(mark);
        searchMatches.push(mark);
        n--; // re-check same node for multiple matches
      }
    }
  }
  document.getElementById('searchCount').textContent = searchMatches.length ? '0/' + searchMatches.length : '无结果';
  if (searchMatches.length) searchNav(1);
}
function searchNav(dir) {
  if (!searchMatches.length) return;
  if (searchIdx >= 0) searchMatches[searchIdx].classList.remove('current');
  searchIdx = (searchIdx + dir + searchMatches.length) % searchMatches.length;
  searchMatches[searchIdx].classList.add('current');
  searchMatches[searchIdx].scrollIntoView({ behavior: 'smooth', block: 'center' });
  document.getElementById('searchCount').textContent = (searchIdx + 1) + '/' + searchMatches.length;
}
document.addEventListener('keydown', function(e) {
  if ((e.ctrlKey || e.metaKey) && e.key === 'f' && curView === 'reading') { e.preventDefault(); toggleSearch(); }
  if (e.key === 'Escape') closeSearch();
});
document.getElementById('searchInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') { e.preventDefault(); searchNav(e.shiftKey ? -1 : 1); }
});
