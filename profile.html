<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-title" content="白夜俄语">
  <meta name="theme-color" content="#071321">
  <link rel="apple-touch-icon" sizes="1024x1024" href="assets/icons/white-night-tutor-desktop.png">
  <link rel="icon" type="image/png" sizes="1024x1024" href="assets/icons/white-night-tutor-desktop.png">
  <link rel="icon" href="assets/icons/white-night-tutor-desktop.ico" sizes="any">
  <link rel="manifest" href="manifest.webmanifest">
  <title>我的 | 白夜俄语</title>
  <link rel="stylesheet" href="css/app-shell.css">
  <style>
    :root { color-scheme: dark; background:#061321; color:#f1eee9; font-family:system-ui,sans-serif; } body { margin:0; min-height:100dvh; background:radial-gradient(circle at 78% 8%,rgba(69,108,177,.2),transparent 25rem),#061321; } .profile { width:min(100% - 40px,720px); margin:0 auto; padding:calc(30px + env(safe-area-inset-top,0px)) 0 calc(34px + var(--app-shell-nav-height) + env(safe-area-inset-bottom,0px)); } h1 { margin:0; font:400 clamp(38px,11vw,54px) Georgia,"Noto Serif",serif; } .sub { margin:8px 0 28px; color:rgba(224,233,245,.66); font-size:17px; } .identity { display:grid; grid-template-columns:56px minmax(0,1fr) auto; gap:16px; align-items:center; padding:8px 0 24px; border-bottom:1px solid rgba(175,202,234,.15); } .avatar { display:grid; width:56px;height:56px;border:1px solid #315280;border-radius:50%; overflow:hidden; place-items:center;color:#89b5ff;background:#0c1d31;font-size:29px; } .avatar img { width:100%;height:100%;object-fit:cover; } .identity strong { display:block;font:400 25px Georgia,"Noto Serif",serif; } .identity span { display:block;margin-top:6px;color:rgba(224,233,245,.62);font-size:14px; } button { font:inherit; } .plain { border:0;color:#a9c9ff;background:transparent;font-size:22px; } .checkin { display:flex;justify-content:space-between;gap:18px;align-items:center;padding:25px 0; } .checkin span { display:block;color:rgba(224,233,245,.62);font-size:15px; } .checkin strong { display:block;margin-top:5px;font:400 43px Georgia,"Noto Serif",serif; } .primary { min-height:52px;padding:0 24px;border:1px solid rgba(193,217,255,.7);border-radius:10px;color:#07172a;background:#82b1ff;font-weight:650;white-space:nowrap; } .primary:disabled { color:rgba(226,237,255,.72);background:rgba(97,134,189,.3);border-color:rgba(174,202,234,.2); } .group { margin-top:18px;border:1px solid rgba(175,202,234,.17);border-radius:17px;background:rgba(13,32,53,.58);overflow:hidden; } .group h2 { margin:0;padding:13px 16px;border-bottom:1px solid rgba(175,202,234,.15);color:rgba(197,215,240,.75);font-size:17px;font-weight:400; } .row { display:grid;width:100%;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px;border:0;border-bottom:1px solid rgba(175,202,234,.12);color:inherit;background:transparent;text-align:left; } .row:last-child { border-bottom:0; } .row:active { background:rgba(122,166,228,.09); } .row i { color:#adc9ff;font-size:26px;font-style:normal;text-align:center; } .row b { display:block;font:400 20px Georgia,"Noto Serif",serif; } .row small { display:block;margin-top:4px;color:rgba(224,233,245,.62);font-size:14px;line-height:1.35; } .arrow { color:rgba(224,233,245,.65);font-size:28px; } .danger { margin-top:20px;border-color:rgba(221,98,91,.3); } .danger .row,.danger .row i { color:#ff857e; } dialog { width:min(calc(100% - 48px),430px);border:1px solid rgba(175,202,234,.28);border-radius:18px;color:#edf2fa;background:#0c2037;box-shadow:0 24px 70px rgba(0,0,0,.5); } dialog::backdrop { background:rgba(0,8,18,.68); } dialog label { display:block;margin:13px 0 5px;color:#cbd9ef;font-size:14px; } dialog input { width:100%;box-sizing:border-box;padding:11px;border:1px solid rgba(175,202,234,.28);border-radius:9px;color:#edf2fa;background:#07192b;font:inherit; } #profileError { margin:10px 0 0; color:#ff9d97; font-size:14px; line-height:1.4; } .dialog-actions { display:flex;justify-content:flex-end;gap:10px;margin-top:18px; } .secondary { min-height:42px;padding:0 16px;border:1px solid rgba(175,202,234,.26);border-radius:9px;color:#e6eefb;background:transparent; } @media(max-width:360px){.profile{width:min(100% - 28px,720px)}.checkin{align-items:flex-start;flex-direction:column}.primary{width:100%}}
  </style>
</head>
<body>
  <main class="profile" id="profilePage" aria-live="polite"></main>
  <dialog id="profileDialog"><form method="dialog"><h2>编辑本地资料</h2><label for="nickname">昵称</label><input id="nickname" maxlength="32"><label for="localId">本地 ID</label><input id="localId" maxlength="48"><label for="avatarFile">头像</label><input id="avatarFile" type="file" accept="image/jpeg,image/png,image/webp"><p id="profileError" role="alert" hidden></p><div class="dialog-actions"><button class="secondary" id="cancelProfile" value="cancel">取消</button><button class="secondary" id="removeAvatar" type="button">移除头像</button><button class="primary" id="saveProfile" type="button">保存</button></div></form></dialog>
  <input id="restoreInput" type="file" accept="application/json" hidden>
  <script src="js/app-runtime.js"></script>
  <script src="js/app-archive.js"></script>
  <script src="js/app-file-transfer.js"></script>
  <script src="js/app-profile.js"></script>
  <script src="js/app-profile-page.js"></script>
  <script>V1ProfilePage.mount({ store: V1ProfileStore, storage: localStorage, document: document });</script>
  <script src="js/app-shell.js"></script>
  <script>AppShell.mount({ current: 'my' });</script>
</body>
</html>
