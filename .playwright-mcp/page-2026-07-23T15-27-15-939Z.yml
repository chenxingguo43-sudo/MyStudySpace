              - paragraph [ref=f160e921]: "--- PAGE 38 --- Номер: 120 / Тип: single-choice / Вопрос: «Побледнев ..., он дрожащими пальцами застегнул на все пуговицы летнее пальто и поправил пенсне» (В.П. Катаев). / А) от негодования / Б) из-за негодования / В) с негодованием / Г) через негодование Номер: 121 / Тип: single-choice / Вопрос: Каждый год ... заболевают миллионы людей — среди них те, кто курит, и те, кто только вдыхает табачный дым. / А) с курением / Б) для курения / В) от курения / Г) при курении Номер: 122 / Тип: single-choice / Вопрос: На соревнованиях по лёгкой атлетике спортсмен ... пробежал дистанцию не с самым лучшим результатом. / А) в волнении / Б) с волнением / В) при волнении / Г) из-за волнения Номер: 123 / Тип: single-choice / Вопрос: В мире почти двести миллионов человек изучают русский язык; тысячи из них приезжают в Россию ... высшего образования. / А) на получение / Б) за получение / В) для получения Номер: 124 / Тип: single-choice / Вопрос: За всю историю развития научного знания учёные не раз рисковали жизнью ... . / А) на науку / Б) ради науки / В) за науку Номер: 125 / Тип: single-choice / Вопрос: Интеллигенция разных стран мира сегодня всё чаще покидает большие города ... в деревенской глуши. / А) на жизнь / Б) за жизнь / В) ради жизни Номер: 126 / Тип: single-choice / Вопрос: В России почти в каждой семье есть человек, воевавший или погибший ... в Великой Отечественной войне 1941–1945 годов. / А) за победу / Б) для победы / В) на победу --- PAGE 39 --- Номер: 127 / Тип: single-choice / Вопрос: Знаменитый английский поэт лорд Байрон погиб в 1824 году, сражаясь ... Греции. / А) для свободы / Б) на свободу / В) за свободу Номер: 128 / Тип: single-choice / Вопрос: Миллионы доноров во всём мире сдают кровь ... жизни других людей. / А) для спасения / Б) на спасение / В) за спасение Номер: 129 / Тип: single-choice / Вопрос: Поводом к войне ... между американскими Севером и Югом стало нежелание граждан подчиняться произволу власти. / А) для независимости / Б) от независимости / В) за независимость / Г) с независимостью Номер: 130 / Тип: single-choice / Вопрос: Геологам требуются годы ... месторождений серебра и олова на обширной территории Якутии. / А) за поиск / Б) на поиск / В) ради поиска Номер: 131 / Тип: single-choice / Вопрос: По дороге из Сибири на юг чёрные аисты останавливаются ... в казахских степях. / А) за отдыхом / Б) ради отдыха / В) на отдых Номер: 132 / Тип: single-choice / Вопрос: Дожди пришли ... австралийским пожарным, которые сражались с огнём, бушующим в восточных штатах страны. / А) на помощь / Б) для помощи / В) ради помощи Номер: 133 / Тип: single-choice / Вопрос: В интернет-магазине молодые родители могут приобрести всё необходимое ... за новорождённым. / А) для ухода / Б) ради ухода / В) на уход Номер: 134 / Тип: single-choice / Вопрос: Дедушка посадил внука на лавочку, а сам пошёл ... . / А) для мороженого / Б) за мороженым / В) ради мороженого Номер: 135 / Тип: single-choice / Вопрос: Преподаватели и студенты собрались на кафедре ... тематики дипломных работ. / А) ради обсуждения / Б) для обсуждения / В) за обсуждение --- PAGE 40 --- Номер: 136 / Тип: single-choice / Вопрос: Мой друг пошёл ... на балет Сергея Прокофьева «Ромео и Джульетта». / А) для билетов / Б) на билеты / В) ради билетов / Г) за билетами Номер: 137 / Тип: single-choice / Вопрос: «Однажды вечером (это было в начале октября 1773 года) сидел я дома один, слушая вой осеннего ветра» (А.С. Пушкин). / А) где? / Б) в чём? / В) когда? / Г) сколько? Номер: 138 / Тип: single-choice / Вопрос: «Берег обрывом спускался к морю почти у самых стен лачуги» (М.Ю. Лермонтов). / А) как? / Б) каким? / В) почему? / Г) с чем? Номер: 139 / Тип: single-choice / Вопрос: «Я чувствовал себя счастливым... Но отчего я был счастлив?» (И.С. Тургенев). / А) отчего? / Б) каким? / В) чем? / Г) почему? Номер: 140 / Тип: single-choice / Вопрос: «В сентябре он приехал к нам всего на сутки — проститься перед отъездом на фронт» (И.А. Бунин). / А