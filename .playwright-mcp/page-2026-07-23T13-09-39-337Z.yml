          - generic [ref=f54e532]:
            - generic [ref=f54e535]:
              - heading "Gemini 说" [level=2] [ref=f54e536]
              - generic [ref=f54e540]:
                - paragraph [ref=f54e604]: "--- PAGE 66 ---"
                - paragraph [ref=f54e605]: "Номер: 76 Тип: single-choice Вопрос: Без государственного регулирования невозможно создать многоотраслевой хозяйственный комплекс в районах Крайнего Севера. А) По мере того как отсутствует государственное регулирование Б) Хотя отсутствует государственное регулирование В) Если отсутствует государственное регулирование"
                - paragraph [ref=f54e606]: "Номер: 77 Тип: single-choice Вопрос: При прямой трансляции лекции вы можете задать лектору вопрос, используя интернет-чат. А) Хотя трансляция лекции прямая Б) При том что трансляция лекции прямая В) Если трансляция лекции прямая"
                - paragraph [ref=f54e607]: "Номер: 78 Тип: single-choice Вопрос: При переходе на «летнее время» на Северо-Кавказской железной дороге принимаются меры для обеспечения бесперебойного движения поездов. А) Когда осуществляется переход на «летнее время» Б) Если осуществляется переход на «летнее время» В) Хотя осуществляется переход на «летнее время» Г) Чтобы осуществить переход на «летнее время»"
                - paragraph [ref=f54e608]: "Номер: 79 Тип: single-choice Вопрос: При постоянном росте числа персональных компьютеров компьютерную грамотность многих пользователей пока ещё нельзя назвать высокой. А) Так как наблюдается постоянный рост Б) Хотя наблюдается постоянный рост В) Пока наблюдается постоянный рост Г) Если наблюдается постоянный рост"
                - paragraph [ref=f54e609]: "Номер: 80 Тип: single-choice Вопрос: Студенты экономических факультетов вузов изучают маркетинг, менеджмент и логистику, стремясь постичь законы современного финансового мира. А) хотя стремятся Б) поэтому стремятся В) когда стремятся Г) поскольку стремятся"
                - paragraph [ref=f54e610]: "--- PAGE 67 ---"
                - paragraph [ref=f54e611]: "Номер: 81 Тип: single-choice Вопрос: Эксперты ООН во «Всемирном докладе по проблемам молодёжи» утверждают: «Нынешнее молодое поколение является самым образованным в истории человечества»."
                - paragraph [ref=f54e612]: "Номер: 82 Тип: single-choice Вопрос: Французский писатель Александр Дюма в книге «От Парижа до Астрахани» писал: «Россия имеет Волгу — самую большую реку в Европе, царицу рек»."
                - paragraph [ref=f54e613]: "Номер: 83 Тип: single-choice Вопрос: Русский художник И.К. Айвазовский, рисовавший море всю свою жизнь, говорил: «Проживи я ещё триста лет, всегда бы нашёл в море нечто новое»."
                - paragraph [ref=f54e614]: "Номер: 84 Тип: single-choice Вопрос: Руководитель фольклорной практики сказал студентам: «Запишите текст казачьей свадебной песни»."
                - paragraph [ref=f54e615]: "Номер: 85 Тип: single-choice Вопрос: Я поинтересовался у своего друга-путешественника: «Ты видел водопад Виктория, когда был в Африке?»"
                - paragraph [ref=f54e616]: "Номер: 86 Тип: single-choice Вопрос: В новогоднюю ночь он сказал ей: «Как замечательно, что ты есть и что всё у нас ещё впереди!»"
                - paragraph [ref=f54e617]: "Номер: 87 Тип: single-choice Вопрос: «Был в древности народ, жил он там, где греческие и римские географы предполагали существование Гиперборейского моря» (М.Е. Салтыков-Щедрин). А) в какое место? Б) почему? В) как? Г) в каком месте?"
                - paragraph [ref=f54e618]: "Номер: 88 Тип: single-choice Вопрос: «Не ожидая услышать ничего интересного, я встал, чтобы походить по платформе до отхода поезда» (Л.Н. Толстой). А) куда? Б) с какой целью? В) когда? Г) где?"
                - paragraph [ref=f54e619]: "Номер: 89 Тип: single-choice Вопрос: «Если человек сам себя не любит, тогда он никого не может любить, — на что он тогда пригоден?» (А.Н. Толстой). А) при каком условии? Б) когда? В) как? Г) зачем?"
                - paragraph [ref=f54e620]: "--- PAGE 68 ---"
                - paragraph [ref=f54e621]: "Номер: 90 Тип: single-choice Вопрос: «Вы смело смотрите вперёд, так как жизнь ещё скрыта от ваших молодых глаз» (А.П. Чехов). А) почему? Б) когда? В) где? Г) как?"
                - paragraph [ref=f54e622]: "Номер: 91 Тип: single-choice Вопрос: «Спи, Алька, спи», — быстро заговорила Натка, потому что глаза у Альки что-то уж очень ярко заблестели (А.П. Гайдар). А) где? Б) почему? В) когда? Г) как?"
                - paragraph [ref=f54e623]: "Номер: 92 Тип: single-choice Вопрос: «Если бы я обрушил на землю весь небесный свод, я не чувствовал бы себя более несчастным и виноватым» (С.Я. Маршак). А) как? Б) когда? В) почему? Г) при каком условии?"
                - paragraph [ref=f54e624]: "Номер: 93 Тип: single-choice Вопрос: «Пищу он выбирал лёгкую, чтобы мысль могла двигаться свободно» (В.В. Набоков). А) когда? Б) с какой целью? В) как? Г) при каком условии?"
                - paragraph [ref=f54e625]: "Номер: 94 Тип: single-choice Вопрос: «Верстах в восьми от станицы, там, где Дон упирается в седую гору, спустились к воде» (М.А. Шолохов). А) почему? Б) когда? В) в каком месте? Г) зачем?"
                - paragraph [ref=f54e626]: "Номер: 95 Тип: single-choice Вопрос: «Когда он появлялся в столовой, то та часть зала, где стоял его стол, озарялась каким-то светом» (Л.С. Петрушевская). А) когда? Б) зачем? В) почему? Г) какая?"
                - paragraph [ref=f54e627]: "Номер: 96 Тип: single-choice Вопрос: «Всё это началось два века назад, когда в недрах Марса был вдруг обнаружен пустой тоннельный город» (А. и Б. Стругацкие). А) почему? Б) в какое время? В) где? Г) на какое время?"
                - paragraph [ref=f54e628]: "--- PAGE 69 ---"
                - paragraph [ref=f54e629]: "Номер: 97 Тип: single-choice Вопрос: Если верить социологам, через пятьдесят лет две трети жителей Земли будут называть себя горожанами. А) почему? Б) когда? В) зачем? Г) при каком условии?"
                - paragraph [ref=f54e630]: "Номер: 98 Тип: single-choice Вопрос: Современный человек уже ни за что не согласится отказаться от всех благ цивилизации, хотя большой город таит в себе много опасностей. А) несмотря на что? Б) почему? В) как? Г) когда?"
                - paragraph [ref=f54e631]: "Номер: 99 Тип: single-choice Вопрос: Древние римляне и греки стелили под колесницы солому, чтобы приглушить грохот колёс на улицах города. А) когда? Б) где? В) с какой целью? Г) как?"
                - paragraph [ref=f54e632]: "Номер: 100 Тип: single-choice Вопрос: Современные мегаполисы опасны для человека, поскольку в них превышен уровень шума, что сокращает жизнь на восемь-двенадцать лет. А) когда? Б) зачем? В) почему? Г) где?"
                - paragraph [ref=f54e633]: "Номер: 101 Тип: single-choice Вопрос: Сегодня учёные склоняются к тому, чтобы проложить все инженерные и транспортные коммуникации под землёй. А) к чему? Б) почему? В) в чём? Г) где?"
                - paragraph [ref=f54e634]: "Номер: 102 Тип: single-choice Вопрос: Архитекторы XXI века пытаются уйти от гигантских сооружений, так как человек должен жить в уютных домах среди деревьев. А) куда? Б) когда? В) как? Г) почему?"
                - paragraph [ref=f54e635]: "--- PAGE 70 ---"
                - paragraph [ref=f54e636]: "Номер: 1 Тип: single-choice Вопрос: В третьем тысячелетии информационные технологии играют важную роль в развитии ... . А) общественности Б) общества В) общности"
                - paragraph [ref=f54e637]: "Номер: 2 Тип: single-choice Вопрос: В начале XXI века крупнейшие мыслители европейских стран обратились к гуманистическим ... прошлого. А) обычаям Б) традициям"
                - paragraph [ref=f54e638]: "Номер: 3 Тип: single-choice Вопрос: Для ... любой страны естественным является хорошее знание иностранных языков. А) дипломников Б) дипломов В) дипломантов Г) дипломатов"
                - paragraph [ref=f54e639]: "Номер: 4 Тип: single-choice Вопрос: Встреча российского министра иностранных дел с коллегами из стран СНГ прошла в ... взаимопонимания. А) условии Б) обстановке В) обстоятельстве Г) положении"
                - paragraph [ref=f54e640]: "Номер: 5 Тип: single-choice Вопрос: Одной из целей национального проекта «Образование» является поддержка молодых российских учёных, ... им возможностей для профессионального роста. А) представление Б) передача В) предоставление Г) оказание"
                - paragraph [ref=f54e641]: "Номер: 6 Ти型: single-choice Вопрос: ... главы администрации — важнейшее событие в жизни города. А) Выборы Б) Выборка В) Выбор"
                - paragraph [ref=f54e642]: "Номер: 7 Тип: single-choice Вопрос: Специалисты считают психологическое равновесие важным ... поддержания здоровья. А) фактом Б) фактором"
                - paragraph [ref=f54e643]: "--- PAGE 71 ---"
                - paragraph [ref=f54e644]: "Номер: 8 Тип: single-choice Вопрос: Древнеримский поэт Квинт Гораций всю жизнь пытался подчинить себе ..., а не подчиняться им. А) обстоятельства Б) условия"
                - paragraph [ref=f54e645]: "Номер: 9 Тип: single-choice Вопрос: ... цен на товары широкого спроса всегда с радостью воспринимается покупателями. А) Спад Б) Упадок В) Падение"
                - paragraph [ref=f54e646]: "Номер: 10 Тип: single-choice Вопрос: Английский физик XX века Резерфорд считал, что для учёного важно уметь высказывать своё ... и выслушивать оппонентов. А) толкование Б) положение В) воззрение Г) мнение"
                - paragraph [ref=f54e647]: "Номер: 11 Тип: single-choice Вопрос: Астроном А.В. Архипов в своей книге «Неразгаданные тайны Вселенной» рассказывает о таинственных феноменах в небе и о находках странных ... на Земле. А) вещей Б) предметов"
                - paragraph [ref=f54e648]: "Номер: 12 Тип: single-choice Вопрос: Бюллетень новых книжных ... даёт информацию о литературе, которую получает Всероссийская государственная библиотека иностранной литературы. А) поступков Б) проступков В) поступлений Г) выступлений"
                - paragraph [ref=f54e649]: "Номер: 13 Тип: single-choice Вопрос: Написанию дипломной работы предшествует ... теоретического и фактического материала. А) собрание Б) сбор В) собирание Г) сборка"
                - paragraph [ref=f54e650]: "Номер: 14 Тип: single-choice Вопрос: Коллегия адвокатов приглашает студентов старших курсов юридических факультетов на ... помощника адвоката. А) работу Б) функции В) должность"
                - paragraph [ref=f54e651]: "Номер: 15 Тип: single-choice Вопрос: В ... редактора журнала или газеты входит организация работы коллектива, редактирование и написание статей. А) обязанности Б) обязательства"
                - paragraph [ref=f54e652]: "Номер: 16 Тип: single-choice Вопрос: Однажды в газете была допущена комическая ... вместо слова «туш» написали «шум»: «музыканты сыграли громкий шум». А) допечатка Б) перепечатка В) опечатка Г) печать"
                - paragraph [ref=f54e653]: "--- PAGE 72 ---"
                - paragraph [ref=f54e654]: "Номер: 17 Тип: single-choice Вопрос: Если ночь будет ясной, то мы сможем увидеть, как падают звёзды, и загадать ... . А) план Б) мечту В) желание Г) проект"
                - paragraph [ref=f54e655]: "Номер: 18 Тип: single-choice Вопрос: В наше время решение глобальных экологических проблем немыслимо без активного участия в этом процессе ... общественности. А) миролюбивой Б) мирной В) мировой Г) мирской"
                - paragraph [ref=f54e656]: "Номер: 19 Тип: single-choice Вопрос: Философ Николай Бердяев трактовал русскую ... литературу как литературу, рассматривающую жизнь с христианских позиций. А) классическую Б) классовую В) классную"
                - paragraph [ref=f54e657]: "Номер: 20 Тип: single-choice Вопрос: Известный политический деятель Уинстон Черчилль презирал войну, считая её каталогом ... ошибок. А) грубых Б) сильных В) резких"
                - paragraph [ref=f54e658]: "Номер: 21 Тип: single-choice Вопрос: Социологи и психологи утверждают, что современному человеку важно быть ..., иметь много контактов и уметь их поддерживать. А) общим Б) общинным В) общественным Г) общительным"
                - paragraph [ref=f54e659]: "Номер: 22 Тип: single-choice Вопрос: Учёные считают, что постоянно радоваться жизни вредно для ... здоровья человека. А) психического Б) психологического"
                - paragraph [ref=f54e660]: "Номер: 23 Тип: single-choice Вопрос: Любое ... заболевание — это, как правило, заболевание всего организма. А) кожевенное Б) кожаное В) кожистое Г) кожное"
                - paragraph [ref=f54e661]: "--- PAGE 73 ---"
                - paragraph [ref=f54e662]: "Номер: 24 Тип: single-choice Вопрос: ... человек страдает сам и создаёт дискомфорт для окружающих. А) Обидный Б) Обидчивый"
                - paragraph [ref=f54e663]: "Номер: 25 Тип: single-choice Вопрос: Человек должен находиться в постоянном ... поиске, в этом ему помогает чтение книг. А) душевном Б) душном В) душистом Г) духовном"
                - paragraph [ref=f54e664]: "Номер: 26 Тип: single-choice Вопрос: Священник одного из московских храмов монах Сергий наставляет молодых людей на путь ..., читая свои проповеди в рок-клубах. А) справедливый Б) правдивый В) истинный Г) настоящий"
                - paragraph [ref=f54e665]: "Номер: 27 Тип: single-choice Вопрос: ... причиной ошибок в употреблении слов является незнание их значений. А) Типической Б) Типовой В) Типичной Г) Типологической"
