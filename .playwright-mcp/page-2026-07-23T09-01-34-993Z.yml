              - paragraph [ref=f14e450]: "Данная книга входит в учебный комплекс, включающий в себя также пособия «Чтение», «Письмо», «Аудирование. Говорение». В качестве адресатов авторы видят иностранных бакалавров, магистрантов, стажёров, обучающихся на нефилологических факультетах вузов России и готовящихся к итоговому тестированию по второму и частично по третьему сертификационному уровню общего владения русским языком. Между всеми пособиями комплекса существует преемственность, нашедшая отражение в темах, актуальных для данных уровней: духовное развитие человека и его экологического сознания; общественные, научные и культурные взаимодействия людей и другие."
              - paragraph [ref=f14e451]: Задания каждого пособия представлены в тестовой форме, предусмотренной государственными контрольно-измерительными материалами. Упражнения комплекса авторы предлагают использовать в качестве обучающе-тренировочных на этапе, когда возникает необходимость структурировать знания учащихся и проверить степень их готовности к итоговым экзаменам. Таким образом, основной целью комплекса является систематизация и коррекция языковых знаний, навыков и речевых умений иностранцев, изучающих русский язык
