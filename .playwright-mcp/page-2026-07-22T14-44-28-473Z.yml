    - generic [ref=f4e120]:
      - generic [ref=f4e121]:
        - generic [ref=f4e122]:
          - generic [ref=f4e123] [cursor=pointer]:
            - paragraph [ref=f4e124]: "Литературоведение — одна́ из двух филологических наук — нау́ка о литературе. Другая филологическая нау́ка — нау́ка о языке́ — э́то языкознание, и́ли лингвистика. У э́тих наук е́сть мно́го общего: и литературоведение, и лингвистика изучают словесное тво́рчество, т. е. словесность. Поэ́тому они́ развивались в тесной связи друг с дру́гом под общим названием «филология», что́ означает в переводе с древнегреческого «любовь к слову». ▸"
            - paragraph: 文学研究是两门语文学科之一，即关于文学的学科。另一门语文学科，即关于语言的学科，是语言学。这两门学科有许多共同之处：文学研究和语言学都研究言语创作，即文学。因此，它们在彼此的紧密联系中发展起来，统称为"语文学"，该词源自古希腊语，意为"对词语的热爱"。
          - generic [ref=f4e125] [cursor=pointer]:
            - paragraph [ref=f4e126]: Литературоведение и лингвистика — различные науки, та́к как они́ ставят пе́ред собой ра́зные познавательные зада́чи. Лингвистика изуча́ет разнообразные проявления словесной деятельности люде́й, анализирует особенности развития тех языков, на которых гово́рят и пишут народы мира. Литературоведение изуча́ет художественную литературу для того́, что́бы поня́ть ее особенности и пути развития. Литературоведение и лингвистика имеют разный предме́т и различные зада́чи. Поэ́тому э́ти науки пользуются свои́ми собственными принципами при собира- нии, сравнении и классификации материала, используют ра́зные методы изучения. ▸
            - paragraph: 文学研究和语言学是不同的学科，因为它们各自设定不同的认知任务。语言学研究人类言语活动的各种表现形式，分析世界各民族口头和书面语言的发展特征。文学研究则研究文学作品，旨在理解其特征与发展道路。文学研究和语言学有着不同的研究对象和不同的任务。因此，这些学科在收集、比较和分类材料时遵循各自特有的原则，并使用不同的研究方法。
          - generic [ref=f4e127] [cursor=pointer]:
            - paragraph [ref=f4e128]: "Но имея разный предме́т и различные зада́чи своего изучения, литературоведение и лингвистика постоя́нно взаимодействуют ме́жду собой и помога́ют друг дру́гу. Та́к, художественная литература служит важным материалом для лингвистических исследований и выводов о структуре и особенностях языков. И литературоведение мо́жет многое дать лингвистике для понимания э́тих особенностей. В то́ же вре́мя при изуче́нии литературы необходима помощь лингвистики. Литературные языки развиваются, в них происходят измене́ния лексического состава и грамма- тического строя: одни слова́ устаревают и бо́льше не́ употребляются, дру́гие получают новое значе́ние, появля́ются но́вые слова́ и фразеологизмы, по-новому используются синтаксические конструкции и т. д. Кро́ме того́, в своих произведениях писатели нередко используют в речи действующих лиц диалектизмы, лексически и́ли грамматически отличающиеся от слов литературного языка́ того́ же народа. Поэ́тому литературоведческое изучение художественных произведений до́лжно учитывать данные лингвистики и опираться на лингвистические исследования. Ина́че литературоведы мо́гут сде́лать серьезные оши́бки в понимании и оценке произведений. ▸"
            - paragraph: 然而，尽管研究对象和任务各不相同，文学研究和语言学却不断相互作用、彼此帮助。例如，文学作品是语言学研究的重要材料，也是关于语言结构和特点的结论的依据。同时，文学研究也能为语言学提供很多东西以帮助理解这些特点。而在研究文学时，语言学的帮助同样是必不可少的。文学语言在发展，其词汇构成和语法结构都在变化：一些词过时不再使用，另一些词获得新的含义，出现新的词和成语，句法结构以新的方式被使用，等等。此外，作家在作品中常常在人物的言语中使用方言词，这些词在词汇或语法上与同一民族的文学语言不同。因此，对文学作品的文学研究必须考虑语言学的资料并以语言学研究为依据。否则，文学研究者在理解和评价作品时可能犯严重错误。
          - generic [ref=f4e129] [cursor=pointer]:
            - paragraph [ref=f4e130]: Та́ким о́бразом, зада́чи и методы изучения художественной словесности в литературоведении и лингвистике соверше́нно различны. Лингвистика изуча́ет в произведениях литературы лексические, фонетические, грамматические особенности тех языков, на которых э́ти произведения написаны. Литературоведение изуча́ет произведения художественной словесности как произведения искусства, учитывая и их языковую сторону. Литературовед рассматривает все́ особенности произведения с эстетической то́чки зре́ния. ▸
            - paragraph: 由此可见，文学研究和语言学在研究文学创作方面的任务和方法是截然不同的。语言学研究文学作品中所使用的语言的词汇、语音、语法特点。文学研究则将文学作品作为艺术作品来研究，同时兼顾其语言方面。文学研究者从审美角度审视作品的全部特征。
          - generic [ref=f4e131] [cursor=pointer]:
            - paragraph [ref=f4e132]: Итак, литературоведение и лингвистика входят в филологию, но у каждой науки свой предме́т, свои́ собственные зада́чи и методы изучения. ▸
            - paragraph: 总之，文学研究和语言学同属语文学，但每门学科都有自己的研究对象、自己的任务和研究方法。
