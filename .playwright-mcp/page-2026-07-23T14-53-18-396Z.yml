          - generic [ref=f90e466]:
            - heading "Gemini 说" [level=2] [ref=f90e467]
            - generic [ref=f90e471]:
              - paragraph [ref=f90e472]: "--- PAGE 21 ---"
              - paragraph [ref=f90e473]: "Номер: 20 / Тип: single-choice / Вопрос: Учёные утверждают, что мозг дельфина по строению напоминает ... человека. / А) к мозгу / Б) с мозгом / В) мозг / Г) мозгом"
              - paragraph [ref=f90e474]: "Номер: 21 / Тип: single-choice / Вопрос: Животные приспосабливаются ..., в которых им приходится существовать. / А) для условий / Б) на условия / В) по условиям / Г) к условиям"
              - paragraph [ref=f90e475]: "Номер: 22 / Тип: single-choice / Вопрос: В Краснодарском крае открывается горнолыжный центр, который будет отличаться от европейских только ... . / А) по низким ценам / Б) низким ценам / В) с низкими ценами / Г) низкими ценами"
              - paragraph [ref=f90e476]: "Номер: 23 / Тип: single-choice / Вопрос: Процент россиян, которые верят ... национального футбола, намного выше, чем доля пессимистов. / А) успеху / Б) в успех / В) в успехе / Г) за успех"
              - paragraph [ref=f90e477]: "Номер: 24 / Тип: single-choice / Вопрос: Историей доказано, что в тоталитарном государстве люди не свободны ... . / А) своим выбором / Б) со своим выбором / В) для своего выбора / Г) в своём выборе"
              - paragraph [ref=f90e478]: "Номер: 25 / Тип: single-choice / Вопрос: Великий полководец Александр Македонский имел суровый характер, но и сострадание было ... не чуждо. / А) ему / Б) для него / В) им / Г) у него"
              - paragraph [ref=f90e479]: "--- PAGE 22 ---"
              - paragraph [ref=f90e480]: "Номер: 26 / Тип: single-choice / Вопрос: Египетские жрецы относили шахматную игру к числу наук: в то далёкое время шахматы были известны только ... . / А) ими одними / Б) им одним / В) к ним одним / Г) с ними одними"
              - paragraph [ref=f90e481]: "Номер: 27 / Тип: single-choice / Вопрос: Люди, склонные воспринимать жизнь с юмором, обычно терпимы ... . / А) к окружающим / Б) с окружающими / В) окружающим / Г) окружающими"
              - paragraph [ref=f90e482]: "Номер: 28 / Тип: single-choice / Вопрос: Желание быть принятым и оценённым окружающими свойственно ... . / А) любого человека / Б) в любом человеке / В) любому человеку / Г) с любым человеком"
              - paragraph [ref=f90e483]: "Номер: 29 / Тип: single-choice / Вопрос: «Понятие красоты не только не совпадает с добром, но, скорее, противоположно ...» (Л.Н. Толстой). / А) с ним / Б) к нему / В) им / Г) ему"
              - paragraph [ref=f90e484]: "Номер: 30 / Тип: single-choice / Вопрос: Описывая героев своих произведений, писатель Иван Бунин всегда внимателен ... . / А) к деталям / Б) на детали / В) для деталей / Г) с деталями"
              - paragraph [ref=f90e485]: "Номер: 31 / Тип: single-choice / Вопрос: Французский писатель Виктор Гюго считал, что люди должны быть снисходительны ... . / А) со счастливыми / Б) для счастливых / В) к счастливым / Г) о счастливых"
              - paragraph [ref=f90e486]: "Номер: 32 / Тип: single-choice / Вопрос: Сегодня погода не слишком благоприятна ...: и дождь, и снег, и холод — всё вместе. / А) к прогулке / Б) для прогулки / В) с прогулкой / Г) о прогулке"
              - paragraph [ref=f90e487]: "--- PAGE 23 ---"
              - paragraph [ref=f90e488]: "Номер: 33 / Тип: single-choice / Вопрос: Благодаря разумной ценовой политике московского Дома моды его одежда доступна ... . / А) среднему классу / Б) средним классом / В) со средним классом / Г) к среднему классу"
              - paragraph [ref=f90e489]: "Номер: 34 / Тип: single-choice / Вопрос: Стеклообои безвредны для человеческого организма и устойчивы ... окружающей среды. / А) в воздействии / Б) с воздействием / В) для воздействия / Г) к воздействию"
              - paragraph [ref=f90e490]: "Номер: 35 / Тип: single-choice / Вопрос: По мнению нашего тренера, ничья в матче с командой-чемпионом равноценна ... . / А) победу / Б) победы / В) победе / Г) победа"
              - paragraph [ref=f90e491]: "Номер: 36 / Тип: single-choice / Вопрос: Поезда московского метро ходят ... в полторы-две минуты. / А) в промежутке / Б) при промежутке / В) с промежутком / Г) за промежуток"
              - paragraph [ref=f90e492]: "Номер: 37 / Тип: single-choice / Вопрос: Окно ... распахнулось, и в комнату ворвались звуки улицы: детский крик, гудки машин, птичий гомон. / А) с громким шумом / Б) громким шумом / В) в громком шуме / Г) при громком шуме"
              - paragraph [ref=f90e493]: "Номер: 38 / Тип: single-choice / Вопрос: У англичан есть одна особенность: они умеют остроумно шутить и говорить смешные вещи ... лица. / А) серьёзным выражением / Б) с серьёзным выражением / В) серьёзное выражение / Г) в серьёзном выражении"
              - paragraph [ref=f90e494]: "--- PAGE 24 ---"
              - paragraph [ref=f90e495]: "Номер: 39 / Тип: single-choice / Вопрос: Куда бы Эрмитаж ни привозил свои экспонаты, его выставки всегда проходят ... . / А) по высокому уровню / Б) при высоком уровне / В) с высоким уровнем / Г) на высоком уровне"
              - paragraph [ref=f90e496]: "Номер: 40 / Тип: single-choice / Вопрос: То, что построено ... и во благо людей, — будет жить долго. / А) с любовью / Б) за любовь / В) к любви / Г) любовь"
              - paragraph [ref=f90e497]: "Номер: 41 / Тип: single-choice / Вопрос: «Кто ходит ..., тот медлителен в начале дела, но исполнителен» (А.Ф. Лосев). / А) с медленными шагами / Б) за медленными шагами / В) медленными шагами / Г) медленных шагов"
              - paragraph [ref=f90e498]: "Номер: 42 / Тип: single-choice / Вопрос: Известный писатель Александр Куприн умеет объяснять читателю даже самые сложные вещи ... . / А) простого языка / Б) с простым языком / В) через простой язык / Г) простым языком"
              - paragraph [ref=f90e499]: "Номер: 43 / Тип: single-choice / Вопрос: А.П. Чехов считал, что его Аню из «Вишнёвого сада» может играть даже неизвестная молодая актриса, лишь бы говорила ... . / А) со звонким голосом / Б) в звонком голосе / В) звонким голосом / Г) звонкого голоса"
              - paragraph [ref=f90e500]: "Номер: 44 / Тип: single-choice / Вопрос: «Ася опустила глаза и засмеялась ...» (И.С. Тургенев). / А) тихому и лёгкому смеху / Б) в тихом и лёгком смехе / В) с тихим и лёгким смехом / Г) тихим и лёгким смехом"
              - paragraph [ref=f90e501]: "Номер: 45 / Тип: single-choice / Вопрос: «Здесь проводит лучшие годы маленький Илья, в ласках матери и ... няньки» (И.А. Гончаров). / А) с присмотром / Б) под присмотром / В) за присмотром / Г) для присмотра"
              - paragraph [ref=f90e502]: "--- PAGE 25 ---"
              - paragraph [ref=f90e503]: "Номер: 46 / Тип: single-choice / Вопрос: «Однажды Трубадур встретил прекрасную Принцессу и полюбил её ...» (Е.Л. Шварц). / А) на первый взгляд / Б) после первого взгляда / В) с первого взгляда / Г) при первом взгляде"
              - paragraph [ref=f90e504]: "Номер: 47 / Тип: single-choice / Вопрос: «Когда-нибудь ты вспомнишь об этом ...» (Б. Окуджава). / А) с нежностью / Б) в нежности / В) для нежности / Г) к нежности"
              - paragraph [ref=f90e505]: "Номер: 48 / Тип: single-choice / Вопрос: Услышав звон колокола, дети подышали на морозное стекло и ... посмотрели на засыпанную снегом улицу. / А) с широко открытыми глазами / Б) в широко открытых глазах / В) широко открытым глазам / Г) широко открытыми глазами"
              - paragraph [ref=f90e506]: "Номер: 49 / Тип: single-choice / Вопрос: В соседнем доме бушевал пожар, и его хозяева ... в голосе спрашивали, можно ли спасти что-нибудь из их вещей. / А) в волнении / Б) из-за волнения / В) с волнением / Г) от волнения"
              - paragraph [ref=f90e507]: "Номер: 50 / Тип: single-choice / Вопрос: В рамках федеральной программы «Здоровье» во многих городах России проводятся соревнования ... . / А) бега / Б) бегом / В) на бегу / Г) по бегу"
              - paragraph [ref=f90e508]: "Номер: 51 / Тип: single-choice / Вопрос: Женщины должны помнить, что длительное ношение обуви ... вредно для здоровья. / А) с каблуками / Б) в каблуках / В) на каблуках / Г) при каблуках"
              - paragraph [ref=f90e509]: "--- PAGE 26 ---"
              - paragraph [ref=f90e510]: "Номер: 52 / Тип: single-choice / Вопрос: «Молодая семья ... снимет двухкомнатную квартиру в центре города» (из объявления в газете). / А) в три человека / Б) для трёх человек / В) из трёх человек / Г) на трёх человек"
              - paragraph [ref=f90e511]: "Номер: 53 / Тип: single-choice / Вопрос: «Сборник упражнений ... русского языка» можно купить в университетском книжном магазине начиная с двадцать первого сентября. / А) со стилистикой / Б) на стилистику / В) о стилистике / Г) по стилистике"
              - paragraph [ref=f90e512]: "Номер: 54 / Тип: single-choice / Вопрос: В книжной серии «Взгляд из России» вышла антология ... XX века. / А) по русской поэзии / Б) русской поэзии / В) русскую поэзию / Г) из русской поэзии"
              - paragraph [ref=f90e513]: "Номер: 55 / Тип: single-choice / Вопрос: Ф.М. Достоевский — писатель ...; его любят читатели, говорящие на разных языках. / А) мирового имени / Б) мировому имени / В) с мировым именем / Г) при мировом имени"
              - paragraph [ref=f90e514]: "Номер: 56 / Тип: single-choice / Вопрос: «Он был склонен к нравоучениям, хотя и делал их ...» (В.П. Катаев). / А) чувство юмора / Б) в чувстве юмора / В) к чувству юмора / Г) с чувством юмора"
              - paragraph [ref=f90e515]: "Номер: 57 / Тип: single-choice / Вопрос: Во время летнего отпуска мы жили в гостиничном номере ... на залив. / А) вида / Б) видом / В) при виде / Г) с видом"
              - paragraph [ref=f90e516]: "Номер: 58 / Тип: single-choice / Вопрос: Мой дед живёт в доме ..., которая нависла над морем. / А) на скале / Б) со скалой / В) скалы / Г) к скале"
              - paragraph [ref=f90e517]: "--- PAGE 27 ---"
              - paragraph [ref=f90e518]: "Номер: 59 / Тип: single-choice / Вопрос: Между Россией и Анголой первый Договор ... был подписан в 1976 году. / А) за дружбу / Б) о дружбе / В) с дружбой / Г) про дружбу"
              - paragraph [ref=f90e519]: "Номер: 60 / Тип: single-choice / Вопрос: Россия и Нидерланды подтвердили свою взаимную готовность ... в области сельского хозяйства. / А) для продолжения сотрудничества / Б) продолжить сотрудничество"
              - paragraph [ref=f90e520]: "Номер: 61 / Тип: single-choice / Вопрос: Современные режиссёры считают, что у них есть право ... при постановке классических произведений. / А) искать новую интонацию / Б) с поиском новой интонации"
              - paragraph [ref=f90e521]: "Номер: 62 / Тип: single-choice / Вопрос: Традиция ... святого Валентина появилась в России лет двадцать назад. / А) к празднованию дня / Б) праздновать день"
              - paragraph [ref=f90e522]: "Номер: 63 / Тип: single-choice / Вопрос: У моих родителей всегда было желание ... из маленького провинциального городка в столицу. / А) переезда / Б) переехать"
              - paragraph [ref=f90e523]: "Номер: 64 / Тип: single-choice / Вопрос: Плодородием почвы называется её способность ... питательными веществами и влагой. / А) в обеспечении растений / Б) обеспечивать растения"
              - paragraph [ref=f90e524]: "Номер: 65 / Тип: single-choice / Вопрос: Врачи советуют пациентам съедать до завтрака одну чайную ложку ... для поднятия жизненного тонуса. / А) с мёдом / Б) в мёде / В) мёда / Г) мёдом"
              - paragraph [ref=f90e525]: "Номер: 66 / Тип: single-choice / Вопрос: Коробка ... может стать отличным подарком к любому празднику: к Новому году, ко дню рождения, в день 8 марта. / А) из-под конфет / Б) с конфетами / В) для конфет / Г) конфет"
              - paragraph [ref=f90e526]: "Номер: 67 / Тип: single-choice / Вопрос: Ежегодное содержание королевы Елизаветы II обходится каждому британцу в шестьдесят пенсов, что дешевле, чем литр ... . / А) для молока / Б) молока / В) из-под молока / Г) с молоком"
              - paragraph [ref=f90e527]: "--- PAGE 28 ---"
              - paragraph [ref=f90e528]: "Номер: 68 / Тип: single-choice / Вопрос: Российские медики утверждают: для того чтобы прошла головная боль, достаточно съесть яблоко или выпить стакан ... . / А) сока / Б) с соком / В) для сока / Г) соком"
              - paragraph [ref=f90e529]: "Номер: 69 / Тип: single-choice / Вопрос: Чтобы приготовить сырники, необходимо размять вилкой пачку ..., добавить яйцо, соль, сахар, муку; всё размешать, сформировать лепёшки и жарить на масле (из книги «Кулинария»). / А) с творогом / Б) в твороге / В) творога / Г) для творога"
              - paragraph [ref=f90e530]: "Номер: 70 / Тип: single-choice / Вопрос: Учёные отмечают, что ... атмосфера Земли практически не изменила своего химического состава. / А) 2 миллиарда лет / Б) за 2 миллиарда лет / В) до 2 миллиардов лет / Г) на 2 миллиарда лет"
