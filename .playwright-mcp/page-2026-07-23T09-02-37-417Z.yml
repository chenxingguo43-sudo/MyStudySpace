                - heading "Page 5 — ОБЩЕЕ ПРЕДИСЛОВИЕ" [level=2] [ref=f14e644]
                - paragraph [ref=f14e645]: Учебно-тренировочные тесты. Выпуск 1. Грамматика. Лексика 5
                - heading "ОБЩЕЕ ПРЕДИСЛОВИЕ" [level=3] [ref=f14e646]
                - paragraph [ref=f14e647]:
                  - text: Данная книга входит в учебный комплекс, включающий в себя также пособия «Чтение», «Письмо», «Аудирование. Говорение». В качестве адресатов авторы видят иностранных бакалавров, магистрантов, стажёров, обучающихся на нефилологических факультетах вузов
                  - generic [ref=f14e648]:
                    - text: России и готовящихся к итоговому тестированию по второму и частично по третьему сертификационному уровню общего владения русским языком.
                    - superscript [ref=f14e649]
                  - generic [ref=f14e650]:
                    - text: "Между всеми пособиями комплекса существует преемственность, нашедшая отражение в темах, актуальных для данных уровней: духовное"
                    - superscript [ref=f14e651]
                  - text: развитие человека и его экологического сознания; общественные, научные и культурные взаимодействия людей и другие.
                  - button "查看来源详情。按 Enter 键打开来源对话框。" [ref=f14e655] [cursor=pointer]
                - paragraph [ref=f14e656]:
                  - generic [ref=f14e657]:
                    - text: Задания каждого пособия представлены в тестовой форме, предусмотренной государственными контрольно-измерительными материалами. Упражнения комплекса авторы предлагают использовать в качестве обучающе-тренировочных на этапе, когда возникает необходимость структури
                    - superscript [ref=f14e658]
                  - generic [ref=f14e659]:
                    - text: ровать знания учащихся и проверить степень их готовности к итоговым экзаменам. Таким образом, основной целью комплекса является
                    - superscript [ref=f14e660]
                  - generic [ref=f14e661]:
                    - text: систематизация и коррекция языковых знаний, навыков и речевых умений иностранцев, изучающих русский язык
                    - superscript [ref=f14e662]
                  - generic [ref=f14e663]:
                    - text: .
                    - superscript [ref=f14e664]
                  - superscript [ref=f14e665]
                  - superscript [ref=f14e666]
                - paragraph [ref=f14e667]:
                  - generic [ref=f14e668]:
                    - text: Материалы комплекса проходили апробацию в группах иностранных учащихся Южного федерального университета (г
                    - superscript [ref=f14e669]
                  - generic [ref=f14e670]:
                    - text: . Ростов-на-Дону) в течение трёх лет.
                    - superscript [ref=f14e671]
                  - superscript [ref=f14e672]
                - paragraph [ref=f14e673]:
                  - generic [ref=f14e674]:
                    - text: Работа выполнена в рамках внутреннего конкурса инновационных научно
                    - superscript [ref=f14e675]
                  - generic [ref=f14e676]:
                    - text: "-образовательных проектов в соответствии с Программой развития"
                    - superscript [ref=f14e677]
                  - text: Южного федерального университета на 2007–2010 годы.
                - heading "Page 6 — ПРЕДИСЛОВИЕ к учебному пособию «Грамматика. Лексика»" [level=2] [ref=f14e678]
                - paragraph [ref=f14e679]: 6 Учебно-тренировочные тесты. Выпуск 1. Грамматика. Лексика
                - heading "ПРЕДИСЛОВИЕ" [level=3] [ref=f14e680]
                - heading "к учебному пособию «Грамматика. Лексика»" [level=3] [ref=f14e681]
                - paragraph [ref=f14e682]: При разработке пособия авторы ориентировались на государственные образовательные стандарты по русскому языку как иностранному ТРКИ-2 и ТРКИ-3¹ и программу по русскому языку как иностранному для студентов-иностранцев, обучающихся на нефилологических факультетах вузов. Основная цель данной книги — систематизация и коррекция имеющихся у иностранных учащихся грамматических и лексических знаний.
                - paragraph [ref=f14e683]: Используемые здесь задания сконструированы с учётом современных тестовых технологий и представляют собой критериально-ориентированные тесты, которые выявляют соответствие знаний учащихся требованиям, заложенным в государственных стандартах, и подготавливают учащихся к прохождению итоговых тестовых экзаменов.
                - paragraph [ref=f14e684]: Большая часть упражнений представлена заданиями закрытой формы (множественный выбор); имеются также задания открытой формы (с ограниченным количеством ответов).
                - paragraph [ref=f14e685]: "Пособие «Грамматика. Лексика» состоит из двух разделов. Задания первого раздела направлены на совершенствование следующих умений: — употреблять видовременные формы глаголов, предложно-падежные формы существительных, краткие и полные формы прилагательных; — ориентироваться в структуре простого и сложного предложения, выражать смысловые отношения между элементами этих синтаксических единиц, применять правила согласования членов предложения; — использовать грамматическую синонимию (объектные, определительные, обстоятельственные отношения в простом и сложном предложении); — различать значения лексических единиц."
                - paragraph [ref=f14e686]: Первый раздел пособия состоит из пяти глав, каждая из которых делится на параграфы, системно представляющие учебный материал. Во втором разделе помещены грамматические и лексические комментарии, необходимые для выполнения тестовых заданий, поэтому авторы рекомендуют познакомиться в первую очередь с данными материалами.
                - paragraph [ref=f14e687]: Книга может быть использована не только на занятиях, но и при самостоятельной работе учащихся, для чего ко всем заданиям в Приложении даются ключи. Однако в пособии есть темы, рассматривать которые рекомендуется в аудитории (например, «Употребление деепричастия / деепричастного оборота», «Употребление видов глагола в инфинитиве и императиве»). В Приложении также даются краткие сведения об авторах цитат, включённых в задания, что способствует расширению фоновых знаний учащихся.
                - paragraph [ref=f14e688]: Авторы пособия выражают искреннюю благодарность заведующему кафедрой русского языка для иностранных учащихся Южного федерального университета (г. Ростов-на-Дону) профессору В.Д. Горянскому за ценные замечания, сделанные в процессе работы над рукописью.
                - paragraph [ref=f14e689]: ¹ Задания, помещённые в конце каждой главы и отмеченные знаком *, разработаны исключительно на основе требований образовательного стандарта ТРКИ-3.
                - heading "Page 7 — Раздел I. ТЕСТОВЫЕ ЗАДАНИЯ" [level=2] [ref=f14e690]
                - paragraph [ref=f14e691]: Учебно-тренировочные тесты. Выпуск 1. Грамматика. Лексика 7
