          - generic [ref=f3e109]: "Прочитайте текст и выполните задание к нему. Почти полтора миллиона москвичей готовы сменить прописку. Городом мечты для большинства из них стал Петербург, а вовсе не Рио-де-Жанейро. В каких городах страны и мира хотели бы жить москвичи? С таким вопросом специалисты «Ромир Мониторинга» обратились к жителям столицы в возрасте от 18 лет. 84 % москвичей не променяют свой город ни на какой другой населённый пункт в пределах страны. Однако почти каждый двадцатый опрошенный хотел бы жить в Санкт-Петербурге. А 7 % столичных жителей назвали другие города, среди которых чаще упоминаются Хабаровск, Сочи, Нижний Новгород. Но есть и желающие переехать в глушь, в тихое провинциальное местечко. Что касается выбора на международной арене, то 10 % москвичей с радостью покинули бы столицу, чтобы жить в Западной Европе. Ещё 3 % опрошенных хотели бы уехать в один из городов США или Канады. Исследование показало, что женщины более привязаны к Москве, нежели мужчины (89 % против 78 %), и чем младше респондент, тем с большей лёгкостью он относится к переселению. В столице всё тяжелее делать карьеру: привлекательные места в основном заняты, а Питер сейчас резко поднимается экономически, всё больше крупных компаний открывают там свои представительства и даже головные офисы, объясняет результаты президент «Ромир Мониторинга» Андрей Милехин. К тому же молодёжи кажется, что Петербург ближе к Европе. «Трудолюбивыми» мотивами объясняется и желание москвичей перебраться на Запад, где, как считают респонденты, созданы лучшие условия для ведения бизнеса и повышения благосостояния."
