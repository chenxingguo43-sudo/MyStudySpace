                - paragraph [ref=f9e2065]: 结论：总体方案高度可行，但需解决特定缺陷后方可量产。
                - paragraph [ref=f9e2066]: Gemini Vision 在处理复杂版式（如题目选项对齐、多列长文本表格）时表现出了极强的空间布局理解能力，这比传统的 OCR 软件（如 ABBYY）需要大量手动框选要高效得多。
                - paragraph [ref=f9e2067]: 最大的风险：
                - list [ref=f9e2068]:
                  - listitem [ref=f9e2069]:
                    - paragraph [ref=f9e2070]: 重音符号（Ударение）的系统性丢失：对于俄语作为外语（RFL）的教材，重音是核心教学内容。如果全部丢失，这批转写的文本在教学价值上将大打折扣。大型语言模型（LLM）在默认状态下有自动“纠错”或“正规化”文本的倾向，它可能认为带重音符号的俄语字母是“非标准字符”并自动替换为普通字母。
                  - listitem [ref=f9e2071]:
                    - paragraph [ref=f9e2072]:
                      - text: 格式输出的随机性：如测试B与测试C对比所示，模型有时用
                      - code [ref=f9e2073]: \t
                      - text: ，有时用
                      - code [ref=f9e2074]: "|"
                      - text: 。在批量处理时，这种不一致会导致后续入库或排版时出现大量的代码解析错误。
                - heading "4. 如果推全量 135 页，最需要注意什么？" [level=3] [ref=f9e2075]
                - paragraph [ref=f9e2076]: 如果准备全量推进，建议在 Prompt（提示词）层面和工程管线层面做以下优化：
                - list [ref=f9e2077]:
                  - listitem [ref=f9e2078]:
                    - paragraph [ref=f9e2079]: 强化系统提示词（Prompt Engineering）：
                    - list [ref=f9e2080]:
                      - listitem [ref=f9e2081]:
                        - paragraph [ref=f9e2082]:
                          - text: 针对重音：必须在提示词中用强烈语气声明：“严格保留原文中的所有俄语重音符号（а́, о́, е́ 等）。禁止将其标准化为普通字母。”（建议甚至可以在 Prompt 里用俄语双语强调：
                          - code [ref=f9e2083]: Сохраняйте все знаки ударения!
                          - text: ）。
                      - listitem [ref=f9e2084]:
                        - paragraph [ref=f9e2085]: 针对表格：明确规定输出格式：“所有呈现出表格、对比结构的版块，必须且只能使用标准的 Markdown 表格语法（|---|---|），严禁使用制表符（Tab）分隔。”
                      - listitem [ref=f9e2086]:
                        - paragraph [ref=f9e2087]: 针对表头：明确是否允许 AI 总结或翻译表头（如测试C中的 Word/Meaning）。如果不需要，要求“严格照抄原文，不添加原文没有的表头”。
                  - listitem [ref=f9e2088]:
                    - paragraph [ref=f9e2089]: 增加 Few-Shot（少样本）示例：在 Prompt 中提供一个带重音的俄语单词和正确 Markdown 表格的输入/输出示例，能极大收敛 AI 的发挥空间。
                  - listitem [ref=f9e2090]:
                    - paragraph [ref=f9e2091]: 建立抽检机制：全量跑的时候，可以写一个简单的 Python 脚本，扫描返回的内容中是否包含 Unicode 组合重音符（U+0301）。如果某一页的返回结果里一个重音符都没有，直接将其标记为“需人工复核”。
                - paragraph [ref=f9e2092]: 针对上述重音符号丢失这个最致命的风险，你是否需要在下一轮测试前，先由我帮你起草一段专门针对 Gemini 优化的“强制保留重音及 Markdown 格式”的 System Prompt 模板？
