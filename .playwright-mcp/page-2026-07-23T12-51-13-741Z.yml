            - generic [ref=f34e580]:
              - heading "Gemini 说" [level=2] [ref=f34e581]
              - generic [ref=f34e585]:
                - paragraph [ref=f34e645]: "--- PAGE 32 ---"
                - paragraph [ref=f34e646]: "Номер: 94 Тип: single-choice Вопрос: Китай и Россия рассматривают возможность создания самой протяжённой в Северо-Восточной Азии туристической зоны … Амур. А) с рекой Б) к реке В) вдоль реки Г) река"
                - paragraph [ref=f34e647]: "Номер: 95 Тип: single-choice Вопрос: Россиянин Фёдор Конюхов всегда мечтал совершить путешествие … . А) вдоль земного шара Б) вокруг земного шара В) около земного шара Г) снаружи земного шара"
                - paragraph [ref=f34e648]: "Номер: 96 Тип: single-choice Вопрос: …, найденных археологами на Урале, встречаются очень интересные экземпляры. А) Среди камней Б) В камнях В) С камнями Г) К камням"
                - paragraph [ref=f34e649]: "Номер: 97 Тип: single-choice Вопрос: Город Иркутск расположен недалеко … . А) у озера Байкал Б) от озера Байкал В) в озере Байкал Г) к озеру Байкал"
                - paragraph [ref=f34e650]: "Номер: 98 Тип: single-choice Вопрос: Путешествуя по Кавказу, туристы вышли к Голубым озёрам, находящимся на высоте шестьсот метров … моря. А) за уровнем Б) на уровне В) около уровня Г) над уровнем"
                - paragraph [ref=f34e651]: "Номер: 99 Тип: single-choice Вопрос: В Чёрном море … два метра водится мелкая рыба плотва. А) с глубиной Б) в глубине В) на глубине Г) глубиной"
                - paragraph [ref=f34e652]: "--- PAGE 33 ---"
                - paragraph [ref=f34e653]: "Номер: 100 Тип: single-choice Вопрос: Тридцать пять километров отделяют древний город Танаис, некогда самое северное греческое поселение, … . А) от Ростова-на-Дону Б) из Ростова-на-Дону В) с Ростовом-на-Дону Г) к Ростову-на-Дону"
                - paragraph [ref=f34e654]: "Номер: 101 Тип: single-choice Вопрос: В древности, если кораблю сопутствовала удача, он подходил … с поднятыми парусами. А) к родным берегам Б) у родных берегов В) на родные берега Г) по родным берегам"
                - paragraph [ref=f34e655]: "Номер: 102 Тип: single-choice Вопрос: Орнитологами замечено: птенцы, едва окрепнув, разлетаются … и начинают вести самостоятельную жизнь. А) от гнезда Б) из гнезда В) к гнезду Г) в гнездо"
                - paragraph [ref=f34e656]: "Номер: 103 Тип: single-choice Вопрос: «Лохматая дворняга с мокрой от грязи шерстью вышла … и остановилась в недоумении» (В.В. Набоков). А) за домом Б) у дома В) около дома Г) из-за дома"
                - paragraph [ref=f34e657]: "Номер: 104 Тип: single-choice Вопрос: Дом отдыха расположен в стороне …, в тихом сосновом бору. А) по дороге Б) к дороге В) от дороги Г) с дорогой"
                - paragraph [ref=f34e658]: "Номер: 105 Тип: single-choice Вопрос: Весенним вечером окна распахнуты настежь, льётся тихая музыка, а … пахнет сиренью. А) от сада Б) из сада В) у сада"
                - paragraph [ref=f34e659]: "Номер: 106 Тип: single-choice Вопрос: По вечерам … встречается вся семья — поужинать, пообщаться, обсудить последние новости. А) за столом Б) из-за стола В) на столе Г) к столу"
                - paragraph [ref=f34e660]: "--- PAGE 34 ---"
                - paragraph [ref=f34e661]: "Номер: 107 Тип: single-choice Вопрос: За разъяснением по этому вопросу вам лучше всего обратиться … факультета. А) к деканату Б) в деканате В) по деканату Г) в деканат"
                - paragraph [ref=f34e662]: "Номер: 108 Тип: single-choice Вопрос: … завершено обучение преподавателей и сотрудников по программе «Пользователь персонального компьютера». А) На нашу кафедру Б) В нашей кафедре В) На нашей кафедре Г) С нашей кафедрой"
                - paragraph [ref=f34e663]: "Номер: 109 Тип: single-choice Вопрос: … акционерного общества «Балтийский завод» были подведены итоги прошедшего финансового года. А) За собрание Б) На собрании В) В собрании Г) С собранием"
                - paragraph [ref=f34e664]: "Номер: 110 Тип: single-choice Вопрос: … глобального потепления на вершине горы Килиманджаро, находящейся в Африке, растаяли снега. А) Под давлением Б) Под влиянием В) От Г) Из"
                - paragraph [ref=f34e665]: "Номер: 111 Тип: single-choice Вопрос: … осуществления национального проекта «Здоровье» в России построены новые центры высоких медицинских технологий. А) От Б) В результате В) Под действием Г) Под влиянием"
                - paragraph [ref=f34e666]: "Номер: 112 Тип: single-choice Вопрос: На российском рынке лазерные принтеры завоевали достойное место … в работе и простоте в эксплуатации. А) благодаря своей надёжности Б) со своей надёжностью"
                - paragraph [ref=f34e667]: "--- PAGE 35 ---"
                - paragraph [ref=f34e668]: "Номер: 113 Тип: single-choice Вопрос: Металлический трос … сжался, натянулся, как струна, и лопнул. А) из-за мороза Б) вследствие мороза В) от мороза Г) по морозу"
                - paragraph [ref=f34e669]: "Номер: 114 Тип: single-choice Вопрос: … заповедника Аскания-Нова удалось спасти от гибели сайгаков — древнейших животных, ровесников мамонтов. А) Благодаря созданию Б) Из-за создания В) При создании Г) В создании"
                - paragraph [ref=f34e670]: "Номер: 115 Тип: single-choice Вопрос: Все горы на Земле разрушаются … воды, ветра и времени. А) с действием Б) к действию В) под действием Г) в силу действия"
                - paragraph [ref=f34e671]: "Номер: 116 Тип: single-choice Вопрос: В этом году зима в Европе запаздывает … тёплых масс воздуха из Атлантики. А) с проникновением Б) вследствие проникновения В) для проникновения Г) по проникновению"
                - paragraph [ref=f34e672]: "Номер: 117 Тип: single-choice Вопрос: Покидая корабль в последний день круиза, некоторые пассажиры … уносили с собой ключи от кают. А) с рассеянностью Б) из-за рассеянности В) от рассеянности Г) по рассеянности"
                - paragraph [ref=f34e673]: "Номер: 118 Тип: single-choice Вопрос: … остаться одной она вышла замуж за первого встречного. А) В страхе Б) Из страха В) У страха Г) Со страхом"
                - paragraph [ref=f34e674]: "Номер: 119 Тип: single-choice Вопрос: … дети взяли брошенного котёнка домой и стали за ним ухаживать. А) Из жалости Б) С жалостью В) От жалости Г) Из-за жалости"
                - paragraph [ref=f34e675]: "--- PAGE 36 ---"
                - paragraph [ref=f34e676]: "Номер: 120 Тип: single-choice Вопрос: «Побледнев …, он дрожащими пальцами застегнул на все пуговицы летнее пальто и поправил пенсне» (В.П. Катаев). А) от негодования Б) из-за негодования В) с негодованием Г) через негодование"
                - paragraph [ref=f34e677]: "Номер: 121 Тип: single-choice Вопрос: Каждый год … заболевают миллионы людей — среди них те, кто курит, и те, кто только вдыхает табачный дым. А) с курением Б) для курения В) от курения Г) при курении"
                - paragraph [ref=f34e678]: "Номер: 122 Тип: single-choice Вопрос: На соревнованиях по лёгкой атлетике спортсмен … пробежал дистанцию не с самым лучшим результатом. А) в волнении Б) с волнением В) при волнении Г) из-за волнения"
                - paragraph [ref=f34e679]: "Номер: 123 Тип: single-choice Вопрос: В мире почти двести миллионов человек изучают русский язык; тысячи из них приезжают в Россию … высшего образования. А) на получение Б) за получение В) для получения"
                - paragraph [ref=f34e680]: "Номер: 124 Тип: single-choice Вопрос: За всю историю развития научного знания учёные не раз рисковали жизнью … . А) на науку Б) ради науки В) за науку"
                - paragraph [ref=f34e681]: "Номер: 125 Тип: single-choice Вопрос: Интеллигенция разных стран мира сегодня всё чаще покидает большие города … в деревенской глуши. А) на жизнь Б) за жизнь В) ради жизни"
                - paragraph [ref=f34e682]: "Номер: 126 Тип: single-choice Вопрос: В России почти в каждой семье есть человек, воевавший или погибший … в Великой Отечественной войне 1941–1945 годов. А) за победу Б) для победы В) на победу"
                - paragraph [ref=f34e683]: "--- PAGE 37 ---"
                - paragraph [ref=f34e684]: "Номер: 127 Тип: single-choice Вопрос: Знаменитый английский поэт лорд Байрон погиб в 1824 году, сражаясь … Греции. А) для свободы Б) на свободу В) за свободу"
                - paragraph [ref=f34e685]: "Номер: 128 Тип: single-choice Вопрос: Миллионы доноров во всём мире сдают кровь … жизни других людей. А) для спасения Б) на спасение В) за спасение"
                - paragraph [ref=f34e686]: "Номер: 129 Тип: single-choice Вопрос: Поводом к войне … между американскими Севером и Югом стало нежелание граждан подчиняться произволу власти. А) для независимости Б) от независимости В) за независимость Г) с независимостью"
                - paragraph [ref=f34e687]: "Номер: 130 Тип: single-choice Вопрос: Геологам требуются годы … месторождений серебра и олова на обширной территории Якутии. А) за поиск Б) на поиск В) ради поиска"
                - paragraph [ref=f34e688]: "Номер: 131 Тип: single-choice Вопрос: По дороге из Сибири на юг чёрные аисты останавливаются … в казахских степях. А) за отдыхом Б) ради отдыха В) на отдых"
                - paragraph [ref=f34e689]: "Номер: 132 Тип: single-choice Вопрос: Дожди пришли … австралийским пожарным, которые сражались с огнём, бушующим в восточных штатах страны. А) на помощь Б) для помощи В) ради помощи"
                - paragraph [ref=f34e690]: "Номер: 133 Тип: single-choice Вопрос: В интернет-магазине молодые родители могут приобрести всё необходимое … за новорождённым. А) для ухода Б) ради ухода В) на уход"
                - paragraph [ref=f34e691]: "Номер: 134 Тип: single-choice Вопрос: Дедушка посадил внука на лавочку, а сам пошёл … . А) для мороженого Б) за мороженым В) ради мороженого"
                - paragraph [ref=f34e692]: "Номер: 135 Тип: single-choice Вопрос: Преподаватели и студенты собрались на кафедре … тематики дипломных работ. А) ради обсуждения Б) для обсуждения В) за обсуждение"
                - paragraph [ref=f34e693]: "--- PAGE 38 ---"
                - paragraph [ref=f34e694]: "Номер: 136 Тип: single-choice Вопрос: Мой друг пошёл … на балет Сергея Прокофьева «Ромео и Джульетта». А) для билетов Б) на билеты В) ради билетов Г) за билетами"
                - paragraph [ref=f34e695]: "Номер: 137 Тип: single-choice Вопрос: «Однажды вечером (это было в начале октября 1773 года) сидел я дома один, слушая вой осеннего ветра» (А.С. Пушкин). А) где? Б) в чём? В) когда? Г) сколько?"
                - paragraph [ref=f34e696]: "Номер: 138 Тип: single-choice Вопрос: «Берег обрывом спускался к морю почти у самых стен лачуги» (М.Ю. Лермонтов). А) как? Б) каким? В) почему? Г) с чем?"
                - paragraph [ref=f34e697]: "Номер: 139 Тип: single-choice Вопрос: «Я чувствовал себя счастливым... Но отчего я был счастлив?» (И.С. Тургенев). А) отчего? Б) каким? В) чем? Г) почему?"
                - paragraph [ref=f34e698]: "Номер: 140 Тип: single-choice Вопрос: «В сентябре он приехал к нам всего на сутки — проститься перед отъездом на фронт» (И.А. Бунин). А) куда? Б) на сколько? В) когда? Г) зачем?"
                - paragraph [ref=f34e699]: "Номер: 141 Тип: single-choice Вопрос: «Она прильнула губами к моим губам и стала говорить шёпотом, и слова её были как быстрые поцелуи» (А.И. Куприн). А) как? Б) где? В) зачем? Г) с чем?"
                - paragraph [ref=f34e700]: "--- PAGE 39 ---"
                - paragraph [ref=f34e701]: "Номер: 142 Тип: single-choice Вопрос: «Он нашёл глазами Большую Медведицу, вздохнул, а потом поймал себя на том, что чему-то неосознанно улыбается» (М.А. Шолохов). А) что? Б) где? В) какую? Г) когда?"
                - paragraph [ref=f34e702]: "Номер: 143 Тип: single-choice Вопрос: «Я подумал с надеждой, что сегодня, может быть, будет удачный день» (Ю.В. Трифонов). А) почему? Б) зачем? В) как? Г) когда?"
                - paragraph [ref=f34e703]: "Номер: 144 Тип: single-choice Вопрос: «Она не думала о результате, само желание искать манило её какой-то неведомой наградой» (Д.А. Гранин). А) почему? Б) какое? В) зачем? Г) где?"
                - paragraph [ref=f34e704]: "Номер: 145 Тип: single-choice Вопрос: Если верить статистике, «Краткую историю времени» английского физика Хокинга купил каждый пятисотый житель Земли. А) во что? Б) как? В) когда? Г) чему?"
                - paragraph [ref=f34e705]: "Номер: 146 Тип: single-choice Вопрос: В век научно-технического прогресса, как это ни парадоксально, мы предпочитаем использовать натуральные материалы. А) какой? Б) почему? В) когда? Г) где?"
                - paragraph [ref=f34e706]: "Номер: 147 Тип: single-choice Вопрос: Вдоль южного побережья Финляндии петляет старинная дорога, названная «Королевской». А) где? Б) куда? В) какая? Г) как?"
                - paragraph [ref=f34e707]: "Номер: 148 Тип: single-choice Вопрос: Одним из самых известных курортов на Кубе является Варадеро, расположенный почти в ста сорока километрах от Гаваны. А) как? Б) где? В) куда? Г) откуда?"
                - paragraph [ref=f34e708]: "--- PAGE 40 ---"
