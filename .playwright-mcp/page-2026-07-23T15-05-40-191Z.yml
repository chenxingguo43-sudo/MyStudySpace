              - paragraph [ref=f130e468]: "--- PAGE 32 --- Номер: 94 / Тип: single-choice / Вопрос: Китай и Россия рассматривают возможность создания самой протяжённой в Северо-Восточной Азии туристической зоны ... Амур. / А) с рекой / Б) к реке / В) вдоль реки / Г) река Номер: 95 / Тип: single-choice / Вопрос: Россиянин Фёдор Конюхов всегда мечтал совершить путешествие ... . / А) вдоль земного шара / Б) вокруг земного шара / В) около земного шара / Г) снаружи земного шара Номер: 96 / Тип: single-choice / Вопрос: ..., найденных археологами на Урале, встречаются очень интересные экземпляры. / А) Среди камней / Б) В камнях / В) С камнями / Г) К камням Номер: 97 / Тип: single-choice / Вопрос: Город Иркутск расположен недалеко ... . / А) у озера Байкал / Б) от озера Байкал / В) в озере Байкал / Г) к озеру Байкал Номер: 98 / Тип: single-choice / Вопрос: Путешествуя по Кавказу, туристы вышли к Голубым озёрам, находящимся на высоте шестьсот метров ... моря. / А) за уровнем / Б) на уровне / В) около уровня / Г) над уровнем Номер: 99 / Тип: single-choice / Вопрос: В Чёрном море ... два метра водится мелкая рыба плотва. / А) с глубиной / Б) в глубине / В) на глубине / Г) глубиной"
              - paragraph [ref=f130e469]: "--- PAGE 33 --- Номер: 100 / Тип: single-choice / Вопрос: Тридцать пять километров отделяют древний город Танаис, некогда самое северное греческое поселение, ... . / А) от Ростова-на-Дону / Б) из Ростова-на-Дону / В) с Ростовом-на-Дону / Г) к Ростову-на-Дону Номер: 101 / Тип: single-choice / Вопрос: В древности, если кораблю сопутствовала удача, он подходил ... с поднятыми парусами. / А) к родным берегам / Б) у родных берегов / В) на родные берега / Г) по родным берегам Номер: 102 / Тип: single-choice / Вопрос: Орнитологами замечено: птенцы, едва окрепнув, разлетаются ... и начинают вести самостоятельную жизнь. / А) от гнезда / Б) из гнезда / В) к гнезду / Г) в гнездо Номер: 103 / Тип: single-choice / Вопрос: «Лохматая дворняга с мокрой от грязи шерстью вышла ... и остановилась в недоумении» (В.В. Набоков). / А) за домом / Б) у дома / В) около дома / Г) из-за дома Номер: 104 / Тип: single-choice / Вопрос: Дом отдыха расположен в стороне ..., в тихом сосновом бору. / А) по дороге / Б) к дороге / В) от дороги / Г) с дорогой Номер: 105 / Тип: single-choice / Вопрос: Весенним вечером окна распахнуты настежь, льётся тихая музыка, а ... пахнет сиренью. / А) от сада / Б) из сада / В) у сада Номер: 106 / Тип: single-choice / Вопрос: По вечерам ... встречается вся семья — поужинать, пообщаться, обсудить последние новости. / А) за столом / Б) из-за стола / В) на столе / Г) к столу"
              - paragraph [ref=f130e470]: "--- PAGE 34 --- Номер: 107 / Тип: single-choice / Вопрос: За разъяснением по этому вопросу вам лучше всего обратиться ... факультета. / А) к деканату / Б) в деканате / В) по деканату / Г) в деканат Номер: 108 / Тип: single-choice / Вопрос: ... завершено обучение преподавателей и сотрудников по программе «Пользователь персонального компьютера». / А) На нашу кафедру / Б) В нашей кафедре / В) На нашей кафедре / Г) С нашей кафедрой Номер: 109 / Тип: single-choice / Вопрос: ... акционерного общества «Балтийский завод» были подведены итоги прошедшего финансового года. / А) За собрание / Б) На собрании / В) В собрании / Г) С собранием Номер: 110 / Тип: single-choice / Вопрос: ... глобального потепления на вершине горы Килиманджаро, находящейся в Африке, растаяли снега. / А) Под давлением / Б) Под влиянием / В) От / Г) Из Номер: 111 / Тип: single-choice / Вопрос: ... осуществления национального проекта «Здоровье» в России построены новые центры высоких медицинских технологий. / А) От / Б) В результате / В) Под действием / Г) Под влиянием Номер: 112 / Тип: single-choice / Вопрос: На российском рынке лазерные принтеры завоевали достойное место ... в работе и простоте в эксплуатации. / А) благодаря своей надёжности / Б) со своей надёжностью"
              - paragraph [ref=f130e471]: "--- PAGE 35 --- Номер: 113 / Тип: single-choice / Вопрос: Металлический трос ... сжался, натянулся, как струна, и лопнул. / А) из-за мороза / Б) вследствие мороза / В) от мороза / Г) по морозу Номер: 114 / Тип: single-choice / Вопрос: ... заповедника Аскания-Нова удалось спасти от гибели сайгаков — древнейших животных, ровесников мамонтов. / А) Благодаря созданию / Б) Из-за создания / В) При создании / Г) В создании Номер: 115 / Тип: single-choice / Вопрос: Все горы на Земле разрушаются ... воды, ветра и времени. / А) с действием / Б) к действию / В) под действием / Г) в силу действия Номер: 116 / Тип: single-choice / Вопрос: В этом году зима в Европе запаздывает ... тёплых масс воздуха из Атлантики. / А) с проникновением / Б) вследствие проникновения / В) для проникновения / Г) по проникновению Номер: 117 / Тип: single-choice / Вопрос: Покидая корабль в последний день круиза, некоторые пассажиры ... уносили с собой ключи от кают. / А) с рассеянностью / Б) из-за рассеянности / В) от рассеянности / Г) по рассеянности Номер: 118 / Тип: single-choice / Вопрос: ... остаться одной она вышла замуж за первого встречного. / А) В страхе / Б) Из страха / В) У страха / Г) Со страхом Номер: 119 / Тип: single-choice / Вопрос: ... дети взяли брошенного котёнка домой и стали за ним ухаживать. / А) Из жалости / Б) С жалостью / В) От жалости / Г) Из-за жалости"
