              - generic [ref=f165e708]:
                - paragraph [ref=f165e729]: "--- PAGE 48 ---"
                - paragraph [ref=f165e730]: "Номер: 37 / Тип: single-choice / Вопрос: Практически применяя теорию радиоактивности, в физической лаборатории ... . / А) эксперименты были начаты / Б) не возникло никаких проблем / В) приступили к экспериментам / Г) эксперименты проходят успешно Номер: 38 / Тип: single-choice / Вопрос: Следуя решениям «Киотского протокола», ... . / А) планируется приостановление глобального потепления / Б) становится вероятным приостановление глобального потепления / В) глобальное потепление может быть приостановлено / Г) возможно приостановить глобальное потепление Номер: 39 / Тип: single-choice / Вопрос: ..., обеспечивая население жильём. / А) Сегодня в России строится двадцать два новых города / Б) Двадцать два новых города построены сегодня в России / В) Сегодня в России строят двадцать два новых города / Г) В России сегодня идёт строительство двадцати двух новых городов Номер: 40 / Тип: single-choice / Вопрос: Получив ссуду в банке, ... . / А) фермерами освоены новые земли / Б) фермеры освоят новые земли / В) начнётся освоение новых земель / Г) новые земли обретут хозяина Номер: 41 / Тип: single-choice / Вопрос: Море бушевало; борясь со стихией, ... . / А) силы людей иссякли / Б) людей покинули силы / В) у людей не было сил / Г) люди выбились из сил Номер: 42 / Тип: single-choice / Вопрос: Дон, Кубань и другие реки, впадая в Азовское море, ... . / А) усиливается влияние на его природные особенности / Б) оказывают влияние на его природные особенности / В) изменяются его природные особенности / Г) внимание привлекают его природные особенности Номер: 43 / Тип: single-choice / Вопрос: Гуляя в Подмосковье, по лесистым холмам Коломенского, ... . / А) можно набрести на старую церковь / Б) дорога ведёт к старой церкви / В) не сразу видна старая церковь / Г) в дубовой роще появляется старая церковь"
                - paragraph [ref=f165e731]: "--- PAGE 49 ---"
                - paragraph [ref=f165e732]: "Номер: 44 / Тип: single-choice / Вопрос: Являясь самым широким водопадом в мире, ... . / А) мощь и красота Кона поражают воображение / Б) Лаос и Кампучия гордятся водопадом Кон / В) Кон привлекает внимание туристов / Г) ширина Кона составляет 13 километров Номер: 45 / Тип: single-choice / Вопрос: Улавливая недоступные человеку сигналы природы, ... . / А) животные встревожены будущими катаклизмами / Б) животные предчувствуют катаклизмы / В) предвидятся катаклизмы / Г) ощущается приближение катаклизмов Номер: 46 / Тип: single-choice / Вопрос: Многонациональная Россия, живущая на стыке цивилизаций, поддерживает инициативу Испании и Турции по формированию Альянса цивилизаций. / А) которая жила / Б) которая живёт / В) которая прожила / Г) которая будет жить Номер: 47 / Тип: single-choice / Вопрос: В Москве издана энциклопедия «Культура Латинской Америки», содержащая тысячу двести статей обо всех странах региона. / А) которая содержала / Б) которая содержит / В) которую содержит / Г) которую содержали Номер: 48 / Тип: single-choice / Вопрос: Одной из достопримечательностей Эфиопии является город Лалибэл: его храмы, высеченные в скалах, находятся под защитой ЮНЕСКО. / А) которые высекают / Б) которые высекаются / В) которые высечены / Г) которые высекут Номер: 49 / Тип: single-choice / Вопрос: Венесуэльский Гран Роке — единственный в стране остров, образованный вулканической породой. / А) который образовал / Б) который образуется / В) который образован / Г) который будет образован"
                - paragraph [ref=f165e733]: "--- PAGE 50 ---"
                - paragraph [ref=f165e734]: "Номер: 50 / Тип: single-choice / Вопрос: О смелости непальских воинов, доходящей до безрассудства, ходят легенды. / А) которая доходила / Б) которая дойдёт / В) которая дошла / Г) которая доходит Номер: 51 / Тип: single-choice / Вопрос: Главной достопримечательностью марокканского города Фес является мечеть Карауин, считающаяся одним из старейших университетов в мире. / А) которая считалась / Б) которая считается / В) которая будет считаться / Г) Номер: 52 / Тип: single-choice / Вопрос: На Тайване в монастыре Фогуаньшань поражает парк Будды, любовно воссозданный монахами по старинным описаниям. / А) который воссоздают / Б) который воссоздали / В) который воссоздаётся / Г) который воссоздадут Номер: 53 / Тип: single-choice / Вопрос: На полках стоят фарфоровые статуэтки, фигурки зверей и шкатулки, привезённые из путешествия по Юго-Восточной Азии. / А) которые привозят / Б) которые привезли / В) которые привезут / Г) которые привозятся Номер: 54 / Тип: single-choice / Вопрос: Образ мира, создаваемый варварами, свидетельствует о неспособности древнего человека чётко отделить себя от природы. / А) который создан / Б) который был создан / В) который создаётся / Г) который будет создаваться Номер: 55 / Тип: single-choice / Вопрос: При раскопках курганов на нижнем Дону наиболее часто встречаются изделия, изготовленные из керамики. / А) которые изготовят / Б) которые изготовили / В) которые изготавливают / Г) которые изготавливаются Номер: 56 / Тип: single-choice / Вопрос: Сегодня в России личные гербы утверждает геральдическая коллегия, возглавляемая специалистом по военной геральдике и символике. / А) которую возглавит специалист / Б) которую возглавил специалист / В) которую возглавлял специалист / Г) которую возглавляет специалист"
                - paragraph [ref=f165e735]: "--- PAGE 51 ---"
                - paragraph [ref=f165e736]: "Номер: 57 / Тип: single-choice / Вопрос: Новый взгляд на социальные и политические явления, который появился в конце XX века, лёг в основу современного диалога Востока и Запада. / А) появляющийся / Б) появлявшийся / В) появившийся / Г) Номер: 58 / Тип: single-choice / Вопрос: Начало британо-российским дипломатическим отношениям было положено в XVI веке купцом Ченслером, который передал русскому царю бумаги своего монарха. / А) переданным / Б) передавшим / В) передаваемым / Г) передававшим Номер: 59 / Тип: single-choice / Вопрос: Учёный является не только создателем научных систем, но и художником, который творчески использует свои знания. / А) используемым / Б) использующим / В) использованным / Г) использовавшим Номер: 60 / Тип: single-choice / Вопрос: Фёдор Иванович Тютчев считается первым в России поэтом, который проник в сущность и философию природы. / А) проникавшим / Б) проникающим / В) проникшим / Г) проникаемым Номер: 61 / Тип: single-choice / Вопрос: Сегодня учитель, врач и священник — это опора интеллектуальной и духовной жизни, которая существует на селе. / А) существующей / Б) существовавшей / В) / Г) Номер: 62 / Тип: single-choice / Вопрос: 6500 лет назад на территории современного Ирака сформировался центр мировой культуры, который назвали Месопотамией. / А) называющий / Б) назвавший / В) называвший / Г) названный Номер: 63 / Тип: single-choice / Вопрос: В древности через донские степи проходило много разных племён, что оказало влияние на культуру народов, которые проживали на этой территории. / А) проживавших / Б) проживших / В) проживающих / Г) прожитых"
                - paragraph [ref=f165e737]: "--- PAGE 52 ---"
                - paragraph [ref=f165e738]: "Номер: 64 / Тип: single-choice / Вопрос: Школа в Бангладеш, которую построили вручную из глины и бамбука, получила одну из самых престижных мировых премий в области архитектуры. / А) построенная / Б) построившая / В) строившая / Г) строящаяся Номер: 65 / Тип: single-choice / Вопрос: Льготы, которые предоставляются женщинам, имеющим детей, распространяются и на отцов, воспитывающих детей без матери. / А) предоставляемые / Б) предоставленные / В) предоставляющие / Г) предоставлявшие Номер: 66 / Тип: single-choice / Вопрос: Короткое и звучное прозвище Пеле, которое не переводится ни на один язык, дали легендарному футболисту друзья его детства. / А) не переведённое / Б) не переводимое / В) не переводящее / Г) не переводившее Номер: 67 / Тип: single-choice / Вопрос: Армянский коньяк популярен сегодня в мире благодаря многочисленным ресторанам, которые открываются в разных странах армянской диаспорой. / А) открывающим / Б) открывавшим / В) открытым / Г) открываемым Номер: 68 / Тип: single-choice / Вопрос: Изучая продукцию конкурентов, предприниматели оценивают достоинства и недостатки своих товаров по отношению к товарам других фирм. / А) При изучении продукции конкурентов / Б) С изучением продукции конкурентов Номер: 69 / Тип: single-choice / Вопрос: Используя приёмы психологического расслабления, вы должны помнить, что длительная релаксация может помешать мобилизации сил в нужный момент. / А) Если вы используете приёмы психологического расслабления / Б) После того как вы используете приёмы психологического расслабления"
                - paragraph [ref=f165e739]: "--- PAGE 53 ---"
                - paragraph [ref=f165e740]: "Номер: 70 / Тип: single-choice / Вопрос: Представители службы спасения животных, расспрашивая потенциальных хозяев собаки об их отношении к животным, решают, можно ли отдать её этим людям. / А) если расспрашивают потенциальных хозяев собаки об их отношении к животным / Б) пока расспрашивают потенциальных хозяев собаки об их отношении к животным Номер: 71 / Тип: single-choice / Вопрос: Гонщик, приблизившись к повороту, сбавил скорость. / А) когда приблизился к повороту / Б) если приблизился к повороту Номер: 72 / Тип: single-choice / Вопрос: Режиссёр кинотрилогии «Властелин колец» П. Джексон, проанализировав отзывы зрителей на свой первый фильм, решил немного откорректировать материал, отснятый им для второй части. / А) перед тем как проанализировать отзывы зрителей на первый фильм / Б) после того как проанализировал отзывы зрителей на первый фильм Номер: 73 / Тип: single-choice / Вопрос: Инки, развивая уже созданную до них древнюю цивилизацию, внесли свой значительный вклад в андскую культуру. / А) поскольку развивали уже созданную до них древнюю цивилизацию / Б) если развивали уже созданную до них древнюю цивилизацию Номер: 74 / Тип: single-choice / Вопрос: Восточный врач древности Ибн Сина, известный в Европе как Авиценна, вылечил множество людей, используя в своей практике настои из лепестков роз, которые считались даром богов. / А) из-за того что использовал в своей практике настои из лепестков роз / Б) благодаря тому что использовал в своей практике настои из лепестков роз Номер: 75 / Тип: single-choice / Вопрос: Византийский император Константин VIII, живший в X веке нашей эры, оставляя государственные дела жене и министрам, занимался науками и искусством. / А) хотя оставлял государственные дела жене и министрам / Б) когда оставлял государственные дела жене и министрам Номер: 76 / Тип: single-choice / Вопрос: В середине XI века Анна Ярославна, дочь князя Ярослава Мудрого, выйдя замуж за короля Генриха I, стала королевой Франции. / А) после того как вышла замуж за короля Генриха I / Б) хотя вышла замуж за короля Генриха I Номер: 77 / Тип: single-choice / Вопрос: «Учись отдавать честь», — пошутил британский принц Гарри, узнав, что его брат Уильям поступает в военную академию. / А) если узнал / Б) когда узнал"
                - paragraph [ref=f165e741]: "--- PAGE 54 ---"
                - paragraph [ref=f165e742]: "Номер: 78 / Тип: single-choice / Вопрос: Человечество овладело огромной энергией, когда решило урановую проблему. / А) решая урановую проблему / Б) решив урановую проблему Номер: 79 / Тип: single-choice / Вопрос: Командир самолёта, после того как получил информацию о поломке двигателя, принял решение совершить вынужденную посадку. / А) получая информацию о поломке двигателя / Б) получив информацию о поломке двигателя Номер: 80 / Тип: single-choice / Вопрос: «Животные мыслят логически», — к такому выводу пришли исследователи из разных стран, после того как провели серию экспериментов. / А) проведя серию экспериментов / Б) проводя серию экспериментов Номер: 81 / Тип: single-choice / Вопрос: Растения создают одежду для земли, когда укрывают её лесами, лугами и цветущей степью. / А) укрыв её лесами, лугами и цветущей степью / Б) укрывая её лесами, лугами и цветущей степью Номер: 82 / Тип: single-choice / Вопрос: Лес является прекрасным местом отдыха, поскольку оказывает на человека психотерапевтическое воздействие. / А) оказывая на человека психотерапевтическое воздействие / Б) оказав на человека психотерапевтическое воздействие Номер: 83 / Тип: single-choice / Вопрос: Ты бы меньше заботился о том, что думают о тебе другие, если бы знал, как мало они о тебе думают. / А) узнав / Б) зная Номер: 84 / Тип: single-choice / Вопрос: Когда музыка касается сердца, она рождает любовь к жизни и примиряет с ней человека. / А) Касаясь сердца, музыка / Б) Коснувшись сердца, музыка Номер: 85 / Тип: single-choice / Вопрос: Поэтесса часто говорила со смехом, что она «всего лишь слабая женщина». / А) засмеявшись / Б) смеясь"
                - paragraph [ref=f165e743]: "--- PAGE 55 ---"
                - paragraph [ref=f165e744]: "Номер: 86 / Тип: single-choice / Вопрос: «Однажды узнанные, научные истины перестают быть историческими загадками, а делаются фактами сознания» (А.И. Герцен). / А) когда? / Б) зачем? / В) какие? / Г) почему? Номер: 87 / Тип: single-choice / Вопрос: «Если ты получаешь доход, не зарабатывая его, то кто-нибудь работает, не получая дохода» (Л.Н. Толстой) / А) как? / Б) какой? / В) где? / Г) когда? Номер: 88 / Тип: single-choice / Вопрос: «Счастлив путник, который после длинной дороги видит знакомую крышу с несущимися навстречу огоньками» (Н.В. Гоголь). / А) почему? / Б) с какими? / В) когда? / Г) как? Номер: 89 / Тип: single-choice / Вопрос: «Ему казалось, что этот день, наполненный светом солнца и шумом моря, неимоверно велик» (А.Н. Толстой). / А) чем? / Б) когда / В) как? / Г) какой? Номер: 90 / Тип: single-choice / Вопрос: «Красно-синие мячики прыгали по уже пыльным дорожкам, отбрасывая прыгающие тени» (В.П. Катаев). / А) какие? / Б) как? / В) зачем? / Г) почему? Номер: 91 / Тип: single-choice / Вопрос: «Он ушёл, кивая и подмигивая и твёрдо зная при этом, что всё кончится благородно» (Ю.В. Трифонов). / А) как? / Б) куда? / В) откуда? / Г) почему?"
                - paragraph [ref=f165e745]: "--- PAGE 56 ---"
                - paragraph [ref=f165e746]: "Номер: 92 / Тип: single-choice / Вопрос: «Варя вспомнила, что согласно психологической науке спрятанные за спиной руки означают нежелание говорить правду» (Б. Акунин). / А) какие? / Б) что? / В) где? / Г) как? Номер: 93 / Тип: single-choice / Вопрос: «Кошка Джина, лениво позёвывая, сидела в кресле — видно, Инна её разбудила» (Т.В. Устинова). / А) когда? / Б) как? / В) почему? / Г) где? Номер: 94 / Тип: single-choice / Вопрос: «Каждое утро они просыпались в доме, пахнущем деревом, и видели в раскрытое окно цветущие яблони» (В.С. Токарева). / А) как? / Б) чем? / В) каком? / Г) где? Номер: 95 / Тип: single-choice / Вопрос: Растения, нашедшие приют в вашем доме, очень быстро становятся его полноправными обитателями. / А) как? / Б) где? / В) когда? / Г) какие? Номер: 96 / Тип: single-choice / Вопрос: Антропологи, анализирующие первобытное мышление, утверждают, что внешний мир ничего не значил для человека племени. / А) как? / Б) когда? / В) какие? / Г) почему? Номер: 97 / Тип: single-choice / Вопрос: Я с детства люблю осторожно вынимать из картонной коробки завёрнутые в бумагу ёлочные украшения. / А) как? / Б) какие? / В) когда? / Г) откуда? Номер: 98 / Тип: single-choice / Вопрос: Молодая мама шла по улице, толкая перед собой коляску с ребёнком. / А) как? / Б) какая? / В) где? / Г) зачем?"
                - paragraph [ref=f165e747]: "--- PAGE 57 ---"
                - paragraph [ref=f165e748]: "Номер: 99 / Тип: single-choice / Вопрос: Неплохо провести отпуск, нежась на солнце, купаясь в море и изредка выбираясь в горы. / А) где? / Б) какой? / В) как? / Г) когда? Номер: 1 / Тип: single-choice / Вопрос: Общественные отношения воздействуют на природу человека, ... под их влиянием у него формируются нравственные, политические и гражданские свойства. / А) и / Б) а / В) зато / Г) но Номер: 2 / Тип: single-choice / Вопрос: У студентов, совмещающих работу с учёбой, зарплата небольшая, ... молодёжь приобретает ценный опыт. / А) и / Б) зато / В) а / Г) да Номер: 3 / Тип: single-choice / Вопрос: Ситуация на выборах мэра города пока до конца не прояснилась, ... предварительные результаты уже известны. / А) однако / Б) и / В) да / Г) Номер: 4 / Тип: single-choice / Вопрос: Мир разноязычен, ... все люди одинаково плачут и смеются. / А) и / Б) да / В) а / Г) но"
