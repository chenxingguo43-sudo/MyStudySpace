                  - listitem [ref=f29e397]:
                    - paragraph [ref=f29e398]: Федеральная целевая программа развития образования разрабатывается и (142) ... Правительством Российской Федерации.
                  - listitem [ref=f29e399]:
                    - paragraph [ref=f29e400]: Доклад Правительства Российской Федерации о ходе реализации Федеральной целевой программы развития образования ежегодно (143) ... палатам Федерального Собрания Российской Федерации и (144) ... в официальном печатном органе (Закон РФ от 10 июля 1992 г. № 3266-1 «Об образовании»).
                - heading "ТЕКСТ 2" [level=4] [ref=f29e401]
                - paragraph [ref=f29e402]: Правила приёма в магистратуру
                - paragraph [ref=f29e403]: В магистратуру (145) ... лица, (146) ... высшее профессиональное образование. Приём на бюджетные места (147) ... на конкурсной основе по результатам вступительных испытаний. Конкурс (148) ... среди лиц, имеющих диплом бакалавра. Лица, не прошедшие по конкурсу на бюджетные места, могут быть (149) ... в магистратуру на контрактной основе (из Правил приёма в магистратуру Южного федерального университета).
                - heading "ТЕКСТ 3" [level=4] [ref=f29e404]
                - paragraph [ref=f29e405]: Изучением свойств наноматериалов (150) ... во многих странах мира. Наибольших успехов (151) ... в США, Японии, Франции. В России исследования в области нанотехнологий (152) ... последние несколько десятков лет. Российские учёные (153) ... приоритетные позиции в мире по отдельным направлениям. В частности, в области метрологии (154) ... уникальный опыт, позволяющий (155) ... сканирующие зондовые микроскопы.
                - heading "ТЕКСТ 4" [level=4] [ref=f29e406]
                - paragraph [ref=f29e407]: "Аннотация книги А.Л. Бердичевского и Н.Н. Соловьёвой «Русский язык: сферы общения»"
                - paragraph [ref=f29e408]: Пособие (156) ... читателей с функциональными стилями речи и с особенностями употребления языковых средств в разных коммуникативных ситуациях. Книга (157) ... теоретические и практические сведения, которые помогут (158) ... собственные речевые произведения разных жанров. Кроме того, в пособии (159) ... задания, которые систематизируют и (160) ... грамматические знания всех, кто изучает русский язык. Пособие (161) ... иностранным учащимся, хорошо (162) ... русским языком.
                - heading "Page 90" [level=2] [ref=f29e409]
                - paragraph [ref=f29e410]: "90"
                - paragraph [ref=f29e411]: Учебно-тренировочные тесты. Выпуск 1. Грамматика. Лексика
                - heading "ТЕКСТ 5" [level=4] [ref=f29e412]
                - paragraph [ref=f29e413]: "Английский писатель Стивенсон (163) ... поразительной особенностью: ему часто (164) ... «вещие сны». (165) ..., он их (166) ..., превращая в рассказы. Механизм творчества во сне (167) ... в увлекательной книге А. М. Вейна «Бодрствование и сон», где автор (168) ... много подобных случаев. Например, Данте, воспел в сонетах Беатриче, которую он (169) ... во сне. Во время сна Лафонтен (170) ... басню. Известно, что многие образы Пушкина (171) ... во время сна: (172) ... с постели, он торопливо (173) ... их. Сон подсказал Достоевскому идею (174) ... роман «Подросток», а Льву Толстому — сюжет «Отца Сергия» (по Р. Белоусову)."
                - heading "ТЕКСТ 6" [level=4] [ref=f29e414]
                - paragraph [ref=f29e415]: Поиски библиотеки Ивана Грозного (175) ... в течение трёх столетий, но по разным причинам они не были (176) ... до конца. Раскопки не (177) ... прямых подтверждений, что эта библиотека (178) ... . Но в исторических источниках (179) ... многочисленные косвенные указания, что даёт достаточно научных оснований для дальнейших поисков. Может быть, сокровища царской библиотеки (180) ... ещё в подземельях Кремля и (181) ... только, чтобы смелая рука попробовала их (182) ... (по Р. Пересветову).
                - heading "ТЕКСТ 7" [level=4] [ref=f29e416]
                - paragraph [ref=f29e417]: "Российская станция «Беллинсгаузен» в Антарктиде — одна из самых молодых. Климат здесь суровый. Постоянно (183) ... сильный ветер, за ночь может намести двухметровые сугробы, так что дверь на улицу (184) ... . Но это не проблема: (185) ... лопатой полчаса, и всё нормально. Однако не холод и ветер здесь самое страшное: гораздо труднее (186) ... спокойным и (187) ... от психологического срыва."
                - heading "ТЕКСТ 8" [level=4] [ref=f29e418]
                - paragraph [ref=f29e419]: По вечерам учительница любила (188) ... одна к морю. Детей в русской семье укладывали (189) ... рано. В эту пустынную ночь полная луна (190) ... тихий залив. Лидия Павловна (191) ... на выброшенном морем дереве. (192) ..., как много лет уже не отдыхала. Она долго (193) ..., перебирая в памяти год за годом, потерю за потерей, — когда она была в последний раз так безумно и просто счастлива? (по С. Чёрному)
                - heading "ТЕКСТ 9" [level=4] [ref=f29e420]
                - paragraph [ref=f29e421]: "Как-то давно (194) ... фильм, название которого не (195) ... . Но по сей день я (196) ... лицо, глаза прелестной девушки с гусем в руках, она с восхищением (197) ... незнакомую ей улицу. Я подумала, любуясь ею, о том, что у нас (198) ... редкостно талантливая обаятельная актриса. (199) ... знакомого режиссёра, спросила: «Что это за прелесть с гусем?» И впервые (200) ... имя, ставшее дорогим всем нам (по Ф.Г. Раневской)."
                - heading "ТЕКСТ 10" [level=4] [ref=f29e422]
                - paragraph [ref=f29e423]: Мы (201) ... от природы в подарок прекрасный цветущий сад. Однако человек (202) ... никудышным садовником. Он плохо (203) ... в этом саду, не понимая, что в будущем его нерадивость может обернуться мировой катастрофой. По словам одного известного писателя, человек настолько (204) ... от природы, что возомнил себя богом. А такое воззрение никогда никому не (205) ... добра.
                - heading "Page 91" [level=2] [ref=f29e424]
                - paragraph [ref=f29e425]: Учебно-тренировочные тесты. Выпуск 1. Грамматика. Лексика
                - paragraph [ref=f29e426]: "91"
                - heading "Раздел II. ТЕОРЕТИЧЕСКИЕ СВЕДЕНИЯ" [level=1] [ref=f29e427]
                - heading "Грамматический комментарий к главе 1" [level=2] [ref=f29e428]
                - heading "1.1. Согласование существительных, обозначающих лицо, с различными частями речи" [level=3] [ref=f29e429]
                - paragraph [ref=f29e430]:
                  - text: "В русском языке при обозначении лиц по профессии, социальному положению и общественной принадлежности используются существительные мужского и женского рода: учитель — учительница, спортсмен — спортсменка, крестьянин — крестьянка, демократ — демократка. Однако для обозначения определённых профессий, должностей, учёных и воинских званий применяются существительные только мужского рода: физик, химик, биолог, директор, администратор, профессор, полковник и т. п. Эти существительные употребляются и в тех случаях, когда они относятся к лицам женского пола:"
                  - generic [ref=f29e431]: адвокат Петрова
                  - text: ","
                  - generic [ref=f29e432]: мастер спорта Егорова
                  - text: ","
                  - generic [ref=f29e433]: кандидат технических наук Степанова
                  - generic [ref=f29e434]:
                    - text: . Отсутствие подобных существительных женского рода объясняется историческими причинами.
                    - superscript [ref=f29e435]
                - paragraph [ref=f29e436]: "Согласование прилагательных, местоимений в форме женского рода с существительными мужского рода носит разговорный характер: молодая директор Смелякова, наша майор Гордеева. В официальной речи принято говорить: молодой директор Смелякова, наш майор Гордеева."
                - paragraph [ref=f29e437]: "Если название должности или звания образовано при помощи сочетания прилагательного и существительного: главный технолог, старший бухгалтер, младший лейтенант, то и в разговорной, и в официальной речи, говоря о лицах женского пола, правильно употреблять только форму мужского рода: научный сотрудник Зорина."
                - paragraph [ref=f29e438]: "При существительном мужского рода, называющем лицо женского пола, употребляется глагол, краткое причастие или краткое прилагательное в форме женского рода: Доцент Марусева начала занятие; Депутат Игнатова оповещена о времени и месте встречи с избирателями; Инженер Федотова больна."
                - paragraph [ref=f29e439]: "Глагол в прошедшем времени, краткое причастие, краткое прилагательное и числительное употребляются также в форме женского рода, если вместе с существительным мужского рода — названием лица по профессии, должности и т. д. — употребляется существительное, обозначающее лицо женского пола: В январе 2006 года к исполнению обязанностей главы государства приступила первая в истории Африки женщина-президент Эллен Джонсон-Серлиф; Девушка-экскурсовод была очарована Байкалом и замечательно рассказывала о нём; Женщина-телохранитель ознакомлена с правилами работы в охранном агентстве."
