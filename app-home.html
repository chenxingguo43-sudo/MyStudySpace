<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-title" content="白夜俄语">
  <meta name="theme-color" content="#071321">
  <link rel="apple-touch-icon" sizes="1024x1024" href="assets/icons/white-night-tutor-desktop.png">
  <link rel="icon" type="image/png" sizes="1024x1024" href="assets/icons/white-night-tutor-desktop.png">
  <link rel="icon" href="assets/icons/white-night-tutor-desktop.ico" sizes="any">
  <link rel="manifest" href="manifest.webmanifest">
  <title>白夜俄语</title>
  <link rel="stylesheet" href="css/app-shell.css">
  <style>
    :root { color-scheme: dark; background: #061321; color: #f2eee9; font-family: "Noto Serif", "Songti SC", Georgia, serif; }
    body { margin: 0; min-height: 100dvh; background: radial-gradient(circle at 72% 14%, rgba(83,117,184,.26), transparent 27rem), linear-gradient(160deg, #07182a 0%, #061321 48%, #03101e 100%); }
    .home { width: min(100% - 40px, 720px); margin: 0 auto; padding: calc(30px + env(safe-area-inset-top, 0px)) 0 calc(38px + var(--app-shell-nav-height) + env(safe-area-inset-bottom, 0px)); }
    .brand { margin: 0; font-size: clamp(38px, 11vw, 56px); font-weight: 400; letter-spacing: .015em; line-height: 1.02; }
    .brand-zh { margin: 10px 0 0; color: #ece8e3; font-size: 24px; font-weight: 400; }
    .greeting { margin: 22px 0 40px; color: rgba(224,232,243,.69); font-family: system-ui, sans-serif; font-size: 16px; }
    .home-section { margin-top: 32px; }
    .home-section h2 { margin: 0 0 14px; font-family: system-ui, sans-serif; font-size: 20px; font-weight: 600; }
    .continue-card { display: grid; grid-template-columns: minmax(94px, .56fr) minmax(0, 1fr); gap: 20px; align-items: center; padding: 18px; border: 1px solid rgba(167, 194, 230, .17); border-radius: 18px; background: linear-gradient(135deg, rgba(17,38,62,.9), rgba(6,22,38,.78)); box-shadow: 0 18px 42px rgba(0,5,18,.22); }
    .book-cover { display: grid; min-height: 160px; border: 1px solid rgba(190,205,224,.24); border-radius: 5px 12px 12px 5px; background: linear-gradient(160deg, #304963, #172a40 67%, #0c1c2e); box-shadow: 8px 10px 18px rgba(0,0,0,.28); place-content: center; color: #eef1f5; text-align: center; font-size: 22px; line-height: 1.2; }
    .continue-kicker { margin: 0 0 14px; color: #8db8ff; font-family: system-ui, sans-serif; font-size: 15px; }
    .continue-title { margin: 0; font-size: clamp(22px, 5.5vw, 30px); font-weight: 400; line-height: 1.25; }
    .continue-meta { margin: 12px 0 19px; color: rgba(226,233,242,.7); font-family: system-ui, sans-serif; font-size: 15px; line-height: 1.55; }
    .primary { display: inline-flex; min-height: 48px; padding: 0 28px; border: 1px solid rgba(189,215,255,.72); border-radius: 10px; align-items: center; justify-content: center; color: #07172a; background: #82b1ff; font: 600 17px system-ui, sans-serif; text-decoration: none; }
    .primary:active { transform: scale(.98); }
    .home-list { margin: 0; padding: 0; list-style: none; border-top: 1px solid rgba(174,201,231,.14); }
    .home-list a { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 16px; align-items: center; min-height: 82px; border-bottom: 1px solid rgba(174,201,231,.14); color: inherit; text-decoration: none; }
    .home-list a:active { transform: scale(.995); }
    .home-icon { display: grid; width: 56px; height: 56px; border-radius: 14px; place-items: center; color: #94bcff; background: rgba(91,145,226,.14); font: 30px "Segoe UI Symbol", sans-serif; }
    .home-list strong { display: block; font-size: 25px; font-weight: 400; }
    .home-list span { display: block; margin-top: 5px; color: rgba(223,232,242,.68); font: 15px system-ui, sans-serif; }
    .chevron { color: rgba(235,239,246,.6); font: 33px system-ui, sans-serif; }
    .home-empty { color: rgba(223,232,242,.68); font: 15px system-ui, sans-serif; }
    @media (max-width: 360px) { .home { width: min(100% - 28px, 720px); } .continue-card { gap: 14px; padding: 14px; } .book-cover { min-height: 138px; font-size: 19px; } .primary { width: 100%; box-sizing: border-box; padding: 0 12px; } }
  </style>
</head>
<body>
  <main class="home" aria-labelledby="home-title">
    <h1 class="brand" id="home-title">БЕЛЫЕ НОЧИ</h1>
    <p class="brand-zh">白夜俄语</p>
    <p class="greeting" id="homeGreeting">继续你的俄语学习</p>
    <section class="home-section" aria-labelledby="continue-heading">
      <div class="continue-card">
        <div class="book-cover" id="continueCover" aria-hidden="true">В мире<br>людей</div>
        <div>
          <p class="continue-kicker" id="continueKicker">继续学习</p>
          <h2 class="continue-title" id="continue-heading">选择一本教材开始</h2>
          <p class="continue-meta" id="continueMeta">Reader 会保存你上次阅读的位置。</p>
          <a class="primary" id="continueLink" href="reader.html">打开 Reader</a>
        </div>
      </div>
    </section>
    <section class="home-section" aria-labelledby="today-heading">
      <h2 id="today-heading">今天</h2>
      <ul class="home-list">
        <li><a id="homeReaderLink" href="reader.html"><span class="home-icon" aria-hidden="true">▱</span><span><strong>Reader</strong><span id="readerSummary">阅读与语法练习</span></span><b class="chevron" aria-hidden="true">›</b></a></li>
        <li><a href="vocabulary.html"><span class="home-icon" aria-hidden="true">☷</span><span><strong>Vocabulary</strong><span id="vocabularySummary">读取待复习词汇中</span></span><b class="chevron" aria-hidden="true">›</b></a></li>
        <li><a id="homeB2Link" href="reader.html?book=russian_b2&amp;ch=0"><span class="home-icon" aria-hidden="true">◇</span><span><strong>俄语 B2</strong><span id="b2Summary">读取学习记录中</span></span><b class="chevron" aria-hidden="true">›</b></a></li>
      </ul>
    </section>
  </main>
  <script src="js/russian-b2/dashboard.js"></script>
  <script src="js/app-home.js"></script>
  <script src="js/app-shell.js"></script>
  <script>AppShell.mount({ current: 'home' });</script>
</body>
</html>
