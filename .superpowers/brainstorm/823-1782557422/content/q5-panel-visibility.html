<h2>问题 5：详情面板什么时候显示？</h2>
<p class="subtitle">这会影响阅读时的默认布局</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>始终显示双栏（推荐）</h3>
      <div style="display:flex;border:1px solid var(--glass-border);border-radius:8px;overflow:hidden;margin-top:8px;min-height:100px">
        <div style="flex:0 0 70%;background:rgba(129,140,248,0.1);padding:10px;font-size:12px">📖 阅读区 70%</div>
        <div style="width:6px;background:var(--accent);opacity:0.5"></div>
        <div style="flex:1;background:rgba(251,191,36,0.08);padding:10px;font-size:12px">📋 详情面板<br><span style="font-size:10px;color:var(--text-dim)">始终可见<br>点击单词切换内容</span></div>
      </div>
      <p style="margin-top:8px;font-size:13px;color:var(--text-secondary)">
        ✅ 分栏布局始终存在，分割线始终可拖拽<br>
        ✅ 打开页面就看到双栏结构<br>
        ⚠️ 没选词时右侧面板是空的，需要占位内容
      </p>
    </div>
  </div>

  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>点击单词后才展开面板</h3>
      <div style="display:flex;border:1px solid var(--glass-border);border-radius:8px;overflow:hidden;margin-top:8px;min-height:100px">
        <div style="flex:1;background:rgba(129,140,248,0.1);padding:10px;font-size:12px">📖 阅读区 100%（初始全宽）</div>
      </div>
      <div style="margin-top:6px;font-size:11px;color:var(--text-dim);text-align:center">↓ 点击单词后 ↓</div>
      <div style="display:flex;border:1px solid var(--glass-border);border-radius:8px;overflow:hidden;min-height:80px">
        <div style="flex:0 0 70%;background:rgba(129,140,248,0.1);padding:10px;font-size:12px">📖 阅读区</div>
        <div style="width:6px;background:var(--accent);opacity:0.5"></div>
        <div style="flex:1;background:rgba(251,191,36,0.08);padding:10px;font-size:12px">📋 详情面板</div>
      </div>
      <p style="margin-top:8px;font-size:13px;color:var(--text-secondary)">
        ✅ 初始全宽阅读，沉浸感好<br>
        ⚠️ 面板开/关时整个布局会变动<br>
        ⚠️ 分割线在面板关闭时不存在，需要额外逻辑
      </p>
    </div>
  </div>
</div>
