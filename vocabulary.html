<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#c5f5ec">
    <title>背单词 | 俄语学习舱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans:wght@600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --app-bg: #020617;
            --surface: rgba(15,23,42,0.72);
            --surface-strong: #0f172a;
            --border: rgba(255,255,255,0.09);
            --text: #e2e8f0;
            --text-muted: rgba(226,232,240,0.58);
            --accent: #6366f1;
            --accent-soft: rgba(99,102,241,0.18);
            --focus: #a5b4fc;
            --radius-card: 16px;
            --radius-control: 10px;
            --shadow-surface: 0 20px 64px rgba(2,6,23,0.48);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { background: var(--app-bg); scroll-behavior: smooth; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--app-bg);
            color: var(--text);
            min-height: 100dvh;
            overflow-x: hidden;
            overscroll-behavior-x: none;
        }

        button, input, select {
            -webkit-tap-highlight-color: transparent;
        }
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        [tabindex]:focus-visible {
            outline: 3px solid var(--focus);
            outline-offset: 2px;
        }

        .vocab-bg-layer,
        .vocab-bg-scrim {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
        }
        .vocab-bg-layer {
            opacity: 0;
            background-size: cover; background-position: center;
            filter: blur(6px) saturate(1.05);
            transform: scale(1.03);
            transition: opacity 0.45s ease, background-image 0.45s ease;
        }
        .vocab-bg-layer.has-image { opacity: 1; }
        .vocab-bg-scrim {
            background:
                radial-gradient(circle at 50% 42%, rgba(15,23,42,0.18), rgba(2,6,23,0.62) 58%, rgba(2,6,23,0.86) 100%),
                linear-gradient(180deg, rgba(2,6,23,0.18), rgba(2,6,23,0.72));
            opacity: 0;
            transition: opacity 0.45s ease;
        }
        body.has-custom-vocab-bg .vocab-bg-scrim { opacity: 1; }
        body.has-custom-vocab-bg .bg-orb { opacity: 0.07; }

        /* ─── 背景光球 ─── */
        .bg-orb {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
            filter: blur(80px); opacity: 0.15;
        }
        .bg-orb-1 { width: 400px; height: 400px; background: #4F46E5; top: -100px; left: -100px; }
        .bg-orb-2 { width: 300px; height: 300px; background: #7C3AED; bottom: -80px; right: -80px; }
        .bg-orb-3 { width: 250px; height: 250px; background: #2563EB; top: 50%; left: 60%; }

        /* ─── 顶部栏 ─── */
        /* ─── 主容器 ─── */
        .main-container {
            position: relative; z-index: 1;
            width: 100%; max-width: 680px; margin: 0 auto; padding: 10px 16px 110px;
        }

        /* ─── 精简顶栏 ─── */
        .slim-bar {
            display: flex; align-items: center; gap: 0;
            height: 46px; padding: 0;
            background: rgba(15,23,42,0.55);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px; margin-bottom: 8px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            overflow: hidden;
        }
        .slim-hamburger {
            width: 46px; height: 100%; border: none;
            background: transparent; color: rgba(255,255,255,0.45);
            font-size: 15px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0;
        }
        .slim-hamburger:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.9); }
        .slim-hamburger:active { background: rgba(255,255,255,0.04); }
        .slim-hamburger:focus-visible,
        .slim-icon-btn:focus-visible {
            outline-offset: -3px;
        }
        .slim-mode-label {
            font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7);
            white-space: nowrap; flex-shrink: 0; padding: 0 4px 0 2px;
        }
        .slim-mode-quick {
            display: flex; gap: 2px; margin-left: 6px; flex-shrink: 0;
        }
        .slim-mode-quick button {
            padding: 3px 9px; border-radius: 6px; border: none;
            background: transparent; color: rgba(255,255,255,0.3);
            font-size: 11px; cursor: pointer; font-family: inherit;
            transition: all 0.2s;
        }
        .slim-mode-quick button:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); }
        .slim-mode-quick button.active { background: rgba(99,102,241,0.2); color: #a5b4fc; }

        .slim-stats {
            font-size: 11px; color: rgba(255,255,255,0.4);
            margin-left: auto; white-space: nowrap; flex-shrink: 0;
            font-variant-numeric: tabular-nums; padding: 0 8px;
        }
        .slim-progress {
            height: 3px; background: rgba(255,255,255,0.06);
            border-radius: 2px; overflow: hidden;
            flex: 1; max-width: 100px; margin-right: 4px;
        }
        .slim-progress-fill {
            display: block; height: 100%; border-radius: inherit;
            background: linear-gradient(90deg, #6366f1, #a78bfa);
            transition: width 0.4s ease;
        }
        .slim-icon-btn {
            width: 38px; height: 38px; border: none;
            background: transparent; color: rgba(255,255,255,0.3);
            font-size: 14px; cursor: pointer; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s; flex-shrink: 0; margin-right: 4px;
        }
        .slim-icon-btn:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.7); }

        /* ─── 控件面板（展开/收起） ─── */
        .control-panel {
            max-height: 0; overflow: hidden;
            transition: max-height 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            margin-bottom: 0;
        }
        .control-panel.open {
            max-height: 600px;
            margin-bottom: 8px;
        }
        .cp-section {
            padding: 10px 12px; margin-bottom: 4px;
            background: rgba(255,255,255,0.025);
            border-radius: 10px; border: 1px solid rgba(255,255,255,0.05);
        }
        .cp-section-title {
            font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.3);
            text-transform: uppercase; letter-spacing: 0.1em;
            margin-bottom: 8px;
        }
        .cp-mode-grid {
            display: flex; flex-wrap: wrap; gap: 4px;
        }
        .cp-search {
            width: 100%; min-height: 42px; padding: 8px 10px; margin-bottom: 6px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: #e2e8f0; font-size: 13px;
            font-family: 'Inter', sans-serif; outline: none;
        }
        .cp-search::placeholder { color: rgba(255,255,255,0.25); }
        .cp-search:focus { border-color: rgba(99,102,241,0.4); }
        .cp-row {
            display: flex; gap: 6px; flex-wrap: wrap;
        }
        .cp-row select {
            flex: 1; min-width: 80px; min-height: 40px; padding: 5px 8px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px; color: #e2e8f0; font-size: 12px;
            font-family: 'Inter', sans-serif; outline: none; color-scheme: dark;
        }
        .cp-row select:focus { border-color: rgba(129,140,248,0.75); }
        .cp-row select option { background: #0f172a; color: #e2e8f0; }
        .cp-row select option:checked { background: #312e81; color: #ffffff; }
        .cp-chip {
            min-height: 38px; padding: 4px 10px; border-radius: 8px;
            background: transparent; border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.4); font-size: 11px;
            cursor: pointer; font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .cp-chip:hover { background: rgba(255,255,255,0.05); }
        .cp-chip.filter-btn-active {
            background: rgba(239,68,68,0.15); color: #f87171;
            border-color: rgba(239,68,68,0.3);
        }
        .cp-stats {
            display: flex; flex-wrap: wrap; gap: 6px;
        }
        .cp-stats .stat-pill {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 8px; border-radius: 6px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
            font-size: 11px;
        }
        .cp-stats .stat-pill .pill-label {
            color: rgba(255,255,255,0.35); font-size: 10px;
        }
        .cp-stats .stat-pill .pill-val {
            color: rgba(255,255,255,0.6); font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .cp-stats .stat-primary { border-color: rgba(99,102,241,0.2); }

        /* ─── 模式按钮（在面板内复用） ─── */
        .mode-btn {
            min-height: 38px; padding: 5px 10px; border: none;
            background: transparent; color: rgba(255,255,255,0.4);
            border-radius: 8px; font-size: 12px; font-weight: 500;
            cursor: pointer; transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }
        .mode-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); }
        .mode-active {
            background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.2)) !important;
            color: #c4b5fd !important;
            font-weight: 600;
        }
        .brush-btn {
            background: linear-gradient(135deg, rgba(239,68,68,0.2), rgba(249,115,22,0.15));
        }

        /* ─── 设置弹窗 ─── */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-box {
            background: #0f172a; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 24px; width: 360px; max-width: 90vw;
        }
        .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
        .modal-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .modal-label { font-size: 13px; color: rgba(255,255,255,0.6); }
        .modal-input {
            width: 80px; padding: 6px 10px; border-radius: 8px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
            color: #e2e8f0; font-size: 14px; text-align: center;
            font-family: 'Inter', sans-serif;
        }
        .modal-section {
            margin: 18px 0; padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .modal-section-title {
            font-size: 13px; font-weight: 700; color: #e2e8f0;
            margin-bottom: 10px;
        }
        .vocab-bg-grid {
            display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px; margin-bottom: 10px;
        }
        .vocab-bg-tile {
            position: relative; aspect-ratio: 1; border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px; overflow: hidden; cursor: pointer;
            background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.72);
            font-family: inherit; font-size: 11px;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .vocab-bg-tile:hover { transform: translateY(-1px); border-color: rgba(165,180,252,0.6); }
        .vocab-bg-tile.active {
            border-color: #a5b4fc;
            box-shadow: 0 0 0 2px rgba(79,70,229,0.35);
        }
        .vocab-bg-tile .tile-label {
            position: absolute; left: 6px; right: 6px; bottom: 6px;
            padding: 3px 5px; border-radius: 6px;
            background: rgba(2,6,23,0.66); color: #e2e8f0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .vocab-bg-delete {
            position: absolute; top: 4px; right: 4px; width: 20px; height: 20px;
            border-radius: 999px; border: 1px solid rgba(255,255,255,0.28);
            background: rgba(239,68,68,0.78); color: #fff;
            font-size: 13px; line-height: 18px; cursor: pointer;
        }
        .modal-btns { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
        .modal-btn {
            padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px;
            cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600;
        }
        .modal-btn-primary { background: #4F46E5; color: #fff; }
        .modal-btn-secondary { background: rgba(255,255,255,0.08); color: #e2e8f0; }

        /* ─── 问题卡片列表 ─── */
        .problem-list { margin-top: 16px; }
        .problem-item {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px; padding: 12px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .problem-word { font-family: 'Noto Serif', 'Times New Roman', serif; font-size: 16px; }
        .problem-file { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 4px; word-break: break-all; }
        .problem-actions { display: flex; gap: 6px; }
        .problem-actions button {
            padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.5);
            font-size: 11px; cursor: pointer; font-family: 'Inter', sans-serif;
        }
        .problem-actions button:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }

        /* ─── 筛选按钮激活态（给错词/未掌握 Chip 用） ─── */
        .filter-btn-active {
            background: rgba(79,70,229,0.3) !important;
            border-color: rgba(79,70,229,0.5) !important;
            color: #a5b4fc !important;
        }

        /* ─── 进度条（slim bar 下方，始终可见） ─── */
        .progress-track {
            width: 100%; height: 3px; background: rgba(255,255,255,0.06);
            border-radius: 2px; margin-bottom: 10px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #6366f1, #8b5cf6);
            border-radius: 2px; transition: width 0.4s ease;
        }

        /* ─── 卡片区域 ─── */
        .card-zone {
            margin-bottom: 12px;
            display: flex; flex-direction: column;
            height: clamp(340px, calc(100dvh - 300px), 560px);
            min-height: 340px;
            max-height: calc(100dvh - 220px);
        }
        .flashcard {
            position: relative; width: 100%;
            height: 100%; min-height: 0;
            flex: 1;
            cursor: pointer;
        }

        /* 卡片入场动画 */
        @keyframes cardEnter {
            0% { opacity: 0; transform: translateY(24px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .card-zone.card-enter {
            animation: cardEnter 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* 卡片光晕（根据掌握度） */
        .flashcard.glow-green { box-shadow: 0 0 30px rgba(74,222,128,0.08), 0 22px 70px rgba(2,6,23,0.42); }
        .flashcard.glow-yellow { box-shadow: 0 0 30px rgba(250,204,21,0.06), 0 22px 70px rgba(2,6,23,0.42); }
        .flashcard.glow-orange { box-shadow: 0 0 30px rgba(251,146,60,0.06), 0 22px 70px rgba(2,6,23,0.42); }

        /* 掌握度星星 */
        .card-stars {
            font-size: 14px; color: rgba(255,255,255,0.25);
            letter-spacing: 2px; margin-bottom: 8px;
        }

        /* 掌握度进度条 */
        .mastery-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 3px;
            border-radius: 16px 16px 0 0; overflow: hidden;
            background: rgba(255,255,255,0.05);
        }
        .mastery-fill {
            height: 100%; transition: width 0.6s ease, background 0.3s;
            border-radius: 16px 16px 0 0;
        }

        .card-face {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; min-height: 0;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05) 42%, rgba(99,102,241,0.08)),
                rgba(15,23,42,0.55);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 16px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-start; padding: 32px 24px 40px; text-align: center;
            backdrop-filter: blur(24px) saturate(1.35);
            -webkit-backdrop-filter: blur(24px) saturate(1.35);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.20),
                inset 0 -24px 46px rgba(2,6,23,0.16),
                0 22px 70px rgba(2,6,23,0.42);
            overflow: hidden;
            transition: opacity 0.18s ease, visibility 0s linear 0s;
        }
        .card-face::before {
            content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(circle at 28% 12%, rgba(255,255,255,0.24), transparent 34%),
                linear-gradient(180deg, rgba(255,255,255,0.10), transparent 38%);
            opacity: 0.72;
        }
        .card-face::after {
            content: ''; position: absolute; inset: -35% -45%; z-index: 0; pointer-events: none;
            background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.16) 47%, transparent 60%);
            opacity: 0; transform: translateX(-18%);
            transition: opacity 0.45s ease, transform 0.7s ease;
        }
        .flashcard:hover .card-face::after,
        .flashcard.flipped .card-face::after {
            opacity: 0.8; transform: translateX(18%);
        }
        .card-face > * { position: relative; z-index: 1; }
        .card-front, .card-back {
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.08) transparent;
        }
        .card-front::-webkit-scrollbar,
        .card-back::-webkit-scrollbar {
            width: 5px;
        }
        .card-front::-webkit-scrollbar-track,
        .card-back::-webkit-scrollbar-track {
            background: transparent;
            margin: 12px 0;
        }
        .card-front::-webkit-scrollbar-thumb,
        .card-back::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
        }
        .card-front::-webkit-scrollbar-thumb:hover,
        .card-back::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.16);
        }
        .card-front {
            justify-content: center;
            opacity: 1;
            visibility: visible;
        }
        .card-back {
            justify-content: flex-start;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.18s ease, visibility 0s linear 0.18s;
        }
        .flashcard.flipped .card-front {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.18s ease, visibility 0s linear 0.18s;
        }
        .flashcard.flipped .card-back {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            transition: opacity 0.18s ease, visibility 0s linear 0s;
        }

        /* 正面 */
        .card-word {
            font-family: 'Noto Serif', 'Times New Roman', serif;
            font-size: 32px; font-weight: 600; color: #f1f5f9;
            margin-bottom: 12px; line-height: 1.35;
            letter-spacing: 0.01em;
            word-break: break-word;
        }
        .card-meta {
            font-size: 13px; color: rgba(255,255,255,0.4);
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
        }
        .card-meta .tag {
            background: rgba(79,70,229,0.2); color: #a5b4fc;
            padding: 2px 8px; border-radius: 4px; font-size: 11px;
            max-width: 140px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .card-hint {
            margin-top: 24px; font-size: 11px; color: rgba(255,255,255,0.15);
        }

        /* 背面 */
        .card-meaning {
            font-size: 24px; font-weight: 700; color: #f8fafc;
            margin-bottom: 12px; line-height: 1.4;
        }
        .card-extra {
            font-size: 13px; color: rgba(255,255,255,0.35);
            margin-bottom: 16px; font-style: italic;
        }
        .card-detail-zh {
            width: 100%; text-align: left; font-size: 13px; line-height: 1.55;
            color: rgba(248,250,252,0.78); padding: 10px 12px; margin: 0 0 10px;
            background: rgba(15,23,42,0.24); border: 1px solid rgba(255,255,255,0.07);
            border-radius: 8px;
        }
        .card-collocations {
            width: 100%; text-align: left; margin: 2px 0 10px;
        }
        .collocation-item {
            padding: 8px 10px; margin-bottom: 7px; border-radius: 8px;
            background: rgba(79,70,229,0.10); border-left: 3px solid rgba(165,180,252,0.48);
        }
        .collocation-phrase {
            color: #f8fafc; font-size: 14px; font-weight: 700; margin-bottom: 3px;
        }
        .collocation-ru {
            font-family: 'Noto Serif', 'Times New Roman', serif;
            color: #e2e8f0; font-size: 13px; line-height: 1.45; margin-bottom: 2px;
        }
        .collocation-zh {
            color: rgba(255,255,255,0.42); font-size: 12px; line-height: 1.35;
        }
        .card-examples, .fold-body {
            width: 100%; text-align: left; margin-top: 4px;
        }
        .ex-item, .card-examples .ex-item, .fold-body .ex-item {
            margin-bottom: 8px; padding: 10px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px; border-left: 3px solid rgba(79,70,229,0.4);
        }
        .ex-ru, .card-examples .ex-ru, .fold-body .ex-ru {
            font-family: 'Noto Serif', 'Times New Roman', serif;
            font-size: 15px; color: #e2e8f0; margin-bottom: 4px; line-height: 1.5;
        }
        .ex-zh, .card-examples .ex-zh, .fold-body .ex-zh {
            font-size: 12px; color: rgba(255,255,255,0.35); line-height: 1.4;
        }
        /* ─── 资料真实例句 ─── */
        .source-examples-section {
            width: 100%; text-align: left; margin-top: 8px;
            padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.06);
        }
        .source-examples-title {
            font-size: 12px; color: rgba(255,255,255,0.40); margin-bottom: 6px; font-weight: 500;
        }
        .source-examples-empty {
            font-size: 12px; color: rgba(255,255,255,0.25); font-style: italic;
        }
        .source-ex-item {
            margin-bottom: 8px; padding: 8px 10px;
            background: rgba(52,211,153,0.06);
            border-radius: 6px; border-left: 3px solid rgba(52,211,153,0.4);
        }
        .source-ex-ru {
            font-family: 'Noto Serif', 'Times New Roman', serif;
            font-size: 14px; color: #e2e8f0; margin-bottom: 3px; line-height: 1.5;
        }
        .source-ex-zh {
            font-size: 12px; color: rgba(255,255,255,0.35); line-height: 1.4; margin-bottom: 4px;
        }
        .source-ex-meta {
            display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; color: rgba(255,255,255,0.30);
        }
        .source-ex-source { }
        .source-ex-page { }
        .source-ex-type {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 0.7em;
            background: rgba(99,102,241,0.15);
            color: #a5b4fc;
        }
        .source-ex-review {
            background: rgba(251,191,36,0.15); color: #fbbf24;
            padding: 1px 6px; border-radius: 3px; font-size: 10px;
        }

        /* ─── 背面俄语词 ─── */
        .card-word-back {
            font-family: 'Noto Serif', 'Times New Roman', serif;
            font-size: 20px; color: rgba(255,255,255,0.55);
            margin-bottom: 4px; letter-spacing: 0.5px;
        }

        /* ─── 标签行 ─── */
        .card-tagline {
            display: flex; flex-wrap: wrap; gap: 6px;
            justify-content: center; margin: 6px 0 10px;
        }
        .grammar-tag {
            font-size: 11px; color: rgba(255,255,255,0.45);
            background: rgba(255,255,255,0.06);
            padding: 2px 8px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* ─── 重音测验 ─── */
        .stress-quiz {
            display: flex; gap: 8px; justify-content: center;
            margin: 12px 0 6px; flex-wrap: wrap;
        }
        .stress-option {
            padding: 8px 16px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: #e2e8f0; font-size: 18px;
            font-family: 'Noto Serif', 'Times New Roman', serif;
            cursor: pointer; transition: all 0.2s;
            min-width: 60px;
        }
        .stress-option:hover:not(:disabled) {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        .stress-option:disabled { cursor: default; opacity: 0.6; }
        .stress-option.stress-right {
            background: rgba(34,197,94,0.2);
            border-color: rgba(34,197,94,0.5);
            color: #6ee7b7; opacity: 1;
        }
        .stress-selected-correct {
            background: rgba(34,197,94,0.15) !important;
            border-color: #22c55e !important;
            color: #6ee7b7 !important;
        }
        .stress-selected-wrong {
            background: rgba(239,68,68,0.15) !important;
            border-color: #ef4444 !important;
            color: #fca5a5 !important;
        }
        .stress-result {
            font-size: 13px; min-height: 20px; text-align: center;
            margin-bottom: 8px;
        }

        /* ─── 词根拆解 ─── */
        .morphology-display {
            display: flex; gap: 0; align-items: baseline;
            font-family: 'Noto Serif', 'Times New Roman', serif;
            font-size: 16px; margin: 6px 0 10px; justify-content: center;
            letter-spacing: 1px;
        }
        .morph-prefix {
            color: #f472b6; /* 粉色 - 前缀 */
            border-bottom: 2px solid rgba(244,114,182,0.3);
            padding-bottom: 1px;
        }
        .morph-root {
            color: #60a5fa; /* 蓝色 - 词根 */
            font-weight: 600;
            border-bottom: 2px solid rgba(96,165,250,0.3);
            padding-bottom: 1px;
        }
        .morph-suffix {
            color: #a78bfa; /* 紫色 - 后缀 */
            border-bottom: 2px solid rgba(167,139,250,0.3);
            padding-bottom: 1px;
        }
        .morph-ending {
            color: rgba(255,255,255,0.3); /* 灰色 - 词尾 */
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 1px;
        }

        /* ─── 折叠区块（卡片背面：例句/语法/来源例句） ─── */
        .fold-section {
            width: 100%; margin: 4px 0;
            border-radius: 10px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.06);
            background: rgba(255,255,255,0.015);
        }
        .fold-toggle {
            padding: 7px 12px; cursor: pointer;
            font-size: 12px; color: rgba(255,255,255,0.42);
            display: flex; justify-content: space-between; align-items: center;
            user-select: none; -webkit-user-select: none;
            transition: background 0.15s, color 0.15s;
        }
        .fold-toggle:hover { background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.6); }
        .fold-toggle .fold-arrow {
            font-size: 9px; opacity: 0.45;
            transition: transform 0.25s ease;
        }
        .fold-toggle .fold-count {
            font-size: 10px; color: rgba(255,255,255,0.25); margin-left: 6px;
        }
        .fold-body {
            max-height: 0; overflow: hidden;
            padding: 0 12px;
            transition: max-height 0.35s cubic-bezier(0.22, 1, 0.36, 1), padding 0.35s ease;
        }
        .fold-body.open {
            max-height: 2000px;
            padding: 6px 12px 10px;
        }

        /* ─── 语法面板 ─── */
        .grammar-panel {
            width: 100%; margin: 8px 0;
            border-radius: 10px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.02);
        }
        .grammar-toggle {
            padding: 8px 12px; cursor: pointer;
            font-size: 12px; color: rgba(255,255,255,0.5);
            display: flex; justify-content: space-between; align-items: center;
            user-select: none; -webkit-user-select: none;
        }
        .grammar-toggle:hover { background: rgba(255,255,255,0.04); }
        .grammar-arrow { font-size: 10px; transition: transform 0.2s; }
        .grammar-content {
            display: none; padding: 0 12px 10px;
            overflow-x: auto;
        }
        .grammar-content.open { display: block; }
        .grammar-row {
            display: flex; gap: 8px; padding: 3px 0;
            font-size: 12px; line-height: 1.5;
        }
        .grammar-label {
            color: rgba(255,255,255,0.35); min-width: 32px; flex-shrink: 0;
        }
        .grammar-val {
            color: rgba(255,255,255,0.6);
            font-family: 'Noto Serif', 'Times New Roman', serif;
        }
        .grammar-table {
            width: 100%; margin-top: 6px;
            border-collapse: collapse; font-size: 11px;
        }
        .grammar-table th {
            color: rgba(255,255,255,0.4); font-weight: 500;
            padding: 4px 6px; text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .grammar-table td {
            color: rgba(255,255,255,0.55);
            padding: 3px 6px;
            font-family: 'Noto Serif', 'Times New Roman', serif;
        }
        .grammar-table tr:nth-child(even) td {
            background: rgba(255,255,255,0.02);
        }

        /* ─── 操作按钮 ─── */
        .action-btns {
            display: flex; gap: 10px; justify-content: center; margin-bottom: 16px;
        }
        .action-btn {
            flex: 1; max-width: 160px;
            padding: 14px 16px; border: none; border-radius: 14px;
            font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            position: relative; overflow: hidden;
        }
        .action-btn::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 60%);
            pointer-events: none;
        }
        .action-btn .btn-label { font-size: 14px; font-weight: 600; opacity: 1; letter-spacing: 0; }
        .action-btn .btn-sub { font-size: 11px; font-weight: 400; opacity: 0.58; }
        .btn-know {
            background: linear-gradient(135deg, rgba(22,163,74,0.2), rgba(22,163,74,0.12));
            color: #6ee7b7; border: 1px solid rgba(22,163,74,0.3);
            box-shadow: 0 4px 12px rgba(22,163,74,0.1);
        }
        .btn-know:hover { background: linear-gradient(135deg, rgba(22,163,74,0.35), rgba(22,163,74,0.2)); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(22,163,74,0.15); }
        .btn-fuzzy {
            background: linear-gradient(135deg, rgba(234,179,8,0.18), rgba(234,179,8,0.1));
            color: #fcd34d; border: 1px solid rgba(234,179,8,0.3);
            box-shadow: 0 4px 12px rgba(234,179,8,0.08);
        }
        .btn-fuzzy:hover { background: linear-gradient(135deg, rgba(234,179,8,0.3), rgba(234,179,8,0.18)); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(234,179,8,0.12); }
        .btn-dunno {
            background: linear-gradient(135deg, rgba(239,68,68,0.18), rgba(239,68,68,0.1));
            color: #fca5a5; border: 1px solid rgba(239,68,68,0.3);
            box-shadow: 0 4px 12px rgba(239,68,68,0.08);
        }
        .btn-dunno:hover { background: linear-gradient(135deg, rgba(239,68,68,0.3), rgba(239,68,68,0.18)); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(239,68,68,0.12); }
        .action-btn:active { transform: scale(0.95) !important; transition-duration: 0.08s; }
        /* 正面状态：评分按钮禁用 */
        .action-btn.btn-disabled {
            opacity: 0.25; cursor: not-allowed;
            transform: none !important;
            filter: grayscale(0.5);
        }
        .action-btn.btn-disabled:hover { transform: none !important; }
        /* 翻面提示按钮（正面时显示） */
        .btn-flip-hint {
            flex: 1; max-width: 320px;
            padding: 14px 20px; border: 1px dashed rgba(255,255,255,0.12);
            border-radius: 14px; background: rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.3); font-size: 14px; font-weight: 500;
            cursor: pointer; transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .btn-flip-hint:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); }
        .btn-flip-hint .btn-sub { font-size: 11px; opacity: 0.5; }
        /* 回炉/困难状态芯片 */
        .session-chip {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 8px; border-radius: 10px; font-size: 11px;
            font-weight: 500;
        }
        .session-chip.chip-return {
            background: rgba(239,68,68,0.15); color: #f87171;
            border: 1px solid rgba(239,68,68,0.25);
        }
        .session-chip.chip-fuzzy {
            background: rgba(234,179,8,0.15); color: #facc15;
            border: 1px solid rgba(234,179,8,0.25);
        }
        .session-chip.chip-leech {
            background: rgba(239,68,68,0.25); color: #fca5a5;
            border: 1px solid rgba(239,68,68,0.4);
        }
        .session-chip.chip-confirmed {
            background: rgba(22,163,74,0.15); color: #4ade80;
            border: 1px solid rgba(22,163,74,0.25);
        }
        .session-chip.chip-delayed {
            background: rgba(99,102,241,0.15); color: #a5b4fc;
            border: 1px solid rgba(99,102,241,0.25);
        }
        /* 移动端：固定底部评分按钮 */
        @media (max-width: 600px) {
            body {
                min-height: 100dvh;
                overscroll-behavior-y: contain;
            }
            .main-container {
                max-width: none;
                padding: calc(8px + env(safe-area-inset-top)) 10px
                    calc(82px + env(safe-area-inset-bottom));
            }
            .slim-bar {
                position: sticky;
                top: max(6px, env(safe-area-inset-top));
                z-index: 70;
                height: 56px;
                margin-bottom: 8px;
                background: rgba(8,15,32,0.88);
                box-shadow: 0 10px 28px rgba(2,6,23,0.28);
            }
            .slim-hamburger,
            .slim-icon-btn {
                width: 54px;
                height: 54px;
                min-width: 54px;
                margin: 0;
                font-size: 17px;
            }
            .control-panel {
                position: fixed;
                top: calc(72px + env(safe-area-inset-top));
                left: 10px;
                right: 10px;
                z-index: 80;
                max-height: 0;
                margin: 0;
                padding: 0 8px;
                overflow: hidden;
                border: 1px solid transparent;
                border-radius: 16px;
                background: rgba(8,15,32,0.97);
                box-shadow: 0 24px 70px rgba(2,6,23,0.62);
                opacity: 0;
                pointer-events: none;
                transform: translateY(-8px) scale(0.98);
                transform-origin: top center;
                transition: max-height 0.28s cubic-bezier(0.22,1,0.36,1),
                    opacity 0.2s ease, transform 0.28s cubic-bezier(0.22,1,0.36,1),
                    padding 0.28s ease, border-color 0.2s ease;
            }
            .control-panel.open {
                max-height: calc(100dvh - 92px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
                margin: 0;
                padding: 8px;
                overflow-y: auto;
                border-color: rgba(255,255,255,0.11);
                opacity: 1;
                pointer-events: auto;
                transform: translateY(0) scale(1);
            }
            .cp-section {
                padding: 12px;
                margin-bottom: 6px;
                background: rgba(255,255,255,0.035);
            }
            .cp-mode-grid {
                display: grid;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 6px;
            }
            .mode-btn,
            .cp-chip,
            .cp-row select {
                min-height: 48px;
            }
            .mode-btn { padding: 6px; }
            .cp-search { min-height: 48px; font-size: 16px; }
            .cp-stats .stat-pill { min-height: 36px; padding-inline: 10px; }
            .progress-track {
                height: 2px;
                margin-bottom: 10px;
            }
            .card-zone {
                height: clamp(420px, calc(100dvh - 260px), 540px);
                min-height: 420px;
                max-height: 540px;
                margin-bottom: 8px;
            }
            .flashcard {
                height: 100%;
                min-height: 0 !important;
                flex: 0 0 auto;
            }
            .card-face {
                height: 100%;
                min-height: 0;
                padding: 24px 18px 28px;
                border-radius: 15px;
                box-shadow: inset 0 1px 0 rgba(255,255,255,0.16),
                    0 18px 48px rgba(2,6,23,0.38);
            }
            .card-front { justify-content: center; }
            .card-back { padding-top: 20px; padding-bottom: 24px; }
            .card-word { margin-bottom: 10px; }
            .card-hint {
                max-width: 30ch;
                margin-top: 18px;
                line-height: 1.45;
            }
            .stress-option {
                min-width: 64px;
                min-height: 48px;
                padding: 8px 16px;
            }
            .due-badge { min-height: 32px; display: inline-flex; align-items: center; }
            .fold-toggle,
            .grammar-toggle,
            .more-dropdown button {
                min-height: 48px;
            }
            .action-btns {
                position: fixed; bottom: 0; left: 0; right: 0;
                z-index: 50; margin-bottom: 0;
                padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
                background: rgba(2,6,23,0.94);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border-top: 1px solid rgba(255,255,255,0.08);
                gap: 8px;
                box-shadow: 0 -14px 32px rgba(2,6,23,0.32);
            }
            .action-btn,
            .btn-flip-hint {
                max-width: none;
                min-height: 52px;
                padding: 10px 12px;
                border-radius: 10px;
            }
            .action-btn .btn-label { font-size: 15px; }
            .action-btn .btn-sub { display: none; }
            .kb-hints { display: none; }
            .modal-overlay {
                align-items: flex-end;
                padding-top: env(safe-area-inset-top);
            }
            .modal-box {
                width: 100%;
                max-width: none;
                max-height: 88dvh;
                overflow-y: auto;
                border-radius: 18px 18px 0 0;
                padding: 22px 18px calc(22px + env(safe-area-inset-bottom));
            }
            .modal-btn { min-height: 44px; }
            .vocab-inline-notice {
                bottom: calc(82px + env(safe-area-inset-bottom));
                z-index: 90;
            }
            .backup-reminder {
                bottom: calc(78px + env(safe-area-inset-bottom)) !important;
                padding: 8px 12px !important;
            }
        }

        /* ─── 键盘提示 ─── */
        .kb-hints {
            display: flex; justify-content: center; gap: 24px;
            font-size: 11px; color: rgba(255,255,255,0.25);
        }
        .kb-hints kbd {
            display: inline-block; padding: 1px 6px;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px; font-family: 'Inter', monospace; font-size: 11px;
            margin: 0 2px;
        }

        /* ─── 完成提示 ─── */
        .done-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 36px 24px; text-align: center;
            position: relative; overflow: hidden;
        }
        .done-card .done-emoji { font-size: 48px; margin-bottom: 12px; }
        .done-card .done-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .done-card .done-sub { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 20px; }
        .done-card .done-stats {
            display: flex; justify-content: center; gap: 20px; margin-bottom: 20px;
        }
        .done-card .stat-item { text-align: center; }
        .done-card .stat-num { font-size: 24px; font-weight: 700; }
        .done-card .stat-label { font-size: 12px; color: rgba(255,255,255,0.4); }
        .stat-num.green { color: #4ade80; }
        .stat-num.yellow { color: #facc15; }
        .stat-num.red { color: #f87171; }
        .done-card .done-meter {
            width: 200px; height: 6px; margin: 0 auto 12px;
            background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden;
        }
        .done-card .done-meter-fill {
            height: 100%; border-radius: 3px;
            transition: width 1s ease;
        }
        .done-card .done-msg {
            font-size: 14px; color: rgba(255,255,255,0.6);
            margin-bottom: 20px; line-height: 1.6;
        }
        /* 撒花粒子 */
        .confetti-container {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; overflow: hidden;
        }
        .confetti-piece {
            position: absolute; width: 8px; height: 8px;
            border-radius: 2px; opacity: 0;
            animation: confetti-fall 2.5s ease-out forwards;
        }
        @keyframes confetti-fall {
            0% { opacity: 1; transform: translateY(-20px) rotate(0deg); }
            100% { opacity: 0; transform: translateY(300px) rotate(720deg); }
        }

        .restart-btn {
            padding: 12px 32px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #4F46E5, #6366F1);
            color: #fff; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.25s;
            font-family: 'Inter', sans-serif;
        }
        .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(79,70,229,0.4); }

        /* ─── 加载状态 ─── */
        .loading {
            text-align: center; padding: 16px 0;
            color: rgba(255,255,255,0.48); font-size: 14px;
        }
        .loading-card {
            min-height: min(520px, calc(100dvh - 190px));
            margin-bottom: 14px;
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            border: 1px solid rgba(255,255,255,0.09);
            border-radius: var(--radius-card);
            background: rgba(15,23,42,0.52);
            box-shadow: var(--shadow-surface);
        }
        .loading-line {
            display: block;
            height: 14px;
            border-radius: 7px;
            background: rgba(255,255,255,0.08);
            animation: skeleton-pulse 1.4s ease-in-out infinite;
        }
        .loading-line-word { width: min(240px, 68%); height: 28px; }
        .loading-line-option { width: min(190px, 54%); animation-delay: 0.12s; }
        .loading-line-meta { width: min(130px, 38%); height: 10px; animation-delay: 0.24s; }
        @keyframes skeleton-pulse {
            0%, 100% { opacity: 0.46; }
            50% { opacity: 1; }
        }

        /* ─── 卡片工具栏 ─── */
        .card-utils {
            display: flex; justify-content: center; align-items: center; gap: 12px;
            margin-bottom: 12px;
        }
        .due-badge {
            font-size: 11px; color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.04);
            padding: 4px 10px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            font-variant-numeric: tabular-nums;
        }
        .util-btn {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.35); font-size: 15px;
            width: 34px; height: 34px; border-radius: 10px;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex; align-items: center; justify-content: center;
        }
        .util-btn:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; transform: scale(1.05); }
        .util-active { border-color: #facc15; color: #facc15; }
        /* 更多菜单 */
        .more-menu-wrap { position: relative; }
        .more-dropdown {
            position: absolute; bottom: 100%; right: 0;
            margin-bottom: 6px; min-width: 140px;
            background: #0f172a; border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px; padding: 4px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            z-index: 60; display: none;
        }
        .more-dropdown.open { display: block; }
        .more-dropdown button {
            display: flex; align-items: center; gap: 8px;
            width: 100%; padding: 8px 12px; border: none;
            background: none; color: rgba(255,255,255,0.6);
            font-size: 13px; font-family: 'Inter', sans-serif;
            border-radius: 6px; cursor: pointer;
            transition: all 0.15s;
        }
        .more-dropdown button:hover {
            background: rgba(255,255,255,0.08); color: #e2e8f0;
        }

        .vocab-inline-notice {
            position: fixed; left: 50%; bottom: 18px; z-index: 90;
            transform: translateX(-50%); width: min(520px, calc(100vw - 32px));
            padding: 12px 16px; border-radius: 10px;
            background: rgba(127,29,29,0.94); border: 1px solid rgba(252,165,165,0.45);
            box-shadow: 0 12px 32px rgba(2,6,23,0.5); color: #fee2e2;
            font-size: 13px; line-height: 1.45; text-align: center;
        }
        .vocab-inline-notice.success {
            background: rgba(6,78,59,0.94); border-color: rgba(110,231,183,0.42); color: #d1fae5;
        }

        .backup-reminder { z-index: 40 !important; }

        /* ─── 音频播放按钮 ─── */
        .audio-btn {
            background: none; border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.4); font-size: 16px;
            width: 32px; height: 32px; border-radius: 8px;
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .audio-btn:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
        .audio-btn.playing {
            color: #818cf8; border-color: rgba(129,140,248,0.4);
            animation: pulse-audio 1s infinite;
        }
        @keyframes pulse-audio {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .ex-audio-btn {
            background: none; border: none;
            color: rgba(255,255,255,0.3); font-size: 13px;
            cursor: pointer; padding: 2px 4px;
            transition: color 0.2s; vertical-align: middle;
            margin-left: 6px;
        }
        .ex-audio-btn:hover { color: #a5b4fc; }

        /* ─── 快捷键提示 ─── */
        .kbd-hints {
            display: flex; gap: 12px; justify-content: center;
            margin-top: 8px; flex-wrap: wrap;
        }
        .kbd-hint {
            font-size: 11px; color: rgba(255,255,255,0.25);
            display: inline-flex; align-items: center; gap: 4px;
        }
        .kbd-hint kbd {
            display: inline-block; padding: 1px 5px;
            font-size: 10px; font-family: 'Inter', monospace;
            color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px; line-height: 1.4;
        }

        /* ─── 操作按钮子标签 ─── */
        .action-btn .btn-sub {
            font-size: 10px; font-weight: 400; opacity: 0.5;
        }

        /* ─── 刷词 Toast ─── */
        .brush-toast {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(15,23,42,0.92); backdrop-filter: blur(12px);
            color: #e2e8f0; padding: 10px 24px; border-radius: 999px;
            font-size: 14px; font-weight: 500; z-index: 999;
            border: 1px solid rgba(255,255,255,0.12);
            opacity: 0; pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            transform: translateX(-50%) translateY(-10px);
        }
        .brush-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Later component rules are defined above, so keep these mobile overrides last. */
        @media (max-width: 600px) {
            .loading { padding-top: 0; }
            .loading-card {
                min-height: 0;
                height: clamp(420px, calc(100dvh - 260px), 540px);
                padding: 28px 18px;
            }
            .card-utils {
                min-height: 44px;
                margin-bottom: 8px;
                gap: 10px;
            }
            .audio-btn,
            .util-btn {
                width: 44px;
                height: 44px;
                min-width: 44px;
                border-radius: 10px;
            }
            .brush-toast {
                top: auto;
                bottom: calc(82px + env(safe-area-inset-bottom));
                z-index: 90;
                width: max-content;
                max-width: calc(100vw - 32px);
                padding: 9px 16px;
                line-height: 1.35;
                text-align: center;
            }
        }

        /* ─── 响应式 ─── */
        @media (max-width: 480px) {
            .slim-mode-label, .slim-stats, .slim-progress, .slim-mode-quick { display: none; }
            .card-word { font-size: 26px; }
            .card-meaning { font-size: 17px; }
            .done-card { padding: 28px 16px; }
            .card-word-back { font-size: 17px; }
            .grammar-table { font-size: 10px; }
            .grammar-table td, .grammar-table th { padding: 2px 4px; }
            .grammar-row { font-size: 11px; }
        }
        @media (max-width: 900px) and (orientation: landscape) {
            .main-container { max-width: 820px; }
            .card-zone {
                height: clamp(170px, calc(100dvh - 220px), 240px);
                min-height: 170px;
                max-height: 240px;
            }
            .flashcard {
                height: 100%;
                min-height: 0 !important;
                flex: 0 0 auto;
            }
            .card-face {
                height: 100%;
                min-height: 0;
                padding: 12px 16px;
            }
            .card-hint { display: none; }
            .card-utils { margin-block: 6px; }
            .cp-mode-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        }
        @media (max-height: 500px) and (orientation: landscape) {
            .main-container {
                max-width: 920px;
                padding: 6px 12px calc(68px + env(safe-area-inset-bottom));
            }
            .slim-bar { height: 44px; margin-bottom: 5px; }
            .slim-hamburger, .slim-icon-btn { width: 44px; min-width: 44px; height: 44px; }
            .card-zone {
                height: clamp(160px, calc(100dvh - 215px), 260px);
                min-height: 160px;
                max-height: calc(100dvh - 195px);
            }
            .card-face { padding: 12px 16px; }
            .card-hint, .kbd-hints { display: none; }
            .card-utils { margin-block: 5px; }
            .action-btns {
                position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
                margin: 0; padding: 7px 12px calc(7px + env(safe-area-inset-bottom));
                background: rgba(2,6,23,0.95); border-top: 1px solid rgba(255,255,255,0.08);
            }
            .action-btn { min-height: 44px; max-width: none; padding: 7px 12px; }
            .action-btn .btn-sub { display: none; }
            .backup-reminder { bottom: calc(60px + env(safe-area-inset-bottom)) !important; }
            .vocab-inline-notice { bottom: calc(62px + env(safe-area-inset-bottom)); }
        }
        @media (hover: none) {
            .flashcard:hover .card-face::after { opacity: 0; transform: translateX(-18%); }
            .stress-option:hover:not(:disabled),
            .action-btn:hover,
            .util-btn:hover,
            .restart-btn:hover { transform: none; }
        }
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .card-face {
                background: rgba(15,23,42,0.92);
                border-color: rgba(255,255,255,0.14);
                box-shadow: 0 18px 56px rgba(2,6,23,0.44);
            }
            .card-face::before,
            .card-face::after { display: none; }
        }

        /* ─── Vocabulary app refresh: light, focused flashcard workspace ─── */
        :root {
            color-scheme: light;
            --app-bg: #f7f9f6;
            --surface: #ffffff;
            --surface-strong: #ffffff;
            --border: rgba(22, 50, 47, 0.10);
            --text: #1d2b2a;
            --text-muted: rgba(29, 43, 42, 0.52);
            --accent: #08c9a9;
            --accent-soft: rgba(8, 201, 169, 0.13);
            --focus: #008e7c;
            --radius-card: 30px;
            --radius-control: 14px;
            --shadow-surface: 0 16px 42px rgba(31, 74, 68, 0.10);
        }

        html, body { background: #f7f9f6; }
        body {
            color: var(--text);
            background:
                radial-gradient(circle at 18% 0%, rgba(124, 239, 216, 0.40), transparent 32rem),
                radial-gradient(circle at 88% 13%, rgba(255, 236, 152, 0.26), transparent 24rem),
                linear-gradient(180deg, #c5f5ec 0, #effffb 26%, #f7f9f6 60%, #f7f9f6 100%);

        .bg-orb { display: none; }

        .main-container { max-width: 760px; padding: 0 22px 130px; }
        .slim-bar {
            height: 72px; margin: 0 -22px 14px; padding: 0 22px;

            background: rgba(255,255,255,0.42); box-shadow: none; backdrop-filter: blur(16px);
        }
        .slim-hamburger, .slim-icon-btn { color: #1d2b2a; }
        .slim-hamburger:hover, .slim-icon-btn:hover { background: rgba(8, 201, 169, 0.10); color: #087f70; }
        .slim-mode-label { color: #1b3b38; font-size: 15px; font-weight: 700; }
        .slim-mode-quick button { color: rgba(29,43,42,0.42); }
        .slim-mode-quick button.active { background: rgba(8,201,169,0.12); color: #008e7c; }
        .slim-stats { color: rgba(29,43,42,0.48); }
        .slim-progress, .progress-track { background: rgba(29,43,42,0.09); }

        .control-panel.open { max-height: 680px; }

        }

        .cp-row select option { background: #fff; color: #1d2b2a; }
        .mode-btn { color: rgba(29,43,42,0.66); }
        .mode-btn:hover { background: rgba(8,201,169,0.10); color: #087f70; }

        .brush-training-grid {

            margin-bottom: 8px; padding: 4px; border-radius: 14px; background: #f2f8f6;
        }
        .brush-direction-btn { min-height: 42px; padding: 6px 8px; font-size: 12px; }
        .reinforcement-btn {
            width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid rgba(8,201,169,0.18);
            border-radius: 14px; background: rgba(8,201,169,0.10); color: #087f70;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            font: 700 13px Inter, sans-serif; cursor: pointer;
        }
        .reinforcement-btn:hover { background: rgba(8,201,169,0.16); }
        .audio-prompt {
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
            color: rgba(29,43,42,0.58); text-align: center;
        }
        .audio-prompt-btn {
            width: 92px; height: 92px; border: 0; border-radius: 50%; background: rgba(8,201,169,0.13);
            color: #008e7c; font-size: 38px; cursor: pointer; box-shadow: 0 12px 30px rgba(8,201,169,0.12);
        }
        .audio-prompt-btn:active { transform: scale(0.96); }
        .output-prompt-label { color: rgba(29,43,42,0.42); font-size: 13px; margin-bottom: 12px; }
        .output-prompt-meaning { max-width: 24ch; color: #172422; font-size: clamp(24px, 5vw, 34px); line-height: 1.35; text-align: center; }

        .card-zone {
            height: clamp(400px, calc(100dvh - 310px), 610px); min-height: 400px;
            margin: 18px 18px 16px;
        }
        .flashcard { filter: none; }
        .flashcard::before {
            content: ''; position: absolute; inset: -10px 13px 10px; z-index: -1;
            background: rgba(255,255,255,0.72); border: 1px solid rgba(24,72,66,0.05); border-radius: 30px;
            box-shadow: 0 18px 40px rgba(31,74,68,0.09);

        .flashcard.glow-green, .flashcard.glow-yellow, .flashcard.glow-orange { box-shadow: none; }
        .card-face {
            background: rgba(255,255,255,0.96); border: 1px solid rgba(24,72,66,0.07); border-radius: 30px;
            padding: 42px 32px; color: #1d2b2a; backdrop-filter: none; -webkit-backdrop-filter: none;
            box-shadow: 0 16px 42px rgba(31,74,68,0.11); overflow: auto;
        }
        .card-face::before, .card-face::after { display: none; }
        .mastery-bar { height: 4px; background: rgba(8,201,169,0.10); border-radius: 30px 30px 0 0; }
        .mastery-fill { background: var(--accent) !important; }
        .card-front { justify-content: center; }
        .card-word { color: #172422; font-family: 'Noto Sans', Inter, sans-serif; font-size: clamp(34px, 6vw, 56px); font-weight: 700; letter-spacing: 0; }
        .card-meta { color: rgba(29,43,42,0.52); font-size: 15px; }
        .card-meta .tag { background: rgba(8,201,169,0.12); color: #087f70; border-radius: 99px; }
        .card-hint { color: rgba(29,43,42,0.30); font-size: 13px; }
        .card-meaning { color: #172422; font-size: clamp(22px, 4vw, 31px); }
        .card-extra { color: rgba(29,43,42,0.54); }
        .card-detail-zh, .ex-item, .card-examples .ex-item, .fold-body .ex-item {
            background: #f5fbf9; border-color: rgba(8,201,169,0.16); color: #24413d;
        }
        .collocation-item { background: #f5fbf9; border-left-color: var(--accent); }
        .collocation-phrase, .collocation-ru, .ex-ru, .card-examples .ex-ru, .fold-body .ex-ru { color: #1d2b2a; }
        .collocation-zh, .ex-zh, .card-examples .ex-zh, .fold-body .ex-zh { color: rgba(29,43,42,0.58); }
        .card-front::-webkit-scrollbar-thumb, .card-back::-webkit-scrollbar-thumb { background: rgba(8,201,169,0.22); }

        .card-utils { margin: 0 0 14px; gap: 10px; }
        .audio-btn, .util-btn {
            width: 42px; height: 42px; background: rgba(255,255,255,0.80); border-color: rgba(24,72,66,0.10);
            color: #008e7c; border-radius: 14px; box-shadow: 0 5px 16px rgba(31,74,68,0.06);
        }
        .audio-btn:hover, .util-btn:hover { background: #eafff9; color: #008e7c; }
        .due-badge, .session-chip { background: rgba(255,255,255,0.74) !important; border: 1px solid rgba(24,72,66,0.09); color: rgba(29,43,42,0.52) !important; }
        .more-dropdown { background: #fff; border-color: rgba(24,72,66,0.10); box-shadow: 0 16px 42px rgba(31,74,68,0.16); }
        .more-dropdown button { color: #35504d; }
        .more-dropdown button:hover { background: #effbf7; color: #087f70; }

        .action-btns { gap: 12px; }
        .action-btn, .btn-flip-hint, .restart-btn {
            min-height: 58px; border-radius: 18px; border: 0; box-shadow: none;
            font-family: Inter, sans-serif; font-weight: 700;
        }
        .btn-flip-hint { width: min(440px, 100%); background: linear-gradient(90deg, #07c9aa, #1be0bd); color: #fff; font-size: 17px; }
        .action-btn { background: #fff; color: #24413d; border: 1px solid rgba(24,72,66,0.09); }
        .action-btn.btn-dunno { color: #ff8a43; background: #fff; }
        .action-btn.btn-fuzzy { color: #5f716f; background: #f1f5f3; }

        .kbd-hints, .kb-hints { color: rgba(29,43,42,0.40); }
        .kbd-hint, .kb-hints { color: rgba(29,43,42,0.40); }
        .kbd-hint kbd, .kb-hints kbd { color: rgba(29,43,42,0.55); background: rgba(255,255,255,0.68); border-color: rgba(24,72,66,0.10); }

        .modal-overlay { background: rgba(23, 47, 43, 0.43); backdrop-filter: blur(5px); }

        .done-card { color: #1d2b2a; border-radius: 28px; }
        .done-card .done-sub, .done-card .stat-label, .done-card .done-msg { color: rgba(29,43,42,0.56); }

            column-gap: 8px;

        .brush-card-hint {

        }

            font-size: 24px;
            line-height: 1.45;
        }
        .brush-card .card-stars { display: none; }
        .brush-card .card-tagline,
        .brush-card .morphology-display { justify-content: flex-start; }
        .brush-card .card-tagline { color: rgba(29,43,42,0.62); }

        .brush-card .fold-toggle .fold-count,

    <script>

    // ─── 资料坐标系数据 ─────────────────────────────────────────
    var coordLexemeIndex = null;  // lexeme_index.json
    var coordSentences = null;    // sentences.json

    var REVIEW_KEY = 'vocabulary-review-records';

        { name: '默认', url: 'default' },

        { name: '风景2', url: 'assets/IMG_20260405_015834.jpg' },
        { name: '风景3', url: 'assets/IMG_20260405_015918.jpg' },
        { name: '风景4', url: 'assets/IMG_20260405_020008.jpg' },
        { name: '风景5', url: 'assets/IMG_20260405_020048.jpg' },
        { name: '风景6', url: 'assets/mmexport1775325437154.jpg' }
    ];
    var newCardsToday = 0;       // 今日已学新卡数
    var currentMode = 'brush';     // 当前模式
    var currentModeLabel = '刷词模式'; // 当前模式中文名

    // ─── 当日学习队列（回炉机制）───────────────────────────────
    var seenCount = 0;           // 本轮已展示卡数（含回炉）
    var sessionCards = {};       // id → { id, failCount, fuzzyCount, goodStreak, readyAfterSeen, readyAfterTime, passed }
    var delayedQueue = [];       // 延迟回炉卡队列
    var LEECH_THRESHOLD = 3;     // failCount >= 3 视为困难词

    // The scheduler owns the brush queue, retries and completion condition.

    var brushSession = null;

    var _undoSnapshot = null;

    // ─── 加载数据 ──────────────────────────────────────────────────
        // ─── 卡片背面折叠区块切换 ──────────────────────────────────
    function toggleFold(el, e) {
        if (e) e.stopPropagation();
        var body = el.nextElementSibling;
        if (!body) return;
        var isOpen = body.classList.toggle('open');
        // Flip the arrow: ▾ ↔ ▴
        var arrow = el.querySelector('.fold-arrow');
        if (arrow) {
            arrow.textContent = isOpen ? '▴' : '▾';
            arrow.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(0deg)';
        }
        if (isOpen) scrollFoldIntoCardView(body);
        adjustCardHeight();
    }

    function scrollFoldIntoCardView(body) {
        var scroller = document.querySelector('.card-back');
        if (!scroller || !body) return;
        var section = body.closest('.fold-section') || body;

        function reveal(behavior) {
            var scrollerRect = scroller.getBoundingClientRect();
            var sectionRect = section.getBoundingClientRect();
            var bodyRect = body.getBoundingClientRect();
            var bottom = Math.max(sectionRect.bottom, bodyRect.bottom);
            var bottomGap = bottom - (scrollerRect.bottom - 30);
            var topGap = (scrollerRect.top + 18) - sectionRect.top;

            if (bottomGap > 0) {
                scroller.scrollTo({ top: scroller.scrollTop + bottomGap, behavior: behavior || 'smooth' });
            } else if (topGap > 0) {
                scroller.scrollTo({ top: Math.max(0, scroller.scrollTop - topGap), behavior: behavior || 'smooth' });
            }
        }

        requestAnimationFrame(function() { reveal('smooth'); });
        setTimeout(function() { reveal('smooth'); }, 120);
        setTimeout(function() { reveal('smooth'); }, 260);
        setTimeout(function() { reveal('auto'); }, 420);
    }

    function openSourceExamplesFold() {
        if (currentMode === 'brush' && !brushAnswerVisible) {
            showBrushBackWithoutRating();
            setTimeout(openSourceExamplesFold, 80);
            return;
        }
        if (currentMode !== 'brush' && !flipped) {
            flipCard();
            setTimeout(openSourceExamplesFold, 80);
            return;
        }
        var mount = document.getElementById('sourceExamplesMount');
        if (!mount) return false;
        var body = mount.closest('.fold-body');
        if (!body) return false;
        if (!body.classList.contains('open')) {
            body.classList.add('open');
            var toggle = body.previousElementSibling;
            if (toggle) {
                var arrow = toggle.querySelector('.fold-arrow');
                if (arrow) arrow.textContent = '▲';
            }
        }
        scrollFoldIntoCardView(body);
        adjustCardHeight();
        return true;
    }

    function showBrushBackWithoutRating() {
        if (!_currentSessionCard) return;
        brushAnswerVisible = true;
        brushPendingKnown = false;
        flipped = true;
        renderBrushCard(true);
    }

    function scrollCardBackByGamepad(delta) {
        if (!flipped || !delta) return;
        var cardBack = document.querySelector('.flashcard.flipped .card-back') || document.querySelector('.card-back');
        if (cardBack) cardBack.scrollTop += delta;
    }

    // ─── 控件面板展开/收起 ─────────────────────────────────────
    var _panelLocked = false;
    function toggleControlPanel() {
        _panelLocked = !_panelLocked;
        var panel = document.getElementById('controlPanel');
        if (panel) {
            panel.classList.toggle('open', _panelLocked);
            panel.setAttribute('aria-hidden', _panelLocked ? 'false' : 'true');
            panel.inert = !_panelLocked;
        }
        var btn = document.getElementById('slimHamburger');
        if (btn) {
            btn.textContent = _panelLocked ? '×' : '☰';
            btn.setAttribute('aria-expanded', _panelLocked ? 'true' : 'false');
            btn.setAttribute('aria-label', _panelLocked ? '收起控件面板' : '展开控件面板');
        }
        if (_panelLocked) {
            if (window.innerWidth > 600) {
                setTimeout(function() { panel.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 100);
            }
        }
    }

    function closeControlPanel() {
        if (_panelLocked) toggleControlPanel();
    }

    // ─── 更新精简顶栏 ─────────────────────────────────────────
    function updateSlimBar() {
        document.body.classList.toggle('is-brush-mode', currentMode === 'brush');
        document.getElementById('slimModeLabel').textContent = currentMode === 'brush' ?
            '极速刷词' :
            '📅 ' + (currentModeLabel || '学习');
        var brushStats = getBrushStats();
        var totalCards = currentMode === 'brush' ?
            brushStats.total :
            getSessionTotalUnique();
        var processed = currentMode === 'brush' ?
            (brushStats.completed || brushStats.known) :
            (getPassedCount() + getLeechCountInSession());
        document.getElementById('slimStats').textContent = processed + '/' + totalCards;
        var pct = totalCards > 0 ? Math.round(processed / totalCards * 100) : 0;
        document.getElementById('slimProgressFill').style.width = pct + '%';
    }

    function loadVocabulary() {
        loadAudioManifest();
        Promise.all([
            fetch('data/vocabulary.json').then(function(r) {
                if (!r.ok) throw new Error('词库加载失败 (' + r.status + ')');
                return r.json();
            }),
            readerRuntime.loadVocabularyExtras()
        ])
            .then(function(results) {
                var data = Array.isArray(results[0]) ? results[0] : [];
                var novelItems = Array.isArray(results[1]) ? results[1] : [];
                novelItems.forEach(function(item, index) {
                    if (!item || !item.word) return;
                    var normalized = {
                        id: item.id || ('novel-' + String(item.word).toLowerCase().replace(/[^a-z0-9\u0400-\u04ff]+/gi, '-') + '-' + index),
                        word: item.word,
                        meaning: item.meaning || '',
                        type: item.type || 'reader',
                        source: 'novel',
                        sourceBook: item.source || '',
                        sourceSentenceRu: item.sourceSentenceRu || '',
                        sourceSentenceZh: item.sourceSentenceZh || '',
                        examples: (item.sourceSentenceRu || item.sourceSentenceZh) ? [{
                            ru: item.sourceSentenceRu || '',
                            zh: item.sourceSentenceZh || ''
                        }] : []
                    };
                    var existingIndex = data.findIndex(function(word) { return word.id === normalized.id; });
                    if (existingIndex >= 0) data[existingIndex] = Object.assign({}, data[existingIndex], normalized);
                    else data.push(normalized);
                });
                var records = getRecords();
                function normalizeSavedIdentity(value) {
                    return String(value || '').normalize('NFD').replace(/[\u0300\u0301]/g, '').normalize('NFC').replace(/ё/g, 'е').toLowerCase().replace(/[^а-я-]/g, '');
                }
                Object.keys(records).forEach(function(id) {
                    var record = records[id] || {};
                    var canonical = record.canonicalKey || record.lemma || record.word || id;
                    var normalizedCanonical = normalizeSavedIdentity(canonical);
                    var existingIndex = data.findIndex(function(word) {
                        return word.id === id || normalizeSavedIdentity(word.lemma || word.word) === normalizedCanonical;
                    });
                    var savedFields = {
                        _saved: true,
                        canonicalKey: record.canonicalKey || normalizedCanonical,
                        lemma: record.lemma || canonical,
                        forms: record.forms || [],
                        origins: record.origins || (record.source ? [record.source] : []),
                        collection: record.collection || 'saved',
                        contexts: record.contexts || record.sources || []
                    };
                    if (existingIndex >= 0) {
                        data[existingIndex] = Object.assign({}, data[existingIndex], savedFields, {
                            meaning: record.meaning || data[existingIndex].meaning || '',
                            type: record.partOfSpeech || data[existingIndex].type || ''
                        });
                        return;
                    }
                    data.push(Object.assign({
                        id: id,
                        word: record.lemma || record.word || (record.forms || [])[0] || id,
                        meaning: record.meaning || '',
                        type: record.partOfSpeech || 'reader',
                        source: record.source || (record.origins || [])[0] || 'reader'
                    }, savedFields));
                });
                allWords = data;
                initFilters();
                var settings = getSettings();
                brushStudyMode = ['visual', 'audio', 'output'].indexOf(settings.brushStudyMode) >= 0 ? settings.brushStudyMode : 'visual';
                var preferredSource = settings.brushSource || 'vocab';

    function getLegacyVisualProfile(record) {
        if (!record) return null;
        var successfulDates = (Array.isArray(record.history) ? record.history : []).filter(function(item) {
            return item && (item.rating === 'known' || item.rating === 5);
        }).map(function(item) { return String(item.date || '').slice(0, 10); }).filter(Boolean);
        successfulDates = successfulDates.filter(function(date, index, dates) { return dates.indexOf(date) === index; }).slice(-8);
        return VocabularySessionScheduler.normalizeSkillProfile({
            attempts: record.reps || record.count || record.history && record.history.length || 0,
            successes: successfulDates.length,
            failures: record.lapses || 0,
            streak: record.mastery >= 5 ? 1 : 0,
            successfulDates: successfulDates,
            lastSeen: record.lastReview || null,
            lastSuccess: record.mastery >= 3 ? record.lastReview || null : null,
            nextDue: record.nextReview || null,
            stable: successfulDates.length >= 3 && record.mastery >= 5
        });
    }

    function getSkillProfile(record, mode) {
        var profiles = record && record.skillProfiles;
        if (profiles && profiles[mode]) return VocabularySessionScheduler.normalizeSkillProfile(profiles[mode]);
        return mode === 'visual' ? getLegacyVisualProfile(record) : null;
    }

    function recordBrushSkillAttempt(wordId, known) {
        var records = getRecords();
        var record = records[wordId] && typeof records[wordId] === 'object' ? records[wordId] : {};
        var profiles = record.skillProfiles && typeof record.skillProfiles === 'object' ? record.skillProfiles : {};
        var previous = getSkillProfile(record, brushStudyMode);
        var elapsed = brushDecision && brushDecision.responseMs || Math.max(0, Date.now() - brushShownAt);
        var replayed = brushStudyMode === 'audio' && brushAudioReplayCount > 0;
        var fuzzy = known && (replayed || brushDecision && brushDecision.quality === 'fuzzy' || elapsed > 4000);
        var outcome = known ? (fuzzy ? 'fuzzy' : 'known') : 'unknown';
        profiles[brushStudyMode] = VocabularySessionScheduler.recordSkillAttempt(previous, outcome, {
            today: getTodayKey(), reviewedAt: new Date().toISOString(), responseMs: elapsed, replayed: replayed
        });
        record.skillProfiles = profiles;
        record.lastLearningMode = brushStudyMode;
        records[wordId] = record;
        saveRecords(records);
        return outcome;
    }

    function isPriorityBrushWord(word, record, extras) {
        var profile = getSkillProfile(record, brushStudyMode);
        return word.source === 'freq' || word.source === 'b2' ||
            extras.fav.indexOf(word.id) >= 0 || !!(profile && profile.failures >= 2);
    }

    function getReinforcementWords() {

            return profile && profile.nextDue && String(profile.nextDue).slice(0, 10) <= today;
        }).sort(function(a, b) {

            var pb = getSkillProfile(records[b.id], brushStudyMode);
            if (pa.failures !== pb.failures) return pb.failures - pa.failures;
            return String(pa.nextDue).localeCompare(String(pb.nextDue));
        });
