<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 背单词 — 俄语学习舱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #020617;
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .vocab-bg-layer,
        .vocab-bg-scrim {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
        }
        .vocab-bg-layer {
            opacity: 0;
            background-size: cover; background-position: center;
            filter: blur(6px) saturate(1.05);
            transform: scale(1.03);
            transition: opacity 0.45s ease, background-image 0.45s ease;
        }
        .vocab-bg-layer.has-image { opacity: 1; }
        .vocab-bg-scrim {
            background:
                radial-gradient(circle at 50% 42%, rgba(15,23,42,0.18), rgba(2,6,23,0.62) 58%, rgba(2,6,23,0.86) 100%),
                linear-gradient(180deg, rgba(2,6,23,0.18), rgba(2,6,23,0.72));
            opacity: 0;
            transition: opacity 0.45s ease;
        }
        body.has-custom-vocab-bg .vocab-bg-scrim { opacity: 1; }
        body.has-custom-vocab-bg .bg-orb { opacity: 0.07; }

        /* ─── 背景光球 ─── */
        .bg-orb {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
            filter: blur(80px); opacity: 0.15;
        }
        .bg-orb-1 { width: 400px; height: 400px; background: #4F46E5; top: -100px; left: -100px; }
        .bg-orb-2 { width: 300px; height: 300px; background: #7C3AED; bottom: -80px; right: -80px; }
        .bg-orb-3 { width: 250px; height: 250px; background: #2563EB; top: 50%; left: 60%; }

        /* ─── 顶部栏 ─── */
        /* ─── 主容器 ─── */
        .main-container {
            position: relative; z-index: 1;
            max-width: 640px; margin: 0 auto; padding: 16px 16px 100px;
        }

        /* ─── 模式栏 ─── */
        .mode-bar {
            display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px;
            align-items: center; padding: 4px;
            background: rgba(255,255,255,0.03);
            border-radius: 14px; border: 1px solid rgba(255,255,255,0.06);
        }
        .mode-btn {
            padding: 7px 14px; border: none;
            background: transparent; color: rgba(255,255,255,0.45);
            border-radius: 10px; font-size: 13px; font-weight: 500;
            cursor: pointer; transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            font-family: 'Inter', sans-serif;
            white-space: nowrap; flex-shrink: 0;
            position: relative;
        }
        .mode-btn:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.7); }
        .mode-active {
            background: linear-gradient(135deg, rgba(99,102,241,0.25), rgba(139,92,246,0.2)) !important;
            color: #c4b5fd !important;
            box-shadow: 0 2px 8px rgba(99,102,241,0.15);
            font-weight: 600;
        }
        .mode-bar-right {
            margin-left: auto; display: flex; gap: 6px; flex-shrink: 0;
        }
        .mode-icon-btn {
            width: 32px; height: 32px; padding: 0;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.4);
            border-radius: 8px; font-size: 15px;
            cursor: pointer; transition: all 0.2s;
        }
        .mode-icon-btn:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
        /* 移动端：单行横向滑动 tabs */
        @media (max-width: 600px) {
            .mode-bar {
                flex-wrap: nowrap; overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none; gap: 6px;
                padding-bottom: 2px;
            }
            .mode-bar::-webkit-scrollbar { display: none; }
            .mode-btn { font-size: 12px; padding: 6px 12px; }
        }

        /* ─── 设置弹窗 ─── */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-box {
            background: #0f172a; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 24px; width: 360px; max-width: 90vw;
        }
        .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
        .modal-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .modal-label { font-size: 13px; color: rgba(255,255,255,0.6); }
        .modal-input {
            width: 80px; padding: 6px 10px; border-radius: 8px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
            color: #e2e8f0; font-size: 14px; text-align: center;
            font-family: 'Inter', sans-serif;
        }
        .modal-section {
            margin: 18px 0; padding-top: 14px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .modal-section-title {
            font-size: 13px; font-weight: 700; color: #e2e8f0;
            margin-bottom: 10px;
        }
        .vocab-bg-grid {
            display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px; margin-bottom: 10px;
        }
        .vocab-bg-tile {
            position: relative; aspect-ratio: 1; border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px; overflow: hidden; cursor: pointer;
            background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.72);
            font-family: inherit; font-size: 11px;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .vocab-bg-tile:hover { transform: translateY(-1px); border-color: rgba(165,180,252,0.6); }
        .vocab-bg-tile.active {
            border-color: #a5b4fc;
            box-shadow: 0 0 0 2px rgba(79,70,229,0.35);
        }
        .vocab-bg-tile .tile-label {
            position: absolute; left: 6px; right: 6px; bottom: 6px;
            padding: 3px 5px; border-radius: 6px;
            background: rgba(2,6,23,0.66); color: #e2e8f0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .vocab-bg-delete {
            position: absolute; top: 4px; right: 4px; width: 20px; height: 20px;
            border-radius: 999px; border: 1px solid rgba(255,255,255,0.28);
            background: rgba(239,68,68,0.78); color: #fff;
            font-size: 13px; line-height: 18px; cursor: pointer;
        }
        .modal-btns { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
        .modal-btn {
            padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px;
            cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600;
        }
        .modal-btn-primary { background: #4F46E5; color: #fff; }
        .modal-btn-secondary { background: rgba(255,255,255,0.08); color: #e2e8f0; }

        /* ─── 问题卡片列表 ─── */
        .problem-list { margin-top: 16px; }
        .problem-item {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px; padding: 12px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .problem-word { font-family: 'Noto Serif', 'Times New Roman', serif; font-size: 16px; }
        .problem-file { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 4px; word-break: break-all; }
        .problem-actions { display: flex; gap: 6px; }
        .problem-actions button {
            padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.5);
            font-size: 11px; cursor: pointer; font-family: 'Inter', sans-serif;
        }
        .problem-actions button:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }

        /* ─── 筛选面板 ─── */
        .filter-bar {
            display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px;
            align-items: center;
        }
        .filter-bar select, .filter-bar button {
            font-family: 'Inter', sans-serif; font-size: 12px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #e2e8f0; border-radius: 8px; padding: 5px 10px;
            cursor: pointer; transition: all 0.2s;
        }
        .filter-bar select:hover, .filter-bar button:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }
        .filter-bar select:focus, .filter-bar button:focus {
            outline: none; border-color: #4F46E5;
        }
        .filter-bar select option { background: #1e1b4b; color: #e2e8f0; }
        .filter-btn-active {
            background: rgba(79,70,229,0.3) !important;
            border-color: rgba(79,70,229,0.5) !important;
            color: #a5b4fc !important;
        }
        .filter-sep { width: 1px; height: 24px; background: rgba(255,255,255,0.1); }
        /* 筛选折叠面板（桌面+移动端都默认折叠） */
        /* 搜索框 */
        #filterSearch {
            flex: 1; min-width: 0; max-width: 150px;
            padding: 6px 10px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: #e2e8f0; font-size: 12px;
            outline: none; transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        #filterSearch:focus {
            border-color: rgba(99,102,241,0.4);
            background: rgba(255,255,255,0.06);
            box-shadow: 0 0 0 2px rgba(99,102,241,0.1);
        }
        #filterSearch::placeholder { color: rgba(255,255,255,0.25); }

        .filter-toggle-btn {
            display: inline-flex;
            align-items: center; gap: 4px;
            padding: 5px 12px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.4); font-size: 12px;
            cursor: pointer; font-family: 'Inter', sans-serif;
            transition: all 0.2s;
        }
        .filter-toggle-btn:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
        .filter-drawer {
            display: none; gap: 6px; align-items: center;
            flex-wrap: wrap; padding: 8px 0 4px;
        }
        .filter-drawer.open { display: flex; }
        .filter-drawer select { flex: 1; min-width: 0; }
        @media (max-width: 600px) {
            .filter-drawer select { flex: 1; min-width: 0; }
        }

        /* ─── 统计条 ─── */
        .stats-bar {
            display: flex; gap: 5px; align-items: center;
            margin-bottom: 14px; font-size: 11px; color: rgba(255,255,255,0.5);
            flex-wrap: wrap;
        }
        .stat-pill {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 4px 10px; border-radius: 20px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            white-space: nowrap; transition: all 0.2s;
        }
        .stat-pill:hover { background: rgba(255,255,255,0.06); }
        .stat-pill .pill-label { color: rgba(255,255,255,0.35); font-size: 10px; }
        .stat-pill .pill-val { font-weight: 600; color: #c4b5fd; font-variant-numeric: tabular-nums; }
        .stat-pill.stat-primary {
            background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(139,92,246,0.08));
            border-color: rgba(99,102,241,0.2);
        }
        .stat-pill.stat-primary .pill-val { color: #a5b4fc; }

        /* ─── 进度条 ─── */
        .progress-track {
            width: 100%; height: 4px; background: rgba(255,255,255,0.08);
            border-radius: 2px; margin-bottom: 16px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #4F46E5, #6366F1);
            border-radius: 2px; transition: width 0.3s ease;
        }

        /* ─── 卡片区域 ─── */
        .card-zone {
            perspective: 1000px; margin-bottom: 16px;
        }
        .flashcard {
            position: relative; width: 100%; min-height: 340px;
            cursor: pointer; transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .flashcard.flipped { transform: rotateY(180deg); }

        /* 卡片入场动画 */
        @keyframes cardEnter {
            0% { opacity: 0; transform: translateY(24px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .card-zone.card-enter {
            animation: cardEnter 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* 卡片光晕（根据掌握度） */
        .flashcard.glow-green { box-shadow: 0 0 30px rgba(74,222,128,0.08), 0 22px 70px rgba(2,6,23,0.42); }
        .flashcard.glow-yellow { box-shadow: 0 0 30px rgba(250,204,21,0.06), 0 22px 70px rgba(2,6,23,0.42); }
        .flashcard.glow-orange { box-shadow: 0 0 30px rgba(251,146,60,0.06), 0 22px 70px rgba(2,6,23,0.42); }

        /* 掌握度星星 */
        .card-stars {
            font-size: 14px; color: rgba(255,255,255,0.25);
            letter-spacing: 2px; margin-bottom: 8px;
        }

        /* 掌握度进度条 */
        .mastery-bar {
            position: absolute; top: 0; left: 0; right: 0; height: 3px;
            border-radius: 16px 16px 0 0; overflow: hidden;
            background: rgba(255,255,255,0.05);
        }
        .mastery-fill {
            height: 100%; transition: width 0.6s ease, background 0.3s;
            border-radius: 16px 16px 0 0;
        }

        .card-face {
            position: absolute; top: 0; left: 0; width: 100%; min-height: 340px;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            background:
                linear-gradient(135deg, rgba(255,255,255,0.18), rgba(255,255,255,0.055) 42%, rgba(99,102,241,0.10)),
                rgba(15,23,42,0.34);
            border: 1px solid rgba(255,255,255,0.20);
            border-radius: 16px;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 32px 24px; text-align: center;
            backdrop-filter: blur(28px) saturate(1.45);
            -webkit-backdrop-filter: blur(28px) saturate(1.45);
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.24),
                inset 0 -24px 46px rgba(2,6,23,0.20),
                0 22px 70px rgba(2,6,23,0.42);
            overflow: hidden;
        }
        .card-face::before {
            content: ''; position: absolute; inset: 0; z-index: 0; pointer-events: none;
            background:
                radial-gradient(circle at 28% 12%, rgba(255,255,255,0.28), transparent 34%),
                linear-gradient(180deg, rgba(255,255,255,0.12), transparent 38%);
            opacity: 0.72;
        }
        .card-face::after {
            content: ''; position: absolute; inset: -35% -45%; z-index: 0; pointer-events: none;
            background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.16) 47%, transparent 60%);
            opacity: 0; transform: translateX(-18%);
            transition: opacity 0.45s ease, transform 0.7s ease;
        }
        .flashcard:hover .card-face::after,
        .flashcard.flipped .card-face::after {
            opacity: 0.8; transform: translateX(18%);
        }
        .card-face > * { position: relative; z-index: 1; }
        .card-front, .card-back {
            overflow-y: auto; justify-content: flex-start;
        }
        .card-back {
            transform: rotateY(180deg);
        }

        /* 正面 */
        .card-word {
            font-family: 'Noto Serif', 'Times New Roman', serif;
            font-size: 32px; font-weight: 600; color: #f1f5f9;
            margin-bottom: 12px; line-height: 1.35;
            letter-spacing: 0.01em;
            word-break: break-word;
        }
        .card-meta {
            font-size: 13px; color: rgba(255,255,255,0.4);
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
        }
        .card-meta .tag {
            background: rgba(79,70,229,0.2); color: #a5b4fc;
            padding: 2px 8px; border-radius: 4px; font-size: 11px;
            max-width: 140px; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
        }
        .card-hint {
            margin-top: 24px; font-size: 11px; color: rgba(255,255,255,0.15);
        }

        /* 背面 */
        .card-meaning {
            font-size: 24px; font-weight: 700; color: #f8fafc;
            margin-bottom: 12px; line-height: 1.4;
        }
        .card-extra {
            font-size: 13px; color: rgba(255,255,255,0.35);
            margin-bottom: 16px; font-style: italic;
        }
        .card-examples {
            width: 100%; text-align: left; margin-top: 4px;
        }
        .card-examples .ex-item {
            margin-bottom: 8px; padding: 10px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px; border-left: 3px solid rgba(79,70,229,0.4);
        }
        .card-examples .ex-ru {
            font-family: 'Noto Serif', 'Times New Roman', serif;
            font-size: 15px; color: #e2e8f0; margin-bottom: 4px; line-height: 1.5;
        }
        .card-examples .ex-zh {
            font-size: 12px; color: rgba(255,255,255,0.35); line-height: 1.4;
        }

        /* ─── 资料真实例句 ─── */
        .source-examples-section {
            width: 100%; text-align: left; margin-top: 8px;
            padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.06);
        }
        .source-examples-title {
            font-size: 12px; color: rgba(255,255,255,0.40); margin-bottom: 6px; font-weight: 500;
        }
        .source-examples-empty {
            font-size: 12px; color: rgba(255,255,255,0.25); font-style: italic;
        }
        .source-ex-item {
            margin-bottom: 8px; padding: 8px 10px;
            background: rgba(52,211,153,0.06);
            border-radius: 6px; border-left: 3px solid rgba(52,211,153,0.4);
        }
        .source-ex-ru {
            font-family: 'Noto Serif', 'Times New Roman', serif;
            font-size: 14px; color: #e2e8f0; margin-bottom: 3px; line-height: 1.5;
        }
        .source-ex-zh {
            font-size: 12px; color: rgba(255,255,255,0.35); line-height: 1.4; margin-bottom: 4px;
        }
        .source-ex-meta {
            display: flex; gap: 8px; flex-wrap: wrap; font-size: 11px; color: rgba(255,255,255,0.30);
        }
        .source-ex-source { }
        .source-ex-page { }
        .source-ex-type {
            display: inline-block;
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 0.7em;
            background: rgba(99,102,241,0.15);
            color: #a5b4fc;
        }
        .source-ex-review {
            background: rgba(251,191,36,0.15); color: #fbbf24;
            padding: 1px 6px; border-radius: 3px; font-size: 10px;
        }

        /* ─── 背面俄语词 ─── */
        .card-word-back {
            font-family: 'Noto Serif', 'Times New Roman', serif;
            font-size: 20px; color: rgba(255,255,255,0.55);
            margin-bottom: 4px; letter-spacing: 0.5px;
        }

        /* ─── 标签行 ─── */
        .card-tagline {
            display: flex; flex-wrap: wrap; gap: 6px;
            justify-content: center; margin: 6px 0 10px;
        }
        .grammar-tag {
            font-size: 11px; color: rgba(255,255,255,0.45);
            background: rgba(255,255,255,0.06);
            padding: 2px 8px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* ─── 重音测验 ─── */
        .stress-quiz {
            display: flex; gap: 8px; justify-content: center;
            margin: 12px 0 6px; flex-wrap: wrap;
        }
        .stress-option {
            padding: 8px 16px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.05);
            color: #e2e8f0; font-size: 18px;
            font-family: 'Noto Serif', 'Times New Roman', serif;
            cursor: pointer; transition: all 0.2s;
            min-width: 60px;
        }
        .stress-option:hover:not(:disabled) {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.3);
            transform: scale(1.05);
        }
        .stress-option:disabled { cursor: default; opacity: 0.6; }
        .stress-option.stress-right {
            background: rgba(34,197,94,0.2);
            border-color: rgba(34,197,94,0.5);
            color: #6ee7b7; opacity: 1;
        }
        .stress-selected-correct {
            background: rgba(34,197,94,0.15) !important;
            border-color: #22c55e !important;
            color: #6ee7b7 !important;
        }
        .stress-selected-wrong {
            background: rgba(239,68,68,0.15) !important;
            border-color: #ef4444 !important;
            color: #fca5a5 !important;
        }
        .stress-result {
            font-size: 13px; min-height: 20px; text-align: center;
            margin-bottom: 8px;
        }

        /* ─── 词根拆解 ─── */
        .morphology-display {
            display: flex; gap: 0; align-items: baseline;
            font-family: 'Noto Serif', 'Times New Roman', serif;
            font-size: 16px; margin: 6px 0 10px; justify-content: center;
            letter-spacing: 1px;
        }
        .morph-prefix {
            color: #f472b6; /* 粉色 - 前缀 */
            border-bottom: 2px solid rgba(244,114,182,0.3);
            padding-bottom: 1px;
        }
        .morph-root {
            color: #60a5fa; /* 蓝色 - 词根 */
            font-weight: 600;
            border-bottom: 2px solid rgba(96,165,250,0.3);
            padding-bottom: 1px;
        }
        .morph-suffix {
            color: #a78bfa; /* 紫色 - 后缀 */
            border-bottom: 2px solid rgba(167,139,250,0.3);
            padding-bottom: 1px;
        }
        .morph-ending {
            color: rgba(255,255,255,0.3); /* 灰色 - 词尾 */
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 1px;
        }

        /* ─── 语法面板 ─── */
        .grammar-panel {
            width: 100%; margin: 8px 0;
            border-radius: 10px; overflow: hidden;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.02);
        }
        .grammar-toggle {
            padding: 8px 12px; cursor: pointer;
            font-size: 12px; color: rgba(255,255,255,0.5);
            display: flex; justify-content: space-between; align-items: center;
            user-select: none; -webkit-user-select: none;
        }
        .grammar-toggle:hover { background: rgba(255,255,255,0.04); }
        .grammar-arrow { font-size: 10px; transition: transform 0.2s; }
        .grammar-content {
            display: none; padding: 0 12px 10px;
            overflow-x: auto;
        }
        .grammar-content.open { display: block; }
        .grammar-row {
            display: flex; gap: 8px; padding: 3px 0;
            font-size: 12px; line-height: 1.5;
        }
        .grammar-label {
            color: rgba(255,255,255,0.35); min-width: 32px; flex-shrink: 0;
        }
        .grammar-val {
            color: rgba(255,255,255,0.6);
            font-family: 'Noto Serif', 'Times New Roman', serif;
        }
        .grammar-table {
            width: 100%; margin-top: 6px;
            border-collapse: collapse; font-size: 11px;
        }
        .grammar-table th {
            color: rgba(255,255,255,0.4); font-weight: 500;
            padding: 4px 6px; text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .grammar-table td {
            color: rgba(255,255,255,0.55);
            padding: 3px 6px;
            font-family: 'Noto Serif', 'Times New Roman', serif;
        }
        .grammar-table tr:nth-child(even) td {
            background: rgba(255,255,255,0.02);
        }

        /* ─── 操作按钮 ─── */
        .action-btns {
            display: flex; gap: 10px; justify-content: center; margin-bottom: 16px;
        }
        .action-btn {
            flex: 1; max-width: 160px;
            padding: 14px 16px; border: none; border-radius: 14px;
            font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            position: relative; overflow: hidden;
        }
        .action-btn::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, transparent 60%);
            pointer-events: none;
        }
        .action-btn .btn-label { font-size: 11px; font-weight: 400; opacity: 0.6; letter-spacing: 0.3px; }
        .action-btn .btn-sub { font-size: 10px; font-weight: 400; opacity: 0.4; }
        .btn-know {
            background: linear-gradient(135deg, rgba(22,163,74,0.2), rgba(22,163,74,0.12));
            color: #6ee7b7; border: 1px solid rgba(22,163,74,0.3);
            box-shadow: 0 4px 12px rgba(22,163,74,0.1);
        }
        .btn-know:hover { background: linear-gradient(135deg, rgba(22,163,74,0.35), rgba(22,163,74,0.2)); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(22,163,74,0.15); }
        .btn-fuzzy {
            background: linear-gradient(135deg, rgba(234,179,8,0.18), rgba(234,179,8,0.1));
            color: #fcd34d; border: 1px solid rgba(234,179,8,0.3);
            box-shadow: 0 4px 12px rgba(234,179,8,0.08);
        }
        .btn-fuzzy:hover { background: linear-gradient(135deg, rgba(234,179,8,0.3), rgba(234,179,8,0.18)); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(234,179,8,0.12); }
        .btn-dunno {
            background: linear-gradient(135deg, rgba(239,68,68,0.18), rgba(239,68,68,0.1));
            color: #fca5a5; border: 1px solid rgba(239,68,68,0.3);
            box-shadow: 0 4px 12px rgba(239,68,68,0.08);
        }
        .btn-dunno:hover { background: linear-gradient(135deg, rgba(239,68,68,0.3), rgba(239,68,68,0.18)); transform: translateY(-3px); box-shadow: 0 8px 20px rgba(239,68,68,0.12); }
        .action-btn:active { transform: scale(0.95) !important; transition-duration: 0.08s; }
        /* 正面状态：评分按钮禁用 */
        .action-btn.btn-disabled {
            opacity: 0.25; cursor: not-allowed;
            transform: none !important;
            filter: grayscale(0.5);
        }
        .action-btn.btn-disabled:hover { transform: none !important; }
        /* 翻面提示按钮（正面时显示） */
        .btn-flip-hint {
            flex: 1; max-width: 320px;
            padding: 14px 20px; border: 1px dashed rgba(255,255,255,0.12);
            border-radius: 14px; background: rgba(255,255,255,0.02);
            color: rgba(255,255,255,0.3); font-size: 14px; font-weight: 500;
            cursor: pointer; transition: all 0.2s;
            font-family: 'Inter', sans-serif;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .btn-flip-hint:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.6); }
        .btn-flip-hint .btn-sub { font-size: 11px; opacity: 0.5; }
        /* 回炉/困难状态芯片 */
        .session-chip {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 2px 8px; border-radius: 10px; font-size: 11px;
            font-weight: 500;
        }
        .session-chip.chip-return {
            background: rgba(239,68,68,0.15); color: #f87171;
            border: 1px solid rgba(239,68,68,0.25);
        }
        .session-chip.chip-fuzzy {
            background: rgba(234,179,8,0.15); color: #facc15;
            border: 1px solid rgba(234,179,8,0.25);
        }
        .session-chip.chip-leech {
            background: rgba(239,68,68,0.25); color: #fca5a5;
            border: 1px solid rgba(239,68,68,0.4);
        }
        .session-chip.chip-confirmed {
            background: rgba(22,163,74,0.15); color: #4ade80;
            border: 1px solid rgba(22,163,74,0.25);
        }
        .session-chip.chip-delayed {
            background: rgba(99,102,241,0.15); color: #a5b4fc;
            border: 1px solid rgba(99,102,241,0.25);
        }
        /* 移动端：固定底部评分按钮 */
        @media (max-width: 600px) {
            .action-btns {
                position: fixed; bottom: 0; left: 0; right: 0;
                z-index: 50; margin-bottom: 0;
                padding: 10px 16px;
                background: rgba(2, 6, 23, 0.92);
                backdrop-filter: blur(16px);
                border-top: 1px solid rgba(255,255,255,0.08);
                gap: 8px;
            }
            .action-btn { padding: 10px 12px; border-radius: 10px; }
            .action-btn .btn-sub { display: none; }
            .kb-hints { display: none; }
            /* 底部留白给固定按钮 */
            .main-container { padding-bottom: 90px; }
        }

        /* ─── 键盘提示 ─── */
        .kb-hints {
            display: flex; justify-content: center; gap: 24px;
            font-size: 11px; color: rgba(255,255,255,0.25);
        }
        .kb-hints kbd {
            display: inline-block; padding: 1px 6px;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px; font-family: 'Inter', monospace; font-size: 11px;
            margin: 0 2px;
        }

        /* ─── 完成提示 ─── */
        .done-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 36px 24px; text-align: center;
            position: relative; overflow: hidden;
        }
        .done-card .done-emoji { font-size: 48px; margin-bottom: 12px; }
        .done-card .done-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
        .done-card .done-sub { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 20px; }
        .done-card .done-stats {
            display: flex; justify-content: center; gap: 20px; margin-bottom: 20px;
        }
        .done-card .stat-item { text-align: center; }
        .done-card .stat-num { font-size: 24px; font-weight: 700; }
        .done-card .stat-label { font-size: 12px; color: rgba(255,255,255,0.4); }
        .stat-num.green { color: #4ade80; }
        .stat-num.yellow { color: #facc15; }
        .stat-num.red { color: #f87171; }
        .done-card .done-meter {
            width: 200px; height: 6px; margin: 0 auto 12px;
            background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden;
        }
        .done-card .done-meter-fill {
            height: 100%; border-radius: 3px;
            transition: width 1s ease;
        }
        .done-card .done-msg {
            font-size: 14px; color: rgba(255,255,255,0.6);
            margin-bottom: 20px; line-height: 1.6;
        }
        /* 撒花粒子 */
        .confetti-container {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            pointer-events: none; overflow: hidden;
        }
        .confetti-piece {
            position: absolute; width: 8px; height: 8px;
            border-radius: 2px; opacity: 0;
            animation: confetti-fall 2.5s ease-out forwards;
        }
        @keyframes confetti-fall {
            0% { opacity: 1; transform: translateY(-20px) rotate(0deg); }
            100% { opacity: 0; transform: translateY(300px) rotate(720deg); }
        }

        .restart-btn {
            padding: 12px 32px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #4F46E5, #6366F1);
            color: #fff; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.25s;
            font-family: 'Inter', sans-serif;
        }
        .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(79,70,229,0.4); }

        /* ─── 加载状态 ─── */
        .loading {
            text-align: center; padding: 80px 24px;
            color: rgba(255,255,255,0.4); font-size: 15px;
        }
        .loading .spinner {
            width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #4F46E5; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── 卡片工具栏 ─── */
        .card-utils {
            display: flex; justify-content: center; align-items: center; gap: 12px;
            margin-bottom: 12px;
        }
        .due-badge {
            font-size: 11px; color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.04);
            padding: 4px 10px; border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            font-variant-numeric: tabular-nums;
        }
        .util-btn {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.35); font-size: 15px;
            width: 34px; height: 34px; border-radius: 10px;
            cursor: pointer; transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex; align-items: center; justify-content: center;
        }
        .util-btn:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; transform: scale(1.05); }
        .util-active { border-color: #facc15; color: #facc15; }
        /* 更多菜单 */
        .more-menu-wrap { position: relative; }
        .more-dropdown {
            position: absolute; bottom: 100%; right: 0;
            margin-bottom: 6px; min-width: 140px;
            background: #0f172a; border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px; padding: 4px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            z-index: 60; display: none;
        }
        .more-dropdown.open { display: block; }
        .more-dropdown button {
            display: flex; align-items: center; gap: 8px;
            width: 100%; padding: 8px 12px; border: none;
            background: none; color: rgba(255,255,255,0.6);
            font-size: 13px; font-family: 'Inter', sans-serif;
            border-radius: 6px; cursor: pointer;
            transition: all 0.15s;
        }
        .more-dropdown button:hover {
            background: rgba(255,255,255,0.08); color: #e2e8f0;
        }

        /* ─── 音频播放按钮 ─── */
        .audio-btn {
            background: none; border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.4); font-size: 16px;
            width: 32px; height: 32px; border-radius: 8px;
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .audio-btn:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
        .audio-btn.playing {
            color: #818cf8; border-color: rgba(129,140,248,0.4);
            animation: pulse-audio 1s infinite;
        }
        @keyframes pulse-audio {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .ex-audio-btn {
            background: none; border: none;
            color: rgba(255,255,255,0.3); font-size: 13px;
            cursor: pointer; padding: 2px 4px;
            transition: color 0.2s; vertical-align: middle;
            margin-left: 6px;
        }
        .ex-audio-btn:hover { color: #a5b4fc; }

        /* ─── 快捷键提示 ─── */
        .kbd-hints {
            display: flex; gap: 12px; justify-content: center;
            margin-top: 8px; flex-wrap: wrap;
        }
        .kbd-hint {
            font-size: 11px; color: rgba(255,255,255,0.25);
            display: inline-flex; align-items: center; gap: 4px;
        }
        .kbd-hint kbd {
            display: inline-block; padding: 1px 5px;
            font-size: 10px; font-family: 'Inter', monospace;
            color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 4px; line-height: 1.4;
        }

        /* ─── 操作按钮子标签 ─── */
        .action-btn .btn-sub {
            font-size: 10px; font-weight: 400; opacity: 0.5;
        }

        /* ─── 响应式 ─── */
        @media (max-width: 480px) {
            .card-word { font-size: 24px; }
            .card-meaning { font-size: 17px; }
            .main-container { padding: 12px 10px 90px; }
            .done-card { padding: 28px 16px; }
            .card-word-back { font-size: 17px; }
            .grammar-table { font-size: 10px; }
            .grammar-table td, .grammar-table th { padding: 2px 4px; }
            .grammar-row { font-size: 11px; }
        }
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .card-face {
                background: rgba(15,23,42,0.92);
                border-color: rgba(255,255,255,0.14);
                box-shadow: 0 18px 56px rgba(2,6,23,0.44);
            }
            .card-face::before,
            .card-face::after { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .vocab-bg-layer,
            .vocab-bg-scrim,
            .card-face::after,
            .flashcard {
                transition: none !important;
                animation: none !important;
            }
            .card-face::after { display: none; }
        }
    </style>
</head>
<body>
    <div class="vocab-bg-layer" id="vocabBgLayer"></div>
    <div class="vocab-bg-scrim" id="vocabBgScrim"></div>
    <!-- 背景光球 -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <!-- 顶部栏 -->
    <!-- 主内容 -->
    <div class="main-container">
        <!-- 模式快捷入口 -->
        <div class="mode-bar" id="modeBar">
            <button class="mode-btn mode-active" data-mode="due" onclick="switchMode('due')">📅 今日待复习</button>
            <button class="mode-btn" data-mode="vocab" onclick="switchMode('vocab')">📖 生词本</button>
            <button class="mode-btn" data-mode="b2" onclick="switchMode('b2')">🇷🇺 B2口语</button>
            <button class="mode-btn" data-mode="freq" onclick="switchMode('freq')">🔥 高频词</button>
            <button class="mode-btn" data-mode="novel" onclick="switchMode('novel')">📖 小说</button>
            <button class="mode-btn" data-mode="wrong" onclick="switchMode('wrong')">❌ 错题本</button>
            <button class="mode-btn" data-mode="fav" onclick="switchMode('fav')">⭐ 收藏</button>
            <button class="mode-btn" data-mode="problems" onclick="switchMode('problems')">🚩 问题卡</button>
            <div class="mode-bar-right">
                <button class="mode-icon-btn" onclick="showSettings()" title="设置">⚙</button>
            </div>
        </div>

        <!-- 筛选栏 -->
        <div class="filter-bar" id="filterBar">
            <input type="text" id="filterSearch" placeholder="🔍 搜索..." oninput="applyFilters()">
            <button class="filter-toggle-btn" id="filterToggleBtn" onclick="toggleFilterDrawer()">
                🔍 筛选 <span id="filterToggleIcon">▾</span>
            </button>
            <button id="btnOnlyWrong" onclick="toggleOnlyWrong()" style="font-size:11px;padding:4px 10px;">❌ 错词</button>
            <button id="btnOnlyUnmastered" onclick="toggleOnlyUnmastered()" style="font-size:11px;padding:4px 10px;">⚠ 未掌握</button>
            <div class="filter-drawer" id="filterSelects">
                <select id="filterSource">
                    <option value="all">全部来源</option>
                    <option value="vocab">📖 生词本</option>
                    <option value="b2">🇷🇺 B2口语</option>
                    <option value="freq">🔥 B2高频词</option>
                    <option value="novel">📖 小说词汇</option>
                </select>
                <select id="filterType">
                    <option value="all">全部词性</option>
                    <option value="noun">名词</option>
                    <option value="verb">动词</option>
                    <option value="adj">形容词</option>
                    <option value="adv">副词</option>
                    <option value="particle">功能词</option>
                </select>
                <select id="filterChapter">
                    <option value="all">全部章节</option>
                </select>
            </div>
        </div>

        <!-- 统计条 -->
        <div class="stats-bar" id="statsBar">
            <span class="stat-pill stat-primary"><span class="pill-label">本轮</span> <span class="pill-val"><span id="currentIdx">0</span>/<span id="sessionTotal">0</span></span></span>
            <span class="stat-pill"><span class="pill-label">已通过</span> <span class="pill-val" id="passedCount">0</span></span>
            <span class="stat-pill"><span class="pill-label">回炉中</span> <span class="pill-val" id="returnCount">0</span></span>
            <span class="stat-pill"><span class="pill-label">困难</span> <span class="pill-val" id="leechCount">0</span></span>
            <span class="stat-pill" style="margin-left:auto;opacity:0.6;"><span class="pill-label">今日</span> <span class="pill-val" id="dailyProgress">0/20</span></span>
        </div>

        <!-- 进度条 -->
        <div class="progress-track">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>

        <!-- 卡片 / 完成 / 加载 -->
        <div id="cardArea">
            <div class="loading">
                <div class="spinner"></div>
                正在加载词库...
            </div>
        </div>
    </div>

    <script>
    // ─── 状态 ─────────────────────────────────────────────────────
    var allWords = [];           // 全部词条
    var filtered = [];           // 筛选后的词条
    var deck = [];               // 本轮主卡组
    var currentPos = 0;          // 主卡组位置
    var flipped = false;         // 是否翻转
    var sessionStats = { know: 0, fuzzy: 0, dunno: 0 };
    var onlyWrong = false;
    var onlyUnmastered = false;

    // ─── 资料坐标系数据 ─────────────────────────────────────────
    var coordLexemeIndex = null;  // lexeme_index.json
    var coordSentences = null;    // sentences.json
    var coordSources = null;      // sources.json
    var showDueOnly = true;      // 默认只显示今日待复习
    var REVIEW_KEY = 'vocabulary-review-records';
    var EXTRAS_KEY = 'vocabulary-extras';
    var SETTINGS_KEY = 'vocabulary-settings';
    var POMODORO_CUSTOM_BG_KEY = 'pomodoro-custom-bgs';
    var VOCAB_BG_OPTIONS = [
        { name: '默认', url: 'default' },
        { name: '风景1', url: 'assets/IMG_20260405_015648.jpg' },
        { name: '风景2', url: 'assets/IMG_20260405_015834.jpg' },
        { name: '风景3', url: 'assets/IMG_20260405_015918.jpg' },
        { name: '风景4', url: 'assets/IMG_20260405_020008.jpg' },
        { name: '风景5', url: 'assets/IMG_20260405_020048.jpg' },
        { name: '风景6', url: 'assets/mmexport1775325437154.jpg' }
    ];
    var newCardsToday = 0;       // 今日已学新卡数
    var currentMode = 'due';     // 当前模式
    var currentModeLabel = '今日待复习'; // 当前模式中文名

    // ─── 当日学习队列（回炉机制）───────────────────────────────
    var seenCount = 0;           // 本轮已展示卡数（含回炉）
    var sessionCards = {};       // id → { id, failCount, fuzzyCount, goodStreak, readyAfterSeen, readyAfterTime, passed }
    var delayedQueue = [];       // 延迟回炉卡队列
    var LEECH_THRESHOLD = 3;     // failCount >= 3 视为困难词

    // ─── 撤销栈（仅保留上一步）──────────────────────────────────
    var _undoSnapshot = null;

    // ─── 加载数据 ──────────────────────────────────────────────────
    function loadVocabulary() {
        loadAudioManifest();
        fetch('data/vocabulary.json')

    function getDailyLimit() {
        var s = getSettings();
        var base = s.dailyLimit || 20;
        // 自适应：根据昨天表现调整
        var adaptive = s.adaptiveLimit;
        if (adaptive && adaptive.date === getYesterdayKey()) {
            return Math.max(5, Math.min(50, adaptive.suggested));
        }
        return base;
    }

    function getYesterdayKey() {
        var d = new Date();
        d.setDate(d.getDate() - 1);
        return d.toISOString().slice(0, 10);

    // 记录今日表现，计算明日建议新词量
    function trackDailyPerformance(know, fuzzy, dunno) {
        var s = getSettings();
        var today = getTodayKey();
        // 累计今日数据
        if (!s.dailyPerf || s.dailyPerf.date !== today) {
            s.dailyPerf = { date: today, correct: 0, total: 0 };
        }
        s.dailyPerf.correct += know + fuzzy * 0.5; // 模糊算半对
        s.dailyPerf.total += know + fuzzy + dunno;
        // 计算建议量
        var rate = s.dailyPerf.total > 0 ? s.dailyPerf.correct / s.dailyPerf.total : 0.7;
        var currentLimit = s.dailyLimit || 20;
        var suggested = currentLimit;
        if (rate >= 0.85) suggested = currentLimit + 3;
        else if (rate < 0.6) suggested = Math.max(5, currentLimit - 3);
        s.adaptiveLimit = { date: today, suggested: Math.min(50, suggested), rate: Math.round(rate * 100) };
        saveSettings(s);
        return { rate: Math.round(rate * 100), suggested: Math.min(50, suggested), change: suggested - currentLimit };
    }

    function getTodayKey() {
        return new Date().toISOString().slice(0, 10);
    }

    function getNewCardsToday() {

        if (s.todayDate !== getTodayKey()) return 0;
        return s.newCardsToday || 0;

    function incNewCardsToday() {
        var s = getSettings();
        if (s.todayDate !== getTodayKey()) {

            s.newCardsToday = 0;
        }
        s.newCardsToday = (s.newCardsToday || 0) + 1;
        saveSettings(s);
    }

    // SM-2 间隔复习算法
    function saveRecord(wordId, rating) {
        var records = getRecords();
        var now = new Date();
        var rec = records[wordId] || { mastery: 1, count: 0, interval: 0, easeFactor: 2.5, nextReview: null };

        rec.count = (rec.count || 0) + 1;
        rec.mastery = rating;
        rec.lastReview = now.toISOString();

        // SM-2: rating 1=不认识, 3=模糊, 5=认识
        if (rating < 3) {
            // 不认识：明天再复习
            rec.interval = 1;
            rec.easeFactor = Math.max(1.3, rec.easeFactor - 0.2);
        } else {
            // 认识/模糊：拉长间隔
            if (rec.interval === 0) {
                rec.interval = 1;
            } else if (rec.interval === 1) {
                rec.interval = rating >= 5 ? 3 : 2;
            } else {
                var ef = rec.easeFactor;
                ef = ef + (0.1 - (5 - rating) * (0.08 + (5 - rating) * 0.02));
                rec.easeFactor = Math.max(1.3, ef);
                rec.interval = Math.round(rec.interval * rec.easeFactor);
            }
        }

        // 计算下次复习时间
        var next = new Date(now);
        next.setDate(next.getDate() + rec.interval);
        rec.nextReview = next.toISOString();

        records[wordId] = rec;
        localStorage.setItem(REVIEW_KEY, JSON.stringify(records));
    }

        if (sc.skippedAsLeech) {

        }
        if (sc.failCount >= LEECH_THRESHOLD) {

        if (sc.passed && (sc.failCount > 0 || sc.fuzzyCount > 0)) {

    function applyFilters() {
        var src = document.getElementById('filterSource').value;
        var type = document.getElementById('filterType').value;
        var chapter = document.getElementById('filterChapter').value;
        var search = (document.getElementById('filterSearch').value || '').trim().toLowerCase();
        var extras = getExtras();

        filtered = allWords.filter(function(w) {
            if (src !== 'all' && w.source !== src) return false;
            if (type !== 'all' && w.type !== type) return false;
            if (chapter !== 'all' && (w.chapter || w.theme) !== chapter) return false;
            // 文本搜索
            if (search) {
                var inWord = (w.word || '').toLowerCase().indexOf(search) >= 0;
                var inMeaning = (w.meaning || '').toLowerCase().indexOf(search) >= 0;
                if (!inWord && !inMeaning) return false;
            }
            // 跳过已标记跳过的卡片
            if (extras.skip.indexOf(w.id) >= 0) return false;
            // 跳过已标记问题的卡片
            if (extras.report.indexOf(w.id) >= 0) return false;
            if (showDueOnly) {
                if (!isDue(w)) return false;
            }
            if (onlyWrong) {
                var m = getWordMastery(w);
                if (m >= 3) return false;
            }
            if (onlyUnmastered) {
                var m2 = getWordMastery(w);
                if (m2 >= 5) return false;
            }
            return true;
        });

    // 重音测验：生成选项
    function generateStressOptions(stressedWord) {
        var clean = stressedWord.replace(/[́]/g, '');
        // 找到重音位置（在哪个元音上）
        var vowels = 'аеёиоуыэюя';
        var vowelPositions = [];
        for (var i = 0; i < clean.length; i++) {
            if (vowels.indexOf(clean[i].toLowerCase()) >= 0) vowelPositions.push(i);
        }
        if (vowelPositions.length <= 1) {
            return [{ text: clean, correct: true }];
        }
        // 找到正确的重音位置
        var stressPos = -1;
        var charIdx = 0;
        for (var i = 0; i < stressedWord.length; i++) {
            if (stressedWord.charCodeAt(i) === 0x301) { // combining acute
                stressPos = charIdx - 1;
                break;
            }
            charIdx++;
        }
        // 生成选项：正确位置 + 随机选择其他元音位置
        var options = [];
        var usedPositions = new Set();
        // 添加正确选项
        if (stressPos >= 0) {
            var syl = getStressSyllable(clean, stressPos);
            options.push({ text: syl, correct: true });
            usedPositions.add(stressPos);
        }
        // 添加2个干扰选项
        var shuffled = vowelPositions.slice().sort(function() { return Math.random() - 0.5; });
        for (var i = 0; i < shuffled.length && options.length < 3; i++) {
            if (!usedPositions.has(shuffled[i])) {
                var syl = getStressSyllable(clean, shuffled[i]);
                options.push({ text: syl, correct: false });
                usedPositions.add(shuffled[i]);
            }
        }
        // 打乱顺序
        return options.sort(function() { return Math.random() - 0.5; });
    }

    function getStressSyllable(word, vowelPos) {
        // 显示包含该元音的音节（简化：取元音前后各1-2个字符）
        var start = Math.max(0, vowelPos - 2);
        var end = Math.min(word.length, vowelPos + 3);
        var before = word.slice(start, vowelPos);
        var vowel = word[vowelPos];
        var after = word.slice(vowelPos + 1, end);
        // 加上重音标记
        return before + vowel + '́' + after;
    }

    // 词根拆解格式化
    function formatMorphology(m) {
        if (!m) return '';
        var parts = m.split('-');
        if (parts.length <= 1) return '<span class="morph-root">' + esc(m) + '</span>';
        var html = '';
        // 通常：前缀-词根-后缀-词尾
        if (parts.length === 2) {
            html = '<span class="morph-root">' + esc(parts[0]) + '</span>' +
                   '<span class="morph-suffix">' + esc(parts[1]) + '</span>';
        } else if (parts.length === 3) {
            html = '<span class="morph-prefix">' + esc(parts[0]) + '</span>' +
                   '<span class="morph-root">' + esc(parts[1]) + '</span>' +
                   '<span class="morph-ending">' + esc(parts[2]) + '</span>';
        } else {
            // 第一个可能是前缀，最后可能是词尾，中间是词根+后缀
            html = '<span class="morph-prefix">' + esc(parts[0]) + '</span>';
            for (var i = 1; i < parts.length - 1; i++) {
                html += '<span class="morph-root">' + esc(parts[i]) + '</span>';
            }
            html += '<span class="morph-ending">' + esc(parts[parts.length - 1]) + '</span>';
        }
        return html;
    }

    // 动态调整卡片高度，防止内容溢出与下方元素重叠
    function adjustCardHeight() {
        requestAnimationFrame(function() {
            var card = document.getElementById('flashcard');
            if (!card) return;
            var front = card.querySelector('.card-front');
            var back = card.querySelector('.card-back');
            if (!front || !back) return;
            // 分别测量每个面的高度
            var origPosF = front.style.position;
            var origPosB = back.style.position;
            front.style.position = 'relative'; back.style.display = 'none';
            var fh = front.scrollHeight;
            front.style.position = origPosF || 'absolute'; back.style.display = '';
            back.style.position = 'relative'; front.style.display = 'none';
            var bh = back.scrollHeight;
            back.style.position = origPosB || 'absolute'; front.style.display = '';
            var h = Math.max(fh, bh, 340);
            card.style.minHeight = h + 'px';
        });
    }

    function importProgress(input) {
        var file = input.files[0];

        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                var data = JSON.parse(e.target.result);
                if (!data.records) { alert('格式错误：缺少 records 字段'); return; }
                if (!confirm('导入将覆盖当前进度，确定？')) return;
                localStorage.setItem(REVIEW_KEY, JSON.stringify(data.records));
                if (data.extras) localStorage.setItem(EXTRAS_KEY, JSON.stringify(data.extras));
                if (data.settings) localStorage.setItem(SETTINGS_KEY, JSON.stringify(data.settings));
                alert('导入成功！共 ' + Object.keys(data.records).length + ' 条记录');
                // 导入也算备份操作
                var s2 = getSettings();
                s2.lastExportAt = new Date().toISOString();
                saveSettings(s2);
                document.querySelector('.modal-overlay').remove();
                applyFilters();
            } catch(err) {

        };
        reader.readAsText(file);

    }

    // ─── 卡组管理 ─────────────────────────────────────────────────
    function startNewDeck() {
        var limit = getDailyLimit();
        var todayCount = getNewCardsToday();

        // 分离：到期复习卡 vs 新卡
        var records = getRecords();
        var dueCards = [];
        var newCards = [];
        filtered.forEach(function(w) {
            var rec = records[w.id];
            if (rec && rec.nextReview && new Date(rec.nextReview) <= new Date()) {
                dueCards.push(w); // 到期复习
            } else if (!rec) {
                newCards.push(w); // 从未见过的新卡
            } else {
                dueCards.push(w); // 其他（已复习但未到期的，在 showDueOnly 模式已被过滤）
            }
        });

        // 复习卡优先，新卡受限
        var remainingNew = Math.max(0, limit - todayCount);
        if (showDueOnly) {
            var allowedNew = newCards.slice(0, remainingNew);
            deck = dueCards.concat(allowedNew);
        } else {
            deck = dueCards.concat(newCards);
        }

        shuffle(deck);
        // 交错排序：混合难/中/易卡，避免连续同难度
        deck = interleaveDeck(deck);
        currentPos = 0;
        flipped = false;
        seenCount = 0;
        sessionCards = {};
        delayedQueue = [];
        sessionStats = { know: 0, fuzzy: 0, dunno: 0 };

        // 更新统计显示
        var totalNew = showDueOnly ? Math.min(newCards.length, remainingNew) : newCards.length;
        document.getElementById('dailyProgress').textContent = todayCount + '/' + limit;

        renderCard();
        // 通知父页面：背词会话开始
        postToParent({ type: 'VOCAB_SESSION_START', mode: currentMode, modeLabel: currentModeLabel, total: deck.length, passed: 0, delayed: 0, difficult: 0 });
    }

    function shuffle(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
        }
    }

    function interleaveDeck(arr) {
        if (arr.length <= 3) return arr;
        var hard = [], medium = [], easy = [];
        arr.forEach(function(w) {
            var m = getWordMastery(w);
            if (m < 3) hard.push(w);
            else if (m < 5) medium.push(w);
            else easy.push(w);
        });
        var result = [], buckets = [hard, medium, easy], i = 0;
        while (buckets.some(function(b) { return b.length > 0; })) {
            var b = buckets[i % 3];
            if (b.length > 0) result.push(b.shift());
            i++;
        }
        return result;
    }

    // ─── 取下一张卡（回炉优先）──────────────────────────────────
    function getNextCard() {
        // 1. 优先取到期回炉卡
        for (var i = 0; i < delayedQueue.length; i++) {
            var sc = delayedQueue[i];
            if (!sc.passed && isDelayedReady(sc)) {
                delayedQueue.splice(i, 1);
                seenCount++;
                return sc;
            }
        }
        // 2. 主队列下一张
        while (currentPos < deck.length) {
            var w = deck[currentPos];
            currentPos++;
            var sc2 = getOrCreateSessionCard(w.id);
            if (!sc2.passed) { seenCount++; return sc2; }
        }
        // 3. 主队列空了，取最早到期的回炉卡
        for (var j = 0; j < delayedQueue.length; j++) {
            if (!delayedQueue[j].passed) { seenCount++; return delayedQueue.splice(j, 1)[0]; }
        }
        // 4. 全部完成
        return null;
    }

    // ─── 资料坐标系查询 ─────────────────────────────────────────
    // 从文本中提取俄语 token（拆分短语为单词）
    function _extractRuTokens(text) {
        if (!text) return [];
        var tokens = [];
        // 匹配连续俄语字母（包括连字符分隔的复合词）
        var raw = text.match(/[а-яА-ЯёЁ]+(?:-[а-яА-ЯёЁ]+)*/g);
        if (raw) {
            raw.forEach(function(t) {
                var lw = t.toLowerCase();
                if (lw.length > 1) {
                    tokens.push(lw);
                    // 连字符复合词拆开也加入
                    if (lw.indexOf('-') >= 0) {
                        lw.split('-').forEach(function(part) {
                            if (part.length > 1 && tokens.indexOf(part) < 0) tokens.push(part);
                        });
                    }
                }
            });
        }
        return tokens;
    }

    var SOURCE_EXAMPLE_STOPWORDS = {
        'не': 1, 'ни': 1, 'что': 1, 'как': 1, 'это': 1, 'если': 1, 'или': 1,
        'уже': 1, 'для': 1, 'при': 1, 'без': 1, 'под': 1, 'над': 1, 'через': 1,
        'до': 1, 'от': 1, 'из': 1, 'по': 1, 'об': 1, 'со': 1, 'во': 1, 'ко': 1,
        'ли': 1, 'же': 1, 'бы': 1, 'то': 1, 'мы': 1, 'вы': 1, 'он': 1, 'она': 1,
        'они': 1, 'оно': 1, 'его': 1, 'ее': 1, 'её': 1, 'их': 1
    };

    // 候选词去重添加。过滤高频虚词，避免短语卡片被无关资料例句污染。
    function _addCandidate(list, word) {
        if (!word) return;
        var normalized = word.toLowerCase();
        if (normalized.length <= 2) return;
        if (SOURCE_EXAMPLE_STOPWORDS[normalized]) return;
        if (list.indexOf(normalized) < 0) list.push(normalized);
    }

    function lookupSourceExamples(word) {
        if (!coordLexemeIndex || !coordSentences || !coordSources) return [];
        if (!word) return [];

        // 构建 source 查找表
        var sourceMap = {};
        coordSources.forEach(function(s) { sourceMap[s.source_id] = s; });

        // 构建 sentence 查找表
        var sentenceMap = {};
        coordSentences.forEach(function(s) { sentenceMap[s.sentence_id] = s; });

        var candidates = [];

        // 1. 主查询词的俄语 token
        _extractRuTokens(word).forEach(function(t) { _addCandidate(candidates, t); });

        // 2. 当前词条的核心检索字段
        // 只使用词条本身和体对偶。不要从释义或自带例句里抽词，
        // 否则会把例句中的普通词误当成当前卡片的资料例句匹配词。
        var w = _currentWord;
        if (w) {
            if (w.word) {
                _extractRuTokens(w.word).forEach(function(t) { _addCandidate(candidates, t); });
            }
            if (w.pair) {
                _extractRuTokens(w.pair).forEach(function(t) { _addCandidate(candidates, t); });
            }
        }

        var foundSentenceIds = {};
        var results = [];
        var sourceCount = {};

        for (var ci = 0; ci < candidates.length; ci++) {
            var entry = coordLexemeIndex[candidates[ci]];
            if (!entry) continue;

            for (var si = 0; si < entry.sentence_ids.length; si++) {
                var sid = entry.sentence_ids[si];
                if (foundSentenceIds[sid]) continue;
                foundSentenceIds[sid] = true;

                var sentence = sentenceMap[sid];
                if (!sentence) continue;

                // 筛选: 必须已翻译
                if (sentence.translation_status !== 'translated') continue;
                if (!sentence.zh || !sentence.zh.trim()) continue;

                // 筛选: 必须 eligible
                if (!sentence.vocabulary_card_eligible) continue;

                // 筛选: 只要 natural_sentence / grammar_example / real_source
                var et = sentence.example_type;
                if (et !== 'natural_sentence' && et !== 'grammar_example' && et !== 'real_source') continue;

                // 每个 source 最多 2 条
                var srcId = sentence.source_id;
                if (!sourceCount[srcId]) sourceCount[srcId] = 0;
                if (sourceCount[srcId] >= 2) continue;
                sourceCount[srcId]++;

                var source = sourceMap[srcId] || null;

                results.push({
                    sentence: sentence,
                    source: source,
                    matchedVia: candidates[ci]
                });
            }
        }

        // 排序: display_priority 高的在前, real_source/natural_sentence 优先, quality_score 高的在前
        results.sort(function(a, b) {
            var sa = a.sentence, sb = b.sentence;
            // 1. display_priority
            var pa = sa.display_priority || 0, pb = sb.display_priority || 0;
            if (pa !== pb) return pb - pa;
            // 2. real_source > natural_sentence > grammar_example
            var typePriority = { real_source: 2, natural_sentence: 1, grammar_example: 0 };
            var ta = typePriority[sa.example_type] || 0;
            var tb = typePriority[sb.example_type] || 0;
            if (ta !== tb) return tb - ta;
            // 3. quality_score
            var qa = sa.quality_score || 0, qb = sb.quality_score || 0;
            return qb - qa;
        });

        return results.slice(0, 3);
    }

    function renderSourceExamples(word) {
        var matches = lookupSourceExamples(word);
        var html = '<div class="source-examples-section" id="sourceExamplesMount">';
        html += '<div class="source-examples-title">📚 资料真实例句</div>';

        if (matches.length === 0) {
            html += '<div class="source-examples-empty">暂无资料例句</div>';
        } else {
            for (var i = 0; i < matches.length; i++) {
                var m = matches[i];
                var s = m.sentence;
                var src = m.source;
                var typeLabel = s.example_type === 'natural_sentence' ? '自然例句' : '语法例句';
                // Add source label emoji
                var srcLabel = (window._sourceLabels && src) ? (window._sourceLabels[s.source_id] || '') : '';
                html += '<div class="source-ex-item">';
                html += '<div class="source-ex-ru">' + esc(s.ru) + '</div>';
                html += '<div class="source-ex-zh">' + esc(s.zh) + '</div>';
                html += '<div class="source-ex-meta">';
                if (src) html += '<span class="source-ex-source">' + esc(srcLabel + ' ' + src.source_title) + '</span>';
                if (s.page_or_location) html += '<span class="source-ex-page">第' + esc(String(s.page_or_location)) + '页</span>';
                html += '<span class="source-ex-type">' + esc(typeLabel) + '</span>';
                html += '</div>';
                html += '</div>';
            }
        }

        html += '</div>';
        return html;
    }

    // 只刷新资料例例句区域，不触发 renderCard / getNextCard / 跳卡
    function refreshSourceExamplesOnly() {
        if (!_currentWord) return;

        if (!mount) return;
        mount.outerHTML = renderSourceExamples(_currentWord.word);

    // ─── 开发/验收用测试函数（仅控制台调用） ─────────────────────
    window.__testSourceExamples = function(word) {
        if (!coordLexemeIndex || !coordSentences || !coordSources) {
            return { error: '坐标系数据尚未加载' };
        }
        var matches = lookupSourceExamples(word);
        return matches.map(function(m) {
            return {
                sentence_id: m.sentence.sentence_id,
                ru: m.sentence.ru,
                zh: m.sentence.zh,
                source: m.source ? m.source.source_title : '',
                page: m.sentence.page_or_location,
                needs_review: m.sentence.needs_review,
                matchedVia: m.matchedVia
            };
        });
    };

    // ─── 渲染 ─────────────────────────────────────────────────────
    function renderCard() {
        var area = document.getElementById('cardArea');

        if (deck.length === 0) {
            area.innerHTML = '<div class="done-card"><div class="done-emoji">📭</div>' +
                '<div class="done-title">没有符合条件的词条</div>' +
                '<div class="done-sub">请调整筛选条件</div></div>';
            updateStats();
            return;
        }

        var sc = getNextCard();
        if (!sc) {
            renderDone();
            return;
        }

        // 找到对应的 word
        var w = allWords.find(function(x) { return x.id === sc.id; });
        if (!w) { renderCard(); return; } // 安全跳过

        _currentSessionCard = sc;
        _currentWord = w;
        var m = getWordMastery(w);
        var typeLabel = w.type ? w.type : '';
        var chapterLabel = w.chapter || w.theme || '';
        var metaTags = '';

        if (typeLabel) { metaTags += '<span class="tag">' + esc(typeLabel) + '</span>'; tagCount++; }
        if (chapterLabel && tagCount < 2) { metaTags += '<span class="tag">' + esc(chapterLabel) + '</span>'; tagCount++; }
        if (w.source === 'b2' && tagCount < 2) { metaTags += '<span class="tag">B2口语</span>'; tagCount++; }
        if (w.source === 'freq' && tagCount < 2) { metaTags += '<span class="tag">高频词</span>'; tagCount++; }
        if (w.source === 'novel' && tagCount < 2) {
          var novelSrc = w.extra ? w.extra.replace('来源: ', '') : '小说';
          metaTags += '<span class="tag">📖 ' + esc(novelSrc) + '</span>'; tagCount++;
        }

        // 掌握度星星
        var rec2 = getRecords()[w.id];
        var mLevel = rec2 ? (rec2.mastery || 0) : 0;
        var stars = '';
        for (var si = 0; si < 5; si++) {
            stars += si < mLevel ? '★' : '☆';
        }

        // 背面内容
        var backContent = '<div class="card-word-back">' + esc(w.word) + '</div>';
        backContent += '<div class="card-meaning">' + esc(w.meaning) + '</div>';
        backContent += '<div class="card-stars">' + stars + '</div>';

        // 标签行：体/体对偶/性别
        var tagLine = '';
        if (w.aspect) tagLine += '<span class="grammar-tag">' + esc(w.aspect) + '</span>';
        if (w.pair) tagLine += '<span class="grammar-tag">体对: ' + esc(w.pair) + '</span>';
        if (w.gender) tagLine += '<span class="grammar-tag">' + esc(w.gender) + '</span>';

        // 词根拆解

            backContent += '<div class="morphology-display">' + formatMorphology(w.morphology) + '</div>';
        }

        if (w.extra) backContent += '<div class="card-extra">' + esc(w.extra) + '</div>';

        // 语法面板（可折叠）
        var hasRealTable = w.grammarTable && w.grammarTable.indexOf('|') >= 0;
        var hasGrammarNote = w.grammarTable && w.grammarTable.indexOf('|') < 0 && w.grammarTable.length > 2;
        var hasGrammar = w.case_gov || w.conj_pattern || hasRealTable;
        if (hasGrammar) {
            backContent += '<div class="grammar-panel">';
            backContent += '<div class="grammar-toggle" onclick="toggleGrammar(this, event)">📐 语法信息 <span class="grammar-arrow">▾</span></div>';
            backContent += '<div class="grammar-content">';
            if (w.case_gov) backContent += '<div class="grammar-row"><span class="grammar-label">接格</span><span class="grammar-val">' + esc(w.case_gov) + '</span></div>';
            if (w.conj_pattern) backContent += '<div class="grammar-row"><span class="grammar-label">变位</span><span class="grammar-val">' + esc(w.conj_pattern) + '</span></div>';
            if (hasRealTable) {
                // 将 markdown 表格转为 HTML
                var rows = w.grammarTable.split('\n').filter(function(l) { return l.trim(); });
                if (rows.length >= 2) {
                    var headers = rows[0].split('|').filter(function(c) { return c.trim(); }).map(function(c) { return c.trim(); });
                    backContent += '<table class="grammar-table"><thead><tr>';
                    headers.forEach(function(h) { backContent += '<th>' + esc(h) + '</th>'; });
                    backContent += '</tr></thead><tbody>';
                    for (var ri = 2; ri < rows.length; ri++) {
                        var cells = rows[ri].split('|').filter(function(c) { return c.trim(); }).map(function(c) { return c.trim(); });
                        if (cells.length > 0) {
                            backContent += '<tr>';
                            cells.forEach(function(c) { backContent += '<td>' + esc(c) + '</td>'; });
                            backContent += '</tr>';
                        }
                    }
                    backContent += '</tbody></table>';
                }

        } else if (hasGrammarNote) {

            backContent += '<div class="grammar-row"><span class="grammar-label">📐</span><span class="grammar-val">' + esc(w.grammarTable) + '</span></div>';
        }

        // 例句
        var exHtml = '';
        if (w.examples && w.examples.length > 0) {
            w.examples.forEach(function(ex, exIdx) {
                if (ex.ru || ex.zh) {
                    exHtml += '<div class="ex-item">';
                    if (ex.ru) exHtml += '<div class="ex-ru">' + esc(ex.ru) +

                        '</div>';
                    if (ex.zh) exHtml += '<div class="ex-zh">' + esc(ex.zh) + '</div>';
                    exHtml += '</div>';

        if (exHtml) backContent += '<div class="card-examples">' + exHtml + '</div>';

        var dueInfo = '';
        if (rec && rec.nextReview) {

    function renderDone() {
        var total = sessionStats.know + sessionStats.fuzzy + sessionStats.dunno;
        var knowPct = total > 0 ? Math.round(sessionStats.know / total * 100) : 0;
        var passedCount = getPassedCount();
        var leechCount = getLeechCountInSession();
        var returnedCount = 0;
        for (var id in sessionCards) {
            if (sessionCards[id].failCount > 0 && sessionCards[id].passed) returnedCount++;
        }
        var area = document.getElementById('cardArea');

        // 自适应学习量
        var adaptive = trackDailyPerformance(sessionStats.know, sessionStats.fuzzy, sessionStats.dunno);

        // 动态鼓励语
        var msg = '';
        if (knowPct >= 90) msg = '🌟 太棒了！几乎全对，继续保持！';
        else if (knowPct >= 70) msg = '💪 不错哦！大部分都掌握了～';
        else if (knowPct >= 50) msg = '📖 有进步！模糊的词会自动安排复习。';
        else msg = '🔄 别灰心，不认识的词明天会再出现。';

        // 自适应提示
        var adaptiveMsg = '';
        if (adaptive.change > 0) adaptiveMsg = '📈 表现优秀！明天新词已调整为 ' + adaptive.suggested + ' 个（+' + adaptive.change + '）';
        else if (adaptive.change < 0) adaptiveMsg = '📉 今天有点吃力，明天新词已调整为 ' + adaptive.suggested + ' 个（' + adaptive.change + '），稳扎稳打～';
        else adaptiveMsg = '📊 今日正确率 ' + adaptive.rate + '%，明天新词保持 ' + adaptive.suggested + ' 个';

        // 进度条颜色
        var meterColor = knowPct >= 70 ? '#4ade80' : knowPct >= 50 ? '#facc15' : '#f87171';

        // 明日预计复习量
        var records = getRecords();
        var tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        var tomorrowKey = tomorrow.toISOString().slice(0, 10);
        var tomorrowDue = 0;
        for (var rid in records) {
            if (records[rid].nextReview && records[rid].nextReview.slice(0, 10) === tomorrowKey) tomorrowDue++;
        }

        // 今日统计
        var todayCount = getNewCardsToday();
        var limit = getDailyLimit();

        area.innerHTML =
            '<div class="done-card" id="doneCard">' +
            '  <div class="confetti-container" id="confettiBox"></div>' +
            '  <div class="done-emoji">🎉</div>' +
            '  <div class="done-title">本轮复习完成！</div>' +
            '  <div class="done-sub">共复习 ' + total + ' 个词条</div>' +
            '  <div class="done-stats">' +
            '    <div class="stat-item"><div class="stat-num green">' + passedCount + '</div><div class="stat-label">通过</div></div>' +
            '    <div class="stat-item"><div class="stat-num yellow">' + returnedCount + '</div><div class="stat-label">回炉后通过</div></div>' +
            '    <div class="stat-item"><div class="stat-num red">' + leechCount + '</div><div class="stat-label">困难词</div></div>' +
            '  </div>' +
            '  <div class="done-meter"><div class="done-meter-fill" id="doneMeterFill" style="width:0%;background:' + meterColor + ';"></div></div>' +
            '  <div style="margin-bottom:8px;font-size:14px;color:rgba(255,255,255,0.5);">掌握率 ' + knowPct + '%</div>' +
            '  <div class="done-msg">' + msg + '</div>' +
            '  <div style="margin-bottom:8px;font-size:13px;color:rgba(255,255,255,0.35);">今日已学 ' + todayCount + '/' + limit + ' 新卡</div>' +
            '  <div style="margin-bottom:6px;font-size:13px;color:#a5b4fc;">📅 明日预计复习 +' + tomorrowDue + ' 张</div>' +
            '  <div style="margin-bottom:20px;font-size:12px;color:rgba(255,255,255,0.4);">' + adaptiveMsg + '</div>' +
            '  <button class="restart-btn" onclick="startNewDeck()">🔄 再来一轮</button>' +
            '</div>';

        // 动画：进度条填充
        setTimeout(function() {
            var fill = document.getElementById('doneMeterFill');
            if (fill) fill.style.width = knowPct + '%';

        // 动画：撒花
        if (knowPct >= 50) spawnConfetti();

        updateStats();

        postToParent({ type: 'VOCAB_SESSION_DONE', total: total, passed: passedCount, delayedPassed: returnedCount, difficult: leechCount });

    function spawnConfetti() {

        for (var i = 0; i < 30; i++) {
            var piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = Math.random() * 100 + '%';
            piece.style.top = '-10px';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];

    function updateStats() {
        var total = sessionStats.know + sessionStats.fuzzy + sessionStats.dunno;
        var knowPct = total > 0 ? Math.round(sessionStats.know / total * 100) : 0;
        var passed = getPassedCount();
        var leech = getLeechCountInSession();
        var delayed = getDelayedCount();
        // 本轮进度 = 已通过 / 总卡数（含回炉延迟）
        var totalCards = deck.length + delayed;
        var processed = passed + leech + (total > 0 ? (total - passed) : 0);
        document.getElementById('currentIdx').textContent = Math.min(seenCount, totalCards || deck.length);
        document.getElementById('sessionTotal').textContent = totalCards || deck.length;
        document.getElementById('passedCount').textContent = passed;
        document.getElementById('returnCount').textContent = delayed;
        document.getElementById('leechCount').textContent = leech;
        var pct = deck.length > 0 ? Math.round(currentPos / deck.length * 100) : 0;
        document.getElementById('progressFill').style.width = Math.min(pct, 100) + '%';
