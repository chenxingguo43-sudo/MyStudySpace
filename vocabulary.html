    function getDailyLimit() {
        var s = getSettings();
        var base = s.dailyLimit || 20;
        // 硬上限：防止误设超大值
        base = Math.min(base, 50);
        // 自适应：根据昨天表现调整
        var adaptive = s.adaptiveLimit;
        if (adaptive && adaptive.date === getYesterdayKey()) {
            return Math.max(5, Math.min(50, adaptive.suggested));
        }
        return base;
    }

    function getYesterdayKey() {
        var d = new Date();
        d.setDate(d.getDate() - 1);
        return VocabularySessionScheduler.getLocalDateKey(d);
    }

    // 记录今日表现，计算明日建议新词量
    function trackDailyPerformance(know, fuzzy, dunno) {
        var s = getSettings();
        var today = getTodayKey();
        // 累计今日数据
        if (!s.dailyPerf || s.dailyPerf.date !== today) {
            s.dailyPerf = { date: today, correct: 0, total: 0 };
        }
        s.dailyPerf.correct += know + fuzzy * 0.5; // 模糊算半对
        s.dailyPerf.total += know + fuzzy + dunno;
        // 计算建议量
        var rate = s.dailyPerf.total > 0 ? s.dailyPerf.correct / s.dailyPerf.total : 0.7;
        var currentLimit = s.dailyLimit || 20;
        var suggested = currentLimit;
        if (rate >= 0.85) suggested = currentLimit + 3;
        else if (rate < 0.6) suggested = Math.max(5, currentLimit - 3);
        s.adaptiveLimit = { date: today, suggested: Math.min(50, suggested), rate: Math.round(rate * 100) };
        saveSettings(s);
        return { rate: Math.round(rate * 100), suggested: Math.min(50, suggested), change: suggested - currentLimit };
    }

    function getTodayKey() {
        return VocabularySessionScheduler.getLocalDateKey(new Date());
    }

    function getNewCardsToday() {
        var s = getSettings();
        if (s.todayDate !== getTodayKey()) return 0;
        return s.newCardsToday || 0;
    }

    function incNewCardsToday() {
        var s = getSettings();
        if (s.todayDate !== getTodayKey()) {
            s.todayDate = getTodayKey();
            s.newCardsToday = 0;
        }
        s.newCardsToday = (s.newCardsToday || 0) + 1;
        saveSettings(s);
    }

    // SM-2 间隔复习算法
    function saveRecord(wordId, rating, options) {
        var records = getRecords();
        var numericRating = typeof rating === 'number' ? rating : 1;
        var schedulerRating = numericRating < 3 ? 'unknown' : (numericRating < 5 ? 'fuzzy' : 'known');
        var rec = VocabularySessionScheduler.scheduleLongTerm(records[wordId], schedulerRating, Object.assign({
            today: getTodayKey()
        }, options || {}));
        rec.count = (records[wordId] && records[wordId].count || 0) + 1;
        records[wordId] = rec;
        return saveRecords(records);
    }

    // ─── 当日学习队列管理 ────────────────────────────────────────
    function getOrCreateSessionCard(wordId) {
        if (!sessionCards[wordId]) {
            sessionCards[wordId] = {
                id: wordId,
                failCount: 0,
                fuzzyCount: 0,
                goodStreak: 0,
                readyAfterSeen: 0,
                readyAfterTime: 0,
                passed: false,
                skippedAsLeech: false
            };
        }
        return sessionCards[wordId];
    }

    function isDelayedReady(sc) {
        if (!sc) return false;
        var seenReady = seenCount >= sc.readyAfterSeen;
        var timeReady = Date.now() >= sc.readyAfterTime;
        return seenReady || timeReady;
    }

    function getDelayedCount() {
        var count = 0;
        delayedQueue.forEach(function(sc) {
            if (!sc.passed && !sc.excluded) count++;
        });
        return count;
    }

    function getActiveDelayedCount() {
        var count = 0;
        delayedQueue.forEach(function(sc) {
            if (!sc.passed && !sc.excluded && isDelayedReady(sc)) count++;
        });
        return count;
    }

    function getPassedCount() {
        var count = 0;
        for (var id in sessionCards) {
            if (sessionCards[id].passed && !sessionCards[id].excluded) count++;
        }
        return count;
    }

    function getLeechCountInSession() {
        var count = 0;
        for (var id in sessionCards) {
            if (sessionCards[id].skippedAsLeech && !sessionCards[id].passed && !sessionCards[id].excluded) count++;
        }
        return count;
    }

    function isSessionLeech(wordId) {
        return sessionCards[wordId] && sessionCards[wordId].failCount >= LEECH_THRESHOLD;
    }

    function getSessionChipHtml(sc) {
        if (!sc) return '';
        if (sc.skippedAsLeech) {
            return '<span class="session-chip chip-leech">💀 困难词（本轮跳过）</span>';
        }
        if (sc.failCount >= LEECH_THRESHOLD) {
            return '<span class="session-chip chip-leech">💀 困难词</span>';
        }
        if (sc.passed && (sc.failCount > 0 || sc.fuzzyCount > 0)) {
            return '<span class="session-chip chip-confirmed">✅ 回炉后通过</span>';
        }
        if (sc.failCount > 0) {
            return '<span class="session-chip chip-return">🔄 回炉第' + sc.failCount + '次</span>';
        }
        if (sc.fuzzyCount > 0) {
            return '<span class="session-chip chip-fuzzy">⚠ 模糊' + sc.fuzzyCount + '次</span>';
        }
        return '<span class="session-chip" style="background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.35);border:1px solid rgba(255,255,255,0.08);">🆕 新卡</span>';
    }

    // ─── 筛选 ─────────────────────────────────────────────────────
    function initFilters() {
        // 填充章节下拉
        var chapters = {};
        allWords.forEach(function(w) {
            var ch = w.chapter || w.theme || '';
            if (ch) chapters[ch] = true;
        });
        var sel = document.getElementById('filterChapter');
        Object.keys(chapters).sort().forEach(function(ch) {
            var opt = document.createElement('option');
            opt.value = ch; opt.textContent = ch;
            sel.appendChild(opt);
        });
    }

    function applyFilters() {
        var src = document.getElementById('filterSource').value;
        var type = document.getElementById('filterType').value;
        var chapter = document.getElementById('filterChapter').value;
        var search = (document.getElementById('filterSearch').value || '').trim().toLowerCase();
        var extras = getExtras();

        filtered = allWords.filter(function(w) {
            if (savedOnly && !w._saved) return false;
            if (src !== 'all' && w.source !== src) return false;
            if (type !== 'all') {
                var wordType = VocabularySessionScheduler.normalizePartOfSpeech(w.type);
                var selectedType = VocabularySessionScheduler.normalizePartOfSpeech(type);
                if (selectedType === 'function') {
                    if (!VocabularySessionScheduler.isFunctionWord(wordType)) return false;
                } else if (wordType !== selectedType) {
                    return false;
                }
            }
            if (chapter !== 'all' && (w.chapter || w.theme) !== chapter) return false;
            // 文本搜索
            if (search) {
                var inWord = (w.word || '').toLowerCase().indexOf(search) >= 0;
                var inMeaning = (w.meaning || '').toLowerCase().indexOf(search) >= 0;
                if (!inWord && !inMeaning) return false;
            }
            // 跳过已标记跳过的卡片
            if (extras.skip.indexOf(w.id) >= 0) return false;
            // 跳过已标记问题的卡片
            if (extras.report.indexOf(w.id) >= 0) return false;
            if (showDueOnly) {
                if (!isDue(w)) return false;
            }
            if (onlyWrong) {
                var m = getWordMastery(w);
                if (m >= 3) return false;
            }
            if (onlyUnmastered) {
                var m2 = getWordMastery(w);
                if (m2 >= 5) return false;
            }
            return true;
        });

        if (currentMode === 'brush') {
            brushSessionKind = 'scan';
            initBrushDeck();
        } else {
            startNewDeck();
        }
    }

    // 重音测验：生成选项
    function generateStressOptions(stressedWord) {
        var clean = stressedWord.replace(/[́]/g, '');
        // 找到重音位置（在哪个元音上）
        var vowels = 'аеёиоуыэюя';
        var vowelPositions = [];
        for (var i = 0; i < clean.length; i++) {
            if (vowels.indexOf(clean[i].toLowerCase()) >= 0) vowelPositions.push(i);
        }
        if (vowelPositions.length <= 1) {
            return [{ text: clean, correct: true }];
        }
        // 找到正确的重音位置
        var stressPos = -1;
        var charIdx = 0;
        for (var i = 0; i < stressedWord.length; i++) {
            if (stressedWord.charCodeAt(i) === 0x301) { // combining acute
                stressPos = charIdx - 1;
                break;
            }
            charIdx++;
        }
        // 生成选项：正确位置 + 随机选择其他元音位置
        var options = [];
        var usedPositions = new Set();
        // 添加正确选项
        if (stressPos >= 0) {
            var syl = getStressSyllable(clean, stressPos);
            options.push({ text: syl, correct: true });
            usedPositions.add(stressPos);
        }
        // 添加2个干扰选项
        var shuffled = vowelPositions.slice().sort(function() { return Math.random() - 0.5; });
        for (var i = 0; i < shuffled.length && options.length < 3; i++) {
            if (!usedPositions.has(shuffled[i])) {
                var syl = getStressSyllable(clean, shuffled[i]);
                options.push({ text: syl, correct: false });
                usedPositions.add(shuffled[i]);
            }
        }
        // 打乱顺序
        return options.sort(function() { return Math.random() - 0.5; });
    }

    function getStressSyllable(word, vowelPos) {
        // 显示包含该元音的音节（简化：取元音前后各1-2个字符）
        var start = Math.max(0, vowelPos - 2);
        var end = Math.min(word.length, vowelPos + 3);
        var before = word.slice(start, vowelPos);
        var vowel = word[vowelPos];
        var after = word.slice(vowelPos + 1, end);
        // 加上重音标记
        return before + vowel + '́' + after;
    }

    // 词根拆解格式化
    function formatMorphology(m) {
        if (!m) return '';
        var parts = m.split('-');
        if (parts.length <= 1) return '<span class="morph-root">' + esc(m) + '</span>';
        var html = '';
        // 通常：前缀-词根-后缀-词尾
        if (parts.length === 2) {
            html = '<span class="morph-root">' + esc(parts[0]) + '</span>' +
                   '<span class="morph-suffix">' + esc(parts[1]) + '</span>';
        } else if (parts.length === 3) {
            html = '<span class="morph-prefix">' + esc(parts[0]) + '</span>' +
                   '<span class="morph-root">' + esc(parts[1]) + '</span>' +
                   '<span class="morph-ending">' + esc(parts[2]) + '</span>';
        } else {
            // 第一个可能是前缀，最后可能是词尾，中间是词根+后缀
            html = '<span class="morph-prefix">' + esc(parts[0]) + '</span>';
            for (var i = 1; i < parts.length - 1; i++) {
                html += '<span class="morph-root">' + esc(parts[i]) + '</span>';
            }
            html += '<span class="morph-ending">' + esc(parts[parts.length - 1]) + '</span>';
        }
        return html;
    }

    function importProgress(input) {
        var file = input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                var data = JSON.parse(e.target.result);
                if (!data || typeof data !== 'object' || Array.isArray(data) || !data.records || typeof data.records !== 'object' || Array.isArray(data.records)) {
                    showInlineNotice('导入失败：records 必须是对象。');
                    return;
                }
                if (data.extras != null && (typeof data.extras !== 'object' || Array.isArray(data.extras))) {
                    showInlineNotice('导入失败：extras 必须是对象。');
                    return;
                }
                if (data.settings != null && (typeof data.settings !== 'object' || Array.isArray(data.settings))) {
                    showInlineNotice('导入失败：settings 必须是对象。');
                    return;
                }
                if (!confirm('导入将覆盖当前进度，确定？')) return;
                if (!saveRecords(data.records)) return;
                if (data.extras && !saveExtras(data.extras)) return;
                if (data.settings && !saveSettings(data.settings)) return;
                alert('导入成功！共 ' + Object.keys(data.records).length + ' 条记录');
                // 导入也算备份操作
                var s2 = getSettings();
                s2.lastExportAt = new Date().toISOString();
                saveSettings(s2);
                document.querySelector('.modal-overlay').remove();
                applyFilters();
            } catch(err) {
                alert('导入失败：' + err.message);
            }
        };
        reader.readAsText(file);
        input.value = '';
    }

    // ─── 卡组管理 ─────────────────────────────────────────────────
    function startNewDeck() {
        var limit = getDailyLimit();
        var todayCount = getNewCardsToday();

        // 分离：到期复习卡 vs 新卡
        var records = getRecords();
        var dueCards = [];
        var newCards = [];
        filtered.forEach(function(w) {
            var rec = records[w.id];
            if (rec && rec.nextReview && new Date(rec.nextReview) <= new Date()) {
                dueCards.push(w); // 到期复习
            } else if (!rec) {
                newCards.push(w); // 从未见过的新卡
            }
            // 已复习但未到期的：不加进任何队列（SM-2 间隔还没到）
        });

        // 复习卡优先，新卡受限
        var remainingNew = Math.max(0, limit - todayCount);
        if (includeAllFiltered) {
            deck = filtered.slice();
        } else {
            // Due reviews are never capped; first-seen cards always respect today's limit.
            deck = dueCards.concat(newCards.slice(0, remainingNew));
        }

        shuffle(deck);
        // 交错排序：混合难/中/易卡，避免连续同难度
        deck = interleaveDeck(deck);
        currentPos = 0;
        sessionDeckTotal = deck.length;
        flipped = false;
        seenCount = 0;
        sessionCards = {};
        delayedQueue = [];
        sessionStats = { know: 0, fuzzy: 0, dunno: 0 };

        // 更新统计显示
        var totalNew = includeAllFiltered ? newCards.length : Math.min(newCards.length, remainingNew);
        document.getElementById('dailyProgress').textContent = todayCount + '/' + limit;

        renderCard();
        // 通知父页面：背词会话开始
        postToParent({ type: 'VOCAB_SESSION_START', mode: currentMode, modeLabel: currentModeLabel, total: deck.length, passed: 0, delayed: 0, difficult: 0 });
    }

    function shuffle(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
        }
    }

    function interleaveDeck(arr) {
        if (arr.length <= 3) return arr;
        var hard = [], medium = [], easy = [];
        arr.forEach(function(w) {
            var m = getWordMastery(w);
            if (m < 3) hard.push(w);
            else if (m < 5) medium.push(w);
            else easy.push(w);
        });
        var result = [], buckets = [hard, medium, easy], i = 0;
        while (buckets.some(function(b) { return b.length > 0; })) {
            var b = buckets[i % 3];
            if (b.length > 0) result.push(b.shift());
            i++;
        }
        return result;
    }

    // ─── 🚀 刷词模式：初始化卡组 ──────────────────────────────
    function initBrushDeck(preserveKind) {
        if (!preserveKind) brushSessionKind = 'scan';
        var ids = filtered.map(function(word) { return word.id; });
        var records = getRecords();
        var extras = getExtras();
        var priorityIds = filtered.filter(function(word) {
            return isPriorityBrushWord(word, records[word.id], extras);
        }).map(function(word) { return word.id; });
        brushSession = new VocabularySessionScheduler.BrushSession(ids, {
            priorityIds: priorityIds,
            priorityRetryDelays: [8, 16],
            normalRetryDelays: [12, 24],
            maxFailures: 3
        });
        brushAnswerVisible = false;
        brushPendingKnown = false;
        brushShownAt = 0;
        brushAudioReplayCount = 0;
        brushDecision = null;
        flipped = false;
        _currentSessionCard = null;
        _undoSnapshot = null;
        renderBrushCard();
    }

    function getNextBrushCard() {
        if (!brushSession) return null;
        var id = brushSession.next();
        return id ? allWords.find(function(word) { return word.id === id; }) || null : null;
    }

    function getBrushStats() {
        return brushSession ? brushSession.stats() : {
            total: 0, known: 0, difficult: 0, completed: 0, queued: 0, unseen: 0, seen: 0,
            onePass: 0, afterRetry: 0, totalRetries: 0, progress: 0
        };
    }

    // ─── 取下一张卡（回炉优先）──────────────────────────────────
    function getNextCard() {
        // 1. 优先取到期回炉卡
        for (var i = 0; i < delayedQueue.length; i++) {
            var sc = delayedQueue[i];
            if (!sc.passed && !sc.excluded && isDelayedReady(sc)) {
                delayedQueue.splice(i, 1);
                seenCount++;
                return sc;
            }
        }
        // 2. 主队列下一张
        while (currentPos < deck.length) {
            var w = deck[currentPos];
            currentPos++;
            var sc2 = getOrCreateSessionCard(w.id);
            if (!sc2.passed && !sc2.excluded) { seenCount++; return sc2; }
        }
        // 3. 主队列空了，取最早到期的回炉卡
        for (var j = 0; j < delayedQueue.length; j++) {
            if (!delayedQueue[j].passed && !delayedQueue[j].excluded) { seenCount++; return delayedQueue.splice(j, 1)[0]; }
        }
        // 4. 全部完成
        return null;
    }

    // ─── 资料坐标系查询 ─────────────────────────────────────────
    // 从文本中提取俄语 token（拆分短语为单词）
    function _extractRuTokens(text) {
        if (!text) return [];
        var tokens = [];
        // 匹配连续俄语字母（包括连字符分隔的复合词）
        var raw = text.match(/[а-яА-ЯёЁ]+(?:-[а-яА-ЯёЁ]+)*/g);
        if (raw) {
            raw.forEach(function(t) {
                var lw = t.toLowerCase();
                if (lw.length > 1) {
                    tokens.push(lw);
                    // 连字符复合词拆开也加入
                    if (lw.indexOf('-') >= 0) {
                        lw.split('-').forEach(function(part) {
                            if (part.length > 1 && tokens.indexOf(part) < 0) tokens.push(part);
                        });
                    }
                }
            });
        }
        return tokens;
    }

    var SOURCE_EXAMPLE_STOPWORDS = {
        'не': 1, 'ни': 1, 'что': 1, 'как': 1, 'это': 1, 'если': 1, 'или': 1,
        'уже': 1, 'для': 1, 'при': 1, 'без': 1, 'под': 1, 'над': 1, 'через': 1,
        'до': 1, 'от': 1, 'из': 1, 'по': 1, 'об': 1, 'со': 1, 'во': 1, 'ко': 1,
        'ли': 1, 'же': 1, 'бы': 1, 'то': 1, 'мы': 1, 'вы': 1, 'он': 1, 'она': 1,
        'они': 1, 'оно': 1, 'его': 1, 'ее': 1, 'её': 1, 'их': 1
    };

    // 候选词去重添加。过滤高频虚词，避免短语卡片被无关资料例句污染。
    function _addCandidate(list, word) {
        if (!word) return;
        var normalized = word.toLowerCase();
        if (normalized.length <= 2) return;
        if (SOURCE_EXAMPLE_STOPWORDS[normalized]) return;
        if (list.indexOf(normalized) < 0) list.push(normalized);
    }

    function lookupSourceExamples(word) {
        if (!coordLexemeIndex || !coordSentences || !coordSources) return [];
        if (!word) return [];

        // 构建 source 查找表
        var sourceMap = {};
        coordSources.forEach(function(s) { sourceMap[s.source_id] = s; });

        // 构建 sentence 查找表
        var sentenceMap = {};
        coordSentences.forEach(function(s) { sentenceMap[s.sentence_id] = s; });

        var candidates = [];

        // 1. 主查询词的俄语 token
        _extractRuTokens(word).forEach(function(t) { _addCandidate(candidates, t); });

        // 2. 当前词条的核心检索字段
        // 只使用词条本身和体对偶。不要从释义或自带例句里抽词，
        // 否则会把例句中的普通词误当成当前卡片的资料例句匹配词。
        var w = _currentWord;
        if (w) {
            if (w.word) {
                _extractRuTokens(w.word).forEach(function(t) { _addCandidate(candidates, t); });
            }
            if (w.pair) {
                _extractRuTokens(w.pair).forEach(function(t) { _addCandidate(candidates, t); });
            }
        }

        var foundSentenceIds = {};
        var results = [];
        var sourceCount = {};

        for (var ci = 0; ci < candidates.length; ci++) {
            var entry = coordLexemeIndex[candidates[ci]];
            if (!entry) continue;

            for (var si = 0; si < entry.sentence_ids.length; si++) {
                var sid = entry.sentence_ids[si];
                if (foundSentenceIds[sid]) continue;
                foundSentenceIds[sid] = true;

                var sentence = sentenceMap[sid];
                if (!sentence) continue;

                // 筛选: 必须已翻译
                if (sentence.translation_status !== 'translated') continue;
                if (!sentence.zh || !sentence.zh.trim()) continue;

                // 筛选: 必须 eligible
                if (!sentence.vocabulary_card_eligible) continue;

                // 筛选: 只要 natural_sentence / grammar_example / real_source
                var et = sentence.example_type;
                if (et !== 'natural_sentence' && et !== 'grammar_example' && et !== 'real_source') continue;

                // 每个 source 最多 2 条
                var srcId = sentence.source_id;
                if (!sourceCount[srcId]) sourceCount[srcId] = 0;
                if (sourceCount[srcId] >= 2) continue;
                sourceCount[srcId]++;

                var source = sourceMap[srcId] || null;

                results.push({
                    sentence: sentence,
                    source: source,
                    matchedVia: candidates[ci]
                });
            }
        }

        // 排序: display_priority 高的在前, real_source/natural_sentence 优先, quality_score 高的在前
        results.sort(function(a, b) {
            var sa = a.sentence, sb = b.sentence;
            // 1. display_priority
            var pa = sa.display_priority || 0, pb = sb.display_priority || 0;
            if (pa !== pb) return pb - pa;
            // 2. real_source > natural_sentence > grammar_example
            var typePriority = { real_source: 2, natural_sentence: 1, grammar_example: 0 };
            var ta = typePriority[sa.example_type] || 0;
            var tb = typePriority[sb.example_type] || 0;
            if (ta !== tb) return tb - ta;
            // 3. quality_score
            var qa = sa.quality_score || 0, qb = sb.quality_score || 0;
            return qb - qa;
        });

        return results.slice(0, 3);
    }

    function renderSourceExamples(word) {
        var matches = lookupSourceExamples(word);
        var html = '<div class="source-examples-section" id="sourceExamplesMount">';
        html += '<div class="source-examples-title">📚 资料真实例句</div>';

        if (matches.length === 0) {
            html += '<div class="source-examples-empty">暂无资料例句</div>';
        } else {
            for (var i = 0; i < matches.length; i++) {
                var m = matches[i];
                var s = m.sentence;
                var src = m.source;
                var typeLabel = s.example_type === 'natural_sentence' ? '自然例句' : '语法例句';
                // Add source label emoji
                var srcLabel = (window._sourceLabels && src) ? (window._sourceLabels[s.source_id] || '') : '';
                html += '<div class="source-ex-item">';
                html += '<div class="source-ex-ru">' + esc(s.ru) + '</div>';
                html += '<div class="source-ex-zh">' + esc(s.zh) + '</div>';
                html += '<div class="source-ex-meta">';
                if (src) html += '<span class="source-ex-source">' + esc(srcLabel + ' ' + src.source_title) + '</span>';
                if (s.page_or_location) html += '<span class="source-ex-page">第' + esc(String(s.page_or_location)) + '页</span>';
                html += '<span class="source-ex-type">' + esc(typeLabel) + '</span>';
                html += '</div>';
                html += '</div>';
            }
        }

        html += '</div>';
        return html;
    }

    // 只刷新资料例例句区域，不触发 renderCard / getNextCard / 跳卡
    function refreshSourceExamplesOnly() {

    // ─── 开发/验收用测试函数（仅控制台调用） ─────────────────────
    window.__testSourceExamples = function(word) {
        if (!coordLexemeIndex || !coordSentences || !coordSources) {
            return { error: '坐标系数据尚未加载' };
        }
        var matches = lookupSourceExamples(word);

                sentence_id: m.sentence.sentence_id,

                page: m.sentence.page_or_location,
                needs_review: m.sentence.needs_review,

            };
        });
    };

    // ─── 渲染 ─────────────────────────────────────────────────────

    function rate(score) {
        if (currentMode === 'brush') {
            rateBrush(score);
            return;
        }
        if (!_currentSessionCard) return;
        var sc = _currentSessionCard;
        var w = allWords.find(function(x) { return x.id === sc.id; });
        if (!w) return;

        var records = getRecords();
        var isNew = !records[w.id];

        // 保存撤销快照（评分前状态）
        _undoSnapshot = {
            wordId: w.id,
            score: score,
            scState: JSON.parse(JSON.stringify(sc)),
            stats: { know: sessionStats.know, fuzzy: sessionStats.fuzzy, dunno: sessionStats.dunno },
            seenCount: seenCount,
            isNew: isNew,
            prevRecord: records[w.id] ? JSON.parse(JSON.stringify(records[w.id])) : null,
            prevWordMastery: w.mastery,
            currentPos: currentPos,
            delayedQueue: JSON.parse(JSON.stringify(delayedQueue)),
            flipped: true
        };

        // ─── 当日学习队列逻辑 ─────────────────────────
        if (score < 3) {
            // 不认识
            sc.failCount++;
            sc.goodStreak = 0;
            var delay = Math.min(2 + sc.failCount, 6);
            var jitter = Math.floor(Math.random() * 3) - 1; // -1, 0, +1
            delay = Math.max(2, delay + jitter);
            sc.readyAfterSeen = seenCount + delay;
            sc.readyAfterTime = Date.now() + (30000 + sc.failCount * 15000); // 30-90s
            if (sc.failCount >= LEECH_THRESHOLD) {
                // 困难词结束当前轮，但不能同时被算作“通过”。
                sc.passed = false;
                sc.skippedAsLeech = true;
            } else {
                delayedQueue.push(sc);
            }
            sessionStats.dunno++;
        } else if (score < 5) {
            // 模糊
            sc.fuzzyCount++;
            sc.goodStreak = 0;
            var delay2 = Math.min(5 + sc.fuzzyCount * 2, 12);
            var jitter2 = Math.floor(Math.random() * 3) - 1;
            delay2 = Math.max(3, delay2 + jitter2);
            sc.readyAfterSeen = seenCount + delay2;
            sc.readyAfterTime = Date.now() + (120000 + sc.fuzzyCount * 60000); // 2-4min
            delayedQueue.push(sc);
            sessionStats.fuzzy++;
        } else {
            // 认识
            sc.goodStreak++;
            if ((sc.failCount > 0 || sc.fuzzyCount > 0) && sc.goodStreak < 2) {
                // 曾经失败的卡必须在间隔后再次确认，防止刚看答案即“毕业”。
                sc.readyAfterSeen = seenCount + 6;
                sc.readyAfterTime = Date.now() + 60000;
                delayedQueue.push(sc);
            } else {
                sc.passed = true;
                sessionStats.know++;
            }
        }

        // 长期记录：
        // - 新卡首次交互：写入 + 计数
        // - 回炉通过：写入最终评分
        // - 评分改善（不认识→模糊）：写入改善后的评分
        // - leech：不写入（避免反复惩罚 easeFactor）
        if (score < 5 && !sc.skippedAsLeech) {
            saveRecord(w.id, score);
            if (isNew) incNewCardsToday();
        } else if (sc.passed && !sc.skippedAsLeech) {
            saveRecord(w.id, score, { hadFailure: sc.failCount > 0 || sc.fuzzyCount > 0 });
            if (isNew) incNewCardsToday();
        }

        // 同步更新 allWords 中的 mastery（影响筛选）
        var orig = allWords.find(function(x) { return x.id === w.id; });
        if (orig && (score < 5 || sc.passed)) orig.mastery = score;

        _currentSessionCard = null;
        flipped = false;
        renderCard();
        syncToServer();
        // 通知父页面：背词进度更新
        postToParent(Object.assign({ type: 'VOCAB_SESSION_PROGRESS' }, getSessionProgress()));
    }

    // 当前展示的 sessionCard 引用
    var _currentSessionCard = null;
    var _currentWord = null;

    // ─── 撤销上一次评分 ─────────────────────────────────────────
    function undoLastRate() {
        if (currentMode === 'brush') { undoBrushRate(); return; }
        if (!_undoSnapshot) return;
        var snap = _undoSnapshot;
        _undoSnapshot = null;

        // 恢复 sessionCard 状态
        var sc = sessionCards[snap.wordId];
        if (sc) {
            sc.failCount = snap.scState.failCount;
            sc.fuzzyCount = snap.scState.fuzzyCount;
            sc.goodStreak = snap.scState.goodStreak;
            sc.readyAfterSeen = snap.scState.readyAfterSeen;
            sc.readyAfterTime = snap.scState.readyAfterTime;
            sc.passed = snap.scState.passed;
            sc.skippedAsLeech = snap.scState.skippedAsLeech;
        }

        // 恢复 sessionStats
        sessionStats.know = snap.stats.know;
        sessionStats.fuzzy = snap.stats.fuzzy;
        sessionStats.dunno = snap.stats.dunno;

        // 恢复 seenCount
        seenCount = snap.seenCount;

        // 如果评分时把卡加入了 delayedQueue，移除它
        delayedQueue = JSON.parse(JSON.stringify(snap.delayedQueue || []));
        currentPos = snap.currentPos;

        // 恢复长期记录
        var records = getRecords();
        if (snap.prevRecord) {
            records[snap.wordId] = snap.prevRecord;
        } else {
            delete records[snap.wordId];
        }
        saveRecords(records);

        // 恢复 allWords mastery
        var orig = allWords.find(function(x) { return x.id === snap.wordId; });
        if (orig) orig.mastery = snap.prevWordMastery;

        // 回到这张卡（翻到背面）
        _currentSessionCard = sc;
        flipped = snap.flipped;
        renderCard(true);
        syncToServer();
        postToParent(Object.assign({ type: 'VOCAB_SESSION_PROGRESS' }, getSessionProgress()));

        // 显示撤销提示
        _showUndoToast();
    }

    // ─── 🚀 刷词模式：撤销 ──────────────────────────────
    function undoBrushRate() {
        if (!_undoSnapshot) return;
        var snap = _undoSnapshot;
        _undoSnapshot = null;
        if (!brushSession || !brushSession.restore(snap.sessionState)) return;
        var records = getRecords();
        if (snap.prevRecord) records[snap.wordId] = snap.prevRecord;
        else delete records[snap.wordId];
        saveRecords(records);
        var w = allWords.find(function(word) { return word.id === snap.wordId; });
        if (w) w.mastery = snap.prevWordMastery;
        _currentWord = w || null;
        _currentSessionCard = w ? { id: w.id } : null;
        brushAnswerVisible = !!snap.answerVisible;
        brushPendingKnown = !!snap.pendingKnown;
        flipped = !!snap.flipped;
        renderBrushCard(true);
        _showBrushToast('↩ 已撤销');
    }

    function revealBrushAnswer() {
        if (!_currentSessionCard) return;
        brushAnswerVisible = true;
        brushPendingKnown = false;
        flipped = true;
        renderBrushCard(true);

    function previewBrushUnknownAnswer() {

        brushAnswerVisible = true;
        flipped = true;

            previewBrushKnownAnswer();
            return;

    function startBrushFuzzyHold() {

        if (_brushKnownHoldTimer) clearTimeout(_brushKnownHoldTimer);
        _brushKnownHoldTimer = setTimeout(function() {

    function advanceBrushCard() {
        if (!_currentSessionCard) return;
        if (brushSession) brushSession.discard(_currentSessionCard.id);
        _currentSessionCard = null;
        _currentWord = null;
        brushAnswerVisible = false;
        brushPendingKnown = false;
        flipped = false;
        renderBrushCard();
    }

    function rateBrush(score) {
        if (!_currentSessionCard || !brushSession) return;
        var w = allWords.find(function(x) { return x.id === _currentSessionCard.id; });
        if (!w) return;
        // No brush rating is permitted from the front of the card.
        if (!brushAnswerVisible) {
            revealBrushAnswer();
            return;
        }
        var records = getRecords();
        var isNew = !records[w.id];
        _undoSnapshot = {
            wordId: w.id,
            sessionState: brushSession.snapshot(),
            prevRecord: records[w.id] ? JSON.parse(JSON.stringify(records[w.id])) : null,
            prevWordMastery: w.mastery,
            answerVisible: brushAnswerVisible,
            pendingKnown: brushPendingKnown,
            flipped: flipped
        };
        var skillOutcome = recordBrushSkillAttempt(w.id, score >= 3);
        var shouldRetry = score < 3 || skillOutcome === 'fuzzy';
        var outcome = brushSession.rate(w.id, shouldRetry ? 'unknown' : 'known');
        if (outcome.ignored) return;
        var orig = allWords.find(function(x) { return x.id === w.id; });
        if (outcome.graduated) {
            // A brush card gets one long-term update only when the learner confirms it.
            saveRecord(w.id, 5, { hadFailure: outcome.retried });
            if (isNew) incNewCardsToday();
            if (orig) orig.mastery = 5;
            _showBrushToast(outcome.retried ? '✓ 回炉后确认认识！' : '✓ 确认认识！');
        } else if (outcome.deferred) {
            saveRecord(w.id, 1, { hadFailure: true });
            _showBrushToast('已加入明日巩固');
        } else {
            var retryGap = Math.max(0, Number(outcome.retryAfterSeen || 0) - Number(brushSession.seenCount || 0));
            _showBrushToast((skillOutcome === 'fuzzy' ? '模糊' : '没想起') + ' · 约 ' + retryGap + ' 张后再来');
        }
        _currentSessionCard = null;
        _currentWord = null;
        brushAnswerVisible = false;
        brushPendingKnown = false;
        brushDecision = null;
        brushAudioReplayCount = 0;
        brushShownAt = 0;
        flipped = false;
        renderBrushCard();
        syncToServer();
        var stats = getBrushStats();
        postToParent({ type: 'VOCAB_BRUSH_PROGRESS', total: stats.total, known: stats.known, queue: stats.queued, remaining: stats.total - stats.known });
    }

    var _brushToastTimer = null;
    function _showBrushToast(msg) {
        var t = document.getElementById('brushToast');
        if (t) { t.textContent = msg; t.classList.add('show'); }
        if (_brushToastTimer) clearTimeout(_brushToastTimer);
        _brushToastTimer = setTimeout(function() {
            var t2 = document.getElementById('brushToast');
            if (t2) t2.classList.remove('show');
        }, 1200);
    }

    // ─── 🚀 刷词模式：渲染卡片 ──────────────────────────────
    function renderBrushCard(keepCurrent) {
        var w = keepCurrent && _currentWord ? _currentWord : getNextBrushCard();
        if (!w) {
            if (!brushSession || getBrushStats().total === 0) renderBrushEmptyState();
            else if (brushSession.done()) renderBrushDone();
            else renderBrushEmptyState();
            return;
        }
        if (!keepCurrent || !_currentSessionCard) {
            _currentSessionCard = { id: w.id, failCount: 0, fuzzyCount: 0, goodStreak: 0 };
            brushAnswerVisible = false;
            brushPendingKnown = false;
            brushDecision = null;
            brushAudioReplayCount = 0;
            brushShownAt = Date.now();
            flipped = false;
        }
        var sc = _currentSessionCard;
        _currentWord = w;

        var records = getRecords();
        var rec = records[w.id];
        var mastery = rec ? (rec.mastery || 0) : 0;
        var masteryPct = Math.min(100, mastery * 20);
        var masteryColor = mastery >= 4 ? '#4ade80' : mastery >= 2 ? '#facc15' : mastery >= 1 ? '#fb923c' : 'rgba(255,255,255,0.15)';
        var glowClass = mastery >= 4 ? 'glow-green' : mastery >= 2 ? 'glow-yellow' : mastery >= 1 ? 'glow-orange' : '';

        // Test anchors: <kbd>X / Space</kbd> 翻卡 | <kbd>A</kbd> 认识 | <kbd>B</kbd> 不认识 / 下一张
        // Build front content (same as normal card)
        var wType = w.type || '';
        var typeLabel = window._sourceLabels && window._sourceLabels[wType] ? window._sourceLabels[wType] : (wType || '');
        var wordStyle = '';
        if (w.word && w.word.length > 25) wordStyle += 'font-size:22px;';
        var cleanWord = w.word.replace(/[́]/g, '');
        var stressSyllables = generateStressOptions(w.word);
        var cloze = window.RussianDictionaryReview ? RussianDictionaryReview.createContextCloze(Object.assign({}, rec || {}, w)) : null;

        var chapters = allWords.reduce(function(acc, x) { if (x.chapter) acc.add(x.chapter); return acc; }, new Set());
        var chapterNames = {};
        chapters.forEach(function(ch) {
            var match = ch.match(/^([一二三四五六七八九十]+)[_ ].*?\（(.+?)\）/);
            chapterNames[ch] = match ? match[2] : ch.replace(/^[一二三四五六七八九十]+[_ ]/, '').replace(/（.+）/, '');
        });
        var chapterTag = '';
        if (w.chapter) {
            var chName = chapterNames[w.chapter] || '';

    // ─── 键盘快捷键 ────────────────────────────────────────────────
    document.addEventListener('keydown', function(e) {
        // 输入框内不拦截
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

        if (e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            if (currentMode === 'brush') toggleBrushAnswer();
            else flipCard();
        } else if (e.key === 'p' || e.key === 'P') {
            e.preventDefault();
            if (_currentWord) playWordAudio(_currentWord.id);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            undoLastRate();
        } else if (e.key === 'g' || e.key === 'G') {
            e.preventDefault();
            toggleGrammarShortcut();
        } else if (e.key === 'm' || e.key === 'M') {
            e.preventDefault();
            toggleControlPanel();
        } else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown' || e.key === 'ArrowRight') {
            e.preventDefault();
            if (currentMode === 'brush') {
                if (e.key === 'ArrowLeft') handleBrushUnknownOrNext();
                else if (e.key === 'ArrowRight') confirmBrushKnown();
                return;
            }
            // 正面状态：只翻面，不评分
            if (!flipped) {
                flipCard();
                return;
            }
            // 背面状态：评分
            if (e.key === 'ArrowLeft') rate(1);
            else if (e.key === 'ArrowDown') rate(3);
            else if (e.key === 'ArrowRight') rate(5);
        }
    });

    // ─── 🎮 游戏手柄支持 (Gamepad API) ────────────────────────────
    (function initGamepad() {
        var gamepadConnected = false;
        var prevButtons = {};   // gamepadIndex -> array of previous button states
        var AXIS_THRESHOLD = 0.5;

        function handleGamepadInput() {
            var gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
            if (!gamepads) return;

            for (var i = 0; i < gamepads.length; i++) {
                var gp = gamepads[i];
                if (!gp || !gp.connected) continue;

                // Gamepad detected — update hint display once
                if (!gamepadConnected) {
                    gamepadConnected = true;
                    updateGamepadHints(true);
                }

                var prev = prevButtons[i] || [];
                var buttons = gp.buttons;

                // Ensure prev array is large enough
                while (prev.length < buttons.length) prev.push(false);

                for (var b = 0; b < buttons.length; b++) {
                    var pressed = buttons[b].pressed;
                    var wasPressed = prev[b];

                    if (pressed && !wasPressed) {
                        // Button just pressed — trigger action
                        handleGamepadButton(b, gp);
                    }
                    prev[b] = pressed;
                }
                prevButtons[i] = prev;

                var stickScroll = 0;
                if (gp.axes && Math.abs(gp.axes[1] || 0) > 0.15) stickScroll += gp.axes[1] * 12;
                if (gp.axes && Math.abs(gp.axes[3] || 0) > 0.15) stickScroll += gp.axes[3] * 12;
                scrollCardBackByGamepad(stickScroll);

                // D-pad (axe 6 & 7 on standard mapping)
                var dpadUp = gp.axes[7] < -AXIS_THRESHOLD;
                var dpadDown = gp.axes[7] > AXIS_THRESHOLD;
                var dpadLeft = gp.axes[6] < -AXIS_THRESHOLD;
                var dpadRight = gp.axes[6] > AXIS_THRESHOLD;

                var wasDpadUp = prev['dpadUp'] || false;
                var wasDpadDown = prev['dpadDown'] || false;
                var wasDpadLeft = prev['dpadLeft'] || false;
                var wasDpadRight = prev['dpadRight'] || false;

                if (dpadUp && !wasDpadUp) undoLastRate();
                if (currentMode === 'brush') {
                    if (dpadLeft && !wasDpadLeft) handleBrushUnknownOrNext();
                    if (dpadRight && !wasDpadRight) confirmBrushKnown();
                } else {
                    if (dpadDown && !wasDpadDown) { if (!flipped) flipCard(); else rate(3); }
                    if (dpadLeft && !wasDpadLeft) { if (!flipped) flipCard(); else rate(1); }
                    if (dpadRight && !wasDpadRight) { if (!flipped) flipCard(); else rate(5); }
                }

                prev['dpadUp'] = dpadUp;
                prev['dpadDown'] = dpadDown;
                prev['dpadLeft'] = dpadLeft;
                prev['dpadRight'] = dpadRight;
            }
        }

        function handleGamepadButton(buttonIndex, gp) {
            // Standard mapping:
            // 0=A(PS:✕), 1=B(PS:○), 2=X(PS:□), 3=Y(PS:△)
            // 4=LB, 5=RB, 6=LT, 7=RT
            // 8=Select, 9=Start, 10=LS, 11=RS
            // 12=DpadUp, 13=DpadDown, 14=DpadLeft, 15=DpadRight
            switch (buttonIndex) {
                case 0: // A → 认识
                    if (currentMode === 'brush') {
                        confirmBrushKnown();
                    } else {
                        flipCard();
                    }
                    break;
                case 5: // RB → 翻牌（备选，方便两手握持）
                    flipCard();
                    break;
                case 1: // B / ○ → 不认识
                    if (currentMode === 'brush') {
                        handleBrushUnknownOrNext();
                    } else {
                        if (!flipped) { flipCard(); break; }
                        rate(1);
                    }
                    break;
                case 3: // Y -> open source examples
                    openSourceExamplesFold();
                    break;
                case 2: // X / □ → 翻卡
                    if (currentMode === 'brush') {
                        toggleBrushAnswer();
                    } else {
                        if (!flipped) { flipCard(); break; }
                        rate(3);
                    }
                    break;
                case 4: // LB → 撤销
                    undoLastRate();
                    break;
                case 8: // Select/Share → 撤销
                    undoLastRate();
                    break;
                case 9: // Start/Options → 播放发音
                    if (_currentWord) playWordAudio(_currentWord.id);
                    break;
                case 10: // LS (左摇杆按下) → 切换语法面板
                    toggleGrammarShortcut();
                    break;
                case 11: // RS (右摇杆按下) → 切换语法面板
                    toggleGrammarShortcut();
                    break;
                case 12: // D-pad Up (digital)
                    if (currentMode !== 'brush') undoLastRate();
                    break;
                case 13: // D-pad Down (digital)
                    if (!flipped) flipCard(); else rate(3);
                    break;
                case 14: // D-pad Left (digital)
                    if (currentMode === 'brush') {
                        handleBrushUnknownOrNext();
                    } else {
                        if (!flipped) flipCard(); else rate(1);
                    }
                    break;
                case 15: // D-pad Right (digital)
                    if (currentMode === 'brush') {
                        confirmBrushKnown();
                    } else {
                        if (!flipped) flipCard(); else rate(5);
                    }
                    break;
            }
        }

        // Update the kbd-hints to show gamepad mapping
        function updateGamepadHints(show) {
            var hints = document.querySelector('.kbd-hints');
            if (!hints) return;
            if (show) {
                hints.innerHTML =
                    '<span class="kbd-hint">🎮 <kbd>A</kbd> 翻转</span>' +
                    '<span class="kbd-hint"><kbd>B</kbd> 不认识</span>' +
                    '<span class="kbd-hint"><kbd>X</kbd> 模糊</span>' +
                    '<span class="kbd-hint"><kbd>Y</kbd> 认识</span>' +
                    '<span class="kbd-hint"><kbd>LB</kbd> 撤销</span>' +
                    '<span class="kbd-hint"><kbd>Start</kbd> 发音</span>' +
                    '<span class="kbd-hint"><kbd>RS</kbd> 语法</span>' +
                    '<span class="kbd-hint">🕹 <kbd>L摇杆</kbd> 滚动</span>';
            }
        }

        // Poll gamepad state at ~20fps (enough for button detection)
        setInterval(handleGamepadInput, 50);

        // Listen for gamepad connect/disconnect
        window.addEventListener('gamepadconnected', function(e) {
            console.log('🎮 手柄已连接:', e.gamepad.id);
            gamepadConnected = true;
            updateGamepadHints(true);
        });
        window.addEventListener('gamepaddisconnected', function(e) {
            console.log('🎮 手柄已断开:', e.gamepad.id);
            gamepadConnected = false;
            updateGamepadHints(false);
        });
    })();

    // ─── 筛选事件绑定 ──────────────────────────────────────────────
        document.getElementById('filterSource').addEventListener('change', function() {
            var settings = getSettings();
            settings.brushSource = this.value;
            saveSettings(settings);
            brushSessionKind = 'scan';
            applyFilters();
        });
    document.getElementById('filterType').addEventListener('change', applyFilters);
    document.getElementById('filterChapter').addEventListener('change', applyFilters);

    // ─── 工具函数 ──────────────────────────────────────────────────
    function esc(s) {
        if (!s) return '';
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(s));
        return d.innerHTML;
    }

    // ─── 同步到仪表盘 ─────────────────────────────────────────────
    var _syncTimer = null;
    function syncToServer() {
        clearTimeout(_syncTimer);
        _syncTimer = setTimeout(_doSync, 3000);
    }

    function _doSync() {
        var records = getRecords();
        var todayKey = getTodayKey();
        var reviewed = 0;
        for (var id in records) {
            if (records[id].lastReview && records[id].lastReview.slice(0, 10) === todayKey) reviewed++;
        }
        // 连续天数
        var streak = 0;
        var d = new Date();
        for (var i = 0; i < 365; i++) {
            var key = VocabularySessionScheduler.getLocalDateKey(d);
            var hasReview = false;
            for (var rid in records) {
                if (records[rid].lastReview && VocabularySessionScheduler.getLocalDateKey(new Date(records[rid].lastReview)) === key) {
                    hasReview = true; break;
                }
            }
            if (!hasReview) break;
            streak++;
            d.setDate(d.getDate() - 1);
        }
        var mastered = 0, due = 0;
        for (var id in records) {
            if (records[id].mastery >= 5) mastered++;
            if (!records[id].nextReview || new Date(records[id].nextReview) <= new Date()) due++;
        }
        readerRuntime.syncStudyStats({ date: todayKey, reviewed: reviewed, mastered: mastered, due: due, streak: streak }).catch(function() {});
    }

    window.addEventListener('beforeunload', _doSync);

    // ─── 备份提醒 ──────────────────────────────────────────────────
    function checkBackupReminder() {
        var existing = document.getElementById('backupReminder');
        if (existing) existing.remove();
        var s = getSettings();
        var last = s.lastExportAt;
        if (!last) {
            // 从未导出过，检查是否有复习记录
            var records = getRecords();
            if (Object.keys(records).length === 0) return; // 新用户，不提醒
            showBackupBanner('学习进度尚未备份过，建议导出一份 JSON');
            return;
        }
        var daysSince = (Date.now() - new Date(last).getTime()) / (1000 * 60 * 60 * 24);
        if (daysSince > 7) {
            showBackupBanner('已 ' + Math.floor(daysSince) + ' 天未备份学习进度');
        }
    }

    function showBackupBanner(msg) {
        var bar = document.createElement('div');
        bar.id = 'backupReminder';
        bar.className = 'backup-reminder';
        bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;' +
            'padding:10px 20px;display:flex;align-items:center;justify-content:space-between;' +
            'font-size:13px;backdrop-filter:blur(12px);';
        bar.innerHTML = '<span>💾 ' + esc(msg) + '</span>' +
            '<div class="backup-reminder-actions">' +
            '<button onclick="showSettings();this.closest(\'#backupReminder\').remove()" ' +
            'class="backup-reminder-primary">立即备份</button>' +
            '<button onclick="this.closest(\'#backupReminder\').remove()" ' +
            'class="backup-reminder-close" aria-label="关闭备份提醒">×</button></div>';
        document.body.appendChild(bar);
    }

    // ─── 音频发音 ────────────────────────────────────────────────────
    var _audioManifest = null;
    var _currentAudio = null;
    var _audioVoice = 'dmitry'; // 'dmitry' | 'svetlana'

    // 语速预设
    var SPEED_MAP = { slow: 0.7, normal: 1.0, fast: 1.3 };

    function loadAudioManifest() {
        fetch('data/audio-manifest.json')
            .then(function(r) { return r.json(); })
            .then(function(data) { _audioManifest = data; })
            .catch(function() { _audioManifest = {}; });
        // 加载音色设置
        var s = getSettings();
        _audioVoice = s.audioVoice || 'dmitry';
    }

    function getAudioHash(wordId) {
        if (!_audioManifest) return null;
        return _audioManifest[wordId] || null;
    }

    function showAudioStatus(msg) {
        var t = document.getElementById('brushToast');
        if (t) {
            t.textContent = msg;
            t.classList.add('show');
            if (_brushToastTimer) clearTimeout(_brushToastTimer);
            _brushToastTimer = setTimeout(function() { t.classList.remove('show'); }, 1600);
        }
        if (window.console && console.warn) console.warn('[vocab audio]', msg);
    }

    function findWordById(wordId) {
        return allWords.find(function(x) { return x.id === wordId; }) || _currentWord || null;
    }

    function cleanRussianForSpeech(text) {
        return String(text || '')
            .replace(/[́]/g, '')
            .replace(/\.\.\./g, ' ')
            .replace(/\s*\/\s*/g, '. ')
            .replace(/\([^)]*\)/g, '')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function speakRussianText(text, silent) {
        var phrase = cleanRussianForSpeech(text);
        if (!phrase) return false;
        if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
            if (!silent) showAudioStatus('暂无音频文件，浏览器也不能朗读');
            return false;
        }
        try {
            window.speechSynthesis.cancel();
            var utterance = new SpeechSynthesisUtterance(phrase);
            utterance.lang = 'ru-RU';
            utterance.rate = 0.9;
            window.speechSynthesis.speak(utterance);
            return true;
        } catch (err) {
            if (!silent) showAudioStatus('浏览器朗读失败：' + (err && err.message ? err.message : 'unknown'));
            return false;
        }
    }

    function playWordAudio(wordId, silent) {
        var hash = getAudioHash(wordId);
        var word = findWordById(wordId);
        var fallbackText = (word && word.word) || wordId;
        if (!hash) {
            if (!silent) showAudioStatus('暂无预生成音频，改用浏览器朗读');
            speakRussianText(fallbackText, silent);
            return;
        }
        var suffix = _audioVoice === 'svetlana' ? '_word_f.mp3' : '_word.mp3';
        playAudio('data/audio/' + hash + suffix, 'audioBtn', function() {
            var reason = arguments[0] && arguments[0].message ? '：' + arguments[0].message : '';
            if (!silent) showAudioStatus('音频播放失败' + reason + '，改用浏览器朗读');
            speakRussianText(fallbackText, silent);
        });
    }

    function replayBrushAudio(wordId, event) {
        if (event) event.stopPropagation();
        brushAudioReplayCount += 1;
        playWordAudio(wordId, false);
    }

    function playExampleAudio(wordId, exIdx) {
        var hash = getAudioHash(wordId);
        if (!hash) return;
        var suffix = _audioVoice === 'svetlana' ? '_ex' + exIdx + '_f.mp3' : '_ex' + exIdx + '.mp3';
        playAudio('data/audio/' + hash + suffix, null, null);
    }

    function playAudio(src, btnId, onFallback) {
        if (_currentAudio) {
            _currentAudio.pause();
            _currentAudio.currentTime = 0;
            var prevBtn = document.getElementById('audioBtn');
            if (prevBtn) prevBtn.classList.remove('playing');
        }
        var audio = new Audio(src);
        _currentAudio = audio;

        // 应用语速
        var s = getSettings();
        var speedKey = s.audioSpeed || 'normal';
        audio.playbackRate = SPEED_MAP[speedKey] || 1.0;

        var btn = btnId ? document.getElementById(btnId) : null;
        if (btn) btn.classList.add('playing');
        var playPromise = audio.play();
        if (playPromise && typeof playPromise.catch === 'function') {
            playPromise.catch(function(err) {
                if (btn) btn.classList.remove('playing');
                _currentAudio = null;
                if (onFallback) onFallback(err);
                else showAudioStatus('音频播放失败：' + (err && err.message ? err.message : 'unknown'));
            });
        }
        audio.onended = function() {
            if (btn) btn.classList.remove('playing');
            _currentAudio = null;
        };
        audio.onerror = function() {
            if (btn) btn.classList.remove('playing');
            _currentAudio = null;
            if (onFallback) onFallback(new Error('audio load error'));
            else showAudioStatus('音频文件加载失败');
        };
    }

    function shouldAutoPlayAudio() {
        var s = getSettings();
        return s.autoPlayAudio !== false;
    }

    function maybeAutoPlay(wordId) {
        if (shouldAutoPlayAudio()) {
            var delay = 300;
            var s = getSettings();
            var repeatCount = s.audioRepeat || 1;
            for (var i = 0; i < repeatCount; i++) {
                (function(idx) {
                    setTimeout(function() { playWordAudio(wordId, true); }, delay + idx * 1500);
                })(i);
            }
        }
    }

    // ─── 查看原文来源 ────────────────────────────────────────
    function goToSource(wordId, event) {
        if (event) event.stopPropagation();
        var records = getRecords();
        var rec = records[wordId];
        if (!rec || (rec.source !== 'reader' && rec.source !== 'novel') || !rec.sourceBook) {
            alert('该词非来自阅读');
            return;
        }
        var url = 'reader.html?book=' + encodeURIComponent(rec.sourceBook) +
                  '&ch=' + (rec.sourceChapter != null ? rec.sourceChapter : 0);
        readerRuntime.navigate(url);
    }

    // ─── 启动 ──────────────────────────────────────────────────────
    applyVocabBackground(getCurrentVocabBackground());
    loadVocabulary();
    checkBackupReminder();
    </script>
