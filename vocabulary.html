<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 背单词 — 俄语学习舱</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Crimson+Pro:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #020617;
            color: #e2e8f0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ─── 背景光球 ─── */
        .bg-orb {
            position: fixed; border-radius: 50%; pointer-events: none; z-index: 0;
            filter: blur(80px); opacity: 0.15;
        }
        .bg-orb-1 { width: 400px; height: 400px; background: #4F46E5; top: -100px; left: -100px; }
        .bg-orb-2 { width: 300px; height: 300px; background: #7C3AED; bottom: -80px; right: -80px; }
        .bg-orb-3 { width: 250px; height: 250px; background: #2563EB; top: 50%; left: 60%; }

        /* ─── 顶部栏 ─── */
        .top-bar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding: 12px 24px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .top-bar-left { display: flex; align-items: center; gap: 12px; }
        .top-bar-title {
            font-size: 18px; font-weight: 700; color: #e2e8f0;
            display: flex; align-items: center; gap: 8px;
        }
        .top-bar-title .emoji { font-size: 22px; }
        .top-bar-right { display: flex; align-items: center; gap: 8px; }
        .back-link {
            color: rgba(255,255,255,0.5); text-decoration: none; font-size: 13px;
            padding: 6px 12px; border-radius: 8px; transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .back-link:hover { color: rgba(255,255,255,0.9); background: rgba(255,255,255,0.06); }

        /* ─── 主容器 ─── */
        .main-container {
            position: relative; z-index: 1;
            max-width: 640px; margin: 0 auto; padding: 24px 16px 100px;
        }

        /* ─── 模式栏 ─── */
        .mode-bar {
            display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
        }
        .mode-btn {
            padding: 8px 16px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.5);
            border-radius: 10px; font-size: 13px; font-weight: 500;
            cursor: pointer; transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .mode-btn:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
        .mode-active {
            background: rgba(79,70,229,0.2) !important;
            border-color: rgba(79,70,229,0.4) !important;
            color: #a5b4fc !important;
        }
        .mode-sep { width: 1px; height: 28px; background: rgba(255,255,255,0.08); }

        /* ─── 设置弹窗 ─── */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .modal-box {
            background: #0f172a; border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 24px; width: 360px; max-width: 90vw;
        }
        .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
        .modal-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .modal-label { font-size: 13px; color: rgba(255,255,255,0.6); }
        .modal-input {
            width: 80px; padding: 6px 10px; border-radius: 8px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
            color: #e2e8f0; font-size: 14px; text-align: center;
            font-family: 'Inter', sans-serif;
        }
        .modal-btns { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
        .modal-btn {
            padding: 8px 16px; border-radius: 8px; border: none; font-size: 13px;
            cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 600;
        }
        .modal-btn-primary { background: #4F46E5; color: #fff; }
        .modal-btn-secondary { background: rgba(255,255,255,0.08); color: #e2e8f0; }

        /* ─── 问题卡片列表 ─── */
        .problem-list { margin-top: 16px; }
        .problem-item {
            background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px; padding: 12px; margin-bottom: 8px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .problem-word { font-family: 'Crimson Pro', serif; font-size: 16px; }
        .problem-file { font-size: 11px; color: rgba(255,255,255,0.3); margin-top: 4px; word-break: break-all; }
        .problem-actions { display: flex; gap: 6px; }
        .problem-actions button {
            padding: 4px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.5);
            font-size: 11px; cursor: pointer; font-family: 'Inter', sans-serif;
        }
        .problem-actions button:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }

        /* ─── 筛选面板 ─── */
        .filter-bar {
            display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;
            align-items: center;
        }
        .filter-bar select, .filter-bar button {
            font-family: 'Inter', sans-serif; font-size: 13px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #e2e8f0; border-radius: 8px; padding: 6px 12px;
            cursor: pointer; transition: all 0.2s;
        }
        .filter-bar select:hover, .filter-bar button:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }
        .filter-bar select:focus, .filter-bar button:focus {
            outline: none; border-color: #4F46E5;
        }
        .filter-bar select option { background: #1e1b4b; color: #e2e8f0; }
        .filter-btn-active {
            background: rgba(79,70,229,0.3) !important;
            border-color: rgba(79,70,229,0.5) !important;
            color: #a5b4fc !important;
        }
        .filter-sep { width: 1px; height: 24px; background: rgba(255,255,255,0.1); }

        /* ─── 统计条 ─── */
        .stats-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px; font-size: 13px; color: rgba(255,255,255,0.5);
        }
        .stats-bar .count { font-weight: 600; color: #a5b4fc; }

        /* ─── 进度条 ─── */
        .progress-track {
            width: 100%; height: 4px; background: rgba(255,255,255,0.08);
            border-radius: 2px; margin-bottom: 24px; overflow: hidden;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, #4F46E5, #6366F1);
            border-radius: 2px; transition: width 0.3s ease;
        }

        /* ─── 卡片区域 ─── */
        .card-zone {
            perspective: 1000px; margin-bottom: 24px;
        }
        .flashcard {
            position: relative; width: 100%; min-height: 280px;
            cursor: pointer; transform-style: preserve-3d;
            transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .flashcard.flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute; top: 0; left: 0; width: 100%; min-height: 280px;
            backface-visibility: hidden; -webkit-backface-visibility: hidden;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 32px 24px; text-align: center;
            backdrop-filter: blur(12px);
        }
        .card-back {
            transform: rotateY(180deg);
        }

        /* 正面 */
        .card-word {
            font-family: 'Crimson Pro', serif;
            font-size: 32px; font-weight: 600; color: #f1f5f9;
            margin-bottom: 12px; line-height: 1.4;
            word-break: break-word;
        }
        .card-meta {
            font-size: 13px; color: rgba(255,255,255,0.4);
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center;
        }
        .card-meta .tag {
            background: rgba(79,70,229,0.2); color: #a5b4fc;
            padding: 2px 8px; border-radius: 4px; font-size: 11px;
        }
        .card-hint {
            margin-top: 20px; font-size: 12px; color: rgba(255,255,255,0.25);
        }

        /* 背面 */
        .card-meaning {
            font-size: 22px; font-weight: 600; color: #f1f5f9;
            margin-bottom: 16px; line-height: 1.5;
        }
        .card-extra {
            font-size: 14px; color: rgba(255,255,255,0.5);
            margin-bottom: 16px; font-style: italic;
        }
        .card-examples {
            width: 100%; text-align: left;
        }
        .card-examples .ex-item {
            margin-bottom: 10px; padding: 10px 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px; border-left: 3px solid #4F46E5;
        }
        .card-examples .ex-ru {
            font-family: 'Crimson Pro', serif;
            font-size: 15px; color: #e2e8f0; margin-bottom: 4px; line-height: 1.5;
        }
        .card-examples .ex-zh {
            font-size: 13px; color: rgba(255,255,255,0.5); line-height: 1.4;
        }

        /* ─── 操作按钮 ─── */
        .action-btns {
            display: flex; gap: 12px; justify-content: center; margin-bottom: 24px;
        }
        .action-btn {
            flex: 1; max-width: 160px;
            padding: 14px 20px; border: none; border-radius: 12px;
            font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.25s ease;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .action-btn .btn-label { font-size: 13px; font-weight: 500; opacity: 0.8; }
        .btn-know {
            background: rgba(22,163,74,0.2); color: #4ade80;
            border: 1px solid rgba(22,163,74,0.3);
        }
        .btn-know:hover { background: rgba(22,163,74,0.35); transform: translateY(-2px); }
        .btn-fuzzy {
            background: rgba(234,179,8,0.2); color: #facc15;
            border: 1px solid rgba(234,179,8,0.3);
        }
        .btn-fuzzy:hover { background: rgba(234,179,8,0.35); transform: translateY(-2px); }
        .btn-dunno {
            background: rgba(239,68,68,0.2); color: #f87171;
            border: 1px solid rgba(239,68,68,0.3);
        }
        .btn-dunno:hover { background: rgba(239,68,68,0.35); transform: translateY(-2px); }
        .action-btn:active { transform: scale(0.96) !important; }

        /* ─── 键盘提示 ─── */
        .kb-hints {
            display: flex; justify-content: center; gap: 24px;
            font-size: 11px; color: rgba(255,255,255,0.25);
        }
        .kb-hints kbd {
            display: inline-block; padding: 1px 6px;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 4px; font-family: 'Inter', monospace; font-size: 11px;
            margin: 0 2px;
        }

        /* ─── 完成提示 ─── */
        .done-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px; padding: 48px 24px; text-align: center;
        }
        .done-card .done-emoji { font-size: 48px; margin-bottom: 16px; }
        .done-card .done-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .done-card .done-sub { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 24px; }
        .done-card .done-stats {
            display: flex; justify-content: center; gap: 24px; margin-bottom: 24px;
        }
        .done-card .stat-item { text-align: center; }
        .done-card .stat-num { font-size: 24px; font-weight: 700; }
        .done-card .stat-label { font-size: 12px; color: rgba(255,255,255,0.4); }
        .stat-num.green { color: #4ade80; }
        .stat-num.yellow { color: #facc15; }
        .stat-num.red { color: #f87171; }

        .restart-btn {
            padding: 12px 32px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #4F46E5, #6366F1);
            color: #fff; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.25s;
            font-family: 'Inter', sans-serif;
        }
        .restart-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(79,70,229,0.4); }

        /* ─── 加载状态 ─── */
        .loading {
            text-align: center; padding: 80px 24px;
            color: rgba(255,255,255,0.4); font-size: 15px;
        }
        .loading .spinner {
            width: 32px; height: 32px; border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #4F46E5; border-radius: 50%;
            animation: spin 0.8s linear infinite; margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ─── 卡片工具栏 ─── */
        .card-utils {
            display: flex; justify-content: center; align-items: center; gap: 12px;
            margin-bottom: 16px;
        }
        .due-badge {
            font-size: 12px; color: rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.05);
            padding: 3px 10px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .util-btn {
            background: none; border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.4); font-size: 16px;
            width: 32px; height: 32px; border-radius: 8px;
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .util-btn:hover { background: rgba(255,255,255,0.08); color: #e2e8f0; }
        .util-active { border-color: #facc15; color: #facc15; }

        /* ─── 操作按钮子标签 ─── */
        .action-btn .btn-sub {
            font-size: 10px; font-weight: 400; opacity: 0.5;
        }

        /* ─── 响应式 ─── */
        @media (max-width: 480px) {
            .card-word { font-size: 26px; }
            .card-meaning { font-size: 18px; }
            .action-btns { gap: 8px; }
            .action-btn { padding: 12px 16px; font-size: 14px; }
            .filter-bar { gap: 6px; }
            .main-container { padding: 16px 12px 80px; }
        }
    </style>
</head>
<body>
    <!-- 背景光球 -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>

    <!-- 顶部栏 -->
    <div class="top-bar">
        <div class="top-bar-left">
            <div class="top-bar-title">
                <span class="emoji">📚</span> 背单词
            </div>
        </div>
        <div class="top-bar-right">
            <a href="index.html" class="back-link">🏠 返回学习舱</a>
        </div>
    </div>

    <!-- 主内容 -->
    <div class="main-container">
        <!-- 模式快捷入口 -->
        <div class="mode-bar" id="modeBar">
            <button class="mode-btn mode-active" data-mode="due" onclick="switchMode('due')">📅 今日待复习</button>
            <button class="mode-btn" data-mode="vocab" onclick="switchMode('vocab')">📖 生词本</button>
            <button class="mode-btn" data-mode="b2" onclick="switchMode('b2')">🇷🇺 B2口语</button>
            <button class="mode-btn" data-mode="freq" onclick="switchMode('freq')">🔥 高频词</button>
            <button class="mode-btn" data-mode="wrong" onclick="switchMode('wrong')">❌ 错题本</button>
            <button class="mode-btn" data-mode="fav" onclick="switchMode('fav')">⭐ 收藏</button>
            <button class="mode-btn" data-mode="problems" onclick="switchMode('problems')">🚩 问题卡</button>
            <span class="mode-sep"></span>
            <button class="mode-btn" onclick="showSettings()">⚙ 设置</button>
        </div>

        <!-- 筛选栏 -->
        <div class="filter-bar" id="filterBar">
            <select id="filterSource">
                <option value="all">全部来源</option>
                <option value="vocab">📖 生词本</option>
                <option value="b2">🇷🇺 B2口语</option>
                <option value="freq">🔥 B2高频词</option>
            </select>
            <select id="filterType">
                <option value="all">全部词性</option>
                <option value="noun">名词</option>
                <option value="verb">动词</option>
                <option value="adj">形容词</option>
                <option value="adv">副词</option>
                <option value="particle">功能词</option>
            </select>
            <select id="filterChapter">
                <option value="all">全部章节</option>
            </select>
            <div class="filter-sep"></div>
            <button id="btnDueOnly" class="filter-btn-active" onclick="toggleDueOnly()">📅 今日待复习</button>
            <button id="btnOnlyWrong" onclick="toggleOnlyWrong()">❌ 只看错词</button>
            <button id="btnOnlyUnmastered" onclick="toggleOnlyUnmastered()">⚠ 未掌握</button>
        </div>

        <!-- 统计条 -->
        <div class="stats-bar" id="statsBar">
            <span>到期 <span class="count" id="dueCount">0</span></span>
            <span>新卡 <span class="count" id="newCount">0</span></span>
            <span>今日 <span class="count" id="dailyProgress">0/20</span></span>
            <span>本轮 <span class="count" id="currentIdx">0</span> / <span id="sessionTotal">0</span></span>
            <span>掌握率 <span class="count" id="masterRate">0%</span></span>
        </div>

        <!-- 进度条 -->
        <div class="progress-track">
            <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>

        <!-- 卡片 / 完成 / 加载 -->
        <div id="cardArea">
            <div class="loading">
                <div class="spinner"></div>
                正在加载词库...
            </div>
        </div>
    </div>

    <script>
    // ─── 状态 ─────────────────────────────────────────────────────
    var allWords = [];           // 全部词条
    var filtered = [];           // 筛选后的词条
    var deck = [];               // 本轮卡组
    var currentPos = 0;          // 当前位置
    var flipped = false;         // 是否翻转
    var sessionStats = { know: 0, fuzzy: 0, dunno: 0 };
    var onlyWrong = false;
    var onlyUnmastered = false;
    var showDueOnly = true;      // 默认只显示今日待复习
    var REVIEW_KEY = 'vocabulary-review-records';
    var EXTRAS_KEY = 'vocabulary-extras';
    var SETTINGS_KEY = 'vocabulary-settings';
    var newCardsToday = 0;       // 今日已学新卡数

    // ─── 加载数据 ──────────────────────────────────────────────────
    function loadVocabulary() {
        fetch('data/vocabulary.json')
            .then(function(r) { return r.json(); })
            .then(function(data) {
                allWords = data;
                initFilters();
                applyFilters();
            })
            .catch(function(err) {
                document.getElementById('cardArea').innerHTML =
                    '<div class="loading" style="color:#f87171;">❌ 加载失败：' + err.message + '<br>请先运行 node build-vocabulary.js</div>';
            });
    }

    // ─── localStorage 读写 ─────────────────────────────────────────
    function getRecords() {
        try {
            return JSON.parse(localStorage.getItem(REVIEW_KEY)) || {};
        } catch(e) { return {}; }
    }

    function getExtras() {
        try {
            return JSON.parse(localStorage.getItem(EXTRAS_KEY)) || { fav: [], skip: [], report: [] };
        } catch(e) { return { fav: [], skip: [], report: [] }; }
    }

    function saveExtras(extras) {
        localStorage.setItem(EXTRAS_KEY, JSON.stringify(extras));
    }

    function getSettings() {
        try {
            return JSON.parse(localStorage.getItem(SETTINGS_KEY)) || {};
        } catch(e) { return {}; }
    }

    function saveSettings(s) {
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
    }

    function getDailyLimit() {
        return getSettings().dailyLimit || 20;
    }

    function getTodayKey() {
        return new Date().toISOString().slice(0, 10);
    }

    function getNewCardsToday() {
        var s = getSettings();
        if (s.todayDate !== getTodayKey()) return 0;
        return s.newCardsToday || 0;
    }

    function incNewCardsToday() {
        var s = getSettings();
        if (s.todayDate !== getTodayKey()) {
            s.todayDate = getTodayKey();
            s.newCardsToday = 0;
        }
        s.newCardsToday = (s.newCardsToday || 0) + 1;
        saveSettings(s);
    }

    // SM-2 间隔复习算法
    function saveRecord(wordId, rating) {
        var records = getRecords();
        var now = new Date();
        var rec = records[wordId] || { mastery: 1, count: 0, interval: 0, easeFactor: 2.5, nextReview: null };

        rec.count = (rec.count || 0) + 1;
        rec.mastery = rating;
        rec.lastReview = now.toISOString();

        // SM-2: rating 1=不认识, 3=模糊, 5=认识
        if (rating < 3) {
            // 不认识：明天再复习
            rec.interval = 1;
            rec.easeFactor = Math.max(1.3, rec.easeFactor - 0.2);
        } else {
            // 认识/模糊：拉长间隔
            if (rec.interval === 0) {
                rec.interval = 1;
            } else if (rec.interval === 1) {
                rec.interval = rating >= 5 ? 3 : 2;
            } else {
                var ef = rec.easeFactor;
                ef = ef + (0.1 - (5 - rating) * (0.08 + (5 - rating) * 0.02));
                rec.easeFactor = Math.max(1.3, ef);
                rec.interval = Math.round(rec.interval * rec.easeFactor);
            }
        }

        // 计算下次复习时间
        var next = new Date(now);
        next.setDate(next.getDate() + rec.interval);
        rec.nextReview = next.toISOString();

        records[wordId] = rec;
        localStorage.setItem(REVIEW_KEY, JSON.stringify(records));
    }

    function getWordMastery(word) {
        var records = getRecords();
        if (records[word.id]) return records[word.id].mastery;
        return word.mastery || 1;
    }

    function isDue(word) {
        var records = getRecords();
        var rec = records[word.id];
        if (!rec || !rec.nextReview) return true; // 从未复习过的卡片也算待复习
        return new Date(rec.nextReview) <= new Date();
    }

    function toggleFav(wordId) {
        var ex = getExtras();
        var idx = ex.fav.indexOf(wordId);
        if (idx >= 0) ex.fav.splice(idx, 1); else ex.fav.push(wordId);
        saveExtras(ex);
        renderCard(); // 刷新收藏按钮状态
    }

    function toggleSkip(wordId) {
        var ex = getExtras();
        var idx = ex.skip.indexOf(wordId);
        if (idx >= 0) ex.skip.splice(idx, 1); else ex.skip.push(wordId);
        saveExtras(ex);
        currentPos++;
        flipped = false;
        renderCard();
    }

    function reportCard(wordId) {
        var ex = getExtras();
        if (ex.report.indexOf(wordId) < 0) ex.report.push(wordId);
        saveExtras(ex);
        currentPos++;
        flipped = false;
        renderCard();
    }

    // ─── 筛选 ─────────────────────────────────────────────────────
    function initFilters() {
        // 填充章节下拉
        var chapters = {};
        allWords.forEach(function(w) {
            var ch = w.chapter || w.theme || '';
            if (ch) chapters[ch] = true;
        });
        var sel = document.getElementById('filterChapter');
        Object.keys(chapters).sort().forEach(function(ch) {
            var opt = document.createElement('option');
            opt.value = ch; opt.textContent = ch;
            sel.appendChild(opt);
        });
    }

    function applyFilters() {
        var src = document.getElementById('filterSource').value;
        var type = document.getElementById('filterType').value;
        var chapter = document.getElementById('filterChapter').value;
        var extras = getExtras();

        filtered = allWords.filter(function(w) {
            if (src !== 'all' && w.source !== src) return false;
            if (type !== 'all' && w.type !== type) return false;
            if (chapter !== 'all' && (w.chapter || w.theme) !== chapter) return false;
            // 跳过已标记跳过的卡片
            if (extras.skip.indexOf(w.id) >= 0) return false;
            // 跳过已标记问题的卡片
            if (extras.report.indexOf(w.id) >= 0) return false;
            if (showDueOnly) {
                if (!isDue(w)) return false;
            }
            if (onlyWrong) {
                var m = getWordMastery(w);
                if (m >= 3) return false;
            }
            if (onlyUnmastered) {
                var m2 = getWordMastery(w);
                if (m2 >= 5) return false;
            }
            return true;
        });

        document.getElementById('totalCount').textContent = filtered.length;
        startNewDeck();
    }

    // ─── 模式切换 ─────────────────────────────────────────────────
    function switchMode(mode) {
        // 更新按钮状态
        document.querySelectorAll('.mode-btn').forEach(function(b) { b.classList.remove('mode-active'); });
        document.querySelector('.mode-btn[data-mode="' + mode + '"]').classList.add('mode-active');

        // 重置筛选
        showDueOnly = false;
        onlyWrong = false;
        onlyUnmastered = false;
        document.getElementById('btnDueOnly').classList.remove('filter-btn-active');
        document.getElementById('btnOnlyWrong').classList.remove('filter-btn-active');
        document.getElementById('btnOnlyUnmastered').classList.remove('filter-btn-active');
        document.getElementById('filterSource').value = 'all';
        document.getElementById('filterType').value = 'all';
        document.getElementById('filterChapter').value = 'all';

        if (mode === 'due') {
            showDueOnly = true;
            document.getElementById('btnDueOnly').classList.add('filter-btn-active');
        } else if (mode === 'vocab') {
            document.getElementById('filterSource').value = 'vocab';
        } else if (mode === 'b2') {
            document.getElementById('filterSource').value = 'b2';
        } else if (mode === 'freq') {
            document.getElementById('filterSource').value = 'freq';
        } else if (mode === 'wrong') {
            onlyWrong = true;
            document.getElementById('btnOnlyWrong').classList.add('filter-btn-active');
        } else if (mode === 'fav') {
            // 收藏模式单独处理
            var extras = getExtras();
            filtered = allWords.filter(function(w) { return extras.fav.indexOf(w.id) >= 0; });
            document.getElementById('totalCount').textContent = filtered.length;
            startNewDeck();
            return;
        } else if (mode === 'problems') {
            renderProblems();
            return;
        }

        applyFilters();
    }

    function showSettings() {
        var limit = getDailyLimit();
        var overlay = document.createElement('div');
        overlay.className = 'modal-overlay';
        overlay.onclick = function(e) { if (e.target === overlay) overlay.remove(); };
        overlay.innerHTML =
            '<div class="modal-box">' +
            '  <div class="modal-title">⚙ 设置</div>' +
            '  <div class="modal-row">' +
            '    <span class="modal-label">每日新卡上限</span>' +
            '    <input class="modal-input" id="inputLimit" type="number" min="1" max="500" value="' + limit + '">' +
            '  </div>' +
            '  <div class="modal-row">' +
            '    <span class="modal-label">导出/导入进度</span>' +
            '    <div style="display:flex;gap:6px;">' +
            '      <button class="modal-btn modal-btn-secondary" onclick="exportProgress()">📤 导出</button>' +
            '      <button class="modal-btn modal-btn-secondary" onclick="document.getElementById(\'importFile\').click()">📥 导入</button>' +
            '      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importProgress(this)">' +
            '    </div>' +
            '  </div>' +
            '  <div class="modal-btns">' +
            '    <button class="modal-btn modal-btn-secondary" onclick="this.closest(\'.modal-overlay\').remove()">取消</button>' +
            '    <button class="modal-btn modal-btn-primary" onclick="saveSettingsFromModal()">保存</button>' +
            '  </div>' +
            '</div>';
        document.body.appendChild(overlay);
    }

    function saveSettingsFromModal() {
        var val = parseInt(document.getElementById('inputLimit').value);
        if (val > 0) {
            var s = getSettings();
            s.dailyLimit = val;
            saveSettings(s);
        }
        document.querySelector('.modal-overlay').remove();
        applyFilters(); // 刷新卡组
    }

    function exportProgress() {
        var data = {
            version: 1,
            exportedAt: new Date().toISOString(),
            records: getRecords(),
            extras: getExtras(),
            settings: getSettings()
        };
        var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'vocabulary-progress-' + getTodayKey() + '.json';
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function importProgress(input) {
        var file = input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            try {
                var data = JSON.parse(e.target.result);
                if (!data.records) { alert('格式错误：缺少 records 字段'); return; }
                if (!confirm('导入将覆盖当前进度，确定？')) return;
                localStorage.setItem(REVIEW_KEY, JSON.stringify(data.records));
                if (data.extras) localStorage.setItem(EXTRAS_KEY, JSON.stringify(data.extras));
                if (data.settings) localStorage.setItem(SETTINGS_KEY, JSON.stringify(data.settings));
                alert('导入成功！共 ' + Object.keys(data.records).length + ' 条记录');
                document.querySelector('.modal-overlay').remove();
                applyFilters();
            } catch(err) {
                alert('导入失败：' + err.message);
            }
        };
        reader.readAsText(file);
        input.value = '';
    }

    // ─── 问题卡片视图 ────────────────────────────────────────────
    function renderProblems() {
        var area = document.getElementById('cardArea');
        var extras = getExtras();
        var problemIds = (extras.report || []).concat(extras.skip || []);
        if (problemIds.length === 0) {
            area.innerHTML = '<div class="done-card"><div class="done-emoji">✅</div>' +
                '<div class="done-title">没有问题卡片</div>' +
                '<div class="done-sub">标记数据问题或跳过的卡片会出现在这里</div></div>';
            return;
        }
        var html = '<div class="problem-list">';
        html += '<div style="font-size:13px;color:rgba(255,255,255,0.4);margin-bottom:12px;">共 ' + problemIds.length + ' 条问题卡片，可回 Obsidian 修复原文件</div>';
        problemIds.forEach(function(id) {
            var w = allWords.find(function(x) { return x.id === id; });
            if (!w) return;
            var isReport = (extras.report || []).indexOf(id) >= 0;
            html += '<div class="problem-item">' +
                '  <div>' +
                '    <div class="problem-word">' + esc(w.word) + ' → ' + esc(w.meaning).slice(0, 40) + '</div>' +
                '    <div class="problem-file">' + (isReport ? '🚩 数据问题' : '⏭ 已跳过') + ' · ' + esc(w.file) + '</div>' +
                '  </div>' +
                '  <div class="problem-actions">' +
                '    <button onclick="unmarkProblem(\'' + esc(id) + '\')">恢复</button>' +
                '  </div>' +
                '</div>';
        });
        html += '</div>';
        area.innerHTML = html;
    }

    function unmarkProblem(id) {
        var ex = getExtras();
        ex.report = (ex.report || []).filter(function(x) { return x !== id; });
        ex.skip = (ex.skip || []).filter(function(x) { return x !== id; });
        saveExtras(ex);
        renderProblems();
    }

    function toggleDueOnly() {
        showDueOnly = !showDueOnly;
        document.getElementById('btnDueOnly').classList.toggle('filter-btn-active', showDueOnly);
        applyFilters();
    }

    function toggleOnlyWrong() {
        onlyWrong = !onlyWrong;
        document.getElementById('btnOnlyWrong').classList.toggle('filter-btn-active', onlyWrong);
        applyFilters();
    }

    function toggleOnlyUnmastered() {
        onlyUnmastered = !onlyUnmastered;
        document.getElementById('btnOnlyUnmastered').classList.toggle('filter-btn-active', onlyUnmastered);
        applyFilters();
    }

    // ─── 卡组管理 ─────────────────────────────────────────────────
    function startNewDeck() {
        var limit = getDailyLimit();
        var todayCount = getNewCardsToday();

        // 分离：到期复习卡 vs 新卡
        var records = getRecords();
        var dueCards = [];
        var newCards = [];
        filtered.forEach(function(w) {
            var rec = records[w.id];
            if (rec && rec.nextReview && new Date(rec.nextReview) <= new Date()) {
                dueCards.push(w); // 到期复习
            } else if (!rec) {
                newCards.push(w); // 从未见过的新卡
            } else {
                dueCards.push(w); // 其他（已复习但未到期的，在 showDueOnly 模式已被过滤）
            }
        });

        // 复习卡优先，新卡受限
        var remainingNew = Math.max(0, limit - todayCount);
        if (showDueOnly) {
            var allowedNew = newCards.slice(0, remainingNew);
            deck = dueCards.concat(allowedNew);
        } else {
            deck = dueCards.concat(newCards);
        }

        shuffle(deck);
        currentPos = 0;
        sessionStats = { know: 0, fuzzy: 0, dunno: 0 };
        flipped = false;

        // 更新统计显示
        var totalNew = showDueOnly ? Math.min(newCards.length, remainingNew) : newCards.length;
        document.getElementById('dueCount').textContent = dueCards.length;
        document.getElementById('newCount').textContent = totalNew;
        document.getElementById('dailyProgress').textContent = todayCount + '/' + limit;

        renderCard();
    }

    function shuffle(arr) {
        for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
        }
    }

    // ─── 渲染 ─────────────────────────────────────────────────────
    function renderCard() {
        var area = document.getElementById('cardArea');

        if (deck.length === 0) {
            area.innerHTML = '<div class="done-card"><div class="done-emoji">📭</div>' +
                '<div class="done-title">没有符合条件的词条</div>' +
                '<div class="done-sub">请调整筛选条件</div></div>';
            updateStats();
            return;
        }

        if (currentPos >= deck.length) {
            renderDone();
            return;
        }

        var w = deck[currentPos];
        var m = getWordMastery(w);
        var typeLabel = w.type ? w.type : '';
        var chapterLabel = w.chapter || w.theme || '';
        var metaTags = '';
        if (typeLabel) metaTags += '<span class="tag">' + esc(typeLabel) + '</span>';
        if (chapterLabel) metaTags += '<span class="tag">' + esc(chapterLabel) + '</span>';
        if (w.source === 'b2') metaTags += '<span class="tag">B2口语</span>';
        if (w.source === 'freq') metaTags += '<span class="tag">高频词</span>';

        // 背面内容
        var backContent = '<div class="card-meaning">' + esc(w.meaning) + '</div>';
        if (w.extra) backContent += '<div class="card-extra">' + esc(w.extra) + '</div>';
        var exHtml = '';
        if (w.examples && w.examples.length > 0) {
            w.examples.forEach(function(ex) {
                if (ex.ru || ex.zh) {
                    exHtml += '<div class="ex-item">';
                    if (ex.ru) exHtml += '<div class="ex-ru">' + esc(ex.ru) + '</div>';
                    if (ex.zh) exHtml += '<div class="ex-zh">' + esc(ex.zh) + '</div>';
                    exHtml += '</div>';
                }
            });
        }
        if (exHtml) backContent += '<div class="card-examples">' + exHtml + '</div>';

        // 性别/体等附加信息
        var extraMeta = '';
        if (w.gender) extraMeta += w.gender + ' ';
        if (w.aspect) extraMeta += w.aspect + ' ';
        if (extraMeta) backContent += '<div class="card-extra" style="margin-top:8px;">' + esc(extraMeta.trim()) + '</div>';

        // 收藏状态
        var extras = getExtras();
        var isFav = extras.fav.indexOf(w.id) >= 0;

        // 下次复习信息
        var records = getRecords();
        var rec = records[w.id];
        var dueInfo = '';
        if (rec && rec.nextReview) {
            var nextDate = new Date(rec.nextReview);
            var now = new Date();
            var diffDays = Math.ceil((nextDate - now) / (1000*60*60*24));
            if (diffDays <= 0) dueInfo = '待复习';
            else if (diffDays === 1) dueInfo = '明天复习';
            else dueInfo = diffDays + '天后复习';
        } else {
            dueInfo = '新卡片';
        }

        area.innerHTML =
            '<div class="card-zone">' +
            '  <div class="flashcard' + (flipped ? ' flipped' : '') + '" id="flashcard" onclick="flipCard()">' +
            '    <div class="card-face card-front">' +
            '      <div class="card-word">' + esc(w.word) + '</div>' +
            '      <div class="card-meta">' + metaTags + '</div>' +
            '      <div class="card-hint">点击翻转 或 按空格键</div>' +
            '    </div>' +
            '    <div class="card-face card-back">' +
            backContent +
            '    </div>' +
            '  </div>' +
            '</div>' +
            '<div class="card-utils">' +
            '  <span class="due-badge">' + dueInfo + '</span>' +
            '  <button class="util-btn' + (isFav ? ' util-active' : '') + '" onclick="toggleFav(\'' + esc(w.id) + '\')" title="收藏">' + (isFav ? '⭐' : '☆') + '</button>' +
            '  <button class="util-btn" onclick="toggleSkip(\'' + esc(w.id) + '\')" title="跳过此卡">⏭</button>' +
            '  <button class="util-btn" onclick="reportCard(\'' + esc(w.id) + '\')" title="标记数据问题">🚩</button>' +
            '</div>' +
            '<div class="action-btns">' +
            '  <button class="action-btn btn-dunno" onclick="rate(1)"><span>❌</span><span class="btn-label">不认识</span><span class="btn-sub">明天再来</span></button>' +
            '  <button class="action-btn btn-fuzzy" onclick="rate(3)"><span>⚠️</span><span class="btn-label">模糊</span><span class="btn-sub">2-3天后</span></button>' +
            '  <button class="action-btn btn-know" onclick="rate(5)"><span>✅</span><span class="btn-label">认识</span><span class="btn-sub">逐步拉长</span></button>' +
            '</div>' +
            '<div class="kb-hints">' +
            '  <span><kbd>←</kbd> 不认识</span>' +
            '  <span><kbd>↓</kbd> 模糊</span>' +
            '  <span><kbd>→</kbd> 认识</span>' +
            '  <span><kbd>空格</kbd> 翻转</span>' +
            '</div>';

        updateStats();
    }

    function renderDone() {
        var total = sessionStats.know + sessionStats.fuzzy + sessionStats.dunno;
        var knowPct = total > 0 ? Math.round(sessionStats.know / total * 100) : 0;
        var area = document.getElementById('cardArea');
        area.innerHTML =
            '<div class="done-card">' +
            '  <div class="done-emoji">🎉</div>' +
            '  <div class="done-title">本轮复习完成！</div>' +
            '  <div class="done-sub">共复习 ' + total + ' 个词条</div>' +
            '  <div class="done-stats">' +
            '    <div class="stat-item"><div class="stat-num green">' + sessionStats.know + '</div><div class="stat-label">认识</div></div>' +
            '    <div class="stat-item"><div class="stat-num yellow">' + sessionStats.fuzzy + '</div><div class="stat-label">模糊</div></div>' +
            '    <div class="stat-item"><div class="stat-num red">' + sessionStats.dunno + '</div><div class="stat-label">不认识</div></div>' +
            '  </div>' +
            '  <div style="margin-bottom:16px;font-size:14px;color:rgba(255,255,255,0.5);">掌握率 ' + knowPct + '%</div>' +
            '  <button class="restart-btn" onclick="startNewDeck()">🔄 再来一轮</button>' +
            '</div>';
        updateStats();
    }

    function updateStats() {
        var total = sessionStats.know + sessionStats.fuzzy + sessionStats.dunno;
        var knowPct = total > 0 ? Math.round(sessionStats.know / total * 100) : 0;
        document.getElementById('currentIdx').textContent = Math.min(currentPos + 1, deck.length);
        document.getElementById('sessionTotal').textContent = deck.length;
        document.getElementById('masterRate').textContent = knowPct + '%';
        var pct = deck.length > 0 ? Math.round(currentPos / deck.length * 100) : 0;
        document.getElementById('progressFill').style.width = pct + '%';
    }

    // ─── 交互 ─────────────────────────────────────────────────────
    function flipCard() {
        flipped = !flipped;
        var el = document.getElementById('flashcard');
        if (el) el.classList.toggle('flipped', flipped);
    }

    function rate(score) {
        if (currentPos >= deck.length) return;
        var w = deck[currentPos];
        var records = getRecords();
        var isNew = !records[w.id];

        saveRecord(w.id, score);

        // 新卡计入每日计数
        if (isNew) incNewCardsToday();

        if (score >= 5) sessionStats.know++;
        else if (score >= 3) sessionStats.fuzzy++;
        else sessionStats.dunno++;

        // 同步更新 allWords 中的 mastery（影响筛选）
        var orig = allWords.find(function(x) { return x.id === w.id; });
        if (orig) orig.mastery = score;

        // 如果是"今日待复习"模式，不认识的卡片插回卡组后面
        if (showDueOnly && score < 3) {
            deck.push(w);
        }

        currentPos++;
        flipped = false;
        renderCard();
    }

    // ─── 键盘快捷键 ────────────────────────────────────────────────
    document.addEventListener('keydown', function(e) {
        if (e.key === ' ' || e.key === 'Spacebar') {
            e.preventDefault();
            flipCard();
        } else if (e.key === 'ArrowLeft') {
            e.preventDefault();
            rate(1);
        } else if (e.key === 'ArrowDown') {
            e.preventDefault();
            rate(3);
        } else if (e.key === 'ArrowRight') {
            e.preventDefault();
            rate(5);
        }
    });

    // ─── 筛选事件绑定 ──────────────────────────────────────────────
    document.getElementById('filterSource').addEventListener('change', applyFilters);
    document.getElementById('filterType').addEventListener('change', applyFilters);
    document.getElementById('filterChapter').addEventListener('change', applyFilters);

    // ─── 工具函数 ──────────────────────────────────────────────────
    function esc(s) {
        if (!s) return '';
        var d = document.createElement('div');
        d.appendChild(document.createTextNode(s));
        return d.innerHTML;
    }

    // ─── 启动 ──────────────────────────────────────────────────────
    loadVocabulary();
    </script>
</body>
