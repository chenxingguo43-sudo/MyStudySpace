<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <base href="../">
    <title>我的沉浸式学习空间</title>
    <style>
        /* 消除浏览器默认边距 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020617;        }

        /* ====== 房间1：书房（俄语资料） ====== */
        #russian-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        /* ====== 右下角俄语素材库按钮 ====== */
        #russian-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 10000;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #4F46E5;
            border: none;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(79,70,229,0.4);
            outline: none;
        }
        #russian-fab:hover {
            background: #6366F1;
            transform: scale(1.1);
            box-shadow: 0 6px 28px rgba(79,70,229,0.5);
        }
        #russian-fab:active {
            transform: scale(0.95);
        }
        /* 沉浸模式时隐藏（按钮功能由迷你番茄钟覆盖） */
        body.russian-active #russian-fab {
            opacity: 0;
            pointer-events: none;
        }

        /* 俄语 iframe 激活时层级提升（在番茄钟迷你窗口之下） */
        #russian-frame.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 5;
        }

        /* ====== 房间2：卧室（番茄钟） ====== */
        #pomodoro-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 10;
            /* 变身时的过渡动画，0.4秒丝滑缩小 */
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: transparent;
        }

        /* 网易云播放器浮窗 */
        .di-netease-panel {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .di-netease-panel.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(-50%) translateY(0);
        }
        .di-netease-panel iframe {
            background:
                linear-gradient(160deg,
                    rgba(255,255,255,0.08) 0%,
                    rgba(255,255,255,0.02) 50%,
                    rgba(255,255,255,0.04) 100%);
            backdrop-filter: blur(24px) saturate(200%) brightness(1.10) contrast(1.06);
            -webkit-backdrop-filter: blur(24px) saturate(200%) brightness(1.10) contrast(1.06);
            border: 0.5px solid rgba(255,255,255,0.18);
            border-radius: 16px;
            box-shadow:
                0 8px 32px rgba(0,0,0,0.18),
                0 2px 8px rgba(0,0,0,0.08),
                inset 0 0.5px 0 rgba(255,255,255,0.16),
                inset 0 0 0 0.5px rgba(255,255,255,0.04);
        }

        /* ====== 学习数据按钮 ====== */
        #open-stats-btn {
            position: fixed;
            bottom: 100px;
            right: 30px;
            z-index: 10000;
            padding: 12px 20px;
            border-radius: 25px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.25);
            color: rgba(255,255,255,0.85);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.18);
            outline: none;
        }
        #open-stats-btn:hover {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.45);
            transform: scale(1.05);
            box-shadow: 0 6px 28px rgba(0,0,0,0.25);
        }
        #open-stats-btn:active {
            transform: scale(0.95);
        }
        /* 沉浸模式时隐藏 */
        body.russian-active #open-stats-btn {
            opacity: 0;
            pointer-events: none;
        }

        /* ===== 统一导航框架 V10.0 ===== */
        #unified-nav{position:fixed;top:0;left:0;right:0;z-index:9600;height:44px;background:rgba(10,10,20,0.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;padding:0 16px;gap:0}
        .unav-logo{font-size:.82em;font-weight:700;color:rgba(255,255,255,.7);margin-right:16px;white-space:nowrap;letter-spacing:.04em}
        .unav-links{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
        .unav-links::-webkit-scrollbar{display:none}
        .unav-link{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:18px;font-size:.78em;color:rgba(255,255,255,.55);text-decoration:none;transition:all .2s;white-space:nowrap;border:1px solid transparent}
        .unav-link:hover{color:rgba(255,255,255,.9);background:rgba(255,255,255,.08)}
        .unav-link.active{color:#a5b4fc;background:rgba(99,102,241,.2);border-color:rgba(99,102,241,.3)}
        .unav-right{display:flex;align-items:center;gap:8px;margin-left:auto}
        /* index.html: iframe要为导航栏留出空间 */
        #russian-frame, #pomodoro-frame, #stats-frame, #vocab-frame, #reader-frame { top: 44px; height: calc(100% - 44px); }

        /* 统计页 iframe */
        #stats-frame {
            position: absolute;
            left: 0;
            width: 100%;
            border: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 5;
        }
        /* 背单词页 iframe */
        #vocab-frame {
            position: absolute;
            left: 0;
            width: 100%;
            border: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 5;
        }
        /* 小说阅读页 iframe */
        #reader-frame {
            position: absolute;
            left: 0;
            width: 100%;
            border: none;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 5;
        }

        /* ─── 背词计时小窗 ─── */
        #vocab-timer-widget {
            display: none;
            position: fixed;
            top: 56px; right: 16px;
            z-index: 9500;
            background: rgba(15,23,42,0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(129,140,248,0.25);
            border-radius: 999px;
            padding: 8px 16px;
            font-family: -apple-system, 'Inter', sans-serif;
            color: #e2e8f0;
            box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            transition: all 0.25s ease;
            cursor: pointer;
            user-select: none;
            touch-action: none;
            align-items: center; gap: 8px;
        }
        #vocab-timer-widget.visible { display: flex; }
        #vocab-timer-widget.expanded {
            width: 200px; border-radius: 14px; padding: 14px 16px;
            flex-direction: column; cursor: grab;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        #vocab-timer-widget .vtw-capsule { display: flex; align-items: center; gap: 6px; font-size: 14px; }
        #vocab-timer-widget.expanded .vtw-capsule { display: none; }
        #vocab-timer-widget .vtw-full { display: none; }
        #vocab-timer-widget.expanded .vtw-full { display: block; }
        .vtw-capsule-time { font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
        #vocab-timer-widget.dragging { transition: none; cursor: grabbing; }
        #vocab-timer-widget .vtw-time {
            font-size: 28px; font-weight: 700;
            color: #f8fafc; text-align: center;
            letter-spacing: -0.02em; margin-bottom: 4px;
        }
        #vocab-timer-widget .vtw-label {
            font-size: 11px; color: rgba(255,255,255,0.45);
            text-align: center; margin-bottom: 10px;
        }
        #vocab-timer-widget .vtw-stats {
            display: flex; gap: 6px; justify-content: center;
            margin-bottom: 10px;
        }
        #vocab-timer-widget .vtw-stat {
            font-size: 11px; padding: 2px 8px;
            border-radius: 8px; white-space: nowrap;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.06);
        }
        #vocab-timer-widget .vtw-stat .vtw-num { font-weight: 600; color: #a5b4fc; }
        #vocab-timer-widget .vtw-btns {
            display: flex; gap: 6px;
        }
        #vocab-timer-widget .vtw-btn {
            flex: 1; height: 30px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.7); font-size: 11px;
            cursor: pointer; font-family: inherit;
            transition: all 0.15s;
        }
        #vocab-timer-widget .vtw-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
        /* 移动端 */
        @media (max-width: 600px) {
            #vocab-timer-widget { top: 44px; right: 8px; padding: 6px 12px; }
            #vocab-timer-widget.expanded {
                right: 0; left: 0; width: auto; border-radius: 0;
                padding: 6px 16px; flex-direction: row; align-items: center; gap: 12px;
                border-top: none; border-left: none; border-right: none;
            }
            #vocab-timer-widget.expanded .vtw-time { font-size: 18px; margin-bottom: 0; }
            #vocab-timer-widget.expanded .vtw-label { display: none; }
            #vocab-timer-widget.expanded .vtw-stats { margin-bottom: 0; gap: 8px; }
            #vocab-timer-widget.expanded .vtw-btns { display: none; }
            #vocab-frame { top: calc(44px + 36px); height: calc(100% - 44px - 36px); }
        }
    </style>
</head>
<body>
<div id="unified-nav">
  <span class="unav-logo">🎓 学习舱</span>
  <div class="unav-links">
    <a href="#" class="unav-link active" data-view="console" onclick="switchView('console');return false">🏠 主控台</a>
    <a href="#" class="unav-link" data-view="pomodoro" onclick="switchView('pomodoro');return false">🍅 番茄钟</a>
    <a href="#" class="unav-link" data-view="russian" onclick="var isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);if(isIOS){location.href='俄语知识库.html';return false}else{switchView('russian');return false}">🇷🇺 俄语库</a>
    <a href="#" class="unav-link" data-view="stats" onclick="switchView('stats');return false">📊 统计</a><a href="#" class="unav-link" data-view="vocab" onclick="switchView('vocab');return false">📚 背单词</a><a href="#" class="unav-link" data-view="reader" onclick="switchView('reader');return false">📖 小说</a><a href="b2-exam.html" class="unav-link" target="_blank">📋 B2真题</a>
  </div>
  <div class="unav-right">
  </div>
</div>

    <!-- 俄语库滚动容器（iOS 需要 wrapper 才能正常滚动） -->
    <iframe id="russian-frame" src="俄语知识库.html"></iframe>
    <iframe id="pomodoro-frame" src="pomodoro.html" allow="autoplay; clipboard-write"></iframe>
    <iframe id="stats-frame" src="study-stats.html"></iframe>
    <iframe id="vocab-frame" src="vocabulary.html"></iframe>
    <iframe id="reader-frame" src="reader-source.html"></iframe>

    <!-- 网易云播放器浮窗 -->
    <div id="netease-panel" class="di-netease-panel">
        <iframe id="netease-iframe-di"
            frameborder="no" border="0" marginwidth="0" marginheight="0"
            allow="autoplay; encrypted-media"
            style="width:420px;height:110px;border:none;border-radius:16px;"></iframe>
    </div>

    <!-- 学习数据统计按钮 -->
    <button id="open-stats-btn" onclick="switchView('stats')">
        📊 学习数据
    </button>

    <!-- 番茄钟胶囊 -->
    <div id="vocab-timer-widget">
        <div class="vtw-capsule">
            <span>🍅</span>
            <span class="vtw-capsule-time" id="vtw-capsule-time">25:00</span>
        </div>
        <div class="vtw-full">
            <div style="flex-shrink:0;">
                <div class="vtw-time" id="vtw-time">25:00</div>
                <div class="vtw-label" id="vtw-label">背单词中</div>
            </div>
            <div style="flex:1;min-width:0;">
                <div class="vtw-stats" id="vtw-stats">
                    <span class="vtw-stat">✓ <span class="vtw-num" id="vtw-passed">0</span></span>
                    <span class="vtw-stat">🔄 <span class="vtw-num" id="vtw-delayed">0</span></span>
                    <span class="vtw-stat">💀 <span class="vtw-num" id="vtw-difficult">0</span></span>
                </div>
                <div class="vtw-btns">
                    <button class="vtw-btn" id="vtw-pause-btn" onclick="_vtwTogglePause()">⏸</button>
                    <button class="vtw-btn" onclick="_vtwReset()">↺</button>
                    <button class="vtw-btn" onclick="_vtwWidget.classList.remove('expanded')">▾</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 元素引用
        // ==========================================
        var russianFrame = document.getElementById('russian-frame');
        var pomodoroFrame = document.getElementById('pomodoro-frame');
        var statsFrame = document.getElementById('stats-frame');
        var vocabFrame = document.getElementById('vocab-frame');
        var readerFrame = document.getElementById('reader-frame');

        // ==========================================
        // 0. 统一视图切换（单一入口，防止堆叠）
        // ==========================================
        var _viewLock = false;
        var _isRussianMode = false;
        var _isStatsMode = false;
        var _isVocabMode = false;
        var _isReaderMode = false;

        function _setNavActive(view) {
            document.querySelectorAll('.unav-link').forEach(function(l) { l.classList.remove('active'); });
            var link = document.querySelector('.unav-link[data-view="' + view + '"]');
            if (link) link.classList.add('active');
        }

        function _enterRussianMode(internal) {
            if (!internal && (_viewLock || _isRussianMode)) return;
            if (!internal) _viewLock = true;
            _isRussianMode = true;

            _setNavActive('russian');
            document.body.classList.add('russian-active');
            russianFrame.classList.add('active');

            // 隐藏番茄钟 iframe（它在 z-index:10 会遮挡俄语库）
            pomodoroFrame.style.opacity = '0';
            pomodoroFrame.style.pointerEvents = 'none';

            // 不再自动显示悬浮球 — 用户通过导航栏 🍅 按钮手动唤出

            setTimeout(function() {
                try { russianFrame.contentWindow.postMessage('OPEN_RUSSIAN', '*'); } catch(e) {}
                try { pomodoroFrame.contentWindow.postMessage('OPEN_RUSSIAN', '*'); } catch(e) {}
                if (!internal) _viewLock = false;
            }, 150);
        }

        function _exitRussianMode(internal) {
            if (!internal && (_viewLock || !_isRussianMode)) return;
            if (!internal) _viewLock = true;
            _isRussianMode = false;

            document.body.classList.remove('russian-active');
            russianFrame.classList.remove('active');

            // 恢复番茄钟 iframe
            pomodoroFrame.style.opacity = '';
            pomodoroFrame.style.pointerEvents = '';

            try { russianFrame.contentWindow.postMessage('CLOSE_RUSSIAN', '*'); } catch(e) {}
            try { pomodoroFrame.contentWindow.postMessage('CLOSE_RUSSIAN', '*'); } catch(e) {}

            if (!internal) setTimeout(function() { _viewLock = false; }, 150);
        }

        // 统计页模式
        function _enterStatsMode(internal) {
            if (!internal && (_viewLock || _isStatsMode)) return;
            if (!internal) _viewLock = true;
            _isStatsMode = true;

            _setNavActive('stats');
            statsFrame.style.opacity = '1';
            statsFrame.style.pointerEvents = 'auto';

            // 隐藏番茄钟
            pomodoroFrame.style.opacity = '0';
            pomodoroFrame.style.pointerEvents = 'none';

            // 隐藏学习数据浮动按钮
            document.getElementById('open-stats-btn').style.display = 'none';

            try { statsFrame.contentWindow.postMessage('OPEN_STATS', '*'); } catch(e) {}
            if (!internal) setTimeout(function() { _viewLock = false; }, 150);
        }

        function _exitStatsMode(internal) {
            if (!internal && (!_isStatsMode || _viewLock)) return;
            if (!internal) _viewLock = true;
            _isStatsMode = false;

            statsFrame.style.opacity = '0';
            statsFrame.style.pointerEvents = 'none';

            // 恢复番茄钟
            pomodoroFrame.style.opacity = '';
            pomodoroFrame.style.pointerEvents = '';

            // 恢复学习数据浮动按钮
            document.getElementById('open-stats-btn').style.display = '';

            if (!internal) setTimeout(function() { _viewLock = false; }, 150);
        }

        // 背单词页模式
        function _enterVocabMode(internal) {
            if (!internal && (_viewLock || _isVocabMode)) return;
            if (!internal) _viewLock = true;
            _isVocabMode = true;

            _setNavActive('vocab');
            vocabFrame.style.opacity = '1';
            vocabFrame.style.pointerEvents = 'auto';

            // 隐藏番茄钟
            pomodoroFrame.style.opacity = '0';
            pomodoroFrame.style.pointerEvents = 'none';

            // 隐藏学习数据浮动按钮
            document.getElementById('open-stats-btn').style.display = 'none';

            if (!internal) setTimeout(function() { _viewLock = false; }, 150);
        }

        function _exitVocabMode(internal) {
            if (!internal && (!_isVocabMode || _viewLock)) return;
            if (!internal) _viewLock = true;
            _isVocabMode = false;

            vocabFrame.style.opacity = '0';
            vocabFrame.style.pointerEvents = 'none';

            // 恢复番茄钟
            pomodoroFrame.style.opacity = '';
            pomodoroFrame.style.pointerEvents = '';

            // 恢复学习数据浮动按钮
            document.getElementById('open-stats-btn').style.display = '';

            if (!internal) setTimeout(function() { _viewLock = false; }, 150);
        }

        function _enterReaderMode(internal) {
            if (!internal && (_viewLock || _isReaderMode)) return;
            if (!internal) _viewLock = true;
            _isReaderMode = true;

            _setNavActive('reader');
            readerFrame.style.opacity = '1';
            readerFrame.style.pointerEvents = 'auto';

            // 隐藏番茄钟
            pomodoroFrame.style.opacity = '0';
            pomodoroFrame.style.pointerEvents = 'none';

            // 隐藏学习数据浮动按钮
            document.getElementById('open-stats-btn').style.display = 'none';

            if (!internal) setTimeout(function() { _viewLock = false; }, 150);
        }

        function _exitReaderMode(internal) {
            if (!internal && (!_isReaderMode || _viewLock)) return;
            if (!internal) _viewLock = true;
            _isReaderMode = false;

            readerFrame.style.opacity = '0';
            readerFrame.style.pointerEvents = 'none';

            // 恢复番茄钟
            pomodoroFrame.style.opacity = '';
            pomodoroFrame.style.pointerEvents = '';

            // 恢复学习数据浮动按钮
            document.getElementById('open-stats-btn').style.display = '';

            if (!internal) setTimeout(function() { _viewLock = false; }, 150);
        }

        // 导航栏点击入口
        function switchView(view) {
            if (view === 'russian') {
                _exitStatsMode(true);
                _exitVocabMode(true);
                _exitReaderMode(true);
                _enterRussianMode(true);
            } else if (view === 'stats') {
                _exitRussianMode(true);
                _exitVocabMode(true);
                _exitReaderMode(true);
                _enterStatsMode(true);
            } else if (view === 'vocab') {
                _exitRussianMode(true);
                _exitStatsMode(true);
                _exitReaderMode(true);
                _enterVocabMode(true);
            } else if (view === 'reader') {
                _exitRussianMode(true);
                _exitStatsMode(true);
                _exitVocabMode(true);
                _enterReaderMode(true);
            } else if (view === 'pomodoro') {
                _exitRussianMode(true);
                _exitStatsMode(true);
                _exitVocabMode(true);
                _exitReaderMode(true);
                _setNavActive('pomodoro');
                try { pomodoroFrame.contentWindow.postMessage('FULL_MODE', '*'); } catch(e) {}
            } else { // 'console'
                _exitRussianMode(true);
                _exitStatsMode(true);
                _exitVocabMode(true);
                _exitReaderMode(true);
                _setNavActive('console');
                try { pomodoroFrame.contentWindow.postMessage('CONSOLE_MODE', '*'); } catch(e) {}
            }
        }

        // ==========================================
        // 1. 监听来自番茄钟的 postMessage
        // ==========================================
        window.addEventListener('message', function(event) {
            if (event.data === 'OPEN_RUSSIAN') { _enterRussianMode(false); }
            else if (event.data === 'CLOSE_RUSSIAN') { _exitRussianMode(false); }
            else if (event.data === 'CLOSE_STATS') {
                switchView('console');
            }
            else if (event.data === 'CLOSE_VOCAB') {
                switchView('console');
            }
            else if (event.data === 'CLOSE_READER') {
                switchView('console');
            }
            // ─── 小说阅读完成 ───
            else if (event.data && event.data.type === 'NOVEL_CHAPTER_DONE') {
                try {
                    var today = new Date().toISOString().split('T')[0];
                    var key = 'novel_reading_' + today;
                    var existing = JSON.parse(localStorage.getItem(key) || '{"chapters":0,"minutes":0,"books":{}}');
                    existing.chapters++;
                    existing.minutes += Math.round((event.data.timeSec || 0) / 60);
                    if (!existing.books[event.data.bookTitle]) existing.books[event.data.bookTitle] = 0;
                    existing.books[event.data.bookTitle]++;
                    localStorage.setItem(key, JSON.stringify(existing));
                } catch(e) {}
            }
            else if (event.data && event.data.type === 'TIMER_STATE') {
                _vtwOnTimerState(event.data);
            }
            else if (event.data && event.data.type === 'MUSIC_STATE') {
                // 音乐状态已移除
            }
            // ─── 背词会话消息 ───
            else if (event.data && event.data.type === 'VOCAB_SESSION_START') {
                _vtwOnSessionStart(event.data);
            }
            else if (event.data && event.data.type === 'VOCAB_SESSION_PROGRESS') {
                _vtwOnSessionProgress(event.data);
            }
            else if (event.data && event.data.type === 'VOCAB_SESSION_DONE') {
                _vtwOnSessionDone(event.data);
            }
        });

        // 番茄钟 iframe 加载完成后，设为控制台精简模式
        pomodoroFrame.addEventListener('load', function() {
            try { pomodoroFrame.contentWindow.postMessage('CONSOLE_MODE', '*'); } catch(e) {}
        });

        // ==========================================
        // 背词计时小窗
        // ==========================================
        var _vtwWidget = document.getElementById('vocab-timer-widget');
        var _vtwTime = document.getElementById('vtw-time');
        var _vtwLabel = document.getElementById('vtw-label');
        var _vtwPassed = document.getElementById('vtw-passed');
        var _vtwDelayed = document.getElementById('vtw-delayed');
        var _vtwDifficult = document.getElementById('vtw-difficult');
        var _vtwPauseBtn = document.getElementById('vtw-pause-btn');
        var _vtwVisible = false;
        var _vtwPaused = false;
        var _vtwModeLabel = '';
        var _vtwPosKey = 'vocab-timer-widget-pos';

        function _vtwIsMobile() {
            return window.matchMedia && window.matchMedia('(max-width: 600px)').matches;
        }

        function _vtwClampPosition(left, top) {
            var rect = _vtwWidget.getBoundingClientRect();
            var width = rect.width || 200;
            var height = rect.height || 120;
            var margin = 8;
            var minTop = 52;
            var maxLeft = Math.max(margin, window.innerWidth - width - margin);
            var maxTop = Math.max(minTop, window.innerHeight - height - margin);
            return {
                left: Math.min(Math.max(left, margin), maxLeft),
                top: Math.min(Math.max(top, minTop), maxTop)
            };
        }

        function _vtwSavePosition(left, top) {
            try {
                localStorage.setItem(_vtwPosKey, JSON.stringify(_vtwClampPosition(left, top)));
            } catch(e) {}
        }

        function _vtwReadPosition() {
            try {
                var raw = localStorage.getItem(_vtwPosKey);
                if (!raw) return null;
                var pos = JSON.parse(raw);
                if (typeof pos.left !== 'number' || typeof pos.top !== 'number') return null;
                return _vtwClampPosition(pos.left, pos.top);
            } catch(e) {
                return null;
            }
        }

        function _vtwApplyStoredPosition() {
            if (_vtwIsMobile()) {
                _vtwWidget.style.left = '';
                _vtwWidget.style.top = '';
                _vtwWidget.style.right = '';
                return;
            }
            var pos = _vtwReadPosition();
            if (!pos) return;
            _vtwWidget.style.left = pos.left + 'px';
            _vtwWidget.style.top = pos.top + 'px';
            _vtwWidget.style.right = 'auto';
        }

        function _vtwShow() {
            if (_vtwVisible) return;
            _vtwVisible = true;
            _vtwWidget.classList.add('visible');
            requestAnimationFrame(_vtwApplyStoredPosition);
        }
        function _vtwHide() {
            _vtwVisible = false;
            _vtwWidget.classList.remove('visible');
            _vtwWidget.classList.remove('expanded');
        }
        function _vtwToggle() {
            if (_vtwVisible) {
                _vtwWidget.classList.toggle('expanded');
            } else {
                _vtwShow();
            }
        }
        function _vtwUpdateStats(data) {
            if (data.passed !== undefined) _vtwPassed.textContent = data.passed;
            if (data.delayed !== undefined) _vtwDelayed.textContent = data.delayed;
            if (data.difficult !== undefined) _vtwDifficult.textContent = data.difficult;
        }

        // 背词会话开始
        function _vtwOnSessionStart(data) {
            _vtwModeLabel = data.modeLabel || '背单词';
            _vtwLabel.textContent = '背单词 · ' + _vtwModeLabel;
            _vtwUpdateStats(data);
            _vtwShow();
            // 自动启动番茄钟
            try { pomodoroFrame.contentWindow.postMessage({type:'WIDGET_CMD', action:'toggle'}, '*'); } catch(e) {}
            // 设置任务名
            var taskName = '背单词 · ' + _vtwModeLabel;
            try { pomodoroFrame.contentWindow.postMessage({type:'WIDGET_CMD', action:'set-task', task: taskName}, '*'); } catch(e) {}
            localStorage.setItem('pomodoro-current-task', taskName);
        }

        // 背词进度更新
        function _vtwOnSessionProgress(data) {
            _vtwUpdateStats(data);
        }

        // 背词本轮完成
        function _vtwOnSessionDone(data) {
            _vtwUpdateStats(data);
            _vtwLabel.textContent = '本轮完成 · 继续或休息';
        }

        // 番茄钟状态同步到小窗
        function _vtwOnTimerState(data) {
            var timeLeft = data.timeLeft || 0;
            var min = Math.floor(timeLeft / 60);
            var sec = timeLeft % 60;
            var timeStr = String(min).padStart(2,'0') + ':' + String(sec).padStart(2,'0');
            _vtwTime.textContent = timeStr;
            var capsuleTime = document.getElementById('vtw-capsule-time');
            if (capsuleTime) capsuleTime.textContent = timeStr;
            _vtwPaused = !data.isRunning && timeLeft > 0;
            _vtwPauseBtn.textContent = _vtwPaused ? '▶' : '⏸';
            // 番茄完成 → 背词页休息提示
            if (timeLeft === 0 && !data.isRunning && _vtwVisible) {
                _vtwShowRestReminder();
            }
        }

        // 休息提示
        function _vtwShowRestReminder() {
            var existing = document.getElementById('vtw-rest-reminder');
            if (existing) existing.remove();
            var el = document.createElement('div');
            el.id = 'vtw-rest-reminder';
            el.style.cssText = 'position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:9501;' +
                'background:rgba(22,163,74,0.15);border:1px solid rgba(22,163,74,0.3);' +
                'padding:10px 20px;border-radius:12px;font-size:14px;color:#6ee7b7;' +
                'backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;' +
                'font-family:Inter,sans-serif;box-shadow:0 4px 20px rgba(0,0,0,0.3);';
            el.innerHTML = '<span>☕ 番茄完成！休息一下吧</span>' +
                '<button onclick="this.parentElement.remove()" style="padding:4px 10px;border-radius:6px;' +
                'border:1px solid rgba(22,163,74,0.3);background:rgba(22,163,74,0.2);color:#6ee7b7;' +
                'cursor:pointer;font-size:12px;font-family:inherit;">知道了</button>';
            document.body.appendChild(el);
            setTimeout(function() { if (el.parentElement) el.remove(); }, 15000);
        }

        // 小窗控制按钮
        function _vtwTogglePause() {
            try { pomodoroFrame.contentWindow.postMessage({type:'WIDGET_CMD', action:'toggle'}, '*'); } catch(e) {}
        }
        function _vtwReset() {
            try { pomodoroFrame.contentWindow.postMessage({type:'WIDGET_CMD', action:'reset'}, '*'); } catch(e) {}
        }

        function _vtwInitDrag() {
            if (!_vtwWidget || window.PointerEvent === undefined) return;
            var dragging = false;
            var startX = 0, startY = 0, startLeft = 0, startTop = 0;

            _vtwWidget.addEventListener('pointerdown', function(e) {
                if (_vtwIsMobile()) return;
                if (e.target.closest('.vtw-btn')) return;
                // 胶囊模式：点击展开，不拖拽
                if (!_vtwWidget.classList.contains('expanded')) {
                    _vtwWidget.classList.add('expanded');
                    e.preventDefault();
                    return;
                }
                dragging = true;
                var rect = _vtwWidget.getBoundingClientRect();
                startX = e.clientX;
                startY = e.clientY;
                startLeft = rect.left;
                startTop = rect.top;
                _vtwWidget.style.left = rect.left + 'px';
                _vtwWidget.style.top = rect.top + 'px';
                _vtwWidget.style.right = 'auto';
                _vtwWidget.classList.add('dragging');
                try { _vtwWidget.setPointerCapture(e.pointerId); } catch(err) {}
                e.preventDefault();
            });

            _vtwWidget.addEventListener('pointermove', function(e) {
                if (!dragging) return;
                var next = _vtwClampPosition(startLeft + e.clientX - startX, startTop + e.clientY - startY);
                _vtwWidget.style.left = next.left + 'px';
                _vtwWidget.style.top = next.top + 'px';
            });

            function endDrag(e) {
                if (!dragging) return;
                dragging = false;
                _vtwWidget.classList.remove('dragging');
                var rect = _vtwWidget.getBoundingClientRect();
                var pos = _vtwClampPosition(rect.left, rect.top);
                _vtwWidget.style.left = pos.left + 'px';
                _vtwWidget.style.top = pos.top + 'px';
                _vtwSavePosition(pos.left, pos.top);
                try { _vtwWidget.releasePointerCapture(e.pointerId); } catch(err) {}
            }

            _vtwWidget.addEventListener('pointerup', endDrag);
            _vtwWidget.addEventListener('pointercancel', endDrag);
            window.addEventListener('resize', function() {
                if (!_vtwVisible || _vtwIsMobile()) {
                    _vtwApplyStoredPosition();
                    return;
                }
                var rect = _vtwWidget.getBoundingClientRect();
                var pos = _vtwClampPosition(rect.left, rect.top);
                _vtwWidget.style.left = pos.left + 'px';
                _vtwWidget.style.top = pos.top + 'px';
                _vtwWidget.style.right = 'auto';
                _vtwSavePosition(pos.left, pos.top);
            });
        }
        _vtwInitDrag();

        // 离开背词页时隐藏小窗，进入时恢复
        var _origEnterVocab = _enterVocabMode;
        _enterVocabMode = function(internal) {
            _origEnterVocab(internal);
            if (_vtwVisible) _vtwShow();
        };
        var _origExitVocab = _exitVocabMode;
        _exitVocabMode = function(internal) {
            _origExitVocab(internal);
            // 不隐藏小窗，番茄继续运行
        };

    </script>
</body>
</html>
